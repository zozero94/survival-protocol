<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgOut12" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a0e"/>
      <stop offset="50%" stop-color="#0d131b"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="outerCanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="woodGasFlame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadowOut12" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.82"/>
    </filter>
    <pattern id="gridOut12" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#152230" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgOut12)"/>
  <rect width="800" height="450" fill="url(#gridOut12)"/>
  <rect x="10" y="10" width="780" height="430" fill="none" stroke="#293d52" stroke-width="1.2"/>

  <!-- Top Master Header Banner -->
  <rect x="20" y="18" width="760" height="34" fill="#0f1822" stroke="#f97316" stroke-width="1"/>
  <text x="34" y="40" fill="#fde68a" font-family="monospace" font-size="13" font-weight="bold">PR-12 MASTER BLUEPRINT // TWIN-CAN DOUBLE-WALL WOOD GAS STOVE (THERMO-FLUID CUTAWAY)</text>

  <!-- Central High-Precision Cutaway of Twin-Can Wood Gas Stove & Boiling Vessel -->
  <g filter="url(#shadowOut12)">
    <!-- 3 Flat Insulating Base Stones -->
    <rect x="255" y="365" width="90" height="16" rx="4" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
    <rect x="355" y="365" width="90" height="16" rx="4" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
    <rect x="455" y="365" width="90" height="16" rx="4" fill="#475569" stroke="#94a3b8" stroke-width="1"/>

    <!-- Outer Large Steel Can (x=270 to 530, y=185 to 365) -->
    <rect x="270" y="185" width="260" height="180" rx="5" fill="url(#outerCanGrad)" stroke="#cbd5e1" stroke-width="2.2"/>

    <!-- Inner Small Pyrolysis Chamber Can (x=310 to 490, y=185 to 325) -->
    <rect x="310" y="185" width="180" height="140" rx="4" fill="#0b1118" stroke="#fde68a" stroke-width="2.2"/>

    <!-- Vertically Packed Dry Twigs & Glowing Biochar Bed Inside Inner Can -->
    <g fill="#92400e" stroke="#fde68a" stroke-width="0.9">
      <rect x="324" y="220" width="14" height="95" rx="2"/>
      <rect x="344" y="218" width="14" height="97" rx="2"/>
      <rect x="364" y="222" width="14" height="93" rx="2"/>
      <rect x="384" y="217" width="14" height="98" rx="2"/>
      <rect x="404" y="220" width="14" height="95" rx="2"/>
      <rect x="424" y="219" width="14" height="96" rx="2"/>
      <rect x="444" y="221" width="14" height="94" rx="2"/>
      <rect x="464" y="218" width="14" height="97" rx="2"/>
    </g>

    <!-- Bottom Grate Holes (8mm x 12~15) & Outer Lower Air Intakes (12mm x 8~10) -->
    <line x1="310" y1="325" x2="490" y2="325" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8,5"/>
    <g fill="#090d12" stroke="#38bdf8" stroke-width="1.8">
      <circle cx="288" cy="346" r="7"/>
      <circle cx="335" cy="346" r="7"/>
      <circle cx="400" cy="346" r="7"/>
      <circle cx="465" cy="346" r="7"/>
      <circle cx="512" cy="346" r="7"/>
    </g>

    <!-- Secondary Gas Jet Nozzles Near Top of Inner Can (10~12mm x 8~10) -->
    <g fill="#090d12" stroke="#fde68a" stroke-width="1.8">
      <circle cx="330" cy="204" r="6.5"/>
      <circle cx="365" cy="204" r="6.5"/>
      <circle cx="400" cy="204" r="6.5"/>
      <circle cx="435" cy="204" r="6.5"/>
      <circle cx="470" cy="204" r="6.5"/>
    </g>

    <!-- Preheated Air Rising Through 1.5~2cm Double-Wall Gap (Orange Arrows) -->
    <path d="M 290 338 L 290 204 L 315 204" fill="none" stroke="#f97316" stroke-width="3"/>
    <path d="M 510 338 L 510 204 L 485 204" fill="none" stroke="#f97316" stroke-width="3"/>

    <!-- Smokeless Secondary Wood Gas Combustion Vortex Flame -->
    <path d="M 318 204 C 350 192, 375 170, 400 142 C 425 170, 450 192, 482 204 Z" fill="url(#woodGasFlame)" opacity="0.95"/>

    <!-- Salvaged Wire Trivet & Boiling Water Container on Top -->
    <rect x="295" y="166" width="210" height="18" rx="3" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <rect x="315" y="96" width="170" height="70" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="365" cy="142" r="6" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="400" cy="132" r="7" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="435" cy="140" r="6" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
  </g>

  <!-- Callout Labels (Zero Overlap, High Contrast) -->
  <rect x="24" y="88" width="265" height="28" rx="3" fill="#0f172a" stroke="#fde68a" stroke-width="1"/>
  <text x="34" y="106" fill="#fde68a" font-family="sans-serif" font-size="11.5" font-weight="bold">① 상단 2차 노즐 (예열 산소 + 목재 가스 완전 연소)</text>

  <rect x="515" y="88" width="260" height="28" rx="3" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="525" y="106" fill="#fde68a" font-family="sans-serif" font-size="11.5" font-weight="bold">② 피복 벗긴 폐전선 결속 및 오덕 받침대</text>

  <rect x="24" y="235" width="230" height="28" rx="3" fill="#0f172a" stroke="#f97316" stroke-width="1"/>
  <text x="34" y="253" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="bold">③ 내외측 깡통 1.5~2cm 이중 예열 통로</text>

  <rect x="546" y="235" width="230" height="28" rx="3" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
  <text x="556" y="253" fill="#fde68a" font-family="sans-serif" font-size="11.5" font-weight="bold">④ 수직 적재 마른 잔가지 (하향 열분해)</text>

  <rect x="24" y="395" width="350" height="28" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="36" y="413" fill="#38bdf8" font-family="sans-serif" font-size="11.5" font-weight="bold">⑤ 하단 외부 찬 공기 흡입구 (12mm) &amp; 내부 바닥 재 배출공</text>

  <rect x="412" y="395" width="364" height="28" rx="3" fill="#0f172a" stroke="#f97316" stroke-width="1"/>
  <text x="420" y="413" fill="#fde68a" font-family="sans-serif" font-size="10.5" font-weight="bold">⑥ 무연 850℃ 제트 화염 (8분 내 식수 비등 &amp; 바이오차 숯 생성)</text>
</svg>
