<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgOut11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b10"/>
      <stop offset="50%" stop-color="#0b1520"/>
      <stop offset="100%" stop-color="#091017"/>
    </linearGradient>
    <linearGradient id="willowCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9cb36c"/>
      <stop offset="50%" stop-color="#64783d"/>
      <stop offset="100%" stop-color="#35411f"/>
    </linearGradient>
    <linearGradient id="funnelGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="60%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowOut11" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="gridOut11" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#152331" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgOut11)"/>
  <rect width="800" height="450" fill="url(#gridOut11)"/>
  <rect x="10" y="10" width="780" height="430" fill="none" stroke="#293d52" stroke-width="1.2"/>

  <!-- Top Master Header Banner -->
  <rect x="20" y="18" width="760" height="34" fill="#0f1822" stroke="#38bdf8" stroke-width="1"/>
  <text x="34" y="40" fill="#fde68a" font-family="monospace" font-size="13" font-weight="bold">PR-11 MASTER BLUEPRINT // WILLOW ONE-WAY FUNNEL FISH TRAP (HYDRO-MECHANICAL CUTAWAY)</text>

  <!-- River Water Surface & Stream Current Lines -->
  <path d="M 20 82 Q 200 74, 400 82 T 780 82" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6"/>
  <path d="M 20 382 L 780 382" stroke="#334155" stroke-width="3"/>

  <!-- Main Cutaway Diagram of Conical Willow Fish Trap (Center-Left) -->
  <g filter="url(#shadowOut11)">
    <!-- Outer Conical Basket Cutaway -->
    <polygon points="165,135 615,195 615,285 165,345" fill="#182314" opacity="0.65"/>

    <!-- 4 Graduated Willow Hoop Rings (25cm, 20cm, 15cm, 10cm) -->
    <ellipse cx="165" cy="240" rx="34" ry="105" fill="none" stroke="url(#willowCone)" stroke-width="8"/>
    <ellipse cx="305" cy="240" rx="28" ry="86" fill="none" stroke="url(#willowCone)" stroke-width="7"/>
    <ellipse cx="445" cy="240" rx="22" ry="66" fill="none" stroke="url(#willowCone)" stroke-width="6.5"/>
    <ellipse cx="575" cy="240" rx="16" ry="46" fill="none" stroke="url(#willowCone)" stroke-width="6"/>

    <!-- Longitudinal Willow Ribs (1~1.5cm spacing) -->
    <g stroke="url(#willowCone)" stroke-width="2.4" opacity="0.88">
      <line x1="165" y1="135" x2="645" y2="230"/>
      <line x1="165" y1="158" x2="645" y2="233"/>
      <line x1="165" y1="181" x2="645" y2="236"/>
      <line x1="165" y1="204" x2="645" y2="238"/>
      <line x1="165" y1="276" x2="645" y2="242"/>
      <line x1="165" y1="299" x2="645" y2="244"/>
      <line x1="165" y1="322" x2="645" y2="247"/>
      <line x1="165" y1="345" x2="645" y2="250"/>
    </g>

    <!-- Inner One-Way Inverted Funnel Valve (Check-Valve) -->
    <polygon points="165,142 332,216 332,264 165,338" fill="#451a03" opacity="0.45"/>
    <g stroke="url(#funnelGold)" stroke-width="2.8" stroke-linecap="round">
      <line x1="165" y1="145" x2="342" y2="218"/>
      <line x1="165" y1="175" x2="345" y2="225"/>
      <line x1="165" y1="205" x2="346" y2="232"/>
      <line x1="165" y1="275" x2="346" y2="248"/>
      <line x1="165" y1="305" x2="345" y2="255"/>
      <line x1="165" y1="335" x2="342" y2="262"/>
    </g>
    <!-- 5~6cm Funnel Throat Ring Highlight -->
    <ellipse cx="342" cy="240" rx="9" ry="24" fill="none" stroke="#fde68a" stroke-width="2.2" stroke-dasharray="4,3"/>

    <!-- 2 Fist-Sized River Ballast Stones Inside Bottom -->
    <ellipse cx="420" cy="296" rx="28" ry="17" fill="url(#stoneGrad)" stroke="#cbd5e1" stroke-width="1.2"/>
    <ellipse cx="485" cy="286" rx="25" ry="15" fill="url(#stoneGrad)" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Crushed Snail & Earthworm Bait Leaf Pouch + Scent Plume -->
    <circle cx="435" cy="242" r="18" fill="#3f6212" stroke="#fde68a" stroke-width="1.8"/>
    <circle cx="430" cy="238" r="4" fill="#fde68a"/>
    <circle cx="442" cy="245" r="3.5" fill="#fde68a"/>
    <path d="M 415 242 C 300 240, 160 240, 35 240" fill="none" stroke="#fde68a" stroke-width="2" stroke-dasharray="4,5"/>

    <!-- Captured Freshwater Fish Inside Holding Chamber -->
    <path d="M 480 212 C 502 195, 536 195, 558 212 C 570 202, 580 198, 583 198 L 577 212 L 583 226 C 580 226, 570 222, 558 212 C 536 229, 502 229, 480 212 Z" fill="#38bdf8" stroke="#f8fafc" stroke-width="1.5"/>
    <circle cx="494" cy="210" r="2.5" fill="#091017"/>

    <!-- Tail Retrieval Slip-Knot Binding -->
    <rect x="635" y="220" width="22" height="40" rx="5" fill="url(#funnelGold)" stroke="#451a03" stroke-width="1.5"/>
    <path d="M 657 232 C 688 212, 692 268, 657 248" fill="none" stroke="#fde68a" stroke-width="3"/>

    <!-- Wooden Anchor Stakes Driven Into Riverbed -->
    <rect x="225" y="310" width="10" height="72" rx="2" fill="#a16207" stroke="#fde68a" stroke-width="1.2"/>
    <rect x="520" y="280" width="10" height="102" rx="2" fill="#a16207" stroke="#fde68a" stroke-width="1.2"/>
  </g>

  <!-- Callout Labels (Zero Overlap, High Contrast) -->
  <rect x="28" y="92" width="270" height="26" rx="3" fill="#0f172a" stroke="#fde68a" stroke-width="1"/>
  <text x="38" y="109" fill="#fde68a" font-family="sans-serif" font-size="11.5" font-weight="bold">① 일방향 역깔때기 입구 (외경 25cm ➔ 내경 5cm)</text>

  <rect x="320" y="92" width="265" height="26" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="330" y="109" fill="#38bdf8" font-family="sans-serif" font-size="11.5" font-weight="bold">② 4단 원형 림 &amp; 버드나무 세로 살 (1cm 간격)</text>

  <rect x="598" y="135" width="178" height="26" rx="3" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
  <text x="608" y="152" fill="#fde68a" font-family="sans-serif" font-size="11.5" font-weight="bold">③ 꼬리 수거용 풀림 매듭</text>

  <rect x="34" y="395" width="340" height="28" rx="3" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
  <text x="46" y="413" fill="#fde68a" font-family="sans-serif" font-size="11.5" font-weight="bold">④ 으깬 다슬기 미끼 주머니 &amp; 침강용 강돌 2개</text>

  <rect x="410" y="395" width="360" height="28" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="422" y="413" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="bold">⑤ 여울목 강바닥 나무 말뚝 고정 &amp; 자율 포획 챔버</text>
</svg>
