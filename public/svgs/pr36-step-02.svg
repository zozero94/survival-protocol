<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg36s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="slab36s2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="pestle36s2" cx="35%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="55%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <radialGradient id="meal36s2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d6d3d1"/>
    </radialGradient>
    <pattern id="grid36s2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow36s2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg36s2)"/>
  <rect width="400" height="400" fill="url(#grid36s2)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Label 1 -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 02 // 화강암 돌판 + 돌공이 맷돌 갈기 곱게 빻기</text>

  <!-- Label 2 -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9">두 뼘 넓은 화강암 돌판 위에 깐 도토리 속살 배치</text>

  <!-- Main Visual: Wide Granite Slab + Fine Ground Meal + Smooth Cobble Pestle + Loupe Inset -->
  <g filter="url(#shadow36s2)">
    <!-- Broad Flat Granite Slab (3D) -->
    <polygon points="36,222 104,174 334,174 364,222" fill="url(#slab36s2)" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="36,222 364,222 356,258 44,258" fill="#1e293b" stroke="#475569" stroke-width="2"/>

    <!-- Fine Sandy Ground Acorn Meal Mound -->
    <ellipse cx="176" cy="206" rx="76" ry="18" fill="url(#meal36s2)" stroke="#d97706" stroke-width="1.2"/>
    <!-- Fine particle speckles -->
    <circle cx="144" cy="204" r="1.5" fill="#92400e"/>
    <circle cx="162" cy="210" r="1.5" fill="#92400e"/>
    <circle cx="182" cy="208" r="1.5" fill="#92400e"/>
    <circle cx="196" cy="202" r="1.5" fill="#92400e"/>
    <circle cx="212" cy="210" r="1.5" fill="#92400e"/>

    <!-- Smooth Fist-Sized River Cobble Pestle + Circular Milling Arrows -->
    <ellipse cx="184" cy="166" rx="34" ry="26" fill="url(#pestle36s2)" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Downward press + circular rotation vector -->
    <path d="M 184 106 L 184 134" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="178,128 184,138 190,128" fill="#f59e0b"/>
    <path d="M 136 154 A 52 16 0 0 1 232 154" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="228,148 236,156 226,159" fill="#38bdf8"/>

    <!-- Magnifier Loupe Comparing Fine Sand-Like Grains (OK) vs Chunk (NO) -->
    <circle cx="318" cy="134" r="40" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="298" cy="134" r="10" fill="#78350f" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="292" y1="128" x2="304" y2="140" stroke="#fecaca" stroke-width="2"/>
    <line x1="304" y1="128" x2="292" y2="140" stroke="#fecaca" stroke-width="2"/>
    <!-- Fine fine dots (V) -->
    <circle cx="332" cy="126" r="2" fill="#fef3c7"/>
    <circle cx="340" cy="132" r="2" fill="#fef3c7"/>
    <circle cx="330" cy="138" r="2" fill="#fef3c7"/>
    <circle cx="342" cy="142" r="2" fill="#fef3c7"/>
    <polyline points="326,152 332,158 344,146" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="242" y1="196" x2="286" y2="160" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 2"/>
  </g>

  <!-- Label 3 -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="315" fill="#cbd5e1" font-family="monospace" font-size="9">주먹 크기 매끄러운 돌공이로 둥글게 누르며 분쇄</text>

  <!-- Label 4 -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#1e1b18" stroke="#d97706" stroke-width="1"/>
  <text x="24" y="344" fill="#fed7aa" font-family="monospace" font-size="9">거친 덩어리(X) 금지: 모래알 이하 곱고 부드러운 입자</text>

  <!-- Label 5 -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="376" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">[핵심] 알갱이가 고울수록 찬물이 닿는 면적이 커져 독소 0%</text>
</svg>