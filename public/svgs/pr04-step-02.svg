<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 340" class="w-full max-w-2xl h-auto" xmlns="http://www.w3.org/2000/svg" width="680" height="340">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E02424" />
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="340" fill="#131313" />
  <rect x="10" y="10" width="660" height="320" fill="none" stroke="#262626" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Wooden Handle (Shaft) -->
  <path d="M 315 170 L 315 275 L 355 275 L 355 170 Z" fill="#201f1f" stroke="#F5F5F5" stroke-width="1.8" />
  
  <!-- Split Cleft Head (Two tines separated) -->
  <path d="M 315 170 C 315 140 280 110 270 70 L 305 70 C 315 105 330 135 335 170 Z" fill="#292828" stroke="#F5F5F5" stroke-width="1.8" />
  <path d="M 355 170 C 355 140 390 110 400 70 L 365 70 C 355 105 340 135 335 170 Z" fill="#292828" stroke="#F5F5F5" stroke-width="1.8" />

  <!-- Split stop safety collar notch -->
  <line x1="300" y1="172" x2="370" y2="172" stroke="#E02424" stroke-width="2.2" stroke-dasharray="3 2" />

  <!-- Melted Pine Resin + Charcoal Glue Bedding (Inside cleft) -->
  <path d="M 305 130 C 315 150 335 168 335 168 C 335 168 355 150 365 130 C 355 110 315 110 305 130 Z" 
        fill="#78350f" stroke="#d97706" stroke-width="1.5" />
  <circle cx="325" cy="140" r="2.5" fill="#171717" />
  <circle cx="335" cy="132" r="2" fill="#171717" />
  <circle cx="345" cy="142" r="2.5" fill="#171717" />
  <circle cx="335" cy="150" r="1.8" fill="#171717" />

  <!-- Wedged Stone Blade in Slot -->
  <path d="M 230 100 L 440 100 L 415 135 L 255 135 Z" fill="#333333" stroke="#F5F5F5" stroke-width="2" />
  <path d="M 230 100 Q 210 115 255 135" stroke="#E02424" stroke-width="2.5" />

  <!-- Insertion down vector -->
  <line x1="335" y1="30" x2="335" y2="85" stroke="#E02424" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Dimension callout for handle diameter -->
  <line x1="280" y1="288" x2="390" y2="288" stroke="#525252" stroke-width="1" />
  <line x1="280" y1="283" x2="280" y2="293" stroke="#525252" stroke-width="1" />
  <line x1="390" y1="283" x2="390" y2="293" stroke="#525252" stroke-width="1" />

  <!-- 5 Clear Korean labels in safe zones -->
  <rect x="420" y="30" width="225" height="24" fill="#0e0e0e" stroke="#333333" stroke-width="1" />
  <text x="430" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5F5F5">① 위에서 아래로 돌날 끼우기</text>

  <rect x="25" y="102" width="175" height="24" fill="#0e0e0e" stroke="#333333" stroke-width="1" />
  <text x="35" y="118" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E02424" font-weight="bold">나무 자르는 앞날</text>

  <rect x="445" y="96" width="215" height="24" fill="#0e0e0e" stroke="#333333" stroke-width="1" />
  <text x="455" y="112" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E02424">② 쪼갠 나무 자루 틈 (5~7cm)</text>

  <rect x="430" y="152" width="230" height="24" fill="#0e0e0e" stroke="#333333" stroke-width="1" />
  <text x="440" y="168" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5F5F5">③ 녹인 송진 + 숯가루 채우기</text>

  <rect x="25" y="220" width="255" height="24" fill="#0e0e0e" stroke="#333333" stroke-width="1" />
  <text x="35" y="236" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5F5F5">④ 더 안 갈라지게 아래쪽 먼저 묶기</text>

  <text x="335" y="314" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9E9E9E" text-anchor="middle">생나무 자루 굵기: 지름 3.5~4cm</text>
</svg>
