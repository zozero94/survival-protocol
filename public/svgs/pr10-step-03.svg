<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgS3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Stone Dish Gradient -->
    <linearGradient id="stoneDishS3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Clarified Amber Resin -->
    <radialGradient id="clarifiedResin" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <!-- Seashell Gradient -->
    <linearGradient id="seashellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowS3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgS3)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#232830" stroke-width="1.2"/>

  <!-- Technical Corner Ticks -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#475569" stroke-width="1.2"/>

  <!-- Top Header Strip (Label 1) -->
  <rect x="20" y="16" width="360" height="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="16" width="3" height="20" fill="#f59e0b"/>
  <text x="30" y="30" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" letter-spacing="0.5">FIG. 03 // DEBRIS REMOVAL &amp; OINTMENT EXTRACTION</text>

  <!-- Ground / Stone Work Surface -->
  <line x1="20" y1="320" x2="380" y2="320" stroke="#334155" stroke-width="1.5"/>

  <!-- Main Stone Melting Dish on Left -->
  <g filter="url(#shadowS3)">
    <path d="M 35 240 C 40 310, 190 310, 195 240 C 170 260, 60 260, 35 240 Z" fill="url(#stoneDishS3)" stroke="#1e293b" stroke-width="1.5"/>
    <ellipse cx="115" cy="240" rx="78" ry="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Liquid Resin Pool -->
    <ellipse cx="115" cy="242" rx="66" ry="16" fill="url(#clarifiedResin)" stroke="#92400e" stroke-width="1.2"/>
    <path d="M 65 238 Q 115 248 165 238" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Twig Comb Filter Skimming Debris -->
  <g filter="url(#shadowS3)">
    <!-- Main Handle Twig -->
    <line x1="140" y1="140" x2="95" y2="235" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <line x1="140" y1="140" x2="95" y2="235" stroke="#9a3412" stroke-width="3" stroke-linecap="round"/>
    <!-- Comb Tines (Fine Twig Teeth) -->
    <path d="M 80 238 L 92 235 M 84 242 L 96 238 M 90 245 L 102 240 M 96 247 L 108 242" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Trapped Bark Debris Chunks on Comb -->
    <ellipse cx="90" cy="235" rx="5" ry="3" fill="#18181b"/>
    <ellipse cx="98" cy="237" rx="4" ry="2.5" fill="#292524"/>
    <circle cx="85" cy="238" r="2" fill="#18181b"/>
  </g>

  <!-- Label 2: Twig Comb Skimming Bark Debris -->
  <g>
    <line x1="110" y1="210" x2="60" y2="120" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="110" cy="210" r="2.5" fill="#f59e0b"/>
    <rect x="40" y="108" width="180" height="16" fill="#1c1308" rx="3" stroke="#b45309" stroke-width="1"/>
    <text x="130" y="120" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">잔가지 빗으로 불순물 찌꺼기 여과</text>
  </g>

  <!-- Golden Resin Pouring Stream to Seashell -->
  <g filter="url(#shadowS3)">
    <!-- Wooden Spoon / Split Bark Dipper -->
    <path d="M 150 200 Q 185 185 220 205 L 210 215 Q 180 195 150 210 Z" fill="#78350f" stroke="#451a03" stroke-width="1"/>
    <!-- Dipped Molten Ointment Droplet -->
    <ellipse cx="215" cy="210" rx="12" ry="7" fill="url(#clarifiedResin)"/>
    <!-- Liquid Amber Pour Stream into Shell -->
    <path d="M 215 212 C 220 230, 245 235, 255 250" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 215 212 C 220 230, 245 235, 255 250" stroke="#fef08a" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Label 3: Ointment Extraction (30ml) -->
  <g>
    <line x1="220" y1="215" x2="270" y2="160" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="220" cy="215" r="2.5" fill="#38bdf8"/>
    <rect x="180" y="150" width="195" height="16" fill="#0c1726" rx="3" stroke="#0284c7" stroke-width="1"/>
    <text x="277" y="162" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">상처 소독용 순수 송진액 30ml 분리</text>
  </g>

  <!-- Clean Seashell Container with Clarified Ointment (Right Side) -->
  <g filter="url(#shadowS3)">
    <!-- Scallop / Clam Shell Shape -->
    <path d="M 230 295 C 235 240, 335 240, 345 295 C 320 315, 255 315, 230 295 Z" fill="url(#seashellGrad)" stroke="#475569" stroke-width="1.5"/>
    <!-- Shell Ridges Radiating -->
    <path d="M 290 305 L 250 255 M 290 305 L 270 250 M 290 305 L 290 248 M 290 305 L 310 250 M 290 305 L 330 255" stroke="#94a3b8" stroke-width="1" fill="none" opacity="0.6"/>
    <!-- Pure Amber Ointment Pool Cooling inside Shell -->
    <ellipse cx="288" cy="285" rx="38" ry="16" fill="url(#clarifiedResin)" stroke="#b45309" stroke-width="1.2"/>
    <circle cx="275" cy="283" r="3" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="305" cy="286" rx="5" ry="2.5" fill="#fef08a" opacity="0.9"/>
  </g>

  <!-- Label 4: Seashell Cooling Container (10 Minutes) -->
  <g>
    <line x1="290" y1="285" x2="270" y2="225" stroke="#a3e635" stroke-width="1"/>
    <circle cx="290" cy="285" r="2.5" fill="#a3e635"/>
    <rect x="165" y="220" width="215" height="16" fill="#14210a" rx="3" stroke="#4d7c0f" stroke-width="1"/>
    <text x="272" y="232" fill="#bef264" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">조개껍데기에 덜어내어 10분간 자연 냉각</text>
  </g>

  <!-- Bottom Core Insight Briefing Box (Label 5) -->
  <rect x="20" y="348" width="360" height="26" fill="#111827" rx="4" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="20" y="348" width="4" height="26" fill="#f59e0b" rx="1"/>
  <text x="200" y="364" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">[핵심] 맑은 황금빛 소독 연고 분리 확보</text>
</svg>
