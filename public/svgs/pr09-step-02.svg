<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgS2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Bark Gradient for Logs -->
    <linearGradient id="oakBark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d1d13"/>
      <stop offset="25%" stop-color="#593b26"/>
      <stop offset="65%" stop-color="#412918"/>
      <stop offset="100%" stop-color="#1f130a"/>
    </linearGradient>

    <!-- Log Top End Grain -->
    <radialGradient id="oakEndGrain" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e5c596"/>
      <stop offset="50%" stop-color="#c99f67"/>
      <stop offset="85%" stop-color="#936232"/>
      <stop offset="100%" stop-color="#412918"/>
    </radialGradient>

    <!-- Pit Wall Cutout -->
    <linearGradient id="pitWall2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#140d07"/>
      <stop offset="50%" stop-color="#22140a"/>
      <stop offset="100%" stop-color="#140d07"/>
    </linearGradient>

    <!-- Heat Radial from Bottom -->
    <radialGradient id="heatBottom" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#c2410c" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#7c2d12" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07080a" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadowS2" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgS2)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#232830" stroke-width="1.2"/>

  <!-- Technical Corner Ticks -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#475569" stroke-width="1.2"/>

  <!-- Top Header Strip (Label 1) -->
  <rect x="20" y="16" width="360" height="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="16" width="3" height="20" fill="#f97316"/>
  <text x="30" y="30" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" letter-spacing="0.5">FIG. 02 // DENSE VERTICAL TIMBER STACK</text>

  <!-- Soil Cross Section & Pit Boundary -->
  <path d="M 20 100 L 65 100 L 125 315 L 20 315 Z" fill="#24150c" opacity="0.6"/>
  <path d="M 380 100 L 335 100 L 275 315 L 380 315 Z" fill="#24150c" opacity="0.6"/>
  <path d="M 65 100 Q 200 115 335 100 L 275 315 Q 200 320 125 315 Z" fill="url(#pitWall2)" stroke="#452715" stroke-width="1.2"/>

  <!-- Heat Glow from Bottom Embers -->
  <path d="M 125 315 Q 200 320 275 315 L 260 250 Q 200 255 140 250 Z" fill="url(#heatBottom)"/>

  <!-- ============================================== -->
  <!-- VERTICAL LOGS (수직 적재 참나무 장작들) -->
  <!-- ============================================== -->
  <g filter="url(#shadowS2)">
    <!-- Back Layer Logs -->
    <!-- Log B1 -->
    <g>
      <rect x="110" y="125" width="22" height="175" rx="3" fill="url(#oakBark)" stroke="#1a0f07" stroke-width="0.8"/>
      <ellipse cx="121" cy="125" rx="11" ry="4" fill="url(#oakEndGrain)" stroke="#3e2413" stroke-width="0.6"/>
    </g>
    <!-- Log B2 -->
    <g>
      <rect x="155" y="120" width="26" height="185" rx="3" fill="url(#oakBark)" stroke="#1a0f07" stroke-width="0.8"/>
      <ellipse cx="168" cy="120" rx="13" ry="5" fill="url(#oakEndGrain)" stroke="#3e2413" stroke-width="0.6"/>
    </g>
    <!-- Log B3 -->
    <g>
      <rect x="215" y="122" width="25" height="182" rx="3" fill="url(#oakBark)" stroke="#1a0f07" stroke-width="0.8"/>
      <ellipse cx="227" cy="122" rx="12.5" ry="4.5" fill="url(#oakEndGrain)" stroke="#3e2413" stroke-width="0.6"/>
    </g>
    <!-- Log B4 -->
    <g>
      <rect x="268" y="128" width="22" height="172" rx="3" fill="url(#oakBark)" stroke="#1a0f07" stroke-width="0.8"/>
      <ellipse cx="279" cy="128" rx="11" ry="4" fill="url(#oakEndGrain)" stroke="#3e2413" stroke-width="0.6"/>
    </g>

    <!-- Front Layer Main Logs (Prominent Wrist-Thick Oak) -->
    <!-- Front Log 1 -->
    <g>
      <rect x="80" y="135" width="28" height="165" rx="3" fill="url(#oakBark)" stroke="#1a0f07" stroke-width="1"/>
      <ellipse cx="94" cy="135" rx="14" ry="5" fill="url(#oakEndGrain)" stroke="#3e2413" stroke-width="0.8"/>
      <!-- Bark Details -->
      <line x1="88" y1="160" x2="88" y2="240" stroke="#1f1207" stroke-width="1.2"/>
      <line x1="98" y1="180" x2="98" y2="270" stroke="#1f1207" stroke-width="1"/>
    </g>

    <!-- Front Log 2 -->
    <g>
      <rect x="128" y="130" width="30" height="175" rx="3" fill="url(#oakBark)" stroke="#1a0f07" stroke-width="1"/>
      <ellipse cx="143" cy="130" rx="15" ry="5.5" fill="url(#oakEndGrain)" stroke="#3e2413" stroke-width="0.8"/>
      <line x1="136" y1="150" x2="136" y2="230" stroke="#1f1207" stroke-width="1.2"/>
      <line x1="148" y1="170" x2="148" y2="260" stroke="#1f1207" stroke-width="1"/>
    </g>

    <!-- Front Log 3 (Center) -->
    <g>
      <rect x="182" y="125" width="32" height="182" rx="3" fill="url(#oakBark)" stroke="#1a0f07" stroke-width="1"/>
      <ellipse cx="198" cy="125" rx="16" ry="6" fill="url(#oakEndGrain)" stroke="#3e2413" stroke-width="0.8"/>
      <ellipse cx="198" cy="125" rx="8" ry="3" fill="none" stroke="#78350f" stroke-width="0.6"/>
      <line x1="190" y1="155" x2="190" y2="250" stroke="#1f1207" stroke-width="1.2"/>
      <line x1="202" y1="175" x2="202" y2="265" stroke="#1f1207" stroke-width="1"/>
    </g>

    <!-- Front Log 4 -->
    <g>
      <rect x="238" y="132" width="30" height="173" rx="3" fill="url(#oakBark)" stroke="#1a0f07" stroke-width="1"/>
      <ellipse cx="253" cy="132" rx="15" ry="5.5" fill="url(#oakEndGrain)" stroke="#3e2413" stroke-width="0.8"/>
      <line x1="246" y1="155" x2="246" y2="235" stroke="#1f1207" stroke-width="1.2"/>
      <line x1="258" y1="175" x2="258" y2="265" stroke="#1f1207" stroke-width="1"/>
    </g>

    <!-- Front Log 5 (Right edge) -->
    <g>
      <rect x="290" y="138" width="26" height="162" rx="3" fill="url(#oakBark)" stroke="#1a0f07" stroke-width="1"/>
      <ellipse cx="303" cy="138" rx="13" ry="5" fill="url(#oakEndGrain)" stroke="#3e2413" stroke-width="0.8"/>
      <line x1="298" y1="165" x2="298" y2="245" stroke="#1f1207" stroke-width="1.2"/>
    </g>

    <!-- ============================================== -->
    <!-- SLENDER PACKING WEDGES (틈새 메운 잔가지들) -->
    <!-- ============================================== -->
    <!-- Wedge 1 (between 1 and 2) -->
    <line x1="119" y1="140" x2="121" y2="280" stroke="#a16207" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="119" cy="140" rx="3" ry="1.5" fill="#fef08a"/>

    <!-- Wedge 2 (between 2 and 3) -->
    <line x1="172" y1="135" x2="175" y2="285" stroke="#a16207" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="172" cy="135" rx="3.5" ry="1.8" fill="#fef08a"/>

    <!-- Wedge 3 (between 3 and 4) -->
    <line x1="227" y1="138" x2="225" y2="282" stroke="#a16207" stroke-width="6.5" stroke-linecap="round"/>
    <ellipse cx="227" cy="138" rx="3.2" ry="1.6" fill="#fef08a"/>

    <!-- Wedge 4 (between 4 and 5) -->
    <line x1="280" y1="142" x2="278" y2="278" stroke="#a16207" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="280" cy="142" rx="3" ry="1.5" fill="#fef08a"/>
  </g>

  <!-- Lower Embers (Igniting the Base of Logs) -->
  <g>
    <circle cx="150" cy="308" r="6" fill="#dc2626"/>
    <circle cx="185" cy="312" r="7" fill="#ea580c"/>
    <circle cx="215" cy="310" r="8" fill="#f59e0b"/>
    <circle cx="245" cy="309" r="6" fill="#dc2626"/>
    <path d="M 175 310 Q 185 295 195 308" fill="#fef08a" opacity="0.8"/>
    <path d="M 205 310 Q 215 292 225 308" fill="#fef08a" opacity="0.8"/>
  </g>

  <!-- Callout Label 2: Wrist-Thick Oak Stacking -->
  <g>
    <line x1="94" y1="135" x2="60" y2="75" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="94" cy="135" r="2.5" fill="#38bdf8"/>
    <rect x="20" y="65" width="220" height="16" fill="#0b1320" rx="3" stroke="#1e3a5f" stroke-width="1"/>
    <text x="130" y="77" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">손목 굵기(5~8cm) 참나무 수직 적재</text>
  </g>

  <!-- Callout Label 3: Packing Wedges in Gaps -->
  <g>
    <line x1="172" y1="170" x2="275" y2="85" stroke="#facc15" stroke-width="1.2"/>
    <circle cx="172" cy="170" r="2.5" fill="#facc15"/>
    <rect x="200" y="75" width="180" height="16" fill="#1c1608" rx="3" stroke="#854d0e" stroke-width="1"/>
    <text x="290" y="87" fill="#fde047" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">빈틈을 쐐기처럼 메운 잔가지</text>
  </g>

  <!-- Callout Label 4: Bottom Ember Heat Spreading -->
  <g>
    <line x1="200" y1="305" x2="270" y2="285" stroke="#fb923c" stroke-width="1.2"/>
    <circle cx="200" cy="305" r="2.5" fill="#fb923c"/>
    <rect x="180" y="275" width="190" height="16" fill="#1c0f05" rx="3" stroke="#ea580c" stroke-width="1"/>
    <text x="275" y="287" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">하단 초벌 불씨에서 번지는 열기</text>
  </g>

  <!-- Bottom Core Insight Briefing Box (Label 5) -->
  <rect x="20" y="348" width="360" height="26" fill="#111827" rx="4" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="20" y="348" width="4" height="26" fill="#10b981" rx="1"/>
  <text x="200" y="364" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">[핵심] 빈틈 최소화로 무산소 탄화 밀도 극대화</text>
</svg>
