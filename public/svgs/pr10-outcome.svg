<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgOut10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#0e1218"/>
      <stop offset="100%" stop-color="#050709"/>
    </linearGradient>

    <!-- Amber Resin Radial Gradient -->
    <radialGradient id="amberGlowOut" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <!-- Obsidian Hardened Pitch Gradient -->
    <radialGradient id="obsidianPitchOut" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="30%" stop-color="#27272a"/>
      <stop offset="70%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- Seashell Gradient -->
    <linearGradient id="shellGradOut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Wood Stick Gradient -->
    <linearGradient id="woodGradOut" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Stone Axe Blade Gradient -->
    <linearGradient id="axeStoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowOut10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgOut10)"/>
  <rect x="12" y="12" width="776" height="426" fill="none" stroke="#232830" stroke-width="1.2"/>

  <!-- Technical Corner Ticks -->
  <path d="M 20 28 L 36 28 M 28 20 L 28 36" stroke="#475569" stroke-width="1.2"/>
  <path d="M 780 28 L 764 28 M 772 20 L 772 36" stroke="#475569" stroke-width="1.2"/>
  <path d="M 20 422 L 36 422 M 28 414 L 28 430" stroke="#475569" stroke-width="1.2"/>
  <path d="M 780 422 L 764 422 M 772 414 L 772 430" stroke="#475569" stroke-width="1.2"/>

  <!-- Top Technical Header Strip -->
  <rect x="28" y="22" width="744" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="28" y="22" width="4" height="24" fill="#f59e0b"/>
  <text x="42" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" letter-spacing="0.5">PR-10 // PINE RESIN PURIFICATION &amp; PITCH GLUE (소나무 송진 항균 연고 및 만능 방수 결속 막대 제원)</text>

  <!-- LEFT HALF: Physical Dual Assets & Axe Lashing Detail -->
  <g>
    <!-- Ground / Slate Work Table -->
    <rect x="35" y="335" width="425" height="48" fill="#141a23" stroke="#252f3e" stroke-width="1"/>
    <line x1="35" y1="335" x2="460" y2="335" stroke="#38bdf8" stroke-width="1.2" opacity="0.6"/>

    <!-- 1. Antiseptic Amber Ointment in Clam Shell -->
    <g filter="url(#shadowOut10)">
      <path d="M 55 310 C 60 250, 180 250, 190 310 C 160 330, 85 330, 55 310 Z" fill="url(#shellGradOut)" stroke="#475569" stroke-width="1.5"/>
      <path d="M 122 322 L 75 265 M 122 322 L 100 258 M 122 322 L 122 255 M 122 322 L 145 258 M 122 322 L 170 265" stroke="#94a3b8" stroke-width="1" fill="none" opacity="0.6"/>
      <!-- Pure Amber Ointment Pool -->
      <ellipse cx="122" cy="298" rx="48" ry="19" fill="url(#amberGlowOut)" stroke="#b45309" stroke-width="1.2"/>
      <circle cx="105" cy="295" r="3.5" fill="#ffffff" opacity="0.8"/>
      <path d="M 85 294 Q 120 304 155 294" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Annotation: Antiseptic Ointment -->
    <rect x="42" y="70" width="165" height="18" fill="#1c1308" rx="3" stroke="#b45309" stroke-width="1"/>
    <text x="124" y="83" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">천연 상처 소독 연고 (30ml)</text>
    <line x1="122" y1="90" x2="122" y2="280" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- 2. Solid Pitch Stick (Stick with Obsidian Black Pitch Bulb) -->
    <g filter="url(#shadowOut10)">
      <path d="M 235 325 L 420 220" stroke="url(#woodGradOut)" stroke-width="12" stroke-linecap="round"/>
      <ellipse cx="230" cy="325" rx="32" ry="24" fill="url(#obsidianPitchOut)" stroke="#3f3f46" stroke-width="1.8"/>
      <circle cx="222" cy="320" r="20" fill="#09090b"/>
      <!-- Specular Reflection on Obsidian Surface -->
      <path d="M 210 310 Q 235 315 248 332" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
      <circle cx="212" cy="318" r="4" fill="#ffffff" opacity="0.75"/>
    </g>

    <!-- Annotation: Pitch Stick -->
    <rect x="235" y="115" width="180" height="18" fill="#18181b" rx="3" stroke="#3f3f46" stroke-width="1"/>
    <text x="325" y="128" fill="#e4e4e7" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">방수 결속 수지 막대 (Pitch Stick)</text>
    <line x1="260" y1="135" x2="235" y2="305" stroke="#71717a" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- 3. Axe Lashing Waterproof Seal Cross-Section Inset (Top Center/Left) -->
    <g filter="url(#shadowOut10)">
      <rect x="230" y="145" width="225" height="130" fill="#0a0f18" rx="5" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="230" y="145" width="225" height="20" fill="#0f172a" rx="5" stroke="#1e293b" stroke-width="0.8"/>
      <text x="342" y="159" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">실전 결속 방수 단면 // TOOL JOINT SEAL</text>

      <!-- Axe Handle Cross-Section -->
      <rect x="260" y="195" width="165" height="28" rx="4" fill="url(#woodGradOut)" stroke="#451a03" stroke-width="1"/>
      <!-- Stone Axe Blade Inserted into Split -->
      <polygon points="310,175 350,175 365,210 295,210" fill="url(#axeStoneGrad)" stroke="#334155" stroke-width="1"/>
      <!-- Black Pitch Glue Collar Sealing Joint 100% -->
      <path d="M 290 205 Q 330 198 370 205 Q 370 220 330 222 Q 290 220 290 205 Z" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
      <path d="M 295 208 Q 330 204 365 208" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.6"/>

      <!-- Water Droplets Bouncing Off Waterproof Pitch Collar -->
      <path d="M 315 188 Q 320 198 322 204" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <circle cx="320" cy="186" r="2.5" fill="#38bdf8"/>
      <path d="M 345 188 Q 340 198 338 204" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <circle cx="346" cy="186" r="2.5" fill="#38bdf8"/>

      <!-- Label inside Inset -->
      <text x="342" y="240" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">100% 방수 에폭시: 빗물 침투 차단</text>
      <text x="342" y="258" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">진동 충격 흡수 &amp; 칡줄 결속 영구 고정</text>
    </g>
  </g>

  <!-- RIGHT HALF: Specification & Engineering Performance Panel -->
  <g filter="url(#shadowOut10)">
    <rect x="480" y="62" width="292" height="325" fill="#0b0f17" rx="6" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="480" y="62" width="292" height="26" fill="#111827" rx="6" stroke="#1f2937" stroke-width="1"/>
    <text x="626" y="79" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" text-anchor="middle">송진 정제 및 천연 에폭시 제원 (SPECIFICATION)</text>

    <!-- Microscopic Carbon Matrix Callout Circle -->
    <g>
      <circle cx="535" cy="145" r="32" fill="#090d16" stroke="#f59e0b" stroke-width="1.5"/>
      <!-- Resin Matrix (Golden Honeycomb) -->
      <circle cx="535" cy="145" r="28" fill="#451a03" opacity="0.6"/>
      <!-- Dispersed Carbon Micro-Particles -->
      <circle cx="522" cy="135" r="3" fill="#18181b" stroke="#71717a" stroke-width="0.5"/>
      <circle cx="538" cy="132" r="4" fill="#18181b" stroke="#71717a" stroke-width="0.5"/>
      <circle cx="550" cy="142" r="3.5" fill="#18181b" stroke="#71717a" stroke-width="0.5"/>
      <circle cx="525" cy="152" r="4" fill="#18181b" stroke="#71717a" stroke-width="0.5"/>
      <circle cx="542" cy="156" r="3" fill="#18181b" stroke="#71717a" stroke-width="0.5"/>
      <circle cx="534" cy="145" r="3.5" fill="#18181b" stroke="#71717a" stroke-width="0.5"/>
      <!-- Interstitial Terpene Resin Binder -->
      <path d="M 524 136 L 536 134 M 540 134 L 548 140 M 527 150 L 532 146" stroke="#fbbf24" stroke-width="1" opacity="0.8"/>
      <!-- Microstructure Label -->
      <text x="640" y="138" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold">탄소-수지 결합 미세구조</text>
      <text x="640" y="152" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7.5">균열 전파 차단 복합재 골격</text>
      <text x="640" y="164" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="7.5">충격 인성 400% 향상 (취성 극복)</text>
    </g>

    <!-- Technical Specs Table Rows -->
    <g>
      <!-- Row 1: Antimicrobial Efficacy -->
      <rect x="495" y="195" width="262" height="24" fill="#0f172a" rx="3" stroke="#1e293b" stroke-width="1"/>
      <text x="505" y="211" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">항균 유효 성분</text>
      <text x="745" y="211" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="end">알파-피넨 &amp; 테르펜 (세균 차단)</text>

      <!-- Row 2: Hardness & Toughness -->
      <rect x="495" y="225" width="262" height="24" fill="#0f172a" rx="3" stroke="#1e293b" stroke-width="1"/>
      <text x="505" y="241" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">경화 경도 (Hardness)</text>
      <text x="745" y="241" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="end">모스 경도 3.0 (흑요석 광택)</text>

      <!-- Row 3: Optimum Ratio -->
      <rect x="495" y="255" width="262" height="24" fill="#0f172a" rx="3" stroke="#1e293b" stroke-width="1"/>
      <text x="505" y="271" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">최적 배합 비율</text>
      <text x="745" y="271" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="end">송진 1 : 참나무 숯가루 1</text>

      <!-- Row 4: Waterproof Seal -->
      <rect x="495" y="285" width="262" height="24" fill="#0f172a" rx="3" stroke="#1e293b" stroke-width="1"/>
      <text x="505" y="301" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">방수 및 내열 한계</text>
      <text x="745" y="301" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="end">완전 방수 100% / 60℃ 이하 안정</text>

      <!-- Row 5: Batch Yield -->
      <rect x="495" y="315" width="262" height="24" fill="#0f172a" rx="3" stroke="#1e293b" stroke-width="1"/>
      <text x="505" y="331" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">1회 정제 수확량</text>
      <text x="745" y="331" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="end">연고 30ml + 결속 막대 2개</text>

      <!-- Row 6: Re-melting Utility -->
      <rect x="495" y="345" width="262" height="24" fill="#0f172a" rx="3" stroke="#1e293b" stroke-width="1"/>
      <text x="505" y="361" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">재사용성 (Re-melting)</text>
      <text x="745" y="361" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="end">가열 시 즉시 재용융 접착</text>
    </g>
  </g>

  <!-- Bottom Core Summary Banner -->
  <rect x="28" y="398" width="744" height="28" fill="#111827" rx="4" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="28" y="398" width="4" height="28" fill="#10b981" rx="1"/>
  <text x="400" y="416" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" text-anchor="middle">[핵심 공학] 테르펜 항균 분자로 상처 감염을 차단하고 숯가루 탄소 결속으로 돌처럼 단단한 방수 에폭시 완성</text>
</svg>
