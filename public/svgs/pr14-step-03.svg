<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg1403" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#0e1319"/>
    </linearGradient>
    <linearGradient id="anvilStone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sinewAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="oakBaton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="bone3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="drop1403" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="grid1403" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16202c" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg1403)"/>
  <rect width="400" height="400" fill="url(#grid1403)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#253342" stroke-width="1"/>

  <!-- Top Header (Label 1) -->
  <rect x="16" y="14" width="368" height="28" rx="2" fill="#0f1722" stroke="#2c3e50" stroke-width="1"/>
  <text x="26" y="32" fill="#fde68a" font-family="monospace" font-size="11" font-weight="bold">FIG. 03 // DRIED ANIMAL SINEW FIBER SEPARATION</text>

  <!-- Flat Anvil Stone & Sinew Processing Area -->
  <g filter="url(#drop1403)">
    <!-- Flat Anvil River Stone -->
    <path d="M 50 210 L 310 190 L 350 270 L 80 290 Z" fill="url(#anvilStone)" stroke="#475569" stroke-width="1.5"/>
    <path d="M 50 210 L 50 225 L 80 305 L 350 285 L 350 270 L 80 290 Z" fill="#090d16" stroke="#334155" stroke-width="1"/>

    <!-- Rigid Amber Dried Sinew Tendon (Left portion uncrushed) -->
    <path d="M 60 235 C 80 230 110 232 140 230 C 145 226 145 240 140 244 C 110 246 80 248 60 245 Z" fill="url(#sinewAmber)" stroke="#92400e" stroke-width="1"/>
    <!-- Fibrous surface striations on tendon -->
    <line x1="70" y1="236" x2="135" y2="233" stroke="#fde68a" stroke-width="0.7" opacity="0.7"/>
    <line x1="75" y1="242" x2="135" y2="241" stroke="#fde68a" stroke-width="0.7" opacity="0.7"/>

    <!-- Crushed/Pounded Transition Zone -->
    <polygon points="140,230 160,222 165,248 140,244" fill="#fbbf24" opacity="0.8"/>
    <!-- Impact shockwaves -->
    <circle cx="152" cy="235" r="16" fill="none" stroke="#fde68a" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.8"/>
    <circle cx="152" cy="235" r="24" fill="none" stroke="#fde68a" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5"/>

    <!-- Oak Wood Baton (Tapping action from top-right) -->
    <g transform="rotate(-25 152 235)">
      <rect x="135" y="100" width="32" height="110" rx="6" fill="url(#oakBaton)" stroke="#ca8a04" stroke-width="1.2"/>
      <!-- Wood grain rings -->
      <line x1="140" y1="130" x2="162" y2="130" stroke="#713f12" stroke-width="1"/>
      <line x1="140" y1="160" x2="162" y2="160" stroke="#713f12" stroke-width="1"/>
      <line x1="140" y1="190" x2="162" y2="190" stroke="#713f12" stroke-width="1"/>
    </g>

    <!-- Fanned Out Silky Silver-White Collagen Fibers (Right portion) -->
    <!-- Fine individual filaments -->
    <path d="M 160 225 C 200 215 240 210 290 205" stroke="#f8fafc" stroke-width="1.2" fill="none"/>
    <path d="M 162 230 C 210 225 250 225 300 220" stroke="#f1f5f9" stroke-width="1" fill="none"/>
    <path d="M 164 235 C 205 238 255 240 310 238" stroke="#ffffff" stroke-width="1.2" fill="none"/>
    <path d="M 162 240 C 200 248 245 252 295 255" stroke="#e2e8f0" stroke-width="1" fill="none"/>
    <path d="M 160 245 C 195 258 235 265 285 270" stroke="#cbd5e1" stroke-width="0.8" fill="none"/>
  </g>

  <!-- Label 2: Flat Anvil Stone & Sinew -->
  <rect x="25" y="55" width="220" height="22" rx="2" fill="#141a23" stroke="#334155" stroke-width="1"/>
  <text x="33" y="70" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="bold">납작한 돌받침 위 건조 힘줄(Sinew) 배치</text>

  <!-- Label 3: Oak Baton Tapping -->
  <rect x="200" y="85" width="185" height="22" rx="2" fill="#141a23" stroke="#334155" stroke-width="1"/>
  <text x="208" y="100" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">참나무 방망이 경타격 (콜라겐 다발 분쇄)</text>

  <!-- Micro Detail Inset: Needle Threading with Saliva-Coated Sinew (Bottom-Right) -->
  <g filter="url(#drop1403)">
    <rect x="180" y="275" width="195" height="85" rx="3" fill="#0f172a" stroke="#2563eb" stroke-width="1"/>

    <!-- Bone needle head outline in inset -->
    <path d="M 190 315 C 190 305 200 295 215 295 L 360 298 L 360 332 L 215 335 C 200 335 190 325 190 315 Z" fill="url(#bone3)" stroke="#94a3b8" stroke-width="1"/>
    <!-- Eye hole -->
    <ellipse cx="220" cy="315" rx="6" ry="10" fill="#020617" stroke="#e02424" stroke-width="1"/>

    <!-- Sinew thread entering eye smoothly -->
    <path d="M 270 345 C 245 340 230 330 220 315 C 210 300 195 290 170 288" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <!-- Saliva moisture gloss highlight -->
    <ellipse cx="220" cy="315" rx="3" ry="5" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Label 4: Fiber Combing -->
  <rect x="25" y="295" width="150" height="22" rx="2" fill="#141a23" stroke="#334155" stroke-width="1"/>
  <text x="31" y="310" fill="#94a3b8" font-family="monospace" font-size="9" font-weight="bold">머리카락 3~4가닥 굵기 고인장 섬유 빗질</text>

  <!-- Label 5: Step 3 Core Summary -->
  <rect x="16" y="368" width="368" height="22" rx="2" fill="#1e293b" stroke="#e02424" stroke-width="1"/>
  <text x="24" y="383" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">[3단계 핵심] 침(Saliva) 코팅으로 바늘귀 부드러운 통과</text>
</svg>