<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg24s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="cupORS24s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid24s3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow24s3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg24s3)"/>
  <rect width="400" height="400" fill="url(#grid24s3)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Header Banner (Label 1) -->
  <rect x="14" y="14" width="372" height="28" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="32" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">FIG. 03 // 구토 방지 5분 간격 소량 분할 경구 투여 프로토콜</text>

  <!-- Label 2 Callout Box -->
  <rect x="16" y="50" width="368" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="66" fill="#bae6fd" font-family="monospace" font-size="10.5">기도 흡인 방지를 위해 상체를 45도 높여 안정된 자세 유지</text>

  <!-- Visual Comparison: Left (45-deg Posture & 5-Min Spoon Dosing ✓) vs Right (Rapid Gulping ✗ & 10-Min Rest Clock) -->
  <g filter="url(#shadow24s3)">
    <!-- Left Card: 45-Degree Elevated Posture + Small Spoon Sip Every 5 Min (APPROVED ✓) -->
    <rect x="22" y="86" width="170" height="154" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="42" cy="106" r="10" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <path d="M37,106 L41,110 L48,102" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>

    <!-- 45-Degree Backrest Wedge & Seated Torso Silhouette -->
    <polygon points="36,220 96,220 36,160" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <path d="M46,164 A28,28 0 0,1 66,220" fill="none" stroke="#fde047" stroke-width="1.2" stroke-dasharray="2,2"/>
    <!-- Head & 45-Deg Torso -->
    <circle cx="64" cy="134" r="12" fill="#94a3b8" stroke="#f8fafc" stroke-width="1.2"/>
    <path d="M56,148 L96,198 L138,198 L138,214 L88,214 L44,160 Z" fill="#475569" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Small Cup & Spoon Administering Measured Sip -->
    <rect x="128" y="132" width="38" height="46" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="131" y="146" width="32" height="29" rx="2" fill="url(#cupORS24s3)"/>
    <ellipse cx="102" cy="140" rx="11" ry="4.5" fill="#38bdf8" stroke="#f8fafc" stroke-width="1"/>
    <path d="M113,140 L138,136" stroke="#e2e8f0" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Right Card: Rapid Gulping Prohibited (✗) & 5-Min / 10-Min Interval Dial -->
    <rect x="208" y="86" width="170" height="154" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Upper Half of Right Card: No Gulping Warning (✗) -->
    <circle cx="232" cy="112" r="11" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
    <path d="M227,107 L237,117 M237,107 L227,117" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
    <!-- Tilted Large Bottle Gulping Crossed Out -->
    <rect x="264" y="98" width="52" height="26" rx="4" transform="rotate(-20 290 111)" fill="#1e293b" stroke="#ef4444" stroke-width="1.2"/>
    <path d="M258,96 L326,128" stroke="#ef4444" stroke-width="2.5"/>

    <!-- Lower Half of Right Card: 5-Min Interval Clock & 24h Discard Cycle -->
    <circle cx="293" cy="186" r="38" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- 5-Minute Sector Highlight (30 degrees) -->
    <path d="M293,186 L293,150 A36,36 0 0,1 324,168 Z" fill="#10b981" fill-opacity="0.45" stroke="#10b981" stroke-width="1.2"/>
    <!-- Clock Hands -->
    <path d="M293,186 L293,156" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <path d="M293,186 L316,172" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
    <circle cx="293" cy="186" r="3" fill="#fde047"/>
  </g>

  <!-- Label 3 Callout Box -->
  <rect x="16" y="254" width="368" height="26" rx="2" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="24" y="271" fill="#a7f3d0" font-family="monospace" font-size="10.5">컵째 급속 음용 금지 및 5분마다 1~2모금(숟가락)씩 분할 섭취</text>

  <!-- Label 4 Callout Box -->
  <rect x="16" y="288" width="368" height="26" rx="2" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="24" y="305" fill="#fde68a" font-family="monospace" font-size="10.5">구토 시 10분간 위장 휴식 후 3~5분 간격 한 스푼씩 재투여</text>

  <!-- Bottom Core Principle Strip (Label 5) -->
  <rect x="14" y="348" width="372" height="34" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="24" y="369" fill="#ecfdf5" font-family="monospace" font-size="10.5" font-weight="bold">[핵심] 위장 확장 구토 반사 억제 및 24시간 경과 수액 폐기</text>
</svg>
