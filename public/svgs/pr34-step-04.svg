<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg34s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <radialGradient id="glow34s4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.88"/>
      <stop offset="45%" stop-color="#fde047" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#090a0d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid34s4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow34s4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg34s4)"/>
  <rect width="400" height="400" fill="url(#grid34s4)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Label 1 -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 04 // 바깥 틈새 2중 방수 밀봉 + 360도 55W 태양광 산란</text>

  <!-- Label 2 -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9.5">송진·기름 찰흙·방수 띠로 병-판자 틈새 빗물 차단</text>

  <!-- Main Illustration: Waterproof Resin/Clay Seal + Foil Indoor Reflector + 360-Deg Radiant Room Glow -->
  <g filter="url(#shadow34s4)">
    <!-- Soft 55W Equivalent Omnidirectional Room Light Halo -->
    <circle cx="200" cy="212" r="95" fill="url(#glow34s4)"/>

    <!-- Window/Roof Barrier Board -->
    <rect x="30" y="138" width="136" height="14" rx="2" fill="#785028" stroke="#b4834e" stroke-width="1.8"/>
    <rect x="234" y="138" width="136" height="14" rx="2" fill="#785028" stroke="#b4834e" stroke-width="1.8"/>

    <!-- Double Waterproof Resin / Oiled Clay Bead Sloped to Shed Rainwater -->
    <polygon points="146,138 164,138 164,124" fill="#b45309" stroke="#f59e0b" stroke-width="1.5"/>
    <polygon points="254,138 236,138 236,124" fill="#b45309" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Rain Drops Deflecting Away Outside -->
    <path d="M 118 96 L 118 112 M 138 92 L 138 108 M 262 92 L 262 108 M 282 96 L 282 112" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 3"/>
    <path d="M 152 132 L 132 132" stroke="#38bdf8" stroke-width="1.8"/>
    <path d="M 248 132 L 268 132" stroke="#38bdf8" stroke-width="1.8"/>

    <!-- Indoor Foil Reflector Skirt Mounted on Underside of Board -->
    <polygon points="148,152 164,152 136,166" fill="#e2e8f0" stroke="#ffffff" stroke-width="1.2"/>
    <polygon points="252,152 236,152 264,166" fill="#e2e8f0" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Luminous Sealed Water Prism Bottle -->
    <rect x="188" y="92" width="24" height="10" rx="2" fill="#0284c7" stroke="#bae6fd" stroke-width="1.5"/>
    <path d="M 190 102 L 190 112 Q 166 124 164 146 L 164 236 Q 164 248 176 248 L 224 248 Q 236 248 236 236 L 236 146 Q 234 124 210 112 L 210 102 Z" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/>

    <!-- Bright 360-Deg Daylight Beams Illuminating Table & Emergency Supplies -->
    <line x1="164" y1="210" x2="88" y2="262" stroke="#fde047" stroke-width="2.2"/>
    <line x1="200" y1="248" x2="200" y2="274" stroke="#fde047" stroke-width="2.5"/>
    <line x1="236" y1="210" x2="312" y2="262" stroke="#fde047" stroke-width="2.2"/>
    <!-- Shelter Table Silhouetted & Illuminated Below -->
    <rect x="118" y="276" width="164" height="10" rx="2" fill="#44403c" stroke="#a8a29e" stroke-width="1.5"/>
  </g>

  <!-- Label 3 -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="315" fill="#cbd5e1" font-family="monospace" font-size="9">실내 천장면 은박 호일 반사판으로 하향 밝기 1.5배 증폭</text>

  <!-- Label 4 -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#1e1b10" stroke="#f59e0b" stroke-width="1"/>
  <text x="24" y="344" fill="#fef08a" font-family="monospace" font-size="9">낮 동안 불꽃·전기 없이 55W급 360도 자연 조명 제공</text>

  <!-- Label 5 -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="376" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">[핵심] 화재·일산화탄소 0% 안전한 무전력 주간 실내 조명 완수</text>
</svg>