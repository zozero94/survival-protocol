<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-03 [DEBRIS-HUT-SHELTER]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 03</text>

  <!-- 지면 기준선 -->
  <line x1="40" y1="280" x2="360" y2="280" stroke="#404040" stroke-width="2"/>

  <!-- 1m 외부 낙엽 돔 윤곽선 (Debris Mound) -->
  <path d="M 50 280 Q 90 90 200 90 Q 310 90 350 280 Z" fill="#141414" stroke="#FFFFFF" stroke-width="2"/>
  <!-- 내부 골조 단면 (점선) -->
  <path d="M 100 280 Q 130 180 200 180 Q 270 180 300 280" fill="#050505" stroke="#737373" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- 바닥 40cm 마른 낙엽 단열 매트리스 (Ground Insulation) -->
  <rect x="105" y="245" width="190" height="35" fill="#262626" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="105" y1="262" x2="295" y2="262" stroke="#525252" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="200" y="267" fill="#E5E5E5" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">40cm GROUND BED [LEAVES]</text>

  <!-- 외벽 1m 두께 치수선 -->
  <line x1="75" y1="180" x2="140" y2="210" stroke="#E5E5E5" stroke-width="1.5"/>
  <path d="M 78 186 L 75 180 L 82 178 M 133 212 L 140 210 L 137 204" fill="none" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="100" y="188" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="black">1.0m THICK</text>

  <!-- 외벽 솔잎 비늘 빗물 유도 층 (Thatch / Pine Shingles) -->
  <path d="M 120 120 L 110 135 M 140 105 L 130 120 M 260 105 L 270 120 M 280 120 L 290 135" stroke="#A3A3A3" stroke-width="1.5"/>
  <text x="200" y="115" fill="#A3A3A3" font-family="monospace" font-size="9" text-anchor="middle">WATER-SHEDDING PINE THATCH</text>

  <!-- 하단 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 03: 1m DEBRIS MOUND &amp; 40cm BED</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">NEVER SLEEP ON BARE GROUND; PILE LEAVES ARM-DEEP TO SEAL BODY HEAT</text>
</svg>
