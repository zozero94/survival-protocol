<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-03 [DEBRIS-HUT-SHELTER]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 01</text>

  <!-- 지면 기준선 -->
  <line x1="40" y1="280" x2="360" y2="280" stroke="#404040" stroke-width="2"/>
  <line x1="40" y1="285" x2="360" y2="285" stroke="#262626" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- 지지 바위 / 밑동 그루터기 (Fork / Boulder) -->
  <polygon points="60,280 80,180 120,180 140,280" fill="#141414" stroke="#737373" stroke-width="1.5"/>
  <text x="100" y="240" fill="#737373" font-family="monospace" font-size="9" text-anchor="middle">STUMP FORK</text>

  <!-- 3m 주 기둥 (Ridge Pole: 지지대 1m 높이에서 지면으로 경사) -->
  <line x1="100" y1="180" x2="340" y2="280" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="180" x2="340" y2="280" stroke="#000000" stroke-width="2" stroke-linecap="round"/>

  <!-- 치수선: 지지 높이 1m -->
  <line x1="50" y1="180" x2="50" y2="280" stroke="#E5E5E5" stroke-width="1.5"/>
  <path d="M47 185 L50 180 L53 185 M47 275 L50 280 L53 275" fill="none" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="42" y="235" fill="#E5E5E5" font-family="monospace" font-size="10" text-anchor="end" font-weight="bold">1.0m</text>

  <!-- 치수선: 주 기둥 길이 3m -->
  <line x1="110" y1="165" x2="345" y2="265" stroke="#A3A3A3" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="235" y="205" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold">RIDGE POLE (3.0m)</text>

  <!-- 1인 누운 신체 치수 프로파일 (점선) -->
  <ellipse cx="220" cy="270" rx="45" ry="8" fill="none" stroke="#525252" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="165" cy="265" r="7" fill="none" stroke="#525252" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="210" y="255" fill="#737373" font-family="monospace" font-size="9">BODY FIT SPACE</text>

  <!-- 하단 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 01: RIDGE POLE &amp; STRUCTURAL ANCHOR</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">SECURE 3m HARDWOOD AT 1m CREST TO MINIMIZE INTERNAL AIR VOLUME</text>
</svg>
