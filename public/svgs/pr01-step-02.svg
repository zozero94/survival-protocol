<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradP02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b"/>
      <stop offset="50%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>

    <!-- Funnel Cutaway Shell Gradient -->
    <linearGradient id="funnelCutaway" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#332c25"/>
      <stop offset="15%" stop-color="#665747"/>
      <stop offset="50%" stop-color="#181e26"/>
      <stop offset="85%" stop-color="#665747"/>
      <stop offset="100%" stop-color="#332c25"/>
    </linearGradient>

    <!-- Charcoal Grain Texture Pattern -->
    <pattern id="charcoalTexture" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#111317"/>
      <circle cx="3" cy="3" r="2.2" fill="#22272e"/>
      <circle cx="8" cy="8" r="2.8" fill="#1b2026"/>
      <circle cx="9" cy="2" r="1.5" fill="#2d333b"/>
      <circle cx="2" cy="9" r="1.8" fill="#262c33"/>
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadowP02" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="400" height="400" fill="url(#bgGradP02)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#22262c" stroke-width="1"/>

  <!-- Technical Corner Crosshairs -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#374151" stroke-width="1"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#374151" stroke-width="1"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#374151" stroke-width="1"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#374151" stroke-width="1"/>

  <!-- Blueprint Header (Label 1) -->
  <text x="24" y="28" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="0.5">FIG. 02 // PURIFICATION STEP 2: 숯 흡착층 형성</text>
  <line x1="24" y1="36" x2="376" y2="36" stroke="#262d35" stroke-width="1"/>

  <!-- Cutaway Cross Section Funnel Wall -->
  <polygon points="120,85 240,85 195,295 165,295" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 2"/>
  <path d="M 120 85 L 165 295 L 195 295 L 240 85" fill="none" stroke="#374151" stroke-width="3"/>

  <!-- Bottom Moss Plug in Cross Section -->
  <polygon points="166,275 194,275 190,295 170,295" fill="#14532d" stroke="#22c55e" stroke-width="1"/>

  <!-- Charcoal Bed (8cm layer) with Texture and Shading -->
  <polygon points="152,195 208,195 194,275 166,275" fill="url(#charcoalTexture)" stroke="#111827" stroke-width="1.5" filter="url(#shadowP02)"/>
  
  <!-- Individual Charcoal Chunks (5~8mm grains) -->
  <rect x="172" y="202" width="7" height="6" rx="1.5" fill="#374151" stroke="#1f2937" stroke-width="0.8"/>
  <rect x="183" y="205" width="8" height="7" rx="1.5" fill="#4b5563" stroke="#1f2937" stroke-width="0.8"/>
  <rect x="175" y="218" width="9" height="7" rx="2" fill="#374151" stroke="#111827" stroke-width="0.8"/>
  <rect x="188" y="222" width="7" height="6" rx="1.5" fill="#4b5563" stroke="#1f2937" stroke-width="0.8"/>
  <rect x="170" y="235" width="8" height="8" rx="2" fill="#1f2937" stroke="#0f172a" stroke-width="0.8"/>
  <rect x="182" y="240" width="9" height="7" rx="2" fill="#374151" stroke="#1f2937" stroke-width="0.8"/>
  <rect x="174" y="255" width="8" height="6" rx="1.5" fill="#4b5563" stroke="#111827" stroke-width="0.8"/>

  <!-- 8cm Height Dimension Bracket -->
  <path d="M 215 195 L 225 195 L 225 275 L 215 275" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="225" y1="235" x2="235" y2="235" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Zoom Loupe: Micro-Pore Adsorption Mechanism (Right Top) -->
  <circle cx="310" cy="115" r="32" fill="#0d1117" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Charcoal Porous Matrix -->
  <circle cx="310" cy="115" r="22" fill="#1f2937"/>
  <circle cx="304" cy="110" r="3" fill="#0b0f14"/>
  <circle cx="316" cy="112" r="2.5" fill="#0b0f14"/>
  <circle cx="310" cy="122" r="3.2" fill="#0b0f14"/>
  <!-- Toxin Trap Arrow Vectors into pores -->
  <path d="M 292 105 L 302 109" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polygon points="302,109 296,106 298,112" fill="#ef4444"/>
  <path d="M 326 126 L 314 123" stroke="#ef4444" stroke-width="1.5"/>
  <polygon points="314,123 320,121 319,127" fill="#ef4444"/>

  <!-- Technical Callouts -->
  <!-- Callout 1: Charcoal Core (Label 2) -->
  <line x1="160" y1="235" x2="115" y2="75" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="160" cy="235" r="2.5" fill="#f59e0b"/>
  <text x="24" y="70" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold">CHARCOAL CORE (활성 숯)</text>

  <!-- Callout 2: Pore Absorption (Label 3) -->
  <text x="376" y="70" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="end">PORE ABSORPTION (미세 흡착)</text>

  <!-- Callout 3: Thickness 8cm (Label 4) -->
  <line x1="235" y1="235" x2="285" y2="165" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="235" cy="235" r="2.5" fill="#f59e0b"/>
  <text x="376" y="165" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="end">THICKNESS: 8CM (두께)</text>

  <!-- Bottom Tactical Note Strip -->
  <rect x="18" y="340" width="364" height="34" fill="#111419" stroke="#262d35" stroke-width="1"/>
  <rect x="18" y="340" width="4" height="34" fill="#f59e0b"/>
  <!-- Label 5: Step Core Instruction -->
  <text x="32" y="361" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">[2단계 핵심] 콩알 크기(5~8mm)로 부숴 8cm 충진</text>
</svg>
