<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b"/>
      <stop offset="50%" stop-color="#0f1216"/>
      <stop offset="100%" stop-color="#0a0c0e"/>
    </linearGradient>

    <!-- Manila Standing Rope 3D Tubular Gradient -->
    <linearGradient id="ropeManila03" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="25%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Tactical Green Working Rope 3D Gradient -->
    <linearGradient id="ropeGreen03" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="25%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#bbf7d0"/>
      <stop offset="75%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Deep Drop Shadow Filter for Over/Under Crossing -->
    <filter id="shadowDeep03" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <!-- Twisted Rope Braid Pattern for Manila Rope -->
    <pattern id="braidManila03" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#451a03" stroke-width="2.5" opacity="0.6"/>
      <line x1="6" y1="0" x2="6" y2="12" stroke="#fef3c7" stroke-width="1.5" opacity="0.4"/>
    </pattern>

    <!-- Paracord Texture Pattern for Working End -->
    <pattern id="braidGreen03" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#052e16" stroke-width="2" opacity="0.7"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#bbf7d0" stroke-width="1.2" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Canvas Backdrop -->
  <rect width="400" height="400" fill="url(#bgGrad03)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#22262c" stroke-width="1"/>

  <!-- Technical Corner Crosshairs -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#374151" stroke-width="1"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#374151" stroke-width="1"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#374151" stroke-width="1"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#374151" stroke-width="1"/>

  <!-- Blueprint Header -->
  <text x="24" y="28" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">FIG. 03 // BOWLINE STEP 3: 나무(원줄) 뒤편 선회</text>
  <line x1="24" y1="36" x2="376" y2="36" stroke="#262d35" stroke-width="1"/>

  <!-- Background Reference Grid -->
  <g opacity="0.12" stroke="#4b5563" stroke-width="0.5" stroke-dasharray="2 4">
    <line x1="60" y1="40" x2="60" y2="340"/>
    <line x1="200" y1="40" x2="200" y2="340"/>
    <line x1="340" y1="40" x2="340" y2="340"/>
    <line x1="20" y1="120" x2="380" y2="120"/>
    <line x1="20" y1="200" x2="380" y2="200"/>
    <line x1="20" y1="280" x2="380" y2="280"/>
  </g>

  <!-- ============================================================== -->
  <!-- 1. WORKING END (토끼 줄) BEHIND THE TREE (원줄 뒤편으로 감는 구간) -->
  <!-- Drawn FIRST so the tree sits in FRONT of it! -->
  <!-- ============================================================== -->
  <!-- Loop emerging from throat hole and curving behind the tree to the left -->
  <g opacity="0.95">
    <!-- Path behind the standing part -->
    <path d="M 215 155 C 235 120 235 75 195 72 C 160 70 145 95 150 135" 
          stroke="#000000" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 215 155 C 235 120 235 75 195 72 C 160 70 145 95 150 135" 
          stroke="url(#ropeGreen03)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 215 155 C 235 120 235 75 195 72 C 160 70 145 95 150 135" 
          stroke="url(#braidGreen03)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- ============================================================== -->
  <!-- 2. STANDING PART (나무 / 원줄) SITTING IN FRONT WITH HEAVY SHADOW -->
  <!-- ============================================================== -->
  <g filter="url(#shadowDeep03)">
    <!-- Standing Rope Main Vertical Trunk -->
    <path d="M 195 42 L 195 120" stroke="#000000" stroke-width="20" stroke-linecap="round"/>
    <path d="M 195 42 L 195 120" stroke="url(#ropeManila03)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 195 42 L 195 120" stroke="url(#braidManila03)" stroke-width="14" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Throat Loop (토끼굴 루프 - 6자 루프 구조) -->
  <path d="M 195 120 C 130 135 125 215 185 225 C 235 230 255 190 230 155 C 210 130 180 122 145 140" 
        stroke="#000000" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M 195 120 C 130 135 125 215 185 225 C 235 230 255 190 230 155 C 210 130 180 122 145 140" 
        stroke="url(#ropeManila03)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 195 120 C 130 135 125 215 185 225 C 235 230 255 190 230 155 C 210 130 180 122 145 140" 
        stroke="url(#braidManila03)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- Lower Main Eye Loop -->
  <path d="M 185 225 C 185 280 145 325 105 325 C 65 325 40 270 50 210 C 60 160 105 130 145 140" 
        stroke="#000000" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M 185 225 C 185 280 145 325 105 325 C 65 325 40 270 50 210 C 60 160 105 130 145 140" 
        stroke="url(#ropeManila03)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 185 225 C 185 280 145 325 105 325 C 65 325 40 270 50 210 C 60 160 105 130 145 140" 
        stroke="url(#braidManila03)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- ============================================================== -->
  <!-- 3. WORKING END FRONT POINTER (굴로 다시 들어갈 준비) -->
  <!-- ============================================================== -->
  <!-- Green Tail emerging on the left, curving downward aiming into the hole -->
  <g filter="url(#shadowDeep03)">
    <path d="M 150 135 C 152 148 165 160 175 168" 
          stroke="#000000" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 150 135 C 152 148 165 160 175 168" 
          stroke="url(#ropeGreen03)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 150 135 C 152 148 165 160 175 168" 
          stroke="url(#braidGreen03)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>

  <!-- Heat-sealed Red End Cap on Working Tip -->
  <line x1="172" y1="165" x2="178" y2="171" stroke="#ef4444" stroke-width="4" stroke-linecap="square"/>

  <!-- ============================================================== -->
  <!-- 4. MOTION & COGNITIVE BEHIND-THE-TREE CUES -->
  <!-- ============================================================== -->
  <!-- Behind-the-Tree Orbit Motion Arrow (시계 반대 방향 회전 궤적) -->
  <path d="M 235 100 C 235 60 165 55 145 95 C 135 115 140 145 160 160" 
        fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 2"/>
  <polygon points="163,165 152,159 160,150" fill="#ef4444"/>



  <!-- Re-entry Target Loupe Circle around throat hole -->
  <circle cx="180" cy="180" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- ============================================================== -->
  <!-- 5. CALLOUT LABELS (9대 선언적 바인딩 라벨) -->
  <!-- ============================================================== -->
  <!-- Label 2 & 3: Around the tree (Top Right) -->
  <line x1="225" y1="95" x2="265" y2="95" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="225" cy="95" r="2.5" fill="#f59e0b"/>
  <text x="275" y="92" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">AROUND THE TREE</text>
  <text x="275" y="105" fill="#fef3c7" font-family="'JetBrains Mono', monospace" font-size="9">원줄 '뒤쪽'을 감아 돔</text>

  <!-- Label 4 & 5: Tree Trunk Axis (Top Left) -->
  <line x1="190" y1="70" x2="80" y2="70" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="190" cy="70" r="2.5" fill="#f59e0b"/>
  <text x="24" y="65" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">TREE (나무 기둥줄)</text>
  <text x="24" y="78" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9">토끼가 돌아 나갈 중심 축</text>

  <!-- Label 6 & 7: Re-entry Ready (Center Left) -->
  <line x1="165" y1="165" x2="80" y2="165" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="165" cy="165" r="2.5" fill="#38bdf8"/>
  <text x="24" y="158" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">RE-ENTRY READY</text>
  <text x="24" y="171" fill="#bae6fd" font-family="'JetBrains Mono', monospace" font-size="9">다시 굴로 진입할 준비</text>

  <!-- Bottom Tactical Field Note Strip -->
  <rect x="18" y="342" width="364" height="40" fill="#111419" stroke="#262d35" stroke-width="1"/>
  <rect x="18" y="342" width="4" height="40" fill="#f59e0b"/>
  <!-- Label 8 & 9: Summary Instruction -->
  <text x="32" y="357" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="bold">[3단계 핵심] 굴에서 나온 토끼가 원줄 뒤편을 감싸 돎</text>
  <text x="32" y="371" fill="#9ca3af" font-family="'Chivo', sans-serif" font-size="8.5">반드시 원줄의 '뒤'로 돌아야 단단히 조여지는 칼라(Collar) 루프가 만들어집니다.</text>
</svg>