<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#0d131a"/>
    </linearGradient>
    <linearGradient id="funnelTwig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow03" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <pattern id="grid03" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#18222d" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#bg03)"/>
  <rect width="400" height="400" fill="url(#grid03)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#263545" stroke-width="1"/>

  <!-- Top HUD Header -->
  <rect x="16" y="14" width="368" height="28" fill="#101720" stroke="#2c3e50" stroke-width="1"/>
  <text x="26" y="32" fill="#fde68a" font-family="monospace" font-size="11" font-weight="bold">FIG. 03 // ONE-WAY INVERTED FUNNEL VALVE</text>

  <!-- Cutaway Cross-Section of Outer Basket & Inner Inverted Funnel -->
  <g filter="url(#shadow03)">
    <!-- Outer Basket Cutaway Shell (Dimmed Olive) -->
    <polygon points="65,135 345,195 345,235 65,295" fill="#162013" opacity="0.55"/>
    <line x1="65" y1="135" x2="345" y2="195" stroke="#6b7f43" stroke-width="4"/>
    <line x1="65" y1="295" x2="345" y2="235" stroke="#6b7f43" stroke-width="4"/>
    <ellipse cx="65" cy="215" rx="24" ry="80" fill="none" stroke="#849b5c" stroke-width="6"/>

    <!-- Inner Inverted Funnel Cone (Highlighted Amber/Gold Check-Valve) -->
    <polygon points="65,140 198,196 198,234 65,290" fill="#422006" opacity="0.45"/>
    <g stroke="url(#funnelTwig)" stroke-width="2.5" stroke-linecap="round">
      <line x1="65" y1="142" x2="205" y2="198"/>
      <line x1="65" y1="160" x2="208" y2="203"/>
      <line x1="65" y1="178" x2="210" y2="208"/>
      <line x1="65" y1="196" x2="210" y2="212"/>
      <line x1="65" y1="234" x2="210" y2="218"/>
      <line x1="65" y1="252" x2="210" y2="222"/>
      <line x1="65" y1="270" x2="208" y2="227"/>
      <line x1="65" y1="288" x2="205" y2="232"/>
    </g>

    <!-- 5~6cm Narrow Inner Throat Dimension Indicator -->
    <ellipse cx="204" cy="215" rx="7" ry="19" fill="none" stroke="#fde68a" stroke-width="2" stroke-dasharray="3,2"/>

    <!-- Fish Entry Path Arrow (Green/Cyan) -->
    <path d="M 22 215 L 185 215" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="5,3"/>
    <polygon points="192,215 180,209 180,221" fill="#38bdf8"/>

    <!-- Trapped Fish Inside Chamber & Blocked Reverse Escape Arrows (Red) -->
    <path d="M 245 215 C 260 202, 288 202, 305 215 C 315 207, 322 204, 324 204 L 320 215 L 324 226 C 322 226, 315 223, 305 215 C 288 228, 260 228, 245 215 Z" fill="#94a3b8" stroke="#f8fafc" stroke-width="1.2"/>
    <circle cx="256" cy="213" r="2" fill="#0f172a"/>
    <!-- Blocked reverse path -->
    <path d="M 245 198 C 228 190, 218 190, 210 196" fill="none" stroke="#ef4444" stroke-width="2"/>
    <line x1="205" y1="191" x2="215" y2="201" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="215" y1="191" x2="205" y2="201" stroke="#ef4444" stroke-width="2.5"/>
  </g>

  <!-- Callouts & Labels -->
  <!-- Label 2: Outer rim joined to basket mouth (25cm) -->
  <line x1="65" y1="135" x2="65" y2="76" stroke="#fde68a" stroke-width="1.2"/>
  <circle cx="65" cy="135" r="3" fill="#fde68a"/>
  <rect x="18" y="52" width="285" height="24" rx="3" fill="#0f172a" stroke="#fde68a" stroke-width="1"/>
  <text x="26" y="68" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">역깔때기 외측 입구 (직경 25cm 몸통 결합)</text>

  <!-- Label 3: Flexible inner twig tips (5-6cm) -->
  <line x1="204" y1="196" x2="225" y2="110" stroke="#fde68a" stroke-width="1.2"/>
  <circle cx="204" cy="196" r="3" fill="#fde68a"/>
  <rect x="92" y="86" width="290" height="24" rx="3" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
  <text x="100" y="102" fill="#fde68a" font-family="sans-serif" font-size="11">안쪽으로 오므라든 탄성 가지 끝단 (직경 5~6cm)</text>

  <!-- Label 4: Expands on entry, blocks reverse -->
  <line x1="210" y1="232" x2="210" y2="310" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="210" cy="232" r="3" fill="#38bdf8"/>
  <rect x="24" y="310" width="295" height="24" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="32" y="326" fill="#38bdf8" font-family="sans-serif" font-size="11">물고기 진입 시 벌어지고 역진 시 걸리는 구조</text>

  <!-- Label 5: Core Check-Valve Principle -->
  <rect x="18" y="344" width="364" height="34" rx="4" fill="#141e28" stroke="#ef4444" stroke-width="1.2"/>
  <text x="28" y="365" fill="#fde68a" font-family="sans-serif" font-size="11.5" font-weight="bold">[핵심] 일방향 침입 허용 &amp; 역방향 탈출 원천 차단</text>
</svg>
