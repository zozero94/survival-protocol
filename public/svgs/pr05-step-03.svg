<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 340" class="w-full h-auto max-w-[680px]" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="680" height="340" fill="none" stroke="#222222" stroke-width="1"/>

  <!-- Left finished twisted rope -->
  <g transform="translate(95, 165)">
    <path d="M0,0 C20,-15 40,15 60,0 C80,-15 100,15 120,0 C140,-15 160,15 180,0" fill="none" stroke="#E5E5E5" stroke-width="10"/>
    <path d="M0,0 C20,15 40,-15 60,0 C80,15 100,-15 120,0 C140,15 160,-15 180,0" fill="none" stroke="#888888" stroke-width="7"/>
  </g>

  <!-- Left hand pinch point -->
  <circle cx="275" cy="165" r="18" fill="#1E1E1E" stroke="#E02424" stroke-width="2.5"/>
  <circle cx="275" cy="165" r="4" fill="#E02424"/>

  <!-- Top strand twisting outward (away from body) -->
  <path d="M290,157 Q365,115 445,110" fill="none" stroke="#E5E5E5" stroke-width="7"/>
  <path d="M365,120 C370,95 390,90 400,105" fill="none" stroke="#10B981" stroke-width="3"/>
  <polygon points="400,97 407,107 395,110" fill="#10B981"/>

  <!-- Bottom strand crossing over towards body -->
  <path d="M290,173 Q355,215 445,220" fill="none" stroke="#888888" stroke-width="7"/>
  <path d="M375,135 C405,155 395,185 385,200" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="4 2"/>
  <polygon points="380,193 383,207 393,198" fill="#D97706"/>

  <!-- Double lock icon/diagram on right -->
  <rect x="490" y="115" width="110" height="95" fill="#151515" stroke="#333333" stroke-width="1.5"/>
  <path d="M520,162 L570,162 M545,137 L545,187" stroke="#E5E5E5" stroke-width="2"/>
  <circle cx="545" cy="162" r="18" fill="none" stroke="#10B981" stroke-width="2"/>

  <!-- 5 Clean, Non-Overlapping Labels -->
  <text x="250" y="62" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">① 위쪽 가닥: 몸 바깥쪽(↑)으로 단단히 비틀기</text>
  <text x="70" y="115" fill="#E5E5E5" font-family="'Space Grotesk', sans-serif" font-size="11">② 서로 되감기며 톱니처럼 맞물린 밧줄 무늬</text>
  <text x="70" y="218" fill="#E02424" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">③ 왼손 엄지·검지로 꼬인 자리 꽉 눌러 잡기</text>
  <text x="250" y="258" fill="#D97706" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">④ 비튼 위 가닥을 아래 가닥 너머 몸 쪽(↓)으로 넘기기</text>
  <text x="280" y="298" fill="#E5E5E5" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">⑤ 손을 놓아도 절대 풀리지 않는 역방향 잠금 구조</text>
</svg>