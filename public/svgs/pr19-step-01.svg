<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg19s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090b0e"/>
      <stop offset="100%" stop-color="#11151c"/>
    </linearGradient>
    <linearGradient id="woodSlab19" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c4028"/>
      <stop offset="50%" stop-color="#47301d"/>
      <stop offset="100%" stop-color="#2e1e11"/>
    </linearGradient>
    <linearGradient id="leanMeat19" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#651212"/>
    </linearGradient>
    <linearGradient id="whiteFat19" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="flintBlade19" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow19s1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg19s1)"/>
  <g stroke="#1e293b" stroke-width="0.6" opacity="0.45">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>
  <rect x="4" y="4" width="392" height="392" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Header Banner -->
  <rect x="8" y="10" width="384" height="24" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="16" y="26" fill="#fde68a" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 01 // TRIMMING WHITE FAT &amp; SLICING LEAN STRIPS</text>

  <!-- Sub-banner 1 -->
  <rect x="20" y="54" width="360" height="22" rx="2" fill="#131922" stroke="#334155" stroke-width="0.8"/>
  <text x="200" y="69" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">날카로운 돌칼로 쉽게 상하는 하얀 비계 100% 도려내기</text>

  <!-- Zone 1: Trimming White Fat with Flint Blade -->
  <g filter="url(#shadow19s1)">
    <!-- Hardwood cutting board -->
    <polygon points="35,95 245,95 255,165 25,165" fill="url(#woodSlab19)" stroke="#855836" stroke-width="1.2"/>
    <line x1="32" y1="115" x2="248" y2="115" stroke="#3b2615" stroke-width="0.8"/>
    <line x1="29" y1="142" x2="251" y2="142" stroke="#3b2615" stroke-width="0.8"/>

    <!-- Lean Red Meat Block -->
    <rect x="52" y="104" width="110" height="46" rx="4" fill="url(#leanMeat19)" stroke="#ef4444" stroke-width="1"/>
    <line x1="60" y1="114" x2="154" y2="114" stroke="#fca5a5" stroke-width="0.6" opacity="0.5"/>
    <line x1="60" y1="126" x2="154" y2="126" stroke="#fca5a5" stroke-width="0.6" opacity="0.5"/>
    <line x1="60" y1="138" x2="154" y2="138" stroke="#fca5a5" stroke-width="0.6" opacity="0.5"/>

    <!-- White Fat cap being sliced off -->
    <path d="M162,105 C180,103 195,112 200,126 C195,140 180,148 162,148 Z" fill="url(#whiteFat19)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Knapped Flint Stone Knife cutting between lean meat and white fat -->
    <polygon points="154,84 172,92 166,154 156,158 150,120" fill="url(#flintBlade19)" stroke="#94a3b8" stroke-width="1.2"/>
    <polyline points="156,94 164,108 157,122 163,136 158,150" fill="none" stroke="#cbd5e1" stroke-width="0.8"/>

    <!-- Green Leaf holding trimmed white fat scraps (Right side) -->
    <ellipse cx="322" cy="132" rx="52" ry="30" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
    <path d="M298,124 Q315,112 332,124 Q345,134 320,144 Q300,142 298,124 Z" fill="url(#whiteFat19)" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="338" cy="136" r="8" fill="url(#whiteFat19)" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Arrow from fat trim to leaf -->
    <path d="M206,126 L262,126" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3,2"/>
    <polygon points="262,122 270,126 262,130" fill="#f59e0b"/>
  </g>

  <!-- Sub-banner 2 -->
  <rect x="20" y="180" width="360" height="22" rx="2" fill="#131922" stroke="#334155" stroke-width="0.8"/>
  <text x="200" y="195" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">붉은 살코기를 결 따라 두께 5mm·한 뼘 길이로 얇게 썰기</text>

  <!-- Zone 2: 5mm Uniform Lean Strips Along the Grain -->
  <g filter="url(#shadow19s1)">
    <rect x="28" y="210" width="344" height="92" rx="3" fill="#0d131a" stroke="#334155" stroke-width="1"/>
    <!-- 5 Lean Strips -->
    <g transform="translate(46, 224)">
      <rect x="0" y="0" width="190" height="10" rx="2" fill="url(#leanMeat19)" stroke="#f87171" stroke-width="0.8"/>
      <line x1="8" y1="5" x2="182" y2="5" stroke="#fecaca" stroke-width="0.5" opacity="0.6"/>

      <rect x="0" y="15" width="190" height="10" rx="2" fill="url(#leanMeat19)" stroke="#f87171" stroke-width="0.8"/>
      <line x1="8" y1="20" x2="182" y2="20" stroke="#fecaca" stroke-width="0.5" opacity="0.6"/>

      <rect x="0" y="30" width="190" height="10" rx="2" fill="url(#leanMeat19)" stroke="#f87171" stroke-width="0.8"/>
      <line x1="8" y1="35" x2="182" y2="35" stroke="#fecaca" stroke-width="0.5" opacity="0.6"/>

      <rect x="0" y="45" width="190" height="10" rx="2" fill="url(#leanMeat19)" stroke="#f87171" stroke-width="0.8"/>
      <line x1="8" y1="50" x2="182" y2="50" stroke="#fecaca" stroke-width="0.5" opacity="0.6"/>

      <!-- Dimension indicators (20cm length, 5mm thickness) -->
      <line x1="0" y1="66" x2="190" y2="66" stroke="#fde68a" stroke-width="1.2"/>
      <line x1="0" y1="62" x2="0" y2="70" stroke="#fde68a" stroke-width="1.2"/>
      <line x1="190" y1="62" x2="190" y2="70" stroke="#fde68a" stroke-width="1.2"/>
      <rect x="65" y="59" width="60" height="14" fill="#0d131a"/>
      <circle cx="95" cy="66" r="3" fill="#fde68a"/>
    </g>

    <!-- Thickness Callout Gauge on Right -->
    <g transform="translate(262, 220)">
      <rect x="0" y="0" width="94" height="70" rx="3" fill="#161f2c" stroke="#fde68a" stroke-width="1"/>
      <!-- Cross section of 5mm strip -->
      <rect x="22" y="26" width="50" height="14" rx="2" fill="url(#leanMeat19)" stroke="#f87171" stroke-width="1"/>
      <line x1="14" y1="26" x2="14" y2="40" stroke="#fde68a" stroke-width="1.5"/>
      <line x1="10" y1="26" x2="18" y2="26" stroke="#fde68a" stroke-width="1.2"/>
      <line x1="10" y1="40" x2="18" y2="40" stroke="#fde68a" stroke-width="1.2"/>
      <!-- Grain direction arrow -->
      <path d="M26,54 L68,54" stroke="#38bdf8" stroke-width="1.5"/>
      <polygon points="68,51 74,54 68,57" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Sub-banner 3 -->
  <rect x="20" y="312" width="360" height="22" rx="2" fill="#131922" stroke="#334155" stroke-width="0.8"/>
  <text x="200" y="327" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">연기 쐬기 전 바람에 30분간 널어 겉면 물기 꾸덕하게 말리기</text>

  <!-- Zone 3: 30-Min Shade Wind Pre-Drying -->
  <g transform="translate(35, 340)">
    <path d="M10,12 Q45,4 80,12 T150,12" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4,2"/>
    <polygon points="150,9 158,12 150,15" fill="#38bdf8"/>
    <path d="M180,12 Q215,4 250,12 T315,12" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4,2"/>
    <polygon points="315,9 323,12 315,15" fill="#38bdf8"/>
    <rect x="85" y="4" width="22" height="16" rx="2" fill="url(#leanMeat19)" stroke="#f87171" stroke-width="0.8"/>
    <rect x="120" y="4" width="22" height="16" rx="2" fill="url(#leanMeat19)" stroke="#f87171" stroke-width="0.8"/>
    <rect x="225" y="4" width="22" height="16" rx="2" fill="url(#leanMeat19)" stroke="#f87171" stroke-width="0.8"/>
    <rect x="260" y="4" width="22" height="16" rx="2" fill="url(#leanMeat19)" stroke="#f87171" stroke-width="0.8"/>
  </g>

  <!-- Footer Summary Bar -->
  <rect x="8" y="368" width="384" height="24" fill="#1e1b18" stroke="#f59e0b" stroke-width="1"/>
  <text x="200" y="384" fill="#fde68a" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">[1단계 핵심] 하얀 기름기 제거 및 5mm 균일 두께로 썰어 겉물기 건조</text>
</svg>
