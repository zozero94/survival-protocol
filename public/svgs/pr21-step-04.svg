<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <pattern id="grid21s4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#18202c" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="reflectorGrad21s4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="flameGlow21s4" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#dc2626" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow21s4" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <marker id="arrHeat21s4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f97316"/>
    </marker>
    <marker id="arrSky21s4" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="400" fill="#090c10"/>
  <rect x="10" y="10" width="380" height="380" fill="url(#grid21s4)" stroke="#263244" stroke-width="1"/>

  <!-- Top Header Banner -->
  <rect x="18" y="16" width="364" height="24" rx="2" fill="#111827" stroke="#334155" stroke-width="1"/>

  <!-- Label 3 Callout Box (Top: Curved Multi-Fold Foil Reflector Wall) -->
  <rect x="24" y="48" width="352" height="24" rx="3" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Label 2 Callout Box (Second: Smokeless Triple Flame) -->
  <rect x="24" y="80" width="352" height="24" rx="3" fill="#2a1205" stroke="#f97316" stroke-width="1"/>

  <!-- 3D Accordion-Folded Silver Foil Heat Reflector Wall Behind Can -->
  <g filter="url(#shadow21s4)">
    <polygon points="66,118 112,108 112,242 66,256" fill="url(#reflectorGrad21s4)" stroke="#f8fafc" stroke-width="1.2"/>
    <polygon points="112,108 164,104 164,236 112,242" fill="#cbd5e1" stroke="#f8fafc" stroke-width="1.2"/>
    <polygon points="164,104 222,106 222,236 164,236" fill="url(#reflectorGrad21s4)" stroke="#f8fafc" stroke-width="1.2"/>
    <polygon points="222,106 272,114 272,244 222,236" fill="#94a3b8" stroke="#f8fafc" stroke-width="1.2"/>

    <!-- Tuna Can Heater Body -->
    <ellipse cx="195" cy="264" rx="108" ry="18" fill="#334155" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 110 198 L 110 256 A 85 16 0 0 0 280 256 L 280 198 Z" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.4"/>
    <ellipse cx="195" cy="208" rx="83" ry="14" fill="#d97706" fill-opacity="0.85" stroke="#fbbf24" stroke-width="1"/>

    <!-- Foil Bridge & 3 Burning Smokeless Flames -->
    <path d="M 104 198 L 286 198 L 280 206 L 110 206 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>

    <!-- 3 Warm Candle Flames (x=155, x=195, x=235) -->
    <g>
      <circle cx="155" cy="176" r="18" fill="url(#flameGlow21s4)"/>
      <path d="M 155 152 C 147 166 146 180 155 188 C 164 180 163 166 155 152 Z" fill="#f97316" stroke="#fef08a" stroke-width="1"/>
      <path d="M 155 162 C 151 171 151 180 155 185 C 159 180 159 171 155 162 Z" fill="#fef08a"/>

      <circle cx="195" cy="174" r="20" fill="url(#flameGlow21s4)"/>
      <path d="M 195 148 C 186 164 185 179 195 188 C 205 179 204 164 195 148 Z" fill="#f97316" stroke="#fef08a" stroke-width="1"/>
      <path d="M 195 159 C 190 169 190 179 195 185 C 200 179 200 169 195 159 Z" fill="#fef08a"/>

      <circle cx="235" cy="176" r="18" fill="url(#flameGlow21s4)"/>
      <path d="M 235 152 C 227 166 226 180 235 188 C 244 180 243 166 235 152 Z" fill="#f97316" stroke="#fef08a" stroke-width="1"/>
      <path d="M 235 162 C 231 171 231 180 235 185 C 239 180 239 171 235 162 Z" fill="#fef08a"/>
    </g>

    <!-- 2 Stripped Metal Wire Pot Stand Bars Across Top Rim -->
    <line x1="94" y1="190" x2="296" y2="190" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="100" y1="196" x2="290" y2="196" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Forward Reflected Radiant Heat Rays (90% Forward Focus) -->
    <path d="M 248 158 L 348 142" stroke="#f97316" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrHeat21s4)"/>
    <path d="M 252 178 L 356 178" stroke="#f97316" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrHeat21s4)"/>
    <path d="M 248 198 L 348 214" stroke="#f97316" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrHeat21s4)"/>
  </g>

  <!-- Label 4 Callout Box (Lower: 2 Stripped Wire Pot Stand Bars) -->
  <rect x="24" y="298" width="352" height="24" rx="3" fill="#0c1928" stroke="#38bdf8" stroke-width="1.1"/>
  <path d="M 260 298 L 260 198" stroke="#38bdf8" stroke-width="1.3" marker-end="url(#arrSky21s4)"/>

  <!-- Bottom Key Principle Banner -->
  <rect x="18" y="352" width="364" height="30" rx="3" fill="#111827" stroke="#f97316" stroke-width="1.2"/>

  <!-- 5 SVG TEXT LABELS (1:1 Match with svgLabels) -->
  <text x="200" y="32" fill="#f8fafc" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">FIG. 04 // IGNITION, FOIL HEAT REFLECTOR &amp; WIRE POT STAND</text>
  <text x="200" y="96" fill="#fed7aa" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">그을음 없는 3중 무연 불꽃 (높이 2~3cm 안정 유지)</text>
  <text x="200" y="64" fill="#f1f5f9" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">후방 복사열 90%를 전방으로 모으는 은박 호일 반사벽</text>
  <text x="200" y="314" fill="#bae6fd" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">산소 유입 틈을 확보하는 상단 철사 냄비 받침대 2줄</text>
  <text x="200" y="371" fill="#fb923c" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">[핵심] 72시간 실내 보온·온수 가열 &amp; 3시간 주기 환기</text>
</svg>
