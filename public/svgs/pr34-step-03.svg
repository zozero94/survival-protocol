<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg34s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="42%" stop-color="#1e293b"/>
      <stop offset="43%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="water34s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#bae6fd" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.92"/>
    </linearGradient>
    <pattern id="grid34s3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow34s3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg34s3)"/>
  <rect width="400" height="400" fill="url(#grid34s3)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Label 1 -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 03 // 창문 가리개 판자 원형 타공 + 위 1/3·아래 2/3 장착</text>

  <!-- Label 2 -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9.5">판자 중앙에 병 지름보다 살짝 작은 꽉 물림 구멍 가공</text>

  <!-- Cross-Section Diagram: Window/Roof Barrier Board Dividing Bright Exterior (Top) & Dark Shelter Interior (Bottom) -->
  <g filter="url(#shadow34s3)">
    <!-- Incoming Solar Rays Top -->
    <line x1="120" y1="84" x2="184" y2="122" stroke="#fde047" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="200" y1="80" x2="200" y2="112" stroke="#fde047" stroke-width="2.5" stroke-dasharray="4 3"/>
    <line x1="280" y1="84" x2="216" y2="122" stroke="#fde047" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- Thick Plywood / Cardboard Window Barrier Panel (Left & Right halves separated by circular collar cutout) -->
    <rect x="28" y="160" width="136" height="14" rx="2" fill="#785028" stroke="#b4834e" stroke-width="1.8"/>
    <rect x="236" y="160" width="136" height="14" rx="2" fill="#785028" stroke="#b4834e" stroke-width="1.8"/>

    <!-- Protective Notched Flashing Collar Flange Gripping Bottle Seam -->
    <rect x="148" y="152" width="16" height="10" rx="2" fill="#64748b" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="236" y="152" width="16" height="10" rx="2" fill="#64748b" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Clear 1.5L Water Bottle Mounted Vertically 1/3 Out : 2/3 In -->
    <rect x="188" y="106" width="24" height="12" rx="2" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5"/>
    <path d="M 190 118 L 190 128 Q 166 140 164 162 L 164 268 Q 164 280 176 280 L 224 280 Q 236 280 236 268 L 236 162 Q 234 140 210 128 L 210 118 Z" fill="url(#water34s3)" stroke="#ffffff" stroke-width="2"/>

    <!-- Dimension Ratio Braces: 1/3 Outer vs 2/3 Inner -->
    <line x1="120" y1="118" x2="120" y2="160" stroke="#fde047" stroke-width="2"/>
    <line x1="114" y1="118" x2="126" y2="118" stroke="#fde047" stroke-width="1.5"/>
    <line x1="114" y1="160" x2="126" y2="160" stroke="#fde047" stroke-width="1.5"/>

    <line x1="120" y1="174" x2="120" y2="280" stroke="#38bdf8" stroke-width="2"/>
    <line x1="114" y1="174" x2="126" y2="174" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="114" y1="280" x2="126" y2="280" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- 360-degree Interior Light Diffusion Arrows -->
    <line x1="158" y1="204" x2="96" y2="240" stroke="#fef08a" stroke-width="2"/>
    <polygon points="91,243 97,234 102,243" fill="#fef08a"/>
    <line x1="200" y1="282" x2="200" y2="294" stroke="#fef08a" stroke-width="2"/>
    <line x1="242" y1="204" x2="304" y2="240" stroke="#fef08a" stroke-width="2"/>
    <polygon points="309,243 298,243 303,234" fill="#fef08a"/>
  </g>

  <!-- Label 3 -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="315" fill="#cbd5e1" font-family="monospace" font-size="9">병 위쪽 1/3은 바깥 햇빛 향해 집광 렌즈 역할 수행</text>

  <!-- Label 4 -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="24" y="344" fill="#fde68a" font-family="monospace" font-size="9">병 아래쪽 2/3는 실내 깊숙이 내려와 전방위 발광</text>

  <!-- Label 5 -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="376" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">[핵심] 1:2 수직 배치 비율이 실내 360도 확산 밝기를 극대화</text>
</svg>