<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg19s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090b0e"/>
      <stop offset="100%" stop-color="#11151c"/>
    </linearGradient>
    <radialGradient id="emberGlow19" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ea580c" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="greenLeaf19" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="60%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="smokePlume19" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#94a3b8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow19s3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg19s3)"/>
  <g stroke="#1e293b" stroke-width="0.6" opacity="0.45">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>
  <rect x="4" y="4" width="392" height="392" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Header Banner -->
  <rect x="8" y="10" width="384" height="24" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="16" y="26" fill="#fde68a" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 03 // FLAMELESS OAK EMBER &amp; GREEN LEAF SMOKE PIT</text>

  <!-- Sub-banner 1 -->
  <rect x="20" y="52" width="360" height="22" rx="2" fill="#131922" stroke="#334155" stroke-width="0.8"/>
  <text x="200" y="67" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">삼발이 중앙 바닥 구덩이에 빨갛게 달군 참나무 숯불 깔기</text>

  <!-- Rising White Smoke & Hand Warmth Check -->
  <g filter="url(#shadow19s3)">
    <!-- Billowing White Smoke Plumes -->
    <path d="M140,220 C120,180 155,150 135,95 C165,85 235,85 265,95 C245,150 280,180 260,220 Z" fill="url(#smokePlume19)"/>
    <path d="M168,215 Q150,165 172,115" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>
    <path d="M200,215 Q215,165 196,110" fill="none" stroke="#e2e8f0" stroke-width="2.2" stroke-dasharray="5,3" opacity="0.8"/>
    <path d="M232,215 Q250,165 228,115" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5,3" opacity="0.7"/>

    <!-- Chest-high Rack & Hanging Meat Preview at Top -->
    <line x1="115" y1="96" x2="285" y2="96" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <rect x="142" y="98" width="9" height="36" rx="2" fill="#991b1b" stroke="#f87171" stroke-width="0.8"/>
    <rect x="166" y="98" width="9" height="38" rx="2" fill="#991b1b" stroke="#f87171" stroke-width="0.8"/>
    <rect x="190" y="98" width="9" height="36" rx="2" fill="#991b1b" stroke="#f87171" stroke-width="0.8"/>
    <rect x="214" y="98" width="9" height="38" rx="2" fill="#991b1b" stroke="#f87171" stroke-width="0.8"/>
    <rect x="238" y="98" width="9" height="36" rx="2" fill="#991b1b" stroke="#f87171" stroke-width="0.8"/>

    <!-- Hand Warmth Check Indicator on Right -->
    <g transform="translate(278, 106)">
      <rect x="0" y="0" width="92" height="46" rx="4" fill="#161f2c" stroke="#fde68a" stroke-width="1"/>
      <!-- Stylized Hand Silhouette -->
      <path d="M18,28 C18,18 28,14 38,16 L54,16 C58,16 58,22 52,22 L42,22 L56,25 C60,26 59,31 54,30 L40,29 L48,34 C50,36 47,39 43,37 L26,32 Z" fill="#fcd34d" stroke="#b45309" stroke-width="0.8"/>
      <circle cx="74" cy="23" r="8" fill="#22c55e" opacity="0.25"/>
      <circle cx="74" cy="23" r="4" fill="#22c55e"/>
    </g>

    <!-- Sub-banner 2 -->
    <rect x="20" y="182" width="360" height="22" rx="2" fill="#131922" stroke="#22c55e" stroke-width="0.9"/>
    <text x="200" y="197" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">숯불 위에 푸른 참나무 생가지와 잎을 덮어 불꽃 죽이기</text>

    <!-- Shallow Dirt Pit & Oak Charcoal Embers Covered by Green Oak Leaves -->
    <!-- Ground Cross Section -->
    <path d="M36,248 L108,248 Q128,302 200,302 Q272,302 292,248 L364,248 L364,308 L36,308 Z" fill="#292018" stroke="#785233" stroke-width="1.2"/>
    <!-- Glowing Red Oak Charcoal Embers in Pit Bottom -->
    <ellipse cx="200" cy="276" rx="76" ry="22" fill="url(#emberGlow19)"/>
    <polygon points="145,276 162,266 175,278 160,288" fill="#dc2626" stroke="#fde047" stroke-width="0.8"/>
    <polygon points="180,272 202,264 214,278 192,290" fill="#ef4444" stroke="#fde047" stroke-width="0.8"/>
    <polygon points="218,274 238,266 252,278 232,288" fill="#dc2626" stroke="#fde047" stroke-width="0.8"/>
    <polygon points="164,284 185,278 195,290 172,294" fill="#b91c1c" stroke="#fb923c" stroke-width="0.8"/>
    <polygon points="205,284 225,278 235,290 212,294" fill="#b91c1c" stroke="#fb923c" stroke-width="0.8"/>

    <!-- Thick Mound of Fresh Green Oak Leaves Smothering the Embers -->
    <g>
      <ellipse cx="152" cy="246" rx="28" ry="12" transform="rotate(-12 152 246)" fill="url(#greenLeaf19)" stroke="#4ade80" stroke-width="0.9"/>
      <ellipse cx="184" cy="240" rx="30" ry="13" transform="rotate(6 184 240)" fill="url(#greenLeaf19)" stroke="#4ade80" stroke-width="0.9"/>
      <ellipse cx="218" cy="240" rx="30" ry="13" transform="rotate(-8 218 240)" fill="url(#greenLeaf19)" stroke="#4ade80" stroke-width="0.9"/>
      <ellipse cx="248" cy="246" rx="28" ry="12" transform="rotate(14 248 246)" fill="url(#greenLeaf19)" stroke="#4ade80" stroke-width="0.9"/>
      <ellipse cx="170" cy="254" rx="26" ry="11" fill="url(#greenLeaf19)" stroke="#86efac" stroke-width="0.8"/>
      <ellipse cx="202" cy="252" rx="28" ry="12" fill="url(#greenLeaf19)" stroke="#86efac" stroke-width="0.8"/>
      <ellipse cx="232" cy="254" rx="26" ry="11" fill="url(#greenLeaf19)" stroke="#86efac" stroke-width="0.8"/>
      <!-- Green twig stems -->
      <line x1="120" y1="252" x2="280" y2="246" stroke="#166534" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Sub-banner 3 -->
  <rect x="20" y="312" width="360" height="22" rx="2" fill="#131922" stroke="#334155" stroke-width="0.8"/>
  <text x="200" y="327" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">고기 높이에 손을 넣어 따뜻한 아랫목 온도와 하얀 연기 유지</text>

  <!-- Bottom Safety Comparison Strip (Oak OK vs Pine/Oleander NO) -->
  <g transform="translate(35, 340)">
    <rect x="0" y="0" width="155" height="22" rx="3" fill="#0f291e" stroke="#22c55e" stroke-width="0.9"/>
    <circle cx="16" cy="11" r="5" fill="#22c55e"/>
    <line x1="32" y1="11" x2="140" y2="11" stroke="#86efac" stroke-width="2"/>

    <rect x="175" y="0" width="155" height="22" rx="3" fill="#2c1215" stroke="#ef4444" stroke-width="0.9"/>
    <line x1="187" y1="6" x2="197" y2="16" stroke="#ef4444" stroke-width="2"/>
    <line x1="197" y1="6" x2="187" y2="16" stroke="#ef4444" stroke-width="2"/>
    <line x1="208" y1="11" x2="315" y2="11" stroke="#fca5a5" stroke-width="2" stroke-dasharray="4,2"/>
  </g>

  <!-- Footer Summary Bar -->
  <rect x="8" y="368" width="384" height="24" fill="#1e1b18" stroke="#f59e0b" stroke-width="1"/>
  <text x="200" y="384" fill="#fde68a" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">[3단계 핵심] 불꽃 0% 유지 및 참나무 생잎의 하얀 방부 연기 생성</text>
</svg>
