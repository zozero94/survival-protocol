<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 340" class="w-full h-auto block" xmlns="http://www.w3.org/2000/svg" width="680" height="340">
          <defs>
            <marker id="arrow-swirl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 8 5 L 0 9 z" fill="#E02424" />
            </marker>
          </defs>

          <!-- Blueprint Header -->
          <text x="75" y="40" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">
            FIG. 03 // DOME CHAMBER CROSS-SECTION &amp; THERMAL CURVATURE
          </text>
          <line x1="75" y1="48" x2="605" y2="48" stroke="#222222" stroke-width="1" />

          <!-- Cutaway Dome Silhouette -->
          <g transform="translate(190, 70)">
            <!-- Outer Mud Layer -->
            <path d="M 30 190 C 30 70 80 20 150 20 C 220 20 270 70 270 190" fill="none" stroke="#8B5A2B" stroke-width="40" stroke-linecap="round" />

            <!-- Embedded Staggered Stones (Cross section) -->
            <!-- Left wall stones -->
            <ellipse cx="40" cy="170" rx="14" ry="10" fill="#222222" stroke="#E5E5E5" stroke-width="1.5" />
            <ellipse cx="44" cy="130" rx="13" ry="9" fill="#222222" stroke="#E5E5E5" stroke-width="1.5" />
            <ellipse cx="58" cy="90" rx="12" ry="9" fill="#222222" stroke="#E5E5E5" stroke-width="1.5" />
            <ellipse cx="85" cy="55" rx="12" ry="8" fill="#222222" stroke="#E5E5E5" stroke-width="1.5" />
            <!-- Top apex stones -->
            <ellipse cx="125" cy="32" rx="12" ry="8" fill="#222222" stroke="#E5E5E5" stroke-width="1.5" />
            <ellipse cx="175" cy="32" rx="12" ry="8" fill="#222222" stroke="#E5E5E5" stroke-width="1.5" />
            <!-- Right wall stones -->
            <ellipse cx="215" cy="55" rx="12" ry="8" fill="#222222" stroke="#E5E5E5" stroke-width="1.5" />
            <ellipse cx="242" cy="90" rx="12" ry="9" fill="#222222" stroke="#E5E5E5" stroke-width="1.5" />
            <ellipse cx="256" cy="130" rx="13" ry="9" fill="#222222" stroke="#E5E5E5" stroke-width="1.5" />
            <ellipse cx="260" cy="170" rx="14" ry="10" fill="#222222" stroke="#E5E5E5" stroke-width="1.5" />

            <!-- Smooth Interior Heat Reflector Surface -->
            <path d="M 50 190 C 50 90 90 40 150 40 C 210 40 250 90 250 190" fill="#141414" stroke="#F59E0B" stroke-width="2" />

            <!-- Rotating Heat Swirl Inside Chamber -->
            <path d="M 120 160 Q 150 100 180 140 Q 150 170 135 120" fill="none" stroke="#E02424" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-swirl)" />

            <!-- Dimension: Height 45cm (무릎 높이) -->
            <line x1="295" y1="20" x2="295" y2="190" stroke="#06B6D4" stroke-width="1" stroke-dasharray="2,2" />
            <line x1="290" y1="20" x2="300" y2="20" stroke="#06B6D4" stroke-width="1" />
            <line x1="290" y1="190" x2="300" y2="190" stroke="#06B6D4" stroke-width="1" />
            <text x="305" y="110" fill="#06B6D4" font-family="'JetBrains Mono', monospace" font-size="10">45cm</text>
          </g>

          <!-- Label 1: 돌과 진흙을 엇갈려 쌓은 벽체 단면 -->
          <line x1="210" y1="180" x2="130" y2="150" stroke="#E5E5E5" stroke-width="1" />
          <text x="75" y="125" fill="#E5E5E5" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">
            ① 엇갈려 쌓은 벽체 단면
          </text>
          <text x="75" y="143" fill="#888888" font-family="'Space Grotesk', sans-serif" font-size="10">
            돌 틈에 진흙을 채워 무너짐 방지
          </text>

          <!-- Label 2: 손바닥 두께(약 5cm) 단열벽 -->
          <line x1="430" y1="180" x2="480" y2="150" stroke="#D97706" stroke-width="1" />
          <text x="470" y="130" fill="#D97706" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">
            ② 손바닥 두께(약 5cm) 진흙벽
          </text>
          <text x="470" y="148" fill="#888888" font-family="'Space Grotesk', sans-serif" font-size="10">
            바깥으로 새는 열 손실 완벽 차단
          </text>

          <!-- Label 3: 안쪽 벽면 매끄러운 열 반사 곡면 -->
          <line x1="270" y1="130" x2="150" y2="225" stroke="#F59E0B" stroke-width="1" />
          <text x="75" y="235" fill="#F59E0B" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">
            ③ 매끄러운 열 반사 곡면
          </text>
          <text x="75" y="253" fill="#888888" font-family="'Space Grotesk', sans-serif" font-size="10">
            손에 물을 묻혀 반질반질하게 다듬기
          </text>

          <!-- Label 4: 열기가 모여 회전하는 연소실 내부 -->
          <text x="210" y="295" fill="#E02424" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">
            ④ 열기가 모여 회전하는 둥근 연소실 내부
          </text>

          <!-- Label 5: 무릎 높이(약 45cm) 전체 외형선 -->
          <text x="460" y="235" fill="#06B6D4" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">
            ⑤ 무릎 높이(약 45cm) 외형선
          </text>
          <text x="460" y="253" fill="#888888" font-family="'Space Grotesk', sans-serif" font-size="10">
            취사 안정성과 축열 용적 최적화
          </text>
        </svg>