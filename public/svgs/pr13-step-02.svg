<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg1302" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#0e1319"/>
    </linearGradient>
    <linearGradient id="lyeLiquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="potatoSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="clearOil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="potBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="drop1302" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="grid1302" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16202c" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg1302)"/>
  <rect width="400" height="400" fill="url(#grid1302)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#253342" stroke-width="1"/>

  <!-- Top Header (Label 1) -->
  <rect x="16" y="14" width="368" height="28" rx="2" fill="#0f1722" stroke="#2c3e50" stroke-width="1"/>
  <text x="26" y="32" fill="#fde68a" font-family="monospace" font-size="11" font-weight="bold">FIG. 02 // POTATO BUOYANCY SPECIFIC GRAVITY TEST</text>

  <!-- 3D Buoyancy Vessel (Left) & Oil Render Pot (Right) -->
  <g filter="url(#drop1302)">
    <!-- LEFT: Transparent Lye Testing Vessel -->
    <path d="M 45 130 L 45 270 A 55 14 0 0 0 155 270 L 155 130 Z" fill="#131c26" stroke="#475569" stroke-width="1.2" opacity="0.95"/>
    <ellipse cx="100" cy="130" rx="55" ry="14" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>

    <!-- Lye Liquid Fill -->
    <path d="M 46 160 L 46 268 A 54 13 0 0 0 154 268 L 154 160 Z" fill="url(#lyeLiquid)" opacity="0.85"/>
    <ellipse cx="100" cy="160" rx="54" ry="13" fill="#f59e0b" opacity="0.7"/>

    <!-- Floating Potato Piece (Thumb-sized, top 25% exposed above water line) -->
    <ellipse cx="100" cy="158" rx="22" ry="14" fill="url(#potatoSkin)" stroke="#fbbf24" stroke-width="1"/>
    <!-- Exposed crown above water -->
    <path d="M 80 158 Q 100 144 120 158 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8"/>
    <!-- Meniscus Water Ring Around Potato -->
    <ellipse cx="100" cy="160" rx="26" ry="6" fill="none" stroke="#fde68a" stroke-width="1.2" stroke-dasharray="3,2"/>
    <!-- Buoyancy Vector Indicator -->
    <line x1="100" y1="180" x2="100" y2="162" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="100,156 96,164 104,164" fill="#38bdf8"/>

    <!-- RIGHT: Rendered Animal Fat / Salvaged Oil Pot -->
    <path d="M 235 150 L 235 270 A 65 15 0 0 0 365 270 L 365 150 Z" fill="url(#potBody)" stroke="#94a3b8" stroke-width="1.2"/>
    <ellipse cx="300" cy="150" rx="65" ry="15" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Golden Clear Rendered Oil Layer -->
    <path d="M 236 175 L 236 268 A 64 14 0 0 0 364 268 L 364 175 Z" fill="url(#clearOil)"/>
    <ellipse cx="300" cy="175" rx="64" ry="14" fill="#fef08a" opacity="0.8"/>

    <!-- Floating Filtered Cracklings Skimmed on Rim -->
    <circle cx="280" cy="172" r="4" fill="#78350f"/>
    <circle cx="310" cy="176" r="3.5" fill="#92400e"/>
    <circle cx="325" cy="173" r="4.5" fill="#78350f"/>

    <!-- Gentle Embers Glowing Below Pot -->
    <ellipse cx="300" cy="285" rx="50" ry="8" fill="#450a0a" opacity="0.7"/>
    <circle cx="285" cy="284" r="3" fill="#ea580c"/>
    <circle cx="315" cy="285" r="3" fill="#f97316"/>
  </g>

  <!-- Callouts & Labels -->
  <!-- Label 2: Potato Buoyancy Crown -->
  <line x1="100" y1="150" x2="65" y2="88" stroke="#fde68a" stroke-width="1.2"/>
  <circle cx="100" cy="150" r="3" fill="#fde68a"/>
  <rect x="20" y="64" width="280" height="24" rx="3" fill="#0f1722" stroke="#fde68a" stroke-width="1"/>
  <text x="28" y="80" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">수면 위로 엄지손톱 크기만큼 부유하는 생감자</text>

  <!-- Label 3: Specific Gravity Adjustment -->
  <line x1="100" y1="210" x2="45" y2="210" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="100" cy="210" r="3" fill="#38bdf8"/>
  <rect x="18" y="222" width="280" height="24" rx="3" fill="#0f1722" stroke="#38bdf8" stroke-width="1"/>
  <text x="26" y="238" fill="#f8fafc" font-family="sans-serif" font-size="11">비중 부족 시 약불 농축 &amp; 과도 시 온수 희석</text>

  <!-- Label 4: Rendered Oil 2 Cups -->
  <line x1="300" y1="210" x2="330" y2="120" stroke="#facc15" stroke-width="1.2"/>
  <circle cx="300" cy="210" r="3" fill="#facc15"/>
  <rect x="95" y="105" width="285" height="24" rx="3" fill="#0f1722" stroke="#facc15" stroke-width="1"/>
  <text x="103" y="121" fill="#fde68a" font-family="sans-serif" font-size="11">동물 비계 열탕 용출 및 맑은 정제유 2컵 확보</text>

  <!-- Label 5: Core Rule -->
  <rect x="16" y="348" width="368" height="34" rx="4" fill="#141c26" stroke="#eab308" stroke-width="1.2"/>
  <text x="26" y="369" fill="#fde68a" font-family="sans-serif" font-size="11.5" font-weight="bold">[2단계 핵심] 감자 부력 검증 &amp; 유지 불순물 완전 분리</text>
</svg>