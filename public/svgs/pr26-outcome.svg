<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg26out" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a0e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardboard26out" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <pattern id="grid26out" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow26out" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background & Tactical Frame -->
  <rect width="800" height="450" fill="url(#bg26out)"/>
  <rect width="800" height="450" fill="url(#grid26out)"/>
  <rect x="10" y="10" width="780" height="430" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header Banner (Label 1) -->
  <rect x="20" y="20" width="760" height="38" rx="3" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="36" y="44" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold">PR-26 완성체 // 무토양 암실 콩나물 · 비타민 C 자급 시스템</text>

  <!-- 4-Stage Horizontal Engineering Pipeline -->
  <g filter="url(#shadow26out)">
    <!-- STAGE 01 Card -->
    <rect x="20" y="74" width="178" height="296" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="28" y="84" width="162" height="28" rx="2" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="32" y="103" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold">STAGE 01: 종자 선별·침지</text>

    <!-- Soaking Bowl + Charcoal + Plump Beans Visual -->
    <path d="M52,148 L166,148 L152,226 L66,226 Z" fill="#1e293b" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="64" y="166" width="90" height="52" fill="#0284c7" fill-opacity="0.45"/>
    <polygon points="100,196 118,194 120,214 98,214" fill="#090d16" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="82" cy="204" rx="9" ry="6" fill="#facc15"/>
    <ellipse cx="136" cy="204" rx="9" ry="6" fill="#facc15"/>
    <circle cx="109" cy="262" r="18" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <path d="M101,262 L107,268 L119,256" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/>

    <rect x="28" y="316" width="162" height="42" rx="2" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="32" y="341" fill="#e2e8f0" font-family="monospace" font-size="9.5">깨진 콩 제거 + 8시간 불리기</text>

    <!-- STAGE 02 Card -->
    <rect x="214" y="74" width="178" height="296" rx="4" fill="#0b1120" stroke="#fde047" stroke-width="1.2"/>
    <rect x="222" y="84" width="162" height="28" rx="2" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
    <text x="226" y="103" fill="#fde047" font-family="monospace" font-size="10.5" font-weight="bold">STAGE 02: 45도 거즈 배수</text>

    <!-- 45-Degree Inverted Gauze Jar Visual -->
    <g transform="translate(303,184) rotate(-35)">
      <rect x="-42" y="-26" width="84" height="52" rx="5" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect x="-50" y="-20" width="10" height="40" rx="2" fill="#f8fafc" stroke="#eab308" stroke-width="1.2"/>
      <circle cx="-24" cy="10" r="6" fill="#facc15"/>
      <circle cx="-10" cy="12" r="6" fill="#eab308"/>
    </g>
    <path d="M254,234 L352,234 L342,248 L264,248 Z" fill="#334155" stroke="#94a3b8" stroke-width="1.2"/>

    <rect x="222" y="316" width="162" height="42" rx="2" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="226" y="341" fill="#fef08a" font-family="monospace" font-size="9.5">면 천 결속 + 고인 물 0% 배출</text>

    <!-- STAGE 03 Card -->
    <rect x="408" y="74" width="178" height="296" rx="4" fill="#0b1120" stroke="#10b981" stroke-width="1.2"/>
    <rect x="416" y="84" width="162" height="28" rx="2" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="420" y="103" fill="#34d399" font-family="monospace" font-size="10.5" font-weight="bold">STAGE 03: 이중 암실 차광</text>

    <!-- Cardboard & Blackout Cloth Hood + 1.5cm Vent Visual -->
    <rect x="442" y="138" width="110" height="92" rx="3" fill="url(#cardboard26out)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="454" y="150" width="86" height="80" fill="#05070a" stroke="#475569" stroke-width="1"/>
    <path d="M482,216 Q484,186 490,178 M506,216 Q508,186 514,178" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="536" y="228" width="18" height="8" rx="1" fill="#fde047"/>

    <rect x="416" y="316" width="162" height="42" rx="2" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="420" y="341" fill="#a7f3d0" font-family="monospace" font-size="9.5">골판지·검은 천 + 하단 통기구</text>

    <!-- STAGE 04 Card -->
    <rect x="602" y="74" width="178" height="296" rx="4" fill="#0b1120" stroke="#f97316" stroke-width="1.2"/>
    <rect x="610" y="84" width="162" height="28" rx="2" fill="#0f172a" stroke="#f97316" stroke-width="1"/>
    <text x="612" y="103" fill="#fdba74" font-family="monospace" font-size="10.5" font-weight="bold">STAGE 04: 열 세척·수확</text>

    <!-- Harvested Golden Sprouts & 2-Min Blanch Pot -->
    <path d="M636,162 L746,162 L736,226 L646,226 Z" fill="#334155" stroke="#f8fafc" stroke-width="1.5"/>
    <path d="M664,210 Q670,178 680,174 M696,210 Q702,178 712,174" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="682" cy="172" rx="5.5" ry="3.5" fill="#facc15"/>
    <ellipse cx="714" cy="172" rx="5.5" ry="3.5" fill="#facc15"/>

    <rect x="610" y="316" width="162" height="42" rx="2" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="612" y="341" fill="#fed7aa" font-family="monospace" font-size="9.5">1일 2회 헹굼 + 5일 차 데침</text>
  </g>

  <!-- Bottom Verification Banner (Label 10) -->
  <rect x="20" y="388" width="760" height="40" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="36" y="413" fill="#ecfdf5" font-family="monospace" font-size="13" font-weight="bold">야전 검증 완료 // 마른 콩 대비 비타민 C 최대 20배 생합성</text>
</svg>
