<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg24s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="salineStream24s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="skinTone24s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6b498"/>
      <stop offset="100%" stop-color="#a67c5b"/>
    </linearGradient>
    <pattern id="grid24s4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow24s4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg24s4)"/>
  <rect width="400" height="400" fill="url(#grid24s4)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Header Banner (Label 1) -->
  <rect x="14" y="14" width="372" height="28" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="32" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">FIG. 04 // 무설탕 0.9% 등장성 식염수 조제 및 수압 관류 상처 세척</text>

  <!-- Label 2 Callout Box -->
  <rect x="16" y="50" width="368" height="24" rx="2" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="24" y="66" fill="#fecaca" font-family="monospace" font-size="10.5">설탕 절대 배제: 끓여 식힌 물 500mL + 순수 소금 반 작은술(4.5g)</text>

  <!-- Main Illustration: Left (Sugar Prohibited ✗ vs 0.9% Salt ✓) & Right (15-20cm Non-Contact Wound Irrigation) -->
  <g filter="url(#shadow24s4)">
    <!-- Left Panel: Formula Verification Card -->
    <rect x="22" y="86" width="136" height="154" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>

    <!-- Top Sub-box: Sugar Strictly Prohibited (✗) -->
    <rect x="32" y="96" width="116" height="60" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
    <circle cx="52" cy="126" r="12" fill="#7f1d1d" stroke="#f87171" stroke-width="1.2"/>
    <path d="M46,120 L58,132 M58,120 L46,132" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Crossed-out Sugar Cubes -->
    <rect x="78" y="112" width="18" height="18" rx="2" fill="#fef08a" stroke="#eab308" stroke-width="1"/>
    <rect x="102" y="118" width="18" height="18" rx="2" fill="#fef08a" stroke="#eab308" stroke-width="1"/>
    <path d="M72,138 L126,108" stroke="#ef4444" stroke-width="2.5"/>

    <!-- Bottom Sub-box: 500mL Boiled Water + 4.5g Pure Salt (✓) -->
    <rect x="32" y="166" width="116" height="64" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="52" cy="198" r="12" fill="#047857" stroke="#34d399" stroke-width="1.2"/>
    <path d="M46,198 L50,203 L58,193" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <!-- 500mL Vessel + Half-Spoon Salt -->
    <rect x="76" y="178" width="22" height="40" rx="2" fill="#0284c7" stroke="#bae6fd" stroke-width="1.2"/>
    <ellipse cx="118" cy="198" rx="14" ry="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="118" cy="196" r="4" fill="#ffffff"/>

    <!-- Right Panel: 15-20cm High-Pressure Stream Washing Forearm Wound -->
    <rect x="172" y="86" width="206" height="154" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Tilted 500mL Saline Bottle at Top Right -->
    <g transform="translate(270, 92) rotate(125)">
      <rect x="-16" y="-42" width="32" height="58" rx="4" fill="#0284c7" stroke="#bae6fd" stroke-width="1.4"/>
      <rect x="-7" y="16" width="14" height="10" rx="1" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    </g>

    <!-- 15-20cm Height Scale Line -->
    <path d="M204,116 L204,182" stroke="#fde047" stroke-width="1.4" stroke-dasharray="3,2"/>
    <path d="M198,116 L210,116 M198,182 L210,182" stroke="#fde047" stroke-width="1.4"/>

    <!-- Pressurized Saline Jet Flushing Dirt from Wound -->
    <path d="M250,116 L242,184 L256,184 Z" fill="url(#salineStream24s4)"/>

    <!-- Forearm with Abrasion Wound Over Catch Basin -->
    <path d="M188,180 Q248,176 356,186 L356,210 Q248,202 188,204 Z" fill="url(#skinTone24s4)" stroke="#f8fafc" stroke-width="1.2"/>
    <!-- Wound Cavity Being Flushed Clean -->
    <ellipse cx="248" cy="184" rx="16" ry="4.5" fill="#dc2626" stroke="#fecaca" stroke-width="1"/>
    <!-- Flushed Dirt Particles Falling into Basin Below -->
    <circle cx="234" cy="216" r="2.2" fill="#78350f"/>
    <circle cx="248" cy="220" r="2.5" fill="#991b1b"/>
    <circle cx="262" cy="215" r="2" fill="#78350f"/>
    <path d="M214,224 L284,224 L276,236 L222,236 Z" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Label 3 Callout Box -->
  <rect x="16" y="254" width="368" height="26" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="271" fill="#bae6fd" font-family="monospace" font-size="10.5">인체 체액(0.9%)과 동일한 농도로 세포 손상·통증 없이 세척</text>

  <!-- Label 4 Callout Box -->
  <rect x="16" y="288" width="368" height="26" rx="2" fill="#0f172a" stroke="#fde047" stroke-width="1"/>
  <text x="24" y="305" fill="#fef08a" font-family="monospace" font-size="10.5">상처 15~20cm 위에서 식염수를 부어 수압으로 모래·핏덩이 제거</text>

  <!-- Bottom Core Principle Strip (Label 5) -->
  <rect x="14" y="348" width="372" height="34" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="24" y="369" fill="#ecfdf5" font-family="monospace" font-size="10.5" font-weight="bold">[핵심] 당분에 의한 세균 번식·괴사 방지 및 파상풍 2차 감염 차단</text>
</svg>
