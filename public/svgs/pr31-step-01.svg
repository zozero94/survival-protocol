<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg31s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <pattern id="grid31s1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#27272a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow31s1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg31s1)"/>
  <rect width="400" height="400" fill="url(#grid31s1)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Header Banner (Label 1) -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 01 // 창문 전면 손가락 3마디 간격 격자 테이핑 및 창틀 테두리 결속</text>

  <!-- Label 2 Callout Box -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9.5">마른 천으로 유리 표면 먼지 제거 후 창틀 실리콘 라인부터 밀착 테이핑</text>

  <!-- Main Illustration: Window with Grid Tape -->
  <g filter="url(#shadow31s1)">
    <!-- Outer wall & Window Frame -->
    <rect x="50" y="86" width="300" height="205" fill="#1e293b" stroke="#64748b" stroke-width="6"/>
    <rect x="60" y="96" width="135" height="185" fill="#090d16" stroke="#334155" stroke-width="2"/>
    <rect x="205" y="96" width="135" height="185" fill="#090d16" stroke="#334155" stroke-width="2"/>

    <!-- Perimeter frame seal tape (Gold) -->
    <rect x="56" y="92" width="288" height="193" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5 2.5"/>

    <!-- Horizontal Grid Tape (Cyan) -->
    <line x1="60" y1="125" x2="340" y2="125" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="60" y1="155" x2="340" y2="155" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="60" y1="185" x2="340" y2="185" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="60" y1="215" x2="340" y2="215" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="60" y1="245" x2="340" y2="245" stroke="#38bdf8" stroke-width="3.5"/>

    <!-- Vertical Grid Tape (Left Pane) -->
    <line x1="95" y1="96" x2="95" y2="281" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="130" y1="96" x2="130" y2="281" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="165" y1="96" x2="165" y2="281" stroke="#38bdf8" stroke-width="3.5"/>

    <!-- Vertical Grid Tape (Right Pane) -->
    <line x1="240" y1="96" x2="240" y2="281" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="275" y1="96" x2="275" y2="281" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="310" y1="96" x2="310" y2="281" stroke="#38bdf8" stroke-width="3.5"/>

    <!-- Caliper / Hand measure icon (5cm indicator) -->
    <line x1="95" y1="138" x2="130" y2="138" stroke="#f59e0b" stroke-width="1.8"/>
    <circle cx="95" cy="138" r="2.5" fill="#f59e0b"/>
    <circle cx="130" cy="138" r="2.5" fill="#f59e0b"/>
  </g>

  <!-- Label 3: Grid Interval Dimension -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="315" fill="#94a3b8" font-family="monospace" font-size="9">가로·세로 5cm(손가락 세 마디) 간격의 팽팽한 바둑판 격자망 교차</text>

  <!-- Label 4: Warning Box -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#2d0607" stroke="#ef4444" stroke-width="1"/>
  <text x="24" y="344" fill="#fca5a5" font-family="monospace" font-size="9">단순 X자 부착 금지: 유리 중심부가 큰 칼날 덩어리로 떨어져 부상 유발</text>

  <!-- Label 5: Core Principle Footer -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="376" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold">[핵심] 충격파 진동을 격자망 전체로 분산하여 유리창 일체형 결속</text>
</svg>
