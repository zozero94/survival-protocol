<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg1204" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090b0e"/>
      <stop offset="100%" stop-color="#0e1318"/>
    </linearGradient>
    <linearGradient id="jetFlame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow1204" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.78"/>
    </filter>
    <pattern id="grid1204" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#18222d" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#bg1204)"/>
  <rect width="400" height="400" fill="url(#grid1204)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#263545" stroke-width="1"/>

  <!-- Top HUD Header -->
  <rect x="16" y="14" width="368" height="28" fill="#101720" stroke="#2c3e50" stroke-width="1"/>
  <text x="26" y="32" fill="#fde68a" font-family="monospace" font-size="11" font-weight="bold">FIG. 04 // TOP-DOWN IGNITION &amp; WOOD GAS JET</text>

  <!-- Active Wood Gas Stove with Vertical Twigs, Secondary Flame Jets, and Boiling Water Pot -->
  <g filter="url(#shadow1204)">
    <!-- Outer & Inner Can Cutaway -->
    <rect x="110" y="178" width="180" height="118" rx="4" fill="#334155" stroke="#cbd5e1" stroke-width="1.8"/>
    <rect x="136" y="178" width="128" height="92" rx="3" fill="#0f172a" stroke="#fde68a" stroke-width="1.6"/>

    <!-- Vertically Stacked Dry Hardwood Twigs Inside Inner Chamber -->
    <g fill="#a16207" stroke="#fde68a" stroke-width="0.8">
      <rect x="145" y="202" width="10" height="62" rx="2"/>
      <rect x="159" y="200" width="10" height="64" rx="2"/>
      <rect x="173" y="203" width="10" height="61" rx="2"/>
      <rect x="187" y="200" width="10" height="64" rx="2"/>
      <rect x="201" y="202" width="10" height="62" rx="2"/>
      <rect x="215" y="201" width="10" height="63" rx="2"/>
      <rect x="229" y="203" width="10" height="61" rx="2"/>
      <rect x="243" y="202" width="10" height="62" rx="2"/>
    </g>

    <!-- Secondary Preheated Air Jet Flames Shooting Inward from Upper Nozzles -->
    <path d="M 136 190 C 165 182, 185 165, 200 148 C 215 165, 235 182, 264 190 Z" fill="url(#jetFlame)" opacity="0.92"/>

    <!-- Preheated Air Draft Arrows in Annular Wall (Left & Right) -->
    <path d="M 123 285 L 123 190 L 136 190" fill="none" stroke="#f97316" stroke-width="2.2"/>
    <path d="M 277 285 L 277 190 L 264 190" fill="none" stroke="#f97316" stroke-width="2.2"/>

    <!-- Boiling Water Container Resting on Wire Trivet Above Stove (y=115 to 162) -->
    <rect x="142" y="118" width="116" height="44" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="175" cy="145" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="200" cy="138" r="5" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="225" cy="144" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Callouts & Labels -->
  <!-- Label 2: Vertical dry twigs stacked below upper nozzles -->
  <line x1="145" y1="225" x2="75" y2="76" stroke="#fde68a" stroke-width="1.2"/>
  <circle cx="145" cy="225" r="3" fill="#fde68a"/>
  <rect x="18" y="52" width="290" height="24" rx="3" fill="#0f172a" stroke="#fde68a" stroke-width="1"/>
  <text x="26" y="68" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">상단 노즐 아래까지 마른 잔가지 수직 적재</text>

  <!-- Label 3: Top-down tinder ignition -->
  <line x1="200" y1="185" x2="255" y2="110" stroke="#f97316" stroke-width="1.2"/>
  <circle cx="200" cy="185" r="3" fill="#f97316"/>
  <rect x="105" y="86" width="275" height="24" rx="3" fill="#0f172a" stroke="#f97316" stroke-width="1"/>
  <text x="113" y="102" fill="#f8fafc" font-family="sans-serif" font-size="11">맨 위 부싯깃 점화 (Top-Down 하향 연소)</text>

  <!-- Label 4: Preheated air injection & smokeless wood gas flame -->
  <line x1="277" y1="235" x2="277" y2="310" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="277" cy="235" r="3" fill="#38bdf8"/>
  <rect x="24" y="310" width="335" height="24" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="32" y="326" fill="#38bdf8" font-family="sans-serif" font-size="11">이중 벽체 예열 공기 분사 &amp; 무연 2차 가스 화염</text>

  <!-- Label 5: Core Result -->
  <rect x="18" y="344" width="364" height="34" rx="4" fill="#141e28" stroke="#f97316" stroke-width="1.2"/>
  <text x="28" y="365" fill="#fde68a" font-family="sans-serif" font-size="11.5" font-weight="bold">[핵심] 연기 제로 고열로 8분 만에 식수 비등 살균</text>
</svg>
