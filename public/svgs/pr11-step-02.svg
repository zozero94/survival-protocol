<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg02" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#0d131a"/>
    </linearGradient>
    <linearGradient id="ribWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9cb36c"/>
      <stop offset="50%" stop-color="#6b7f43"/>
      <stop offset="100%" stop-color="#3f4d25"/>
    </linearGradient>
    <linearGradient id="lashAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow02" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <pattern id="grid02" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#18222d" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#bg02)"/>
  <rect width="400" height="400" fill="url(#grid02)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#263545" stroke-width="1"/>

  <!-- Top HUD Header -->
  <rect x="16" y="14" width="368" height="28" fill="#101720" stroke="#2c3e50" stroke-width="1"/>
  <text x="26" y="32" fill="#fde68a" font-family="monospace" font-size="11" font-weight="bold">FIG. 02 // CONICAL WICKER BODY WEAVING</text>

  <!-- 3D Conical Basket Frame (Hoops + Longitudinal Willow Ribs) -->
  <g filter="url(#shadow02)">
    <!-- Back half of hoops -->
    <ellipse cx="75" cy="215" rx="26" ry="74" fill="none" stroke="#425029" stroke-width="6"/>
    <ellipse cx="145" cy="215" rx="22" ry="60" fill="none" stroke="#425029" stroke-width="5.5"/>
    <ellipse cx="215" cy="215" rx="17" ry="46" fill="none" stroke="#425029" stroke-width="5"/>
    <ellipse cx="280" cy="215" rx="13" ry="32" fill="none" stroke="#425029" stroke-width="4.5"/>

    <!-- Longitudinal Willow Ribs (1cm spacing grid converging to tail knot at x=340, y=215) -->
    <g stroke="url(#ribWood)" stroke-width="2.6" stroke-linecap="round">
      <line x1="75" y1="141" x2="342" y2="207"/>
      <line x1="70" y1="152" x2="342" y2="209"/>
      <line x1="65" y1="164" x2="342" y2="210"/>
      <line x1="60" y1="176" x2="342" y2="212"/>
      <line x1="56" y1="189" x2="342" y2="213"/>
      <line x1="53" y1="202" x2="342" y2="214"/>
      <line x1="52" y1="215" x2="342" y2="215"/>
      <line x1="53" y1="228" x2="342" y2="216"/>
      <line x1="56" y1="241" x2="342" y2="217"/>
      <line x1="60" y1="254" x2="342" y2="218"/>
      <line x1="65" y1="266" x2="342" y2="220"/>
      <line x1="70" y1="278" x2="342" y2="221"/>
      <line x1="75" y1="289" x2="342" y2="223"/>
    </g>

    <!-- Front half of hoops & Cross-Lashing Nodes -->
    <path d="M 75 141 A 26 74 0 0 0 75 289" fill="none" stroke="#849b5c" stroke-width="6.5"/>
    <path d="M 145 155 A 22 60 0 0 0 145 275" fill="none" stroke="#849b5c" stroke-width="6"/>
    <path d="M 215 169 A 17 46 0 0 0 215 261" fill="none" stroke="#849b5c" stroke-width="5.5"/>
    <path d="M 280 183 A 13 32 0 0 0 280 247" fill="none" stroke="#849b5c" stroke-width="5"/>

    <!-- Cordage Lashing Knots along hoops -->
    <g fill="url(#lashAmber)" stroke="#451a03" stroke-width="0.8">
      <circle cx="145" cy="156" r="3.2"/>
      <circle cx="132" cy="175" r="3.2"/>
      <circle cx="125" cy="195" r="3.2"/>
      <circle cx="123" cy="215" r="3.2"/>
      <circle cx="125" cy="235" r="3.2"/>
      <circle cx="132" cy="255" r="3.2"/>
      <circle cx="145" cy="274" r="3.2"/>

      <circle cx="215" cy="170" r="3"/>
      <circle cx="203" cy="190" r="3"/>
      <circle cx="198" cy="215" r="3"/>
      <circle cx="203" cy="240" r="3"/>
      <circle cx="215" cy="260" r="3"/>
    </g>

    <!-- Tail Retrieval Slip-Knot Binding -->
    <rect x="330" y="201" width="16" height="28" rx="4" fill="url(#lashAmber)" stroke="#451a03" stroke-width="1.2"/>
    <path d="M 346 210 C 368 195, 372 225, 346 220" fill="none" stroke="#fde68a" stroke-width="2.5"/>
  </g>

  <!-- Callouts & Labels -->
  <!-- Label 2: 30-40 longitudinal willow ribs -->
  <line x1="102" y1="162" x2="102" y2="76" stroke="#fde68a" stroke-width="1.2"/>
  <circle cx="102" cy="162" r="3" fill="#fde68a"/>
  <rect x="18" y="52" width="275" height="24" rx="3" fill="#0f172a" stroke="#fde68a" stroke-width="1"/>
  <text x="26" y="68" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">버드나무 세로 살 30~40개 (간격 1~1.5cm)</text>

  <!-- Label 3: Hoop-to-rib cross lashing -->
  <line x1="145" y1="156" x2="185" y2="108" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="130" y="86" width="252" height="24" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="138" y="102" fill="#f8fafc" font-family="sans-serif" font-size="11">4개 원형 림과 세로 살 교차 감쳐 묶기</text>

  <!-- Label 4: Streamlined cone body -->
  <line x1="215" y1="260" x2="215" y2="310" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="215" cy="260" r="3" fill="#38bdf8"/>
  <rect x="24" y="310" width="255" height="24" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="32" y="326" fill="#38bdf8" font-family="sans-serif" font-size="11">물살 저항을 줄이는 유선형 원뿔 바구니</text>

  <!-- Label 5: Tail slip-knot -->
  <line x1="348" y1="224" x2="348" y2="344" stroke="#d97706" stroke-width="1.2"/>
  <circle cx="348" cy="224" r="3" fill="#fde68a"/>
  <rect x="18" y="344" width="364" height="34" rx="4" fill="#141e28" stroke="#d97706" stroke-width="1.2"/>
  <text x="32" y="365" fill="#fde68a" font-family="sans-serif" font-size="11.5" font-weight="bold">[핵심] 꼬리 끝 물고기 수거용 개폐 매듭</text>
</svg>
