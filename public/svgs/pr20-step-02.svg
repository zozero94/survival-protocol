<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg20s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#111722"/>
    </linearGradient>
    <linearGradient id="potBody20" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="55%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="seaWater20" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="hearthFire20" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow20s2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg20s2)"/>
  <g stroke="#1e293b" stroke-width="0.6" opacity="0.45">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>
  <rect x="4" y="4" width="392" height="392" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Header Banner (Text 1) -->
  <rect x="8" y="10" width="384" height="24" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="16" y="26" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold">FIG. 02 // 2/3 SEAWATER FILL &amp; 30-DEG CONDENSER SLOPE</text>

  <!-- Sub-banner 1 (Text 2) -->
  <rect x="20" y="44" width="360" height="22" rx="2" fill="#131922" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="200" y="59" fill="#f8fafc" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">짠 거품이 넘치지 않게 토기 높이의 2/3까지만 바닷물 채우기</text>

  <!-- Main Scene: Clay Pot on Hearth + 2/3 Seawater + 30-Degree Bamboo Tube on Y-Fork -->
  <g filter="url(#shadow20s2)">
    <!-- Ground Line -->
    <rect x="16" y="292" width="368" height="14" fill="#1c1917" stroke="#44403c" stroke-width="1"/>

    <!-- Clay & Stone Hearth Base -->
    <polygon points="32,292 44,242 156,242 168,292" fill="#44403c" stroke="#a8a29e" stroke-width="1.5"/>
    <ellipse cx="100" cy="272" rx="42" ry="18" fill="url(#hearthFire20)"/>
    <polygon points="75,286 90,262 102,282 114,260 126,286" fill="#f97316" stroke="#fef08a" stroke-width="0.8"/>

    <!-- Clay Boiling Pot Cross-Section -->
    <path d="M 46,142 C 34,185 38,235 56,252 L 144,252 C 162,235 166,185 154,142 Z" fill="#1e130c" stroke="#d97706" stroke-width="2.5"/>

    <!-- 2/3 Seawater Fill Level Inside Pot (Leaving Top 1/3 Steam Headspace) -->
    <path d="M 42,182 Q 70,177 100,182 Q 130,187 158,182 C 161,215 156,240 144,250 L 56,250 C 44,240 39,215 42,182 Z" fill="url(#seaWater20)" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- 4 Anti-Boil-Over River Pebbles at Bottom of Pot -->
    <ellipse cx="72" cy="243" rx="11" ry="6" fill="#94a3b8" stroke="#e2e8f0" stroke-width="1"/>
    <ellipse cx="94" cy="244" rx="12" ry="6.5" fill="#64748b" stroke="#cbd5e1" stroke-width="1"/>
    <ellipse cx="116" cy="243" rx="10" ry="6" fill="#94a3b8" stroke="#e2e8f0" stroke-width="1"/>
    <ellipse cx="134" cy="244" rx="9" ry="5.5" fill="#64748b" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Rising Steam Bubbles & Pure Vapor in Top 1/3 Headspace -->
    <circle cx="78" cy="222" r="3.5" fill="none" stroke="#bae6fd" stroke-width="1.2"/>
    <circle cx="104" cy="210" r="4" fill="none" stroke="#bae6fd" stroke-width="1.2"/>
    <circle cx="122" cy="225" r="3" fill="none" stroke="#bae6fd" stroke-width="1.2"/>
    <path d="M 85,172 Q 80,155 92,140" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-dasharray="3,2"/>
    <path d="M 115,172 Q 120,155 108,140" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-dasharray="3,2"/>

    <!-- Hermetic Clay-Sealed Dome Lid -->
    <path d="M 42,142 Q 100,106 158,142 Z" fill="url(#potBody20)" stroke="#f59e0b" stroke-width="1.8"/>
    <!-- Clay Paste Rim Seal -->
    <ellipse cx="46" cy="142" rx="9" ry="5" fill="#78716c" stroke="#d6d3d1" stroke-width="1"/>
    <ellipse cx="154" cy="142" rx="9" ry="5" fill="#78716c" stroke="#d6d3d1" stroke-width="1"/>
    <!-- Top Pipe Socket Clay Mound -->
    <ellipse cx="118" cy="126" rx="16" ry="8" fill="#78716c" stroke="#d6d3d1" stroke-width="1.2"/>

    <!-- 30-Degree Downward Sloped Bamboo Condenser Tube -->
    <g transform="translate(114, 118) rotate(26)">
      <rect x="0" y="0" width="248" height="18" rx="3" fill="#588157" stroke="#a3b18a" stroke-width="1.5"/>
      <rect x="2" y="5" width="244" height="8" fill="#0f172a"/>
      <!-- Internal Downward Steam & Droplet Flow Arrow -->
      <path d="M 16,9 L 222,9" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
      <polygon points="234,9 222,4 222,14" fill="#38bdf8"/>
      <!-- Bamboo Node Rings -->
      <rect x="75" y="-2" width="4" height="22" rx="1" fill="#a3b18a"/>
      <rect x="160" y="-2" width="4" height="22" rx="1" fill="#a3b18a"/>
    </g>

    <!-- Y-Forked Wooden Support Stick Holding the Angled Pipe -->
    <path d="M 254,292 L 254,212 L 238,186 M 254,212 L 270,192" fill="none" stroke="#92400e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 254,292 L 254,212 L 238,186 M 254,212 L 270,192" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 30-Degree Slope Reference Arc & Downward Gravity Indicator -->
    <path d="M 155,118 L 225,118" stroke="#fde047" stroke-width="1.2" stroke-dasharray="4,3"/>
    <path d="M 198,118 A 42,42 0 0 1 192,138" fill="none" stroke="#fde047" stroke-width="2"/>
  </g>

  <!-- Sub-banner 2 (Text 3) -->
  <rect x="20" y="76" width="360" height="22" rx="2" fill="#131922" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="200" y="91" fill="#fde68a" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">뚜껑 테두리를 찰흙 반죽으로 밀봉하고 바닥에 조약돌 3~4개 넣기</text>

  <!-- Sub-banner 3 (Text 4) -->
  <rect x="20" y="314" width="360" height="22" rx="2" fill="#131922" stroke="#22c55e" stroke-width="0.8"/>
  <text x="200" y="329" fill="#f8fafc" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Y자 나뭇가지 받침대로 대나무 관을 30도 아래로 비스듬히 기울이기</text>

  <!-- Footer Key Summary Banner (Text 5) -->
  <rect x="8" y="352" width="384" height="36" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="200" y="374" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">[2단계 핵심] 상단 한 뼘 증기 공간 확보 및 30도 중력 낙하 경사 세팅</text>
</svg>
