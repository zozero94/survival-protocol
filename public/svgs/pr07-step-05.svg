<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b"/>
      <stop offset="50%" stop-color="#0f1216"/>
      <stop offset="100%" stop-color="#0a0c0e"/>
    </linearGradient>

    <!-- Manila Standing Rope 3D Tubular Gradient -->
    <linearGradient id="ropeManila05" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="25%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Tactical Green Working Rope 3D Gradient -->
    <linearGradient id="ropeGreen05" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="25%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#bbf7d0"/>
      <stop offset="75%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Deep Drop Shadow Filter for Over/Under Crossing -->
    <filter id="shadowDeep05" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <!-- Twisted Rope Braid Pattern for Manila Rope -->
    <pattern id="braidManila05" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#451a03" stroke-width="2.5" opacity="0.6"/>
      <line x1="6" y1="0" x2="6" y2="12" stroke="#fef3c7" stroke-width="1.5" opacity="0.4"/>
    </pattern>

    <!-- Paracord Texture Pattern for Working End -->
    <pattern id="braidGreen05" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#052e16" stroke-width="2" opacity="0.7"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#bbf7d0" stroke-width="1.2" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Canvas Backdrop -->
  <rect width="400" height="400" fill="url(#bgGrad05)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#22262c" stroke-width="1"/>

  <!-- Technical Corner Crosshairs -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#374151" stroke-width="1"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#374151" stroke-width="1"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#374151" stroke-width="1"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#374151" stroke-width="1"/>

  <!-- Blueprint Header -->
  <text x="24" y="28" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">FIG. 05 // BOWLINE STEP 5: 락킹 및 1초 해체</text>
  <line x1="24" y1="36" x2="376" y2="36" stroke="#262d35" stroke-width="1"/>

  <!-- Background Reference Grid -->
  <g opacity="0.12" stroke="#4b5563" stroke-width="0.5" stroke-dasharray="2 4">
    <line x1="60" y1="40" x2="60" y2="340"/>
    <line x1="200" y1="40" x2="200" y2="340"/>
    <line x1="340" y1="40" x2="340" y2="340"/>
    <line x1="20" y1="120" x2="380" y2="120"/>
    <line x1="20" y1="200" x2="380" y2="200"/>
    <line x1="20" y1="280" x2="380" y2="280"/>
  </g>

  <!-- ============================================================== -->
  <!-- 1. FULLY TIGHTENED LOCKED BOWLINE KNOT (완벽 결속된 3D 매듭) -->
  <!-- ============================================================== -->
  <!-- Standing Part pulled upward under extreme tension -->
  <path d="M 200 42 L 200 135" stroke="#000000" stroke-width="20" stroke-linecap="round"/>
  <path d="M 200 42 L 200 135" stroke="url(#ropeManila05)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 200 42 L 200 135" stroke="url(#braidManila05)" stroke-width="14" stroke-linecap="round" opacity="0.75"/>

  <!-- Rear Collar Loop (Behind Standing Line) -->
  <path d="M 215 150 C 235 125 235 85 198 85 C 165 85 155 115 165 150" 
        stroke="#000000" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M 215 150 C 235 125 235 85 198 85 C 165 85 155 115 165 150" 
        stroke="url(#ropeGreen05)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 215 150 C 235 125 235 85 198 85 C 165 85 155 115 165 150" 
        stroke="url(#braidGreen05)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Tightened Throat Loop (Locked Nipper Loop) -->
  <g filter="url(#shadowDeep05)">
    <path d="M 200 135 C 160 145 155 195 190 202 C 225 205 235 180 220 155 C 205 138 185 135 160 148" 
          stroke="#000000" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M 200 135 C 160 145 155 195 190 202 C 225 205 235 180 220 155 C 205 138 185 135 160 148" 
          stroke="url(#ropeManila05)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 200 135 C 160 145 155 195 190 202 C 225 205 235 180 220 155 C 205 138 185 135 160 148" 
          stroke="url(#braidManila05)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>

  <!-- Locked Parallel Green Strands through Throat -->
  <g filter="url(#shadowDeep05)">
    <!-- Emerging strand & Re-entered strand tightly bound together -->
    <path d="M 180 185 L 180 148" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
    <path d="M 180 185 L 180 148" stroke="url(#ropeGreen05)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 193 145 L 193 192" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
    <path d="M 193 145 L 193 192" stroke="url(#ropeGreen05)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Working Tail coming out inside the loop (Inside Tail - Correct Bowline) -->
  <path d="M 193 192 C 193 210 215 220 230 220" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
  <path d="M 193 192 C 193 210 215 220 230 220" stroke="url(#ropeGreen05)" stroke-width="10" stroke-linecap="round"/>
  <line x1="228" y1="216" x2="232" y2="224" stroke="#ef4444" stroke-width="4" stroke-linecap="square"/>

  <!-- Big Locked Main Loop (하중을 받아도 절대 줄어들지 않는 완벽 루프) -->
  <path d="M 190 202 C 190 255 155 315 110 315 C 65 315 35 255 50 195 C 60 145 110 130 160 148" 
        stroke="#000000" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M 190 202 C 190 255 155 315 110 315 C 65 315 35 255 50 195 C 60 145 110 130 160 148" 
        stroke="url(#ropeManila05)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 190 202 C 190 255 155 315 110 315 C 65 315 35 255 50 195 C 60 145 110 130 160 148" 
        stroke="url(#braidManila05)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- ============================================================== -->
  <!-- 2. TENSION FORCES (사방 팽팽한 장력 화살표) -->
  <!-- ============================================================== -->
  <!-- Upward Force Arrow -->
  <path d="M 200 70 L 200 45" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <polygon points="200,38 194,50 206,50" fill="#ef4444"/>

  <!-- Rightward Grip Force Arrow -->
  <path d="M 215 225 L 245 235" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <polygon points="252,237 240,230 243,242" fill="#ef4444"/>

  <!-- ============================================================== -->
  <!-- 3. INSET LOUPE: 1초 해체 (BREAK THE BACK 엄지손가락 꺾기 기법) -->
  <!-- ============================================================== -->
  <g transform="translate(85, 110)">
    <circle cx="0" cy="0" r="38" fill="#0d1117" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#222" stroke-width="1"/>
    
    <!-- Standing Line inside Loupe -->
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#b45309" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Collar Loop being tilted backwards -->
    <path d="M 16 0 C 16 -18 -16 -18 -16 0" stroke="#22c55e" stroke-width="7" stroke-linecap="round" fill="none"/>
    
    <!-- Thumb Push Force Vector (엄지 젖히기) -->
    <path d="M 0 -8 C 0 -22 18 -22 22 -14" fill="none" stroke="#f59e0b" stroke-width="2"/>

  </g>

  <!-- ============================================================== -->
  <!-- 4. CALLOUT LABELS (12대 선언적 바인딩 라벨) -->
  <!-- ============================================================== -->
  <!-- Label 2, 3, 4: Quick Release Inset (Top Left) -->
  <text x="24" y="52" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">1-SEC QUICK RELEASE</text>
  <text x="24" y="65" fill="#bae6fd" font-family="'JetBrains Mono', monospace" font-size="9">뒤통수(칼라) 꺾기 비법</text>
  <text x="24" y="162" fill="#93c5fd" font-family="'Chivo', sans-serif" font-size="8.5">엄지로 칼라를 꺾으면 즉시 해체</text>

  <!-- Label 5 & 6: Pull Standing (Top Right) -->
  <line x1="210" y1="55" x2="265" y2="55" stroke="#ef4444" stroke-width="1"/>
  <circle cx="210" cy="55" r="2.5" fill="#ef4444"/>
  <text x="275" y="50" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">PULL STANDING</text>
  <text x="275" y="63" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9">원줄을 위로 강하게 당김</text>

  <!-- Label 7 & 8: Grip Together (Center Right) -->
  <line x1="240" y1="210" x2="265" y2="210" stroke="#22c55e" stroke-width="1"/>
  <circle cx="240" cy="210" r="2.5" fill="#22c55e"/>
  <text x="275" y="205" fill="#86efac" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">GRIP TOGETHER</text>
  <text x="275" y="218" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9">끝단과 고리를 한 손에 쥠</text>

  <!-- Label 9 & 10: Locked Fixed Loop (Bottom Left) -->
  <line x1="60" y1="280" x2="30" y2="280" stroke="#f59e0b" stroke-width="1"/>
  <circle cx="60" cy="280" r="2.5" fill="#f59e0b"/>
  <text x="24" y="268" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">LOCKED FIXED LOOP</text>
  <text x="24" y="281" fill="#fef3c7" font-family="'JetBrains Mono', monospace" font-size="9">하중을 받아도 크기 불변</text>

  <!-- Bottom Tactical Field Note Strip -->
  <rect x="18" y="342" width="364" height="40" fill="#111419" stroke="#262d35" stroke-width="1"/>
  <rect x="18" y="342" width="4" height="40" fill="#38bdf8"/>
  <!-- Label 11 & 12: Summary Instruction -->
  <text x="32" y="357" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="bold">[5단계 핵심] 양손으로 잡고 반대로 당겨 락킹 체결</text>
  <text x="32" y="371" fill="#9ca3af" font-family="'Chivo', sans-serif" font-size="8.5">풀 때는 매듭 뒤편 칼라 링을 엄지로 젖히면 칼 없이 1초 만에 풀립니다.</text>
</svg>