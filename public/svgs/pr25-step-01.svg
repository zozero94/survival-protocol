<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg25s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="ceramic25s1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bagInner25s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid25s1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow25s1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg25s1)"/>
  <rect width="400" height="400" fill="url(#grid25s1)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Header Banner (Label 1) -->
  <rect x="14" y="14" width="372" height="28" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="32" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">FIG. 01 // 배관 역류 차단 레버 봉인 및 이중 방수 봉투 결합</text>

  <!-- Label 2 Callout Box -->
  <rect x="16" y="50" width="368" height="24" rx="2" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="24" y="66" fill="#fecaca" font-family="monospace" font-size="10.5">하수관 역류 방지를 위해 물내림 레버를 끈으로 고정 봉인</text>

  <!-- Main 3D Cutaway Illustration: Left (Flush Tank Lever Locked) & Right (Double-Bagged Bowl Cross-Section) -->
  <g filter="url(#shadow25s1)">
    <!-- Left Panel: Ceramic Cistern with Tied Flush Lever -->
    <rect x="24" y="88" width="132" height="150" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
    <!-- Cistern Tank -->
    <rect x="42" y="106" width="96" height="68" rx="3" fill="url(#ceramic25s1)" stroke="#f8fafc" stroke-width="1.2"/>
    <rect x="38" y="98" width="104" height="10" rx="2" fill="#cbd5e1" stroke="#f8fafc" stroke-width="1"/>
    <!-- Flush Lever Tied & Locked with Cord + Prohibited X Badge -->
    <rect x="48" y="118" width="22" height="6" rx="2" fill="#334155" stroke="#f8fafc" stroke-width="1"/>
    <path d="M58,108 L58,128 M52,118 L64,118" stroke="#f59e0b" stroke-width="2.2"/>
    <circle cx="110" cy="140" r="14" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <path d="M103,133 L117,147 M117,133 L103,147" stroke="#f87171" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Blocked Sewer Pipe Below -->
    <path d="M76,174 L76,222 L118,222" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
    <path d="M84,198 L108,198" stroke="#ef4444" stroke-width="3"/>

    <!-- Right Panel: Double-Layer Bag Cross-Section over Toilet Bowl & Seat -->
    <rect x="170" y="88" width="206" height="150" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Ceramic Bowl Base -->
    <path d="M204,136 L342,136 L326,222 Q273,234 220,222 Z" fill="url(#ceramic25s1)" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Layer 1: Inner Protective Liner Bag (Blue Dashed Outline Directly Over Ceramic Rim) -->
    <path d="M196,132 L350,132 L344,148 L334,148 L320,210 L226,210 L212,148 L202,148 Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- Lowered Toilet Seat Ring (Amber/Gray Cross-Section Blocks) -->
    <rect x="198" y="118" width="34" height="10" rx="3" fill="#fde047" stroke="#ca8a04" stroke-width="1.2"/>
    <rect x="314" y="118" width="34" height="10" rx="3" fill="#fde047" stroke="#ca8a04" stroke-width="1.2"/>

    <!-- Layer 2: Replaceable Heavy Black Collection Bag Over the Seat -->
    <path d="M190,114 L236,114 L242,196 L304,196 L310,114 L356,114 L356,130 L342,130 L312,198 L234,198 L204,130 L190,130 Z" fill="url(#bagInner25s1)" stroke="#10b981" stroke-width="2"/>
  </g>

  <!-- Label 3 Callout Box -->
  <rect x="16" y="254" width="368" height="26" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="271" fill="#bae6fd" font-family="monospace" font-size="10.5">시트를 올리고 도기 본체에 1차 대형 보호 봉투 밀착 장착</text>

  <!-- Label 4 Callout Box -->
  <rect x="16" y="288" width="368" height="26" rx="2" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="24" y="305" fill="#a7f3d0" font-family="monospace" font-size="10.5">시트를 내린 뒤 상단에 2차 교체용 검은 포집 봉투 이중 장착</text>

  <!-- Bottom Core Principle Strip (Label 5) -->
  <rect x="14" y="348" width="372" height="34" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="24" y="369" fill="#ecfdf5" font-family="monospace" font-size="10.5" font-weight="bold">[핵심] 파열 배관 오수 역류 원천 차단 및 변기 본체 오염 방어</text>
</svg>
