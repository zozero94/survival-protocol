<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg26s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="bowl26s1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="water26s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.75"/>
    </linearGradient>
    <pattern id="grid26s1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow26s1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg26s1)"/>
  <rect width="400" height="400" fill="url(#grid26s1)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Header Banner (Label 1) -->
  <rect x="14" y="14" width="372" height="28" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="32" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">FIG. 01 // 파손 종자 선별 제거 및 3배수 침지 휴면 타파</text>

  <!-- Label 2 Callout Box -->
  <rect x="16" y="50" width="368" height="24" rx="2" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="24" y="66" fill="#fecaca" font-family="monospace" font-size="10.5">부패 원인이 되는 쪼개진 콩·상처 난 불량 종자 100% 제거</text>

  <!-- Main 3D Illustration: Left (Culled Split/Bad Beans X) & Right (3x Water Soaking Bowl + Oak Charcoal + Plump 2x Beans) -->
  <g filter="url(#shadow26s1)">
    <!-- Left Panel: Split / Moldy Seeds Culled -->
    <rect x="24" y="88" width="132" height="150" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
    <!-- Broken & Split Bean Silhouettes -->
    <path d="M50,136 C42,126 62,118 68,130 L58,142 Z" fill="#a16207" stroke="#fde047" stroke-width="1"/>
    <path d="M88,128 C82,118 104,118 106,132 L94,138 Z" fill="#713f12" stroke="#ca8a04" stroke-width="1"/>
    <path d="M118,140 C112,130 130,126 132,140 Z" fill="#57534e" stroke="#a8a29e" stroke-width="1"/>
    <!-- Red Prohibition X Circle -->
    <circle cx="90" cy="186" r="22" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
    <path d="M80,176 L100,196 M100,176 L80,196" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Panel: 3x Water Soaking Vessel + Charcoal Piece + Plump Imbibed Beans -->
    <rect x="170" y="88" width="206" height="150" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- Ceramic/Glass Soaking Bowl -->
    <path d="M196,118 L350,118 L334,218 Q273,230 212,218 Z" fill="url(#bowl26s1)" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- 3x Water Level Fill -->
    <path d="M200,132 L346,132 L332,214 Q273,224 214,214 Z" fill="url(#water26s1)" stroke="#38bdf8" stroke-width="1"/>
    <!-- Oak Charcoal Block at Bottom Center -->
    <polygon points="262,188 288,184 292,208 258,210" fill="#090d16" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- Plump Soaked Soybeans (2x Expanded with White Radicle Tip) -->
    <ellipse cx="232" cy="198" rx="12" ry="8" fill="#facc15" stroke="#fef08a" stroke-width="1.2"/>
    <path d="M242,198 Q248,194 250,190" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="314" cy="198" rx="12" ry="8" fill="#facc15" stroke="#fef08a" stroke-width="1.2"/>
    <path d="M324,198 Q330,194 332,190" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="244" cy="176" rx="11" ry="7.5" fill="#eab308" stroke="#fef08a" stroke-width="1"/>
    <ellipse cx="302" cy="176" rx="11" ry="7.5" fill="#eab308" stroke="#fef08a" stroke-width="1"/>
  </g>

  <!-- Label 3 Callout Box -->
  <rect x="16" y="254" width="368" height="26" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="271" fill="#bae6fd" font-family="monospace" font-size="10.5">콩 부피 3배의 깨끗한 정화수 주입 및 참나무 숯 1조각 투입</text>

  <!-- Label 4 Callout Box -->
  <rect x="16" y="288" width="368" height="26" rx="2" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="24" y="305" fill="#a7f3d0" font-family="monospace" font-size="10.5">8~12시간 침지 후 부피 2배 팽창 및 백색 유근 돌파 확인</text>

  <!-- Bottom Core Principle Strip (Label 5) -->
  <rect x="14" y="348" width="372" height="34" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="24" y="369" fill="#ecfdf5" font-family="monospace" font-size="10.5" font-weight="bold">[핵심] 깨진 콩 사전 제거로 재배 중 세균성 무름병 원천 차단</text>
</svg>
