<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgS4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Stone Dish Gradient -->
    <linearGradient id="stoneDishS4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Black Pitch Mix Gradient -->
    <radialGradient id="blackPitchGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="40%" stop-color="#18181b"/>
      <stop offset="85%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Obsidian Hardened Pitch Stick Gradient -->
    <radialGradient id="pitchStickGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="30%" stop-color="#27272a"/>
      <stop offset="70%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- Wood Stick Gradient -->
    <linearGradient id="woodStickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowS4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgS4)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#232830" stroke-width="1.2"/>

  <!-- Technical Corner Ticks -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#475569" stroke-width="1.2"/>

  <!-- Top Header Strip (Label 1) -->
  <rect x="20" y="16" width="360" height="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="16" width="3" height="20" fill="#f59e0b"/>
  <text x="30" y="30" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" letter-spacing="0.5">FIG. 04 // CHARCOAL ADMIXTURE &amp; PITCH STICK</text>

  <!-- Ground Work Surface -->
  <line x1="20" y1="320" x2="380" y2="320" stroke="#334155" stroke-width="1.5"/>

  <!-- Mixing Stone Dish on Left -->
  <g filter="url(#shadowS4)">
    <path d="M 30 240 C 35 310, 185 310, 190 240 C 165 260, 55 260, 30 240 Z" fill="url(#stoneDishS4)" stroke="#1e293b" stroke-width="1.5"/>
    <ellipse cx="110" cy="240" rx="78" ry="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Pitch Black Viscous Resin Mixture -->
    <ellipse cx="110" cy="242" rx="66" ry="16" fill="url(#blackPitchGrad)" stroke="#27272a" stroke-width="1.2"/>
    <!-- Swirling Agitation Lines in Pitch -->
    <path d="M 80 240 Q 110 248 140 240" stroke="#52525b" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 95 245 Q 120 250 135 244" stroke="#71717a" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Cascading Fine Charcoal Powder from Leaf above -->
  <g filter="url(#shadowS4)">
    <!-- Charcoal Powder Leaf / Bark Scoop -->
    <path d="M 70 145 Q 115 135 140 155 L 125 165 Q 100 150 70 155 Z" fill="#3f2213" stroke="#26140b" stroke-width="1"/>
    <!-- Micro Charcoal Powder Particles Streaming Down -->
    <g fill="#18181b">
      <circle cx="120" cy="175" r="3.5"/>
      <circle cx="128" cy="180" r="2.5"/>
      <circle cx="115" cy="190" r="3"/>
      <circle cx="125" cy="198" r="2"/>
      <circle cx="118" cy="208" r="3.5"/>
      <circle cx="126" cy="215" r="2.5"/>
      <circle cx="112" cy="225" r="3"/>
      <circle cx="122" cy="230" r="2"/>
    </g>
  </g>

  <!-- Label 2: Fine Charcoal Powder 1:1 Admixture -->
  <g>
    <line x1="120" y1="185" x2="60" y2="120" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="120" cy="185" r="2.5" fill="#f59e0b"/>
    <rect x="40" y="108" width="180" height="16" fill="#1c1308" rx="3" stroke="#b45309" stroke-width="1"/>
    <text x="130" y="120" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">미세 참나무 숯가루 1:1 비율 투입</text>
  </g>

  <!-- Active Churning Stick in Resin Dish -->
  <g filter="url(#shadowS4)">
    <line x1="145" y1="170" x2="95" y2="245" stroke="url(#woodStickGrad)" stroke-width="6" stroke-linecap="round"/>
    <!-- Sticky Tar Coating on Stirrer Tip -->
    <ellipse cx="95" cy="245" rx="8" ry="5" fill="#09090b"/>
    <!-- Rotation Arrow around Stirrer -->
    <path d="M 85 230 C 80 238, 105 242, 105 232" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 105 232 L 102 238 L 108 238 Z" fill="#38bdf8"/>
  </g>

  <!-- Label 3: High-Speed Churning & Viscous Dough -->
  <g>
    <line x1="100" y1="240" x2="260" y2="155" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="100" cy="240" r="2.5" fill="#38bdf8"/>
    <rect x="175" y="145" width="200" height="16" fill="#0c1726" rx="3" stroke="#0284c7" stroke-width="1"/>
    <text x="275" y="157" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">나뭇가지로 고속 교반 및 점성 반죽</text>
  </g>

  <!-- Finished Obsidian Pitch Stick on Right -->
  <g filter="url(#shadowS4)">
    <!-- Wooden Handle Stick -->
    <path d="M 235 305 L 345 220" stroke="url(#woodStickGrad)" stroke-width="9" stroke-linecap="round"/>
    <!-- Hardened Bulb of Glossy Black Pitch at the Tip -->
    <ellipse cx="230" cy="308" rx="22" ry="16" fill="url(#pitchStickGrad)" stroke="#27272a" stroke-width="1.5"/>
    <circle cx="225" cy="305" r="14" fill="#09090b"/>
    <!-- Specular Highlight reflecting hard obsidian surface -->
    <path d="M 220 298 Q 235 302 242 312" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
    <circle cx="218" cy="304" r="3" fill="#ffffff" opacity="0.7"/>

    <!-- Cold Water Quenching Basin / Surface -->
    <ellipse cx="230" cy="325" rx="35" ry="8" fill="#0284c7" opacity="0.3"/>
    <path d="M 215 325 Q 230 327 245 325" stroke="#38bdf8" stroke-width="1" fill="none" opacity="0.8"/>
  </g>

  <!-- Label 4: Pitch Stick Wrapping & 5-Min Quench -->
  <g>
    <line x1="240" y1="305" x2="270" y2="235" stroke="#a3e635" stroke-width="1"/>
    <circle cx="240" cy="305" r="2.5" fill="#a3e635"/>
    <rect x="160" y="225" width="220" height="16" fill="#14210a" rx="3" stroke="#4d7c0f" stroke-width="1"/>
    <text x="270" y="237" fill="#bef264" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">나뭇가지 끝에 둥글게 도포 후 5분 급랭</text>
  </g>

  <!-- Bottom Core Insight Briefing Box (Label 5) -->
  <rect x="20" y="348" width="360" height="26" fill="#111827" rx="4" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="20" y="348" width="4" height="26" fill="#10b981" rx="1"/>
  <text x="200" y="364" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">[핵심] 균열 없는 천연 방수 에폭시 막대 완성</text>
</svg>
