<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgS1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Bark Wood Gradient (Outer Bark) -->
    <linearGradient id="barkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c3a21"/>
      <stop offset="25%" stop-color="#8a532a"/>
      <stop offset="60%" stop-color="#6e3f1d"/>
      <stop offset="100%" stop-color="#3d210f"/>
    </linearGradient>

    <!-- Carved Inner Wood (Pale Flesh Tone) -->
    <linearGradient id="carvedWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fef3c7"/>
      <stop offset="85%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Deep Drop Shadow -->
    <filter id="shadowS1" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgS1)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#232830" stroke-width="1.2"/>

  <!-- Technical Corner Ticks -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#475569" stroke-width="1.2"/>

  <!-- Top Header Strip (Label 1) -->
  <rect x="20" y="16" width="360" height="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="16" width="3" height="20" fill="#ef4444"/>
  <text x="30" y="30" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" letter-spacing="0.5">FIG. 01 // 3 STICKS ANATOMY &amp; NOTCHES</text>

  <!-- Grid Guide Lines -->
  <line x1="45" y1="45" x2="45" y2="340" stroke="#171f2a" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="355" y1="45" x2="355" y2="340" stroke="#171f2a" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ========================================== -->
  <!-- 1. STICK 1: VERTICAL POST (세움대 20cm) -->
  <!-- ========================================== -->
  <g filter="url(#shadowS1)">
    <!-- Round End (Bottom Base, right side) -->
    <ellipse cx="280" cy="78" rx="5" ry="11" fill="#3d210f"/>
    <!-- Main Cylinder Body -->
    <path d="M 80 67 L 280 67 A 5 11 0 0 1 280 89 L 80 89 Z" fill="url(#barkGrad)" stroke="#271408" stroke-width="1"/>
    <!-- Bark Texture Lines -->
    <line x1="110" y1="72" x2="140" y2="72" stroke="#3d210f" stroke-width="1" stroke-linecap="round"/>
    <line x1="210" y1="84" x2="250" y2="84" stroke="#3d210f" stroke-width="1" stroke-linecap="round"/>

    <!-- Left Chisel Tip (납작 쐐기 깎은 단면) -->
    <polygon points="80,67 52,78 80,89" fill="url(#carvedWood)" stroke="#92400e" stroke-width="1.2"/>
    <line x1="52" y1="78" x2="80" y2="78" stroke="#b45309" stroke-width="0.8" stroke-dasharray="2 1"/>

    <!-- Middle Square Notch (가운데 사각 홈) -->
    <polygon points="155,67 175,67 175,80 155,80" fill="url(#carvedWood)" stroke="#78350f" stroke-width="1"/>
    <polygon points="155,80 175,80 175,82 155,82" fill="#451a03"/>
    <!-- Graphic Notch Pointer -->
    <path d="M 165 95 L 165 84" stroke="#ef4444" stroke-width="1.2"/>
    <polygon points="163,84 165,80 167,84" fill="#ef4444"/>
  </g>

  <!-- Label 2: Stick 1 -->
  <text x="50" y="58" fill="#f59e0b" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">POST (1번 세움대 - 윗머리 납작 쐐기 &amp; 네모 홈)</text>

  <!-- ========================================== -->
  <!-- 2. STICK 2: DIAGONAL STRUT (빗장대 25cm) -->
  <!-- ========================================== -->
  <g filter="url(#shadowS1)">
    <!-- Base Cylinder -->
    <ellipse cx="315" cy="165" rx="5" ry="11" fill="#3d210f"/>
    <path d="M 65 154 L 315 154 A 5 11 0 0 1 315 176 L 65 176 Z" fill="url(#barkGrad)" stroke="#271408" stroke-width="1"/>
    <!-- Bark Texture -->
    <line x1="120" y1="160" x2="160" y2="160" stroke="#3d210f" stroke-width="1" stroke-linecap="round"/>

    <!-- Left Top V-Notch (상단 45도 V자 홈) -->
    <polygon points="78,154 98,154 78,174" fill="url(#carvedWood)" stroke="#92400e" stroke-width="1.2"/>
    <polygon points="78,174 98,154 98,156 80,176" fill="#451a03"/>
    <path d="M 65 154 L 78 154 L 78 174 L 65 176 Z" fill="url(#carvedWood)" stroke="#92400e" stroke-width="0.8"/>

    <!-- Right Bottom Bevel (하단 45도 안쪽 깎기) -->
    <polygon points="300,154 315,154 300,176" fill="url(#carvedWood)" stroke="#92400e" stroke-width="1"/>
    <!-- Graphic V-Notch Pointer -->
    <path d="M 88 188 L 88 177" stroke="#38bdf8" stroke-width="1.2"/>
    <polygon points="86,177 88,173 90,177" fill="#38bdf8"/>
  </g>

  <!-- Label 3: Stick 2 -->
  <text x="50" y="145" fill="#f59e0b" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">STRUT (2번 빗장대 - 윗머리 V홈 &amp; 아랫머리 쐐기)</text>

  <!-- ========================================== -->
  <!-- 3. STICK 3: BAIT STICK (먹이대 30cm) -->
  <!-- ========================================== -->
  <g filter="url(#shadowS1)">
    <!-- Base Cylinder -->
    <path d="M 60 242 L 320 242 L 350 253 L 320 264 L 60 264 Z" fill="url(#barkGrad)" stroke="#271408" stroke-width="1"/>
    <!-- Bark Texture -->
    <line x1="130" y1="248" x2="180" y2="248" stroke="#3d210f" stroke-width="1" stroke-linecap="round"/>

    <!-- Front Catch Ledge -->
    <polygon points="60,242 85,242 85,251 60,251" fill="url(#carvedWood)" stroke="#92400e" stroke-width="1.2"/>
    <polygon points="60,251 85,251 85,253 60,253" fill="#451a03"/>

    <!-- Rear Notch for Strut -->
    <polygon points="170,242 188,242 170,256" fill="url(#carvedWood)" stroke="#92400e" stroke-width="1.2"/>

    <!-- Sharp Pencil Tip on Far Right -->
    <polygon points="320,242 350,253 320,264" fill="url(#carvedWood)" stroke="#92400e" stroke-width="1.2"/>
    <circle cx="348" cy="253" r="3.5" fill="#ef4444"/>
    <!-- Graphic Bait Pointer -->
    <path d="M 348 275 L 348 264" stroke="#ef4444" stroke-width="1.2"/>
    <polygon points="346,264 348,260 350,264" fill="#ef4444"/>
  </g>

  <!-- Label 4: Stick 3 -->
  <text x="50" y="233" fill="#f59e0b" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">BAIT STICK (3번 먹이대 - 걸림턱 &amp; 홈 &amp; 뾰족한 끝)</text>

  <!-- Bottom Visual Callout Box (Label 5) -->
  <rect x="20" y="315" width="360" height="58" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <rect x="20" y="315" width="3" height="58" fill="#f59e0b"/>
  <text x="32" y="348" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">[핵심] 서로 딱 물리는 직각 홈과 걸림턱 깎기</text>
</svg>
