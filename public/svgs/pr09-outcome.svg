<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgOut9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#0e1218"/>
      <stop offset="100%" stop-color="#050709"/>
    </linearGradient>

    <!-- Soil Strata -->
    <linearGradient id="soilCutOut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2314"/>
      <stop offset="50%" stop-color="#241409"/>
      <stop offset="100%" stop-color="#140a04"/>
    </linearGradient>

    <!-- Mud Kiln Mound -->
    <linearGradient id="moundGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3e2314"/>
      <stop offset="35%" stop-color="#593b26"/>
      <stop offset="70%" stop-color="#412918"/>
      <stop offset="100%" stop-color="#2d1607"/>
    </linearGradient>

    <!-- Turf Grass Layer -->
    <linearGradient id="turfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d4a22"/>
      <stop offset="50%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>

    <!-- Pyrolysis Glow in Kiln Interior -->
    <radialGradient id="pyrolysisGlow" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#b45309" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#78350f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#07080a" stop-opacity="0"/>
    </radialGradient>

    <!-- Blue Pyrolysis Smoke Stream -->
    <radialGradient id="bluePlume" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#0369a1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07080a" stop-opacity="0"/>
    </radialGradient>

    <!-- Carbon Charcoal Texture -->
    <linearGradient id="charcoalGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Silver Sheen Highlight -->
    <linearGradient id="silverGloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="shadowOut9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgOut9)"/>
  <rect x="12" y="12" width="776" height="426" fill="none" stroke="#232830" stroke-width="1.2"/>

  <!-- Technical Corner Ticks -->
  <path d="M 20 28 L 36 28 M 28 20 L 28 36" stroke="#475569" stroke-width="1.2"/>
  <path d="M 780 28 L 764 28 M 772 20 L 772 36" stroke="#475569" stroke-width="1.2"/>
  <path d="M 20 422 L 36 422 M 28 414 L 28 430" stroke="#475569" stroke-width="1.2"/>
  <path d="M 780 422 L 764 422 M 772 414 L 772 430" stroke="#475569" stroke-width="1.2"/>

  <!-- Top Technical Header Strip -->
  <rect x="28" y="22" width="744" height="24" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="28" y="22" width="4" height="24" fill="#f97316"/>
  <text x="42" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" letter-spacing="0.5">PR-09 // PIT CHARCOAL KILN (원시 지하 숯가마 구조 &amp; 고순도 탄소 숯 완성 단면)</text>

  <!-- Left: Underground Kiln Cross Section -->
  <!-- Ground Level & Earth -->
  <path d="M 35 190 L 80 190 L 140 375 L 35 375 Z" fill="url(#soilCutOut)" opacity="0.65"/>
  <path d="M 450 190 L 390 190 L 330 375 L 450 375 Z" fill="url(#soilCutOut)" opacity="0.65"/>

  <!-- Pit Interior Chamber (Cone Shape) -->
  <path d="M 80 190 Q 235 200 390 190 L 330 375 Q 235 380 140 375 Z" fill="#140a04" stroke="#452715" stroke-width="1.5"/>

  <!-- Heat/Pyrolysis Glow inside Kiln -->
  <path d="M 140 375 Q 235 380 330 375 L 310 260 Q 235 270 160 260 Z" fill="url(#pyrolysisGlow)"/>

  <!-- Stood Oak Logs inside (Pyrolyzing to Black Charcoal) -->
  <g filter="url(#shadowOut9)">
    <!-- Log 1 -->
    <rect x="155" y="205" width="22" height="160" rx="3" fill="#1e130b" stroke="#0a0502" stroke-width="1"/>
    <!-- Log 2 -->
    <rect x="185" y="195" width="25" height="175" rx="3" fill="#24170d" stroke="#0a0502" stroke-width="1"/>
    <!-- Log 3 (Center) -->
    <rect x="220" y="190" width="30" height="182" rx="3" fill="#2a1b10" stroke="#0a0502" stroke-width="1"/>
    <!-- Log 4 -->
    <rect x="260" y="195" width="26" height="175" rx="3" fill="#24170d" stroke="#0a0502" stroke-width="1"/>
    <!-- Log 5 -->
    <rect x="295" y="205" width="22" height="160" rx="3" fill="#1e130b" stroke="#0a0502" stroke-width="1"/>
    <!-- Wedge branches -->
    <line x1="180" y1="210" x2="182" y2="350" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <line x1="215" y1="205" x2="216" y2="355" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <line x1="254" y1="205" x2="253" y2="355" stroke="#78350f" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="290" y1="210" x2="288" y2="350" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Glowing Embers Bed at Bottom -->
  <g>
    <ellipse cx="235" cy="372" rx="75" ry="8" fill="#ea580c"/>
    <circle cx="185" cy="370" r="5" fill="#fef08a"/>
    <circle cx="215" cy="373" r="6" fill="#fde047"/>
    <circle cx="255" cy="371" r="5" fill="#fef08a"/>
    <circle cx="285" cy="372" r="5" fill="#fde047"/>
  </g>

  <!-- Kiln Dome: Mud & Sod Seal (10cm) -->
  <g filter="url(#shadowOut9)">
    <path d="M 65 190 Q 235 110 405 190 Q 235 160 65 190 Z" fill="url(#moundGrad)" stroke="#593b26" stroke-width="1.5"/>
    <path d="M 72 189 Q 235 113 398 189 Q 235 130 72 189 Z" fill="url(#turfGrad)" opacity="0.85"/>
  </g>

  <!-- Center Chimney -->
  <g filter="url(#shadowOut9)">
    <path d="M 220 126 L 220 105 Q 235 102 250 105 L 250 126 Z" fill="#3e2314" stroke="#5c381e" stroke-width="1.2"/>
    <ellipse cx="235" cy="105" rx="15" ry="4" fill="#0c0603" stroke="#ea580c" stroke-width="1"/>
  </g>

  <!-- Billowing Faint Blue Pyrolysis Smoke Stream -->
  <g>
    <circle cx="235" cy="85" r="14" fill="url(#bluePlume)"/>
    <circle cx="222" cy="65" r="18" fill="url(#bluePlume)"/>
    <circle cx="245" cy="55" r="22" fill="url(#bluePlume)"/>
    <circle cx="230" cy="35" r="26" fill="url(#bluePlume)"/>
  </g>

  <!-- Air Intake Arrows -->
  <g>
    <!-- Left Intake -->
    <ellipse cx="78" cy="195" rx="4" ry="7" fill="#0a0502" stroke="#ea580c" stroke-width="1"/>
    <path d="M 45 195 L 68 195" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="3 2"/>
    <polygon points="73,195 66,192 66,198" fill="#38bdf8"/>
    <!-- Right Intake -->
    <ellipse cx="392" cy="195" rx="4" ry="7" fill="#0a0502" stroke="#ea580c" stroke-width="1"/>
    <path d="M 425 195 L 402 195" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="3 2"/>
    <polygon points="397,195 404,192 404,198" fill="#38bdf8"/>
  </g>

  <!-- Annotations on Kiln Diagram -->
  <rect x="42" y="75" width="135" height="18" fill="#0b1320" rx="3" stroke="#1e3a5f" stroke-width="1"/>
  <text x="109" y="88" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">상단 굴뚝: 푸른 연기 배출</text>

  <rect x="42" y="145" width="135" height="18" fill="#141f0d" rx="3" stroke="#4d7c0f" stroke-width="1"/>
  <text x="109" y="158" fill="#bef264" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">10cm 점토 &amp; 잔디 뗏장 덮개</text>

  <rect x="28" y="275" width="115" height="18" fill="#1c0f05" rx="3" stroke="#ea580c" stroke-width="1"/>
  <text x="85" y="288" fill="#fb923c" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">50cm 원뿔 구덩이</text>

  <!-- Right: Harvested Charcoal Specification & Performance Panel -->
  <g filter="url(#shadowOut9)">
    <rect x="480" y="62" width="292" height="325" fill="#0b0f17" rx="6" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="480" y="62" width="292" height="26" fill="#111827" rx="6" stroke="#1f2937" stroke-width="1"/>
    <text x="626" y="79" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" text-anchor="middle">수확된 고급 참나무 숯 제원 (SPECIFICATION)</text>

    <!-- Harvested Charcoal Vector Art Illustration -->
    <!-- Large Charcoal Log Chunk -->
    <g>
      <polygon points="560,165 620,120 710,130 735,175 660,215 570,205" fill="url(#charcoalGloss)" stroke="#475569" stroke-width="1.2"/>
      <!-- Silver Sheen Facet -->
      <polygon points="620,120 710,130 675,170 595,155" fill="url(#silverGloss)" opacity="0.3"/>
      <!-- Cleavage Lines -->
      <line x1="635" y1="135" x2="670" y2="195" stroke="#020617" stroke-width="1.8"/>
      <line x1="590" y1="170" x2="640" y2="205" stroke="#020617" stroke-width="1.4"/>
      <!-- Metallic Bell Sound Waves -->
      <path d="M 725 140 A 12 12 0 0 1 740 155" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
      <path d="M 732 132 A 20 20 0 0 1 752 158" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    </g>

    <!-- Micro Pores Callout Inset Circle -->
    <circle cx="535" cy="180" r="28" fill="#090d16" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Micro Pores Pattern -->
    <circle cx="525" cy="172" r="2" fill="#38bdf8"/>
    <circle cx="540" cy="170" r="2.5" fill="#38bdf8"/>
    <circle cx="530" cy="184" r="1.8" fill="#38bdf8"/>
    <circle cx="545" cy="182" r="2.2" fill="#38bdf8"/>
    <circle cx="536" cy="192" r="1.5" fill="#38bdf8"/>
    <line x1="563" y1="180" x2="585" y2="180" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="535" y="220" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" text-anchor="middle">다공성 활성 구조</text>

    <!-- Technical Specs Table Rows -->
    <g>
      <!-- Row 1: Carbon Purity -->
      <rect x="495" y="235" width="262" height="24" fill="#0f172a" rx="3" stroke="#1e293b" stroke-width="1"/>
      <text x="505" y="251" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">탄소 순도 (Carbon Purity)</text>
      <text x="745" y="251" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="end">85 ~ 90% (고밀도 탄화)</text>

      <!-- Row 2: Calorific Value & Smokeless -->
      <rect x="495" y="265" width="262" height="24" fill="#0f172a" rx="3" stroke="#1e293b" stroke-width="1"/>
      <text x="505" y="281" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">연소 온도 &amp; 연기 유무</text>
      <text x="745" y="281" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="end">400~500℃ / 연기 0%</text>

      <!-- Row 3: Multipurpose Utility -->
      <rect x="495" y="295" width="262" height="24" fill="#0f172a" rx="3" stroke="#1e293b" stroke-width="1"/>
      <text x="505" y="311" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">생존 다목적 활용</text>
      <text x="745" y="311" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="end">식수 여과 / 불씨 보관</text>

      <!-- Row 4: Acoustic Ring Test -->
      <rect x="495" y="325" width="262" height="24" fill="#0f172a" rx="3" stroke="#1e293b" stroke-width="1"/>
      <text x="505" y="341" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">완성 판정 (Acoustic Ring)</text>
      <text x="745" y="341" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="end">맑은 쇳소리 &amp; 은빛 광택</text>

      <!-- Row 5: Yield per Batch -->
      <rect x="495" y="355" width="262" height="24" fill="#0f172a" rx="3" stroke="#1e293b" stroke-width="1"/>
      <text x="505" y="371" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">1회 가동 수확량</text>
      <text x="745" y="371" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="end">고급 숯 3~5kg (참나무)</text>
    </g>
  </g>

  <!-- Bottom Core Summary Banner -->
  <rect x="28" y="398" width="744" height="28" fill="#111827" rx="4" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="28" y="398" width="4" height="28" fill="#10b981" rx="1"/>
  <text x="400" y="416" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" text-anchor="middle">[핵심 공학] 흙구덩이 속 95% 공기 차단 ➔ 수분·타르만 방출하여 연기 없는 500℃ 고열 숯 생산</text>
</svg>
