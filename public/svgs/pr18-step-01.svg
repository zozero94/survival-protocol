<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d12" />
      <stop offset="100%" stop-color="#121720" />
    </linearGradient>
    <linearGradient id="skinGrad01" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d6a784" />
      <stop offset="50%" stop-color="#be8c68" />
      <stop offset="100%" stop-color="#8f6243" />
    </linearGradient>
    <linearGradient id="burlapGrad01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3c896" />
      <stop offset="50%" stop-color="#c4a46d" />
      <stop offset="100%" stop-color="#967745" />
    </linearGradient>
    <linearGradient id="potGrad01" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c4f36" />
      <stop offset="50%" stop-color="#b56a4c" />
      <stop offset="100%" stop-color="#5c311f" />
    </linearGradient>
    <linearGradient id="waterGrad01" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.3" />
    </linearGradient>
    <pattern id="burlapWeave01" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 0,3 L 6,3 M 3,0 L 3,6" stroke="#785c30" stroke-width="0.8" opacity="0.55" />
    </pattern>
    <filter id="shadow01" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background & Blueprint Grid -->
  <rect width="400" height="400" fill="url(#bgGrad01)" />
  <g stroke="#1e2633" stroke-width="0.6" opacity="0.6">
    <path d="M 0,80 L 400,80 M 0,160 L 400,160 M 0,240 L 400,240 M 0,320 L 400,320" />
    <path d="M 80,0 L 80,400 M 160,0 L 160,400 M 240,0 L 240,400 M 320,0 L 320,400" />
  </g>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#334155" stroke-width="1.2" />

  <!-- Header Banner -->
  <rect x="14" y="14" width="372" height="26" rx="3" fill="#131b26" stroke="#3b4d66" stroke-width="1" />

  <!-- Center Divider -->
  <line x1="196" y1="76" x2="196" y2="338" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,4" />

  <!-- LEFT PANEL: Wound Washing with Boiled Water & Ash Soap -->
  <g filter="url(#shadow01)">
    <!-- Tilted Clay Pot Pouring Warm Boiled Water -->
    <g transform="translate(68, 108) rotate(28)">
      <ellipse cx="0" cy="-18" rx="28" ry="8" fill="#3b2014" stroke="#d4896a" stroke-width="1.2" />
      <path d="M -28,-18 C -34,5 -26,26 0,28 C 26,26 34,5 28,-18 Z" fill="url(#potGrad01)" stroke="#d4896a" stroke-width="1" />
    </g>
    <!-- Wood-Ash Soap Block -->
    <rect x="122" y="96" width="44" height="26" rx="4" fill="#d6ccb8" stroke="#8c7f68" stroke-width="1.2" />
    <path d="M 128,104 L 158,104 M 128,112 L 152,112" stroke="#9e9178" stroke-width="1" />
    <circle cx="126" cy="126" r="4" fill="#e2e8f0" opacity="0.8" />
    <circle cx="136" cy="129" r="3" fill="#e2e8f0" opacity="0.7" />

    <!-- Water Stream Flushing Dirt off Forearm -->
    <path d="M 86,122 C 94,148 96,175 94,205" fill="none" stroke="url(#waterGrad01)" stroke-width="10" stroke-linecap="round" />
    <path d="M 83,126 C 90,152 92,175 90,202" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-dasharray="6,4" />

    <!-- Left Forearm Segment -->
    <path d="M 22,202 C 65,196 135,198 178,206 L 178,252 C 135,248 65,248 22,244 Z" fill="url(#skinGrad01)" stroke="#6e472b" stroke-width="1.5" />
    <!-- Cleaned Wound Area -->
    <ellipse cx="96" cy="218" rx="18" ry="6" fill="#b91c1c" stroke="#fca5a5" stroke-width="1" />
    <!-- Washed Dirt Particles Falling Below Arm -->
    <circle cx="88" cy="272" r="2.5" fill="#785c30" />
    <circle cx="98" cy="280" r="3" fill="#5c4320" />
    <circle cx="106" cy="270" r="2" fill="#785c30" />
    <path d="M 94,254 L 94,290" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3,3" />
  </g>

  <!-- RIGHT PANEL: 8-Layer Boiled Burlap Pad & 10-Min Direct Pressure -->
  <g filter="url(#shadow01)">
    <!-- Right Forearm Resting on Support Pad -->
    <rect x="218" y="250" width="156" height="16" rx="4" fill="#3f4d36" stroke="#657d56" stroke-width="1" />
    <path d="M 210,204 C 255,198 335,200 382,208 L 382,252 C 335,248 255,248 210,244 Z" fill="url(#skinGrad01)" stroke="#6e472b" stroke-width="1.5" />

    <!-- 1st Boiled 8-Layer Burlap Pad Directly on Wound -->
    <rect x="256" y="182" width="78" height="24" rx="3" fill="url(#burlapGrad01)" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="256" y="182" width="78" height="24" rx="3" fill="url(#burlapWeave01)" />
    <line x1="258" y1="188" x2="332" y2="188" stroke="#785c30" stroke-width="1" />
    <line x1="258" y1="194" x2="332" y2="194" stroke="#785c30" stroke-width="1" />
    <line x1="258" y1="200" x2="332" y2="200" stroke="#785c30" stroke-width="1" />

    <!-- 2nd Extra Pad Stacked on Top (Add-On Rule) -->
    <rect x="262" y="160" width="66" height="18" rx="3" fill="url(#burlapGrad01)" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3,2" />
    <rect x="262" y="160" width="66" height="18" rx="3" fill="url(#burlapWeave01)" />

    <!-- Pressing Palm & Downward Force Vectors (10 Min Direct Pressure) -->
    <path d="M 250,126 C 272,132 318,132 340,126 L 332,154 L 258,154 Z" fill="#d6a784" stroke="#fde68a" stroke-width="1.5" />
    <path d="M 276,96 L 276,144 M 270,136 L 276,146 L 282,136" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 314,96 L 314,144 M 308,136 L 314,146 L 320,136" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Callout Badges & Leader Lines -->
  <rect x="18" y="48" width="364" height="24" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <line x1="94" y1="72" x2="94" y2="96" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2,2" />

  <rect x="18" y="294" width="364" height="24" rx="3" fill="#1c1917" stroke="#f59e0b" stroke-width="1" />
  <line x1="295" y1="206" x2="295" y2="294" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2,2" />

  <rect x="18" y="324" width="364" height="24" rx="3" fill="#1c1917" stroke="#fbbf24" stroke-width="1" />

  <!-- Footer Summary Bar -->
  <rect x="14" y="356" width="372" height="30" rx="3" fill="#1e1b4b" stroke="#fde68a" stroke-width="1.2" />

  <!-- 5 SVG Text Labels (1:1 Matched with steps[0].svgLabels) -->
  <text x="200" y="31" fill="#fde68a" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">FIG. 01 // WOUND WASH &amp; DIRECT PRESSURE HEMOSTASIS</text>
  <text x="200" y="64" fill="#7dd3fc" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">끓여 식힌 정수 물과 잿물 비누로 상처 주변 흙먼지 씻어내기</text>
  <text x="200" y="310" fill="#fde68a" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">삶은 삼베 천 8겹 패드를 피 나는 곳에 대고 10분간 꾹 누르기</text>
  <text x="200" y="340" fill="#fcd34d" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">첫 패드가 젖으면 떼지 말고 위에 새 천 패드를 겹쳐 묶기</text>
  <text x="200" y="375" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">[1단계 핵심] 깨끗한 물 세척 후 10분 직접 압박으로 출혈 차단</text>
</svg>
