<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-04 [PRIMITIVE-STONE-AXE]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 02</text>

  <!-- 참나무 Y자 손잡이 (Hardwood Y-Haft) -->
  <!-- 메인 손잡이 몸체 -->
  <rect x="185" y="160" width="30" height="130" fill="#141414" stroke="#E5E5E5" stroke-width="2"/>
  <!-- Y자 갈래 좌측/우측 포크 -->
  <path d="M 185 160 Q 170 120 145 90 L 165 80 Q 195 115 200 140 Q 205 115 235 80 L 255 90 Q 230 120 215 160 Z" fill="#1A1A1A" stroke="#E5E5E5" stroke-width="2"/>

  <!-- 가공된 석기 도끼날 (결합 위치) -->
  <polygon points="120,110 200,60 280,110 230,170 170,170" fill="#262626" stroke="#FFFFFF" stroke-width="2"/>
  <!-- 날 부분 강조선 -->
  <path d="M 120 110 L 200 60 L 280 110" stroke="#FFFFFF" stroke-width="3"/>
  <text x="200" y="85" fill="#FFFFFF" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">AXE BLADE</text>

  <!-- 요철 결합 음각 가공 표시 (Notch Fit) -->
  <line x1="170" y1="170" x2="160" y2="190" stroke="#A3A3A3" stroke-width="1"/>
  <line x1="230" y1="170" x2="240" y2="190" stroke="#A3A3A3" stroke-width="1"/>
  <text x="200" y="200" fill="#E5E5E5" font-family="monospace" font-size="9" text-anchor="middle">FIRE-CARVED MORTISE SEAT</text>

  <!-- 손잡이 규격 치수 -->
  <line x1="225" y1="225" x2="265" y2="225" stroke="#737373" stroke-width="1"/>
  <text x="270" y="228" fill="#737373" font-family="monospace" font-size="9">Ø 3.5cm OAK</text>

  <!-- 압입 방향 화살표 (Downward Force) -->
  <line x1="200" y1="35" x2="200" y2="55" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="200,55 195,45 205,45" fill="#FFFFFF"/>
  <text x="200" y="30" fill="#FFFFFF" font-family="monospace" font-size="9" text-anchor="middle">PRESSURE FIT</text>

  <!-- 하단 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 02: Y-FORK NOTCH FIT &amp; CHARRED SEAT</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">SLIGHTLY CHAR WOOD INTERIOR TO MOLD NEGATIVE CAVITY EXACTLY TO BLADE</text>
</svg>
