<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-06 [SOLAR-STILL-WATER]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 02</text>

  <!-- 지표면 및 웅덩이 -->
  <line x1="40" y1="180" x2="80" y2="180" stroke="#404040" stroke-width="2"/>
  <line x1="320" y1="180" x2="360" y2="180" stroke="#404040" stroke-width="2"/>
  <path d="M 80 180 Q 140 280 200 280 Q 260 280 320 180" fill="#121212" stroke="#737373" stroke-width="1.5"/>

  <!-- 중앙 수거 토기 (Clay Collection Pot) -->
  <rect x="180" y="225" width="40" height="45" fill="#262626" stroke="#FFFFFF" stroke-width="2"/>
  <ellipse cx="200" cy="225" rx="20" ry="6" fill="#141414" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="200" y="252" fill="#E5E5E5" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">COLLECTION POT</text>

  <!-- 상단 수평 밀폐 시트 (Tarp / Large Leaf Membrane) -->
  <line x1="60" y1="180" x2="340" y2="180" stroke="#FFFFFF" stroke-width="2"/>

  <!-- 양 끝단 흙/모래 밀폐 둑 (Dirt/Sand Seal Bank) -->
  <polygon points="50,180 85,150 110,180" fill="#262626" stroke="#E5E5E5" stroke-width="1.5"/>
  <polygon points="290,180 315,150 350,180" fill="#262626" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="80" y="145" fill="#E5E5E5" font-family="monospace" font-size="9" text-anchor="middle">SOIL SEAL</text>
  <text x="320" y="145" fill="#E5E5E5" font-family="monospace" font-size="9" text-anchor="middle">AIR-TIGHT</text>

  <!-- 밀폐 압력 및 온도 상승 인디케이터 (55°C Greenhouse) -->
  <rect x="140" y="90" width="120" height="35" fill="#0A0A0A" stroke="#E5E5E5" stroke-width="1"/>
  <text x="200" y="105" fill="#FFFFFF" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">INTERNAL TEMP &gt; 55°C</text>
  <text x="200" y="118" fill="#A3A3A3" font-family="monospace" font-size="8" text-anchor="middle">SATURATED VAPOR PRESSURE</text>

  <!-- 하단 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 02: POT CENTERED &amp; PERIMETER AIRTIGHT SEAL</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">ANCHOR EDGES WITH WET SOIL; COMPLETE SEAL REQUIRED FOR 55°C VAPORIZATION</text>
</svg>
