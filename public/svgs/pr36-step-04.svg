<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg36s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="wood36s4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c3a21"/>
      <stop offset="50%" stop-color="#8c5a32"/>
      <stop offset="100%" stop-color="#4a2e19"/>
    </linearGradient>
    <linearGradient id="jelly36s4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <pattern id="grid36s4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow36s4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg36s4)"/>
  <rect width="400" height="400" fill="url(#grid36s4)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Label 1 -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 04 // 3~4시간 앙금 침전·햇볕 건조 &amp; 1:5~6 묵 끓이기</text>

  <!-- Label 2 -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9">나무 그릇 3~4시간 방치 후 맑은 윗물 따르기</text>

  <!-- Main Dual Stage Visual: Left = Settling White Starch + Sun Drying; Right = 1:5~6 Boiling Pot + Glossy Jelly -->
  <g filter="url(#shadow36s4)">
    <!-- Left Panel: Wooden Bowl Settling Starch & Clear Top Decant -->
    <path d="M 32 142 L 42 222 Q 46 238 106 238 Q 166 238 170 222 L 180 142 Z" fill="url(#wood36s4)" stroke="#a16207" stroke-width="2"/>
    <!-- Clear top water layer -->
    <path d="M 42 156 L 48 196 L 164 196 L 170 156 Z" fill="#0ea5e9" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1"/>
    <!-- Heavy settled white starch cake bottom -->
    <path d="M 48 198 L 52 220 Q 56 230 106 230 Q 156 230 160 220 L 164 198 Z" fill="#fefce8" stroke="#fde047" stroke-width="1.2"/>
    <!-- Decant pour arrow -->
    <path d="M 164 166 Q 192 148 202 182" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="196,178 203,188 207,177" fill="#38bdf8"/>

    <!-- Sun Symbol Above Drying Cake -->
    <circle cx="106" cy="106" r="12" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5"/>
    <path d="M 106 88 L 106 92 M 106 120 L 106 124 M 88 106 L 92 106 M 120 106 L 124 106" stroke="#fde047" stroke-width="1.8"/>
    <!-- Sun-dried powder stone plate bottom left -->
    <ellipse cx="106" cy="268" rx="64" ry="12" fill="#475569" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 74 268 Q 106 250 138 268 Z" fill="#fefce8" stroke="#d97706" stroke-width="1"/>

    <!-- Center Flow Arrow -->
    <line x1="186" y1="210" x2="218" y2="210" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <polygon points="212,204 224,210 212,216" fill="#f59e0b"/>

    <!-- Right Panel: Boiling Pot (1:5~6) + Wooden Stirring Paddle + Final Jelly Block -->
    <path d="M 232 148 L 240 224 Q 244 236 296 236 Q 348 236 352 224 L 360 148 Z" fill="url(#wood36s4)" stroke="#92400e" stroke-width="2.2"/>
    <ellipse cx="296" cy="170" rx="54" ry="10" fill="url(#jelly36s4)" stroke="#b45309" stroke-width="1.5"/>
    <!-- Wooden Paddle Stirring -->
    <line x1="296" y1="102" x2="296" y2="178" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
    <!-- Hearth Embers Under Pot -->
    <ellipse cx="278" cy="244" rx="12" ry="6" fill="#f97316"/>
    <ellipse cx="298" cy="246" rx="14" ry="6" fill="#ef4444"/>
    <ellipse cx="316" cy="244" rx="12" ry="6" fill="#f97316"/>

    <!-- Final Acorn Jelly Block on Green Leaf -->
    <ellipse cx="296" cy="274" rx="58" ry="12" fill="#15803d" stroke="#22c55e" stroke-width="1.2"/>
    <polygon points="266,268 312,268 326,254 280,254" fill="#b45309" stroke="#f59e0b" stroke-width="1"/>
    <polygon points="266,268 312,268 312,276 266,276" fill="#78350f"/>
    <polygon points="312,268 326,254 326,262 312,276" fill="#451a03"/>
  </g>

  <!-- Label 3 -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="315" fill="#fef08a" font-family="monospace" font-size="9">바닥 하얀 전분 앙금 햇볕 건조 시 1년+ 장기 보존</text>

  <!-- Label 4 -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#1e1b18" stroke="#d97706" stroke-width="1"/>
  <text x="24" y="344" fill="#fed7aa" font-family="monospace" font-size="9">도토리 가루 1 : 물 5~6 넣고 윤기 날 때까지 저어 끓임</text>

  <!-- Label 5 -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="376" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">[핵심] 앙금 건조로 장기 비상식, 끓여 식히면 쫀득한 묵</text>
</svg>