<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d0e"/>
      <stop offset="100%" stop-color="#14171a"/>
    </linearGradient>

    <!-- Haft Wood Texture -->
    <linearGradient id="haftWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d2c1d"/>
      <stop offset="35%" stop-color="#694e36"/>
      <stop offset="70%" stop-color="#523c28"/>
      <stop offset="100%" stop-color="#2b1e12"/>
    </linearGradient>

    <!-- Stone Axe Head (Chert / Basalt Flint) -->
    <linearGradient id="flintStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#474747"/>
      <stop offset="40%" stop-color="#2e2e2e"/>
      <stop offset="80%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>

    <!-- Pine Pitch Resin Glue -->
    <linearGradient id="pitchResin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1106"/>
      <stop offset="50%" stop-color="#42290d"/>
      <stop offset="100%" stop-color="#0f0802"/>
    </linearGradient>

    <!-- Raw Vine Lashing -->
    <linearGradient id="vineLashing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8895b"/>
      <stop offset="50%" stop-color="#7a623e"/>
      <stop offset="100%" stop-color="#4f3e26"/>
    </linearGradient>
  </defs>

  <!-- Canvas Backdrop -->
  <rect x="0" y="0" width="800" height="450" fill="url(#bgGrad4)"/>
  <rect x="15" y="15" width="770" height="420" fill="none" stroke="#222222" stroke-width="1"/>

  <!-- Crosshairs -->
  <path d="M 25 35 L 45 35 M 35 25 L 35 45" stroke="#444" stroke-width="1"/>
  <path d="M 775 35 L 755 35 M 765 25 L 765 45" stroke="#444" stroke-width="1"/>
  <path d="M 25 415 L 45 415 M 35 405 L 35 425" stroke="#444" stroke-width="1"/>
  <path d="M 775 415 L 755 415 M 765 405 L 765 425" stroke="#444" stroke-width="1"/>

  <!-- Title & Top Metrics -->
  <text x="35" y="55" fill="#555" font-family="monospace" font-size="10" letter-spacing="1">ARCHIVE // OUTCOME SPECIFICATION</text>
  <text x="35" y="70" fill="#E02424" font-family="monospace" font-size="11" font-weight="bold">TARGET: PRIMITIVE STONE AXE [BIFACIAL CHERT]</text>
  <text x="765" y="55" fill="#555" font-family="monospace" font-size="10" text-anchor="end">TENSILE RATING: 80 KGF</text>

  <!-- Left Spec Box -->
  <g id="specBoxLeft" font-family="monospace" font-size="10">
    <rect x="45" y="100" width="180" height="155" fill="#141414" stroke="#333" stroke-width="1"/>
    <rect x="45" y="100" width="180" height="22" fill="#1f1f1f"/>
    <text x="55" y="115" fill="#E02424" font-weight="bold">AXE SPECIFICATIONS</text>
    <text x="55" y="140" fill="#aaa">· STONE: RIVER BASALT/FLINT</text>
    <text x="55" y="160" fill="#aaa">· BEVEL: 35° BIFACE EDGE</text>
    <text x="55" y="180" fill="#aaa">· HAFT: DRIED OAK / HICKORY</text>
    <text x="55" y="200" fill="#aaa">· BINDING: X-CROSS VINE</text>
    <text x="55" y="220" fill="#aaa">· RESIN: PINE PITCH + ASH</text>
    <text x="55" y="240" fill="#38bdf8">· CHOPPING EFF: 10 CM / 5 MIN</text>
  </g>

  <!-- Shadow Under Stone Axe -->
  <ellipse cx="440" cy="380" rx="200" ry="16" fill="#050505" opacity="0.9"/>

  <!-- Complete Stone Axe Assembly -->
  <g id="axeAssembly" transform="rotate(-15 420 250)">
    <!-- Wooden Haft Handle (Diagonal Solid Club) -->
    <path d="M 280 230 C 310 232 440 242 560 250 C 585 252 600 256 600 268 C 600 280 580 282 560 280 C 440 270 310 255 280 250 Z" fill="url(#haftWood)" stroke="#1a120b" stroke-width="2"/>

    <!-- Forked Cleft / Socket at Head End -->
    <path d="M 285 220 C 265 215 250 200 250 185 L 295 190 C 295 210 285 220 285 220 Z" fill="#241a10" stroke="#120c07" stroke-width="1.5"/>

    <!-- Chipped Basalt/Flint Stone Axe Blade Head -->
    <polygon points="210,135 295,155 315,225 240,240 185,190" fill="url(#flintStone)" stroke="#111111" stroke-width="2"/>
    <!-- Chipping Facets & Flaking Edges (Realistic Bifacial Flakes) -->
    <polygon points="210,135 250,155 235,175 195,160" fill="#3d3d3d" stroke="#222" stroke-width="1"/>
    <polygon points="250,155 295,155 280,185 235,175" fill="#4d4d4d" stroke="#222" stroke-width="1"/>
    <polygon points="195,160 235,175 225,210 185,190" fill="#262626" stroke="#111" stroke-width="1"/>
    <polygon points="235,175 280,185 270,220 225,210" fill="#363636" stroke="#222" stroke-width="1"/>
    <polygon points="280,185 315,225 270,220" fill="#1f1f1f" stroke="#111" stroke-width="1"/>
    <!-- Razor-Sharp Front Cutting Edge Highlight -->
    <path d="M 210 135 L 185 190 L 240 240" fill="none" stroke="#e0e0e0" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Black Pine Pitch Resin Adhesive Layer Sealing Socket -->
    <ellipse cx="285" cy="225" rx="30" ry="20" fill="url(#pitchResin)" opacity="0.95"/>

    <!-- Tight Criss-Cross Vine / Rawhide Lashings (X-Lashing Pattern) -->
    <g stroke="url(#vineLashing)" stroke-width="3.5" stroke-linecap="round">
      <!-- Diagonal Forward Turns -->
      <line x1="260" y1="210" x2="310" y2="255"/>
      <line x1="265" y1="205" x2="315" y2="250"/>
      <line x1="270" y1="200" x2="320" y2="245"/>
      <!-- Diagonal Backward Turns (Crossing to form X) -->
      <line x1="310" y1="210" x2="260" y2="255"/>
      <line x1="315" y1="205" x2="265" y2="250"/>
      <line x1="320" y1="200" x2="270" y2="245"/>
      <!-- Tight Frapping Turns Around Socket Base -->
      <line x1="280" y1="250" x2="280" y2="265" stroke-width="4"/>
      <line x1="288" y1="248" x2="288" y2="263" stroke-width="4"/>
    </g>

    <!-- Handle Grip Carvings / Notches -->
    <line x1="520" y1="248" x2="520" y2="276" stroke="#241a10" stroke-width="1.5"/>
    <line x1="535" y1="250" x2="535" y2="278" stroke="#241a10" stroke-width="1.5"/>
    <line x1="550" y1="252" x2="550" y2="280" stroke="#241a10" stroke-width="1.5"/>
  </g>

  <!-- Technical Callouts (Right Side) -->
  <g id="calloutsRight" font-family="monospace" font-size="10" fill="#cccccc">
    <!-- Callout 1: Stone Blade -->
    <line x1="260" y1="140" x2="565" y2="140" stroke="#E02424" stroke-width="1"/>
    <circle cx="260" cy="140" r="2" fill="#E02424"/>
    <text x="570" y="137" fill="#E02424" font-weight="bold">CHIPPED BIFACE STONE BLADE</text>
    <text x="570" y="150" fill="#888888">양면 박편 타제로 세운 35도 예리한 절삭날</text>

    <!-- Callout 2: Resin Seal -->
    <line x1="350" y1="210" x2="565" y2="210" stroke="#666" stroke-width="1"/>
    <circle cx="350" cy="210" r="2" fill="#666"/>
    <text x="570" y="207" fill="#ffffff" font-weight="bold">PINE PITCH COMPOSITE SEAL</text>
    <text x="570" y="220" fill="#888888">송진과 숯가루 혼합재로 유격 100% 밀봉</text>

    <!-- Callout 3: Cross Lashing -->
    <line x1="330" y1="280" x2="565" y2="280" stroke="#666" stroke-width="1"/>
    <circle cx="330" cy="280" r="2" fill="#666"/>
    <text x="570" y="277" fill="#ffffff" font-weight="bold">X-CROSS VINE LASHING</text>
    <text x="570" y="290" fill="#888888">충격을 흡수 분산하는 십자 결속 및 프래핑</text>

    <!-- Callout 4: Oak Haft -->
    <line x1="490" y1="340" x2="565" y2="340" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="490" cy="340" r="2" fill="#38bdf8"/>
    <text x="570" y="337" fill="#38bdf8" font-weight="bold">HARDENED OAK HAFT</text>
    <text x="570" y="350" fill="#888888">불에 그슬려 경화한 묵직한 참나무 손잡이</text>
  </g>
</svg>
