<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg37out" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="wood37out" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <pattern id="grid37out" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow37out" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg37out)"/>
  <rect width="800" height="450" fill="url(#grid37out)"/>
  <rect x="10" y="10" width="780" height="430" fill="none" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Top Header Banner (Label 1) -->
  <rect x="20" y="20" width="760" height="38" rx="3" fill="#18181b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="36" y="44" fill="#f4f4f5" font-family="monospace" font-size="11.5" font-weight="bold">PR-37 완성체 // 각목 지렛대 &amp; 우물정(井) 괴임 붕괴 구조</text>

  <!-- 4 Stage Cards -->
  <g filter="url(#shadow37out)">
    <!-- STAGE 01 -->
    <rect x="20" y="74" width="178" height="296" rx="4" fill="#0f1014" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="28" y="84" width="162" height="28" rx="2" fill="#18181b" stroke="#d97706" stroke-width="1"/>
    <text x="34" y="102" fill="#f59e0b" font-family="monospace" font-size="8.5" font-weight="bold">STAGE 01: 받침점 · 지렛대</text>

    <rect x="34" y="248" width="150" height="10" fill="#334155"/>
    <rect x="38" y="180" width="54" height="54" fill="#475569" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="100" y="232" width="18" height="16" fill="#d97706" stroke="#fde047"/>
    <polygon points="82,236 178,200 180,208 84,244" fill="url(#wood37out)" stroke="#fef08a"/>
    <line x1="168" y1="176" x2="168" y2="196" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="163,192 168,200 173,192" fill="#f59e0b"/>

    <rect x="28" y="316" width="162" height="42" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
    <text x="34" y="341" fill="#94a3b8" font-family="monospace" font-size="8">단단한 바닥 + 잔해 코앞 받침</text>

    <!-- STAGE 02 -->
    <rect x="214" y="74" width="178" height="296" rx="4" fill="#0f1014" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="222" y="84" width="162" height="28" rx="2" fill="#18181b" stroke="#0284c7" stroke-width="1"/>
    <text x="228" y="102" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">STAGE 02: 우물정(井) 기초</text>

    <rect x="242" y="242" width="122" height="12" fill="url(#wood37out)" stroke="#451a03"/>
    <rect x="256" y="228" width="18" height="14" fill="#f59e0b" stroke="#451a03"/>
    <rect x="330" y="228" width="18" height="14" fill="#f59e0b" stroke="#451a03"/>
    <rect x="242" y="214" width="122" height="14" fill="url(#wood37out)" stroke="#451a03"/>
    <rect x="256" y="200" width="18" height="14" fill="#f59e0b" stroke="#451a03"/>
    <rect x="330" y="200" width="18" height="14" fill="#f59e0b" stroke="#451a03"/>
    <rect x="242" y="186" width="122" height="14" fill="url(#wood37out)" stroke="#451a03"/>
    <circle cx="348" cy="146" r="10" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <polyline points="343,146 347,150 353,142" fill="none" stroke="#86efac" stroke-width="2"/>

    <rect x="222" y="316" width="162" height="42" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
    <text x="228" y="341" fill="#94a3b8" font-family="monospace" font-size="8">네모 각목 90도 교차 탑 쌓기</text>

    <!-- STAGE 03 -->
    <rect x="408" y="74" width="178" height="296" rx="4" fill="#0f1014" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="416" y="84" width="162" height="28" rx="2" fill="#18181b" stroke="#dc2626" stroke-width="1"/>
    <text x="422" y="102" fill="#ef4444" font-family="monospace" font-size="8.5" font-weight="bold">STAGE 03: 2~3cm 들고 괴기</text>

    <rect x="430" y="158" width="94" height="26" fill="#475569" stroke="#cbd5e1"/>
    <line x1="477" y1="152" x2="477" y2="132" stroke="#22c55e" stroke-width="2.5"/>
    <polygon points="472,136 477,128 482,136" fill="#22c55e"/>
    <polygon points="452,196 508,196 508,186" fill="#fde047"/>
    <polygon points="452,186 508,186 452,196" fill="#d97706"/>
    <rect x="444" y="198" width="66" height="44" fill="url(#wood37out)" stroke="#451a03"/>
    <rect x="526" y="186" width="46" height="8" fill="#a16207"/>
    <line x1="524" y1="142" x2="524" y2="252" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="4 3"/>

    <rect x="416" y="316" width="162" height="42" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
    <text x="422" y="341" fill="#94a3b8" font-family="monospace" font-size="8">손 안 넣고 바깥서 쐐기·각목 밀기</text>

    <!-- STAGE 04 -->
    <rect x="602" y="74" width="178" height="296" rx="4" fill="#0f1014" stroke="#10b981" stroke-width="1.2"/>
    <rect x="610" y="84" width="162" height="28" rx="2" fill="#18181b" stroke="#059669" stroke-width="1"/>
    <text x="616" y="102" fill="#10b981" font-family="monospace" font-size="8.5" font-weight="bold">STAGE 04: 단독 지지 · 구조</text>

    <rect x="622" y="156" width="138" height="22" fill="#475569" stroke="#cbd5e1"/>
    <rect x="626" y="178" width="32" height="72" fill="url(#wood37out)" stroke="#451a03"/>
    <rect x="724" y="178" width="32" height="72" fill="url(#wood37out)" stroke="#451a03"/>
    <rect x="664" y="184" width="54" height="62" fill="#052e16" fill-opacity="0.4" stroke="#22c55e" stroke-dasharray="3 2"/>
    <line x1="674" y1="224" x2="708" y2="224" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="704,220 712,224 704,228" fill="#38bdf8"/>

    <rect x="610" y="316" width="162" height="42" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
    <text x="616" y="341" fill="#94a3b8" font-family="monospace" font-size="8">지렛대 빼도 버틴 뒤 지혈·탈출</text>
  </g>

  <!-- Bottom Core Principle Banner (Label 10) -->
  <rect x="20" y="388" width="760" height="42" rx="3" fill="#18181b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="36" y="413" fill="#fef08a" font-family="monospace" font-size="10.5" font-weight="bold">[공학 원리] 2~3cm 증분 괴임과 4점 우물정 하중 분산으로 지렛대 사고 시에도 낙하 차단</text>
</svg>