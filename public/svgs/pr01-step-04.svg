<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradP04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b"/>
      <stop offset="50%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>

    <!-- Water Drop Gradient -->
    <linearGradient id="clearWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Turbid Inflow Water -->
    <linearGradient id="muddyWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Pebble 3D Gradient -->
    <linearGradient id="pebbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="50%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowP04" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="400" height="400" fill="url(#bgGradP04)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#22262c" stroke-width="1"/>

  <!-- Technical Corner Crosshairs -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#374151" stroke-width="1"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#374151" stroke-width="1"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#374151" stroke-width="1"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#374151" stroke-width="1"/>

  <!-- Blueprint Header (Label 1) -->
  <text x="24" y="28" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="0.5">FIG. 04 // PURIFICATION STEP 4: 자갈층 및 초기 세척</text>
  <line x1="24" y1="36" x2="376" y2="36" stroke="#262d35" stroke-width="1"/>

  <!-- Funnel Outline -->
  <polygon points="120,85 240,85 195,275 165,275" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 2"/>
  <path d="M 120 85 L 165 275 L 195 275 L 240 85" fill="none" stroke="#374151" stroke-width="3"/>

  <!-- Inflow Muddy Water Stream -->
  <path d="M 180 55 C 180 75 170 85 170 95" stroke="url(#muddyWater)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <polygon points="180,50 176,58 184,58" fill="#78350f"/>

  <!-- Top Pebble Bed (4cm) -->
  <polygon points="125,95 235,95 222,140 138,140" fill="#2d333b" stroke="#1f242c" stroke-width="1" filter="url(#shadowP04)"/>
  <!-- 3D Pebbles -->
  <ellipse cx="145" cy="115" rx="9" ry="6" fill="url(#pebbleGrad)" stroke="#111827" stroke-width="0.8"/>
  <ellipse cx="165" cy="110" rx="10" ry="7" fill="url(#pebbleGrad)" stroke="#111827" stroke-width="0.8"/>
  <ellipse cx="185" cy="116" rx="8" ry="6" fill="url(#pebbleGrad)" stroke="#111827" stroke-width="0.8"/>
  <ellipse cx="205" cy="112" rx="11" ry="7" fill="url(#pebbleGrad)" stroke="#111827" stroke-width="0.8"/>
  <ellipse cx="155" cy="128" rx="8" ry="5" fill="url(#pebbleGrad)" stroke="#111827" stroke-width="0.8"/>
  <ellipse cx="178" cy="130" rx="9" ry="6" fill="url(#pebbleGrad)" stroke="#111827" stroke-width="0.8"/>
  <ellipse cx="198" cy="126" rx="8" ry="5" fill="url(#pebbleGrad)" stroke="#111827" stroke-width="0.8"/>

  <!-- Mid Sand Layer -->
  <polygon points="138,140 222,140 208,195 152,195" fill="#785934" stroke="#92400e" stroke-width="1"/>
  <!-- Charcoal Bed -->
  <polygon points="152,195 208,195 194,255 166,255" fill="#181c22" stroke="#111827" stroke-width="1"/>
  <!-- Moss Plug -->
  <polygon points="166,255 194,255 190,275 170,275" fill="#14532d" stroke="#22c55e" stroke-width="1"/>

  <!-- Water Dripping Mechanism at Bottom Spout -->
  <circle cx="180" cy="285" r="3.5" fill="url(#clearWater)"/>
  <path d="M 180 292 C 182 297 182 301 180 304 C 178 301 178 297 180 292" fill="url(#clearWater)"/>

  <!-- Dual Cup Flushing Scheme (Right Inset) -->
  <g id="flushingCups">
    <!-- Cup 1: Dirty Black Flush Cup (DISCARD) -->
    <rect x="290" y="210" width="30" height="35" rx="3" fill="#181c22" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="294" y="218" width="22" height="23" fill="#0f1216"/>
    <!-- Red X mark -->
    <path d="M 299 224 L 311 236 M 311 224 L 299 236" stroke="#ef4444" stroke-width="2"/>

    <!-- Arrow from discard to clean -->
    <path d="M 325 228 L 338 228" stroke="#9ca3af" stroke-width="1.5"/>
    <polygon points="340,228 334,225 334,231" fill="#9ca3af"/>

    <!-- Cup 2: Crystal Clean Water Cup (COLLECT) -->
    <rect x="345" y="210" width="30" height="35" rx="3" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="349" y="222" width="22" height="19" fill="#0284c7" opacity="0.6"/>
    <!-- Green Check mark -->
    <path d="M 353 230 L 358 235 L 367 225" stroke="#22c55e" stroke-width="2" fill="none"/>
  </g>

  <!-- Technical Callouts -->
  <!-- Callout 1: Pebble Layer (Label 2) -->
  <line x1="165" y1="120" x2="115" y2="75" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="165" cy="120" r="2.5" fill="#f59e0b"/>
  <text x="24" y="70" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold">PEBBLE LAYER (자갈층)</text>

  <!-- Callout 2: Flush First Cups (Label 3) -->
  <text x="376" y="70" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="end">FLUSH FIRST CUPS (첫물 버리기)</text>

  <!-- Callout 3: Clear Drip (Label 4) -->
  <line x1="185" y1="298" x2="285" y2="165" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="185" cy="298" r="2.5" fill="#38bdf8"/>
  <text x="376" y="165" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="end">CLEAR DRIP (맑은 물 방울)</text>

  <!-- Bottom Tactical Note Strip -->
  <rect x="18" y="340" width="364" height="34" fill="#111419" stroke="#262d35" stroke-width="1"/>
  <rect x="18" y="340" width="4" height="34" fill="#38bdf8"/>
  <!-- Label 5: Step Core Instruction -->
  <text x="32" y="361" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">[4단계 핵심] 자갈로 수압 분산 후 첫 1~2컵 버리기</text>
</svg>
