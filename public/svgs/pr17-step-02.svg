<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg1702" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#0e1319"/>
    </linearGradient>
    <linearGradient id="oakBarkRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="tanninTeaLiquor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="stoneAnvil17" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="drop1702" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="grid1702" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16202c" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg1702)"/>
  <rect width="400" height="400" fill="url(#grid1702)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#253342" stroke-width="1"/>

  <!-- Top Header (Label 1) -->
  <rect x="16" y="14" width="368" height="28" rx="2" fill="#0f1722" stroke="#2c3e50" stroke-width="1"/>
  <text x="24" y="32" fill="#fde68a" font-family="monospace" font-size="10.0" font-weight="bold">FIG. 02 // OAK BARK CRUSHING &amp; COLD ASTRINGENT LIQUOR</text>

  <!-- Main 3D Illustration: Stone Bark Crushing (Left) & Cold Tannin Liquor Vat (Right) -->
  <g filter="url(#drop1702)">
    <!-- Left: Flat Granite Anvil & Hammerstone Crushing Oak Inner Bark -->
    <ellipse cx="110" cy="242" rx="68" ry="24" fill="url(#stoneAnvil17)" stroke="#94a3b8" stroke-width="1.3"/>
    <!-- Fibrous Red Oak Inner Bark Chips (1~2cm) -->
    <polygon points="75,232 95,222 108,236 84,244" fill="url(#oakBarkRed)" stroke="#f87171" stroke-width="0.9"/>
    <polygon points="105,228 128,220 138,234 114,242" fill="url(#oakBarkRed)" stroke="#f87171" stroke-width="0.9"/>
    <polygon points="88,242 115,236 125,248 96,252" fill="url(#oakBarkRed)" stroke="#f87171" stroke-width="0.9"/>
    <polygon points="122,235 145,228 152,240 130,248" fill="url(#oakBarkRed)" stroke="#f87171" stroke-width="0.9"/>

    <!-- Hammerstone Striking Downward -->
    <ellipse cx="110" cy="148" rx="34" ry="26" fill="url(#stoneAnvil17)" stroke="#cbd5e1" stroke-width="1.3"/>
    <path d="M 110 178 L 110 212" stroke="#fde68a" stroke-width="2.2" stroke-dasharray="4 2"/>
    <polygon points="110,218 104,208 116,208" fill="#fde68a"/>

    <!-- Right: Boiled & Completely Cooled Dark Crimson Tannin Liquor Pot -->
    <path d="M 218 138 L 362 138 L 344 260 C 340 272 325 278 290 278 C 255 278 240 272 236 260 Z" fill="url(#tanninTeaLiquor)" stroke="#ea580c" stroke-width="1.4"/>
    <ellipse cx="290" cy="138" rx="72" ry="15" fill="#450a0a" stroke="#f97316" stroke-width="1.2"/>

    <!-- Steeped Bark Chips & Cool Temperature Indicator (Snowflake/Cool Rings) -->
    <circle cx="268" cy="215" r="5" fill="#991b1b" stroke="#f87171" stroke-width="0.8"/>
    <circle cx="295" cy="230" r="6" fill="#991b1b" stroke="#f87171" stroke-width="0.8"/>
    <circle cx="318" cy="212" r="5" fill="#991b1b" stroke="#f87171" stroke-width="0.8"/>
    <!-- Cool Stream Temperature Wave Lines -->
    <path d="M 252 175 Q 270 168 290 175 T 328 175" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 258 192 Q 275 185 290 192 T 322 192" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
  </g>

  <!-- Label 2 -->
  <rect x="20" y="60" width="360" height="22" rx="2" fill="#141a23" stroke="#334155" stroke-width="1"/>
  <text x="28" y="75" fill="#fde68a" font-family="monospace" font-size="8.5" font-weight="bold">참나무 붉은 속껍질을 주먹돌로 엄지손톱 크기 짓이기기</text>

  <!-- Label 3 -->
  <rect x="20" y="295" width="360" height="22" rx="2" fill="#141a23" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="28" y="310" fill="#f59e0b" font-family="monospace" font-size="8.5" font-weight="bold">토기에 1시간 푹 끓여 진한 홍차빛 떫은 물 우려내기</text>

  <!-- Label 4 -->
  <rect x="20" y="330" width="360" height="22" rx="2" fill="#141a23" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="28" y="345" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">차갑게 식힌 뒤 첫날용 1:1 연한 갈색 물 세팅</text>

  <!-- Label 5 -->
  <rect x="16" y="368" width="368" height="22" rx="2" fill="#1e293b" stroke="#e02424" stroke-width="1"/>
  <text x="24" y="383" fill="#ffffff" font-family="monospace" font-size="9.0" font-weight="bold">[2단계 핵심] 가죽이 익지 않도록 100% 차갑게 식혀서 사용</text>
</svg>