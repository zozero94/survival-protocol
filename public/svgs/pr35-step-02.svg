<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg35s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="ceramic35s2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="bag35s2" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>
    <pattern id="grid35s2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow35s2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg35s2)"/>
  <rect width="400" height="400" fill="url(#grid35s2)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Label 1 -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 02 // 양변기 급수 차단 + 배수 목 2겹 물주머니 마개 끼움</text>

  <!-- Label 2 -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#2d0607" stroke="#ef4444" stroke-width="1"/>
  <text x="24" y="64" fill="#fca5a5" font-family="monospace" font-size="9.5">변기 뒤쪽 급수 밸브 잠그고 물내림 레버 사용 금지</text>

  <!-- Main Cross-Section Diagram: Toilet Bowl + Closed Supply Valve + Conforming Double-Layer Water Plug -->
  <g filter="url(#shadow35s2)">
    <!-- Wall Water Supply Shutoff Valve LOCKED -->
    <line x1="68" y1="158" x2="112" y2="158" stroke="#64748b" stroke-width="8"/>
    <circle cx="72" cy="158" r="14" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <line x1="65" y1="151" x2="79" y2="165" stroke="#fca5a5" stroke-width="2.5"/>
    <line x1="79" y1="151" x2="65" y2="165" stroke="#fca5a5" stroke-width="2.5"/>

    <!-- Ceramic Tank & Bowl Cross-Section -->
    <rect x="112" y="96" width="52" height="82" rx="4" fill="url(#ceramic35s2)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Bowl Rim & Drain Throat -->
    <path d="M 164 156 L 288 156 Q 288 228 240 242 L 240 278 L 154 278 L 154 224 Q 164 196 164 156 Z" fill="url(#ceramic35s2)" stroke="#f8fafc" stroke-width="2"/>
    <!-- Dark Interior Cavity of Bowl & S-Trap Throat -->
    <path d="M 176 166 L 274 166 Q 272 216 232 230 L 232 276 L 194 276 L 194 228 Q 178 210 176 166 Z" fill="#18181b"/>

    <!-- Muddy Backflow Sewer Pressure Blocked Below Plug -->
    <rect x="195" y="246" width="36" height="30" fill="#78350f"/>
    <line x1="213" y1="274" x2="213" y2="252" stroke="#ef4444" stroke-width="2.5"/>
    <polygon points="213,246 208,255 218,255" fill="#ef4444"/>

    <!-- Double-Layered Half-Filled Conformable Water-Bag Plug Wedged Snugly into Drain Throat -->
    <ellipse cx="215" cy="224" rx="28" ry="20" fill="url(#bag35s2)" stroke="#bae6fd" stroke-width="2.2"/>
    <!-- Double Outer Layer Rim Ring & Twisted Gooseneck Top Knot -->
    <ellipse cx="215" cy="224" rx="29" ry="21" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 2"/>
    <path d="M 210 205 L 204 186 L 222 186 L 218 205 Z" fill="#0369a1" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="213" cy="184" r="6" fill="#0284c7" stroke="#fde047" stroke-width="1.5"/>

    <!-- Green Downward Insertion Seating Vector -->
    <line x1="215" y1="120" x2="215" y2="168" stroke="#4ade80" stroke-width="2.5"/>
    <polygon points="215,174 210,165 220,165" fill="#4ade80"/>
  </g>

  <!-- Label 3 -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="315" fill="#cbd5e1" font-family="monospace" font-size="9">중간 봉투 2겹에 물 절반(50%) 채워 둥근 마개 제작</text>

  <!-- Label 4 -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#0f291e" stroke="#22c55e" stroke-width="1"/>
  <text x="24" y="344" fill="#86efac" font-family="monospace" font-size="9">변기 배수 굴곡 목에 밀착 끼워 역류 수압 차단</text>

  <!-- Label 5 -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="376" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">[핵심] 말랑한 물주머니 마개가 도자기 곡면 틈을 100% 밀폐</text>
</svg>