<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto" width="800" height="450">
  <defs>
    <!-- Dark Tactical Backdrop -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0c"/>
      <stop offset="100%" stop-color="#151313"/>
    </linearGradient>

    <!-- Wood Shading -->
    <linearGradient id="hearthWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d2d1e"/>
      <stop offset="40%" stop-color="#694d34"/>
      <stop offset="70%" stop-color="#4d3725"/>
      <stop offset="100%" stop-color="#2b1f14"/>
    </linearGradient>
    <linearGradient id="spindleWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#594432"/>
      <stop offset="50%" stop-color="#806248"/>
      <stop offset="100%" stop-color="#403022"/>
    </linearGradient>
    <linearGradient id="bearingBlock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#735c45"/>
      <stop offset="100%" stop-color="#3b2d1e"/>
    </linearGradient>

    <!-- Hot Glowing Ember & Fire Gradients -->
    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#dc2626" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="75%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Smoke Effect Filter -->
    <filter id="smokeBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Technical Canvas Backdrop -->
  <rect x="0" y="0" width="800" height="450" fill="url(#bgGrad2)"/>
  <rect x="15" y="15" width="770" height="420" fill="none" stroke="#222222" stroke-width="1"/>

  <!-- Crosshairs -->
  <path d="M 25 35 L 45 35 M 35 25 L 35 45" stroke="#444" stroke-width="1"/>
  <path d="M 775 35 L 755 35 M 765 25 L 765 45" stroke="#444" stroke-width="1"/>
  <path d="M 25 415 L 45 415 M 35 405 L 35 425" stroke="#444" stroke-width="1"/>
  <path d="M 775 415 L 755 415 M 765 405 L 765 425" stroke="#444" stroke-width="1"/>

  <!-- Title & Top Metrics -->
  <text x="35" y="55" fill="#555" font-family="monospace" font-size="10" letter-spacing="1">ARCHIVE // OUTCOME SPECIFICATION</text>
  <text x="35" y="70" fill="#E02424" font-family="monospace" font-size="11" font-weight="bold">TARGET: BOW DRILL FRICTION FIRE [EMBER IGNITION]</text>
  <text x="765" y="55" fill="#555" font-family="monospace" font-size="10" text-anchor="end">CORE TEMP: 400°C+</text>

  <!-- Left Spec Box -->
  <g id="specBoxLeft" font-family="monospace" font-size="10">
    <rect x="45" y="100" width="185" height="155" fill="#141414" stroke="#333" stroke-width="1"/>
    <rect x="45" y="100" width="185" height="22" fill="#1f1f1f"/>
    <text x="55" y="115" fill="#E02424" font-weight="bold">FRICTION MECHANICS</text>
    <text x="55" y="140" fill="#aaa">· NOTCH ANGLE: 45° V-CUT</text>
    <text x="55" y="160" fill="#aaa">· SPINDLE RPM: 400-600</text>
    <text x="55" y="180" fill="#aaa">· EMBER COLOR: DENSE CHERRY</text>
    <text x="55" y="200" fill="#aaa">· TINDER PREP: DRIED BAST</text>
    <text x="55" y="220" fill="#aaa">· COAL DUST: BLACK GRAPHITE</text>
    <text x="55" y="240" fill="#f97316">· BLOWING: GENTLE LONG BREATH</text>
  </g>

  <!-- Ground Plane Shadow -->
  <ellipse cx="430" cy="390" rx="260" ry="22" fill="#050505" opacity="0.9"/>

  <!-- Hearth Board (받침 판재) -->
  <g id="hearthBoard">
    <!-- Main Plank Slab (Isometric 3D) -->
    <polygon points="260,335 480,335 460,375 240,375" fill="url(#hearthWood)" stroke="#1a140d" stroke-width="2"/>
    <polygon points="240,375 460,375 460,395 240,395" fill="#241a10" stroke="#1a140d" stroke-width="2"/>
    <polygon points="460,375 480,335 480,355 460,395" fill="#1f160e" stroke="#1a140d" stroke-width="2"/>

    <!-- Burn Socket & 45-degree V-Notch -->
    <ellipse cx="360" cy="350" rx="14" ry="7" fill="#080808" stroke="#111" stroke-width="1.5"/>
    <polygon points="360,350 348,375 372,375" fill="#050505"/>

    <!-- Catch Bark Tray Underneath Notch -->
    <polygon points="335,372 385,372 395,388 325,388" fill="#523d2b" stroke="#332417" stroke-width="1.5"/>
  </g>

  <!-- Glowing Ember Coal (Hot 400°C) on Catch Tray -->
  <g id="emberHot">
    <!-- Concentrated Red/Orange Glow Halo -->
    <circle cx="360" cy="378" r="22" fill="url(#emberGlow)"/>
    <!-- Black Carbon Powder Mound with Red Hot Core -->
    <ellipse cx="360" cy="380" rx="12" ry="6" fill="#141414"/>
    <circle cx="359" cy="379" r="4.5" fill="#ffedd5"/>
    <circle cx="362" cy="378" r="2" fill="#ffffff"/>
    <circle cx="357" cy="380" r="1.5" fill="#fde047"/>

    <!-- Rising Woodsmoke Wisps -->
    <path d="M 360 372 Q 352 340 365 315 Q 375 290 358 260 Q 345 230 360 200" stroke="#e2e8f0" stroke-width="4" fill="none" opacity="0.35" filter="url(#smokeBlur)"/>
    <path d="M 362 370 Q 370 335 358 310 Q 348 285 362 255" stroke="#f1f5f9" stroke-width="2.5" fill="none" opacity="0.45" filter="url(#smokeBlur)"/>
  </g>

  <!-- Spindle (회전봉) & Handhold Bearing Block -->
  <g id="spindleAssembly">
    <!-- Vertical Spindle -->
    <polygon points="354,150 366,150 364,348 356,348" fill="url(#spindleWood)" stroke="#261b13" stroke-width="1.5"/>
    <!-- Bottom Carved Friction Tip (Charred) -->
    <polygon points="356,345 364,345 362,352 358,352" fill="#171717"/>

    <!-- Top Handhold Bearing Block -->
    <path d="M 340 148 C 340 135 350 130 360 130 C 370 130 380 135 380 148 L 375 156 L 345 156 Z" fill="url(#bearingBlock)" stroke="#261b13" stroke-width="1.8"/>
    <!-- Lubricant / Leaf Cushion Layer in Handhold Socket -->
    <line x1="346" y1="154" x2="374" y2="154" stroke="#4ade80" stroke-width="2"/>
  </g>

  <!-- Bow & Taut Cord Wrapped Around Spindle -->
  <g id="bowAndCord">
    <!-- Curved Wooden Bow Branch -->
    <path d="M 230 290 Q 290 190 470 230" fill="none" stroke="#785336" stroke-width="8" stroke-linecap="round"/>
    <path d="M 230 290 Q 290 190 470 230" fill="none" stroke="#47301e" stroke-width="3" stroke-linecap="round"/>

    <!-- Taut Rawhide / Fiber Bowstring Wrapped Once Around Spindle -->
    <line x1="230" y1="288" x2="355" y2="250" stroke="#d4b483" stroke-width="2.5"/>
    <!-- Wrap Turn around spindle shaft -->
    <ellipse cx="360" cy="250" rx="7" ry="3.5" fill="#8c6c45" stroke="#d4b483" stroke-width="2"/>
    <line x1="365" y1="250" x2="470" y2="228" stroke="#d4b483" stroke-width="2.5"/>
  </g>

  <!-- Tinder Nest with Sprouting Flame (부싯깃 둥지 & 피어난 불꽃) -->
  <g id="tinderNestAndFlame">
    <!-- Bird's Nest Bundle of Fibers -->
    <ellipse cx="560" cy="365" rx="55" ry="24" fill="#36291a" stroke="#241b12" stroke-width="2"/>
    <path d="M 515 360 Q 560 380 605 360 M 520 370 Q 560 385 600 370 M 530 355 Q 560 370 590 355" stroke="#78593a" stroke-width="1.5" fill="none"/>

    <!-- Blazing Fire Flame Center -->
    <path d="M 560 355 C 540 340 535 305 555 270 C 560 288 568 295 565 275 C 575 285 585 310 580 340 C 585 330 588 318 584 305 C 595 320 592 345 575 355 Z" fill="url(#flameGrad)" filter="url(#smokeBlur)"/>
    <path d="M 560 355 C 545 342 542 312 555 280 C 559 295 566 300 564 285 C 572 295 580 315 576 342 C 580 334 582 324 579 315 C 588 326 585 346 572 355 Z" fill="url(#flameGrad)"/>
    <!-- White Hot Core -->
    <ellipse cx="563" cy="345" rx="8" ry="14" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="563" cy="345" rx="14" ry="20" fill="#fef08a" opacity="0.7"/>

    <!-- Rising Flame Sparks & Smoke -->
    <circle cx="550" cy="245" r="1.5" fill="#f97316"/>
    <circle cx="568" cy="230" r="1.2" fill="#fde047"/>
    <circle cx="562" cy="210" r="1" fill="#f97316"/>
    <path d="M 560 260 Q 550 220 565 180 Q 575 150 560 120" stroke="#cbd5e1" stroke-width="3" fill="none" opacity="0.25" filter="url(#smokeBlur)"/>
  </g>

  <!-- Technical Callouts (Right Side) -->
  <g id="calloutsRight" font-family="monospace" font-size="10" fill="#cccccc">
    <!-- Callout 1: Handhold -->
    <line x1="380" y1="140" x2="565" y2="140" stroke="#666" stroke-width="1"/>
    <circle cx="380" cy="140" r="2" fill="#666"/>
    <text x="570" y="137" fill="#ffffff" font-weight="bold">TOP BEARING BLOCK</text>
    <text x="570" y="150" fill="#888888">윤활유/풀잎 삽입으로 상단 마찰 최소화</text>

    <!-- Callout 2: Bow & String -->
    <line x1="435" y1="230" x2="565" y2="230" stroke="#666" stroke-width="1"/>
    <circle cx="435" cy="230" r="2" fill="#666"/>
    <text x="570" y="227" fill="#ffffff" font-weight="bold">BOW RIGGING (활비비 구동)</text>
    <text x="570" y="240" fill="#888888">1회 감김 텐션으로 고속 회전력 전달</text>

    <!-- Callout 3: Ember Coal -->
    <line x1="375" y1="380" x2="565" y2="380" stroke="#E02424" stroke-width="1"/>
    <circle cx="375" cy="380" r="2" fill="#E02424"/>
    <text x="570" y="377" fill="#E02424" font-weight="bold">STAGE 1: 400°C GLOWING EMBER</text>
    <text x="570" y="390" fill="#888888">V홈 숯가루가 잉걸불로 자가 연소</text>

    <!-- Callout 4: Flame Nest -->
    <line x1="560" y1="310" x2="565" y2="310" stroke="#f97316" stroke-width="1"/>
    <circle cx="560" cy="310" r="2" fill="#f97316"/>
    <text x="570" y="307" fill="#f97316" font-weight="bold">STAGE 2: SUSTAINED OPEN FLAME</text>
    <text x="570" y="320" fill="#888888">부싯깃 둥지 감싸 쥐고 완만한 호흡 착화</text>
  </g>
</svg>
