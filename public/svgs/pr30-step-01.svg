<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg30s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="leaf30s1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="bag30s1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid30s1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow30s1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg30s1)"/>
  <rect width="400" height="400" fill="url(#grid30s1)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Header Banner (Label 1) -->
  <rect x="14" y="14" width="372" height="28" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="32" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">FIG. 01 // 햇볕 드는 활엽수 가지에 투명 봉투 씌우기 및 돌멩이 거치</text>

  <!-- Label 2 Callout Box -->
  <rect x="16" y="50" width="368" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="66" fill="#bae6fd" font-family="monospace" font-size="10.5">소나무·참나무 등 무독성 활엽수의 햇볕 받는 가지 끝 선별</text>

  <!-- Main Illustration: Branch with leaves, bag, and pebble -->
  <g filter="url(#shadow30s1)">
    <!-- Branch outline -->
    <path d="M60,155 Q130,175 240,165" stroke="#78350f" stroke-width="6" fill="none"/>
    <path d="M120,168 Q160,140 210,135" stroke="#78350f" stroke-width="4" fill="none"/>
    <path d="M170,169 Q200,195 240,190" stroke="#78350f" stroke-width="3.5" fill="none"/>

    <!-- Leaves cluster -->
    <ellipse cx="150" cy="145" rx="22" ry="10" transform="rotate(-20 150 145)" fill="url(#leaf30s1)" stroke="#166534" stroke-width="1.2"/>
    <ellipse cx="190" cy="138" rx="24" ry="11" transform="rotate(-5 190 138)" fill="url(#leaf30s1)" stroke="#166534" stroke-width="1.2"/>
    <ellipse cx="230" cy="148" rx="22" ry="10" transform="rotate(15 230 148)" fill="url(#leaf30s1)" stroke="#166534" stroke-width="1.2"/>
    <ellipse cx="180" cy="180" rx="22" ry="10" transform="rotate(25 180 180)" fill="url(#leaf30s1)" stroke="#166534" stroke-width="1.2"/>
    <ellipse cx="225" cy="182" rx="20" ry="9" transform="rotate(10 225 182)" fill="url(#leaf30s1)" stroke="#166534" stroke-width="1.2"/>

    <!-- Sun rays striking branch -->
    <line x1="280" y1="85" x2="235" y2="125" stroke="#fde047" stroke-width="2"/>
    <line x1="310" y1="95" x2="265" y2="135" stroke="#fde047" stroke-width="2"/>
    <line x1="325" y1="120" x2="280" y2="160" stroke="#fde047" stroke-width="2"/>

    <!-- Large transparent transpiration bag enclosing the leaves -->
    <path d="M80,145 C160,105 270,115 310,160 C330,200 315,260 265,275 C215,285 130,265 95,200 Z" fill="url(#bag30s1)" stroke="#38bdf8" stroke-width="2"/>

    <!-- Smooth fist-sized pebble in the lowest corner of the bag -->
    <ellipse cx="265" cy="268" rx="22" ry="12" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Water pooling arrow down to pebble -->
    <path d="M220,230 Q245,245 260,258" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,2" fill="none"/>
    <circle cx="235" cy="240" r="2.5" fill="#38bdf8"/>
    <circle cx="250" cy="250" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- Label 3 Callout Box -->
  <rect x="16" y="295" width="368" height="24" rx="2" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="24" y="311" fill="#fef08a" font-family="monospace" font-size="10.5">구멍 없는 투명 봉투를 깊숙이 씌우고 모서리에 주먹 돌 거치</text>

  <!-- Label 4 Callout Box -->
  <rect x="16" y="324" width="368" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="340" fill="#bae6fd" font-family="monospace" font-size="10.5">가장 낮은 모서리에 매끈한 돌을 넣어 물방울 집수점 형성</text>

  <!-- Bottom Core Principle Strip (Label 5) -->
  <rect x="14" y="354" width="372" height="34" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="24" y="375" fill="#ecfdf5" font-family="monospace" font-size="10.5" font-weight="bold">[핵심] 잎의 증산 수증기가 응축되어 고일 가장 낮은 물주머니 확보</text>
</svg>
