<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-05 [EDIBLE-PLANT-TEST]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 02</text>

  <!-- 사람 팔 전완부 윤곽선 (Inner Forearm) -->
  <path d="M 60 160 C 120 155 240 150 340 140 L 340 220 C 240 215 120 220 60 210 Z" fill="#141414" stroke="#E5E5E5" stroke-width="2"/>
  <text x="90" y="190" fill="#737373" font-family="monospace" font-size="10">INNER FOREARM</text>

  <!-- 식물 즙 도포 테스트 스팟 (Test Patch) -->
  <circle cx="210" cy="180" r="18" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="210" cy="180" r="26" fill="none" stroke="#737373" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- 즙 도포 화살표 -->
  <path d="M 210 110 L 210 155" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="210,155 205,145 215,145" fill="#FFFFFF"/>
  <text x="210" y="100" fill="#FFFFFF" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">RUB CRUSHED SAP</text>

  <!-- 15분 경과 스톱워치 다이얼 (15 MIN Stopwatch) -->
  <circle cx="290" cy="180" r="30" fill="#0A0A0A" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="290" y1="180" x2="290" y2="155" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="290" y1="180" x2="315" y2="180" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 290 155 A 25 25 0 0 1 315 180" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <text x="290" y="225" fill="#FFFFFF" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">15 MIN WAIT</text>

  <!-- 이상 반응 감시 체크리스트 -->
  <rect x="50" y="240" width="300" height="55" fill="#0A0A0A" stroke="#404040" stroke-width="1"/>
  <text x="65" y="260" fill="#E5E5E5" font-family="monospace" font-size="10">OBSERVE: ERYTHEMA / ITCHING / HIVES</text>
  <text x="65" y="278" fill="#737373" font-family="monospace" font-size="9">&gt; IF BURNING SENSATION OCCURS ➔ RINSE IMMEDIATELY</text>

  <!-- 하단 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 02: DERMAL CONTACT &amp; 15-MINUTE MONITORING</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">RUB JUICE ON SENSITIVE INNER ARM; WAIT 15 MIN FOR HISTAMINE REACTION</text>
</svg>
