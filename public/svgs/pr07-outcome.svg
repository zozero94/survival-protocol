<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
  <defs>
    <!-- Background Technical Gradient -->
    <linearGradient id="bgGradOutcome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0e"/>
      <stop offset="50%" stop-color="#0e1218"/>
      <stop offset="100%" stop-color="#090b0f"/>
    </linearGradient>

    <!-- Timber Anchor Post Gradients -->
    <linearGradient id="anchorPostCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d1e12"/>
      <stop offset="25%" stop-color="#4a3320"/>
      <stop offset="50%" stop-color="#735235"/>
      <stop offset="75%" stop-color="#553a24"/>
      <stop offset="100%" stop-color="#1e140c"/>
    </linearGradient>
    <linearGradient id="anchorTopCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a4029"/>
      <stop offset="50%" stop-color="#7a583a"/>
      <stop offset="100%" stop-color="#3b291a"/>
    </linearGradient>

    <!-- Wood Bark Texture Pattern -->
    <pattern id="barkLines" width="20" height="40" patternUnits="userSpaceOnUse">
      <line x1="5" y1="0" x2="4" y2="40" stroke="#1f140b" stroke-width="1.2" opacity="0.6"/>
      <line x1="12" y1="0" x2="13" y2="40" stroke="#1f140b" stroke-width="1.5" opacity="0.5"/>
      <line x1="18" y1="0" x2="17" y2="40" stroke="#8c6442" stroke-width="0.8" opacity="0.3"/>
    </pattern>

    <!-- Manila Standing Rope 3D Tubular Gradient -->
    <linearGradient id="ropeManilaOutcome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#652b05"/>
      <stop offset="20%" stop-color="#a14908"/>
      <stop offset="48%" stop-color="#fef3c7"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#3d1502"/>
    </linearGradient>

    <!-- Tactical Green Working Rope 3D Gradient -->
    <linearGradient id="ropeGreenOutcome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f3d20"/>
      <stop offset="22%" stop-color="#15803d"/>
      <stop offset="48%" stop-color="#bbf7d0"/>
      <stop offset="75%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Deep Drop Shadow for Over/Under Crossing -->
    <filter id="shadowDeepOutcome" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.95"/>
    </filter>

    <!-- Manila Braid Texture Pattern -->
    <pattern id="braidManilaOutcome" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#451a03" stroke-width="2.5" opacity="0.65"/>
      <line x1="7" y1="0" x2="7" y2="14" stroke="#fef3c7" stroke-width="1.8" opacity="0.45"/>
    </pattern>

    <!-- Paracord Texture Pattern for Working Tail -->
    <pattern id="braidGreenOutcome" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#052e16" stroke-width="2" opacity="0.7"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#bbf7d0" stroke-width="1.2" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Technical Canvas Backdrop -->
  <rect x="0" y="0" width="800" height="450" fill="url(#bgGradOutcome)"/>
  <rect x="14" y="14" width="772" height="422" fill="none" stroke="#22262e" stroke-width="1"/>

  <!-- Technical Corner Crosshairs -->
  <path d="M 22 32 L 34 32 M 28 26 L 28 38" stroke="#374151" stroke-width="1"/>
  <path d="M 778 32 L 766 32 M 772 26 L 772 38" stroke="#374151" stroke-width="1"/>
  <path d="M 22 418 L 34 418 M 28 412 L 28 424" stroke="#374151" stroke-width="1"/>
  <path d="M 778 418 L 766 418 M 772 412 L 772 424" stroke="#374151" stroke-width="1"/>

  <!-- Blueprint Header Strip -->
  <text x="32" y="38" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">ARCHIVE // MASTER SPECIFICATION</text>
  <text x="32" y="56" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">BOWLINE MASTER BLUEPRINT // 매듭의 왕 완전 제원도</text>
  <text x="768" y="38" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="end">RELEASE: 1.0 SEC // JAM-PROOF</text>
  <line x1="32" y1="66" x2="768" y2="66" stroke="#262d35" stroke-width="1"/>

  <!-- Left Technical Spec Card -->
  <g id="specCardLeft" font-family="'JetBrains Mono', monospace" font-size="9.5">
    <rect x="32" y="80" width="190" height="175" fill="#111419" stroke="#262d35" stroke-width="1"/>
    <rect x="32" y="80" width="190" height="24" fill="#181d24"/>
    <text x="44" y="96" fill="#ef4444" font-weight="bold">BOWLINE SPECIFICATIONS</text>
    <text x="44" y="122" fill="#d1d5db">· KNOT TYPE: FIXED LOOP</text>
    <text x="44" y="142" fill="#d1d5db">· SLIPPAGE: ZERO (0%)</text>
    <text x="44" y="162" fill="#d1d5db">· EFFICIENCY: 75% RATING</text>
    <text x="44" y="182" fill="#d1d5db">· JAMMING: 100% JAM-PROOF</text>
    <text x="44" y="202" fill="#d1d5db">· RELEASE: BREAK THE BACK</text>
    <text x="44" y="222" fill="#4ade80">· LOAD CAPACITY: 500+ KG</text>
    <text x="44" y="242" fill="#38bdf8">· TAIL POSITION: INSIDE LOOP</text>
  </g>

  <!-- Left Material Guide Strip -->
  <g id="matGuideLeft" font-family="'JetBrains Mono', monospace" font-size="8.5">
    <rect x="32" y="265" width="190" height="135" fill="#0d1014" stroke="#1e242c" stroke-width="1"/>
    <rect x="32" y="265" width="4" height="135" fill="#f59e0b"/>
    <text x="44" y="284" fill="#f59e0b" font-weight="bold">[TWO-COLOR CONTRAST]</text>
    <rect x="44" y="295" width="12" height="12" fill="url(#ropeManilaOutcome)"/>
    <text x="62" y="305" fill="#fde68a">원줄: 마닐라 탄 로프</text>
    <text x="62" y="318" fill="#9ca3af">(하중 지탱 주 라인)</text>
    <rect x="44" y="335" width="12" height="12" fill="url(#ropeGreenOutcome)"/>
    <text x="62" y="345" fill="#86efac">작동 끝단: 전술 그린 줄</text>
    <text x="62" y="358" fill="#9ca3af">(토끼 궤적 전용 식별)</text>
    <text x="44" y="385" fill="#38bdf8">안전: 꼬리는 고리 안쪽 위치</text>
  </g>

  <!-- Ground Plane Cast Shadow -->
  <ellipse cx="440" cy="410" rx="220" ry="16" fill="#030405" opacity="0.95"/>

  <!-- ============================================================== -->
  <!-- 3D RIGGING SCENE: TIMBER POST + 3D BRAIDED BOWLINE KNOT -->
  <!-- ============================================================== -->
  <!-- 1. Anchor Post: Rope passing BEHIND Post (Drawn First) -->
  <path d="M 410 325 C 455 350 515 350 550 325" stroke="#000000" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M 410 325 C 455 350 515 350 550 325" stroke="url(#ropeManilaOutcome)" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 410 325 C 455 350 515 350 550 325" stroke="url(#braidManilaOutcome)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- 2. Timber Anchor Post Solid Cylinder -->
  <g id="timberPostGroup">
    <!-- Cast Shadow on Timber Post from incoming top line -->
    <polygon points="480,210 525,210 520,415 475,415" fill="url(#anchorPostCylinder)" stroke="#1a120b" stroke-width="1.5"/>
    <polygon points="480,210 525,210 520,415 475,415" fill="url(#barkLines)" opacity="0.65"/>
    <!-- Top Cap Ellipse with Tree Growth Rings -->
    <ellipse cx="502" cy="210" rx="22.5" ry="9" fill="url(#anchorTopCap)" stroke="#261b11" stroke-width="1.5"/>
    <ellipse cx="502" cy="210" rx="15" ry="6" fill="none" stroke="#3b291a" stroke-width="1"/>
    <ellipse cx="502" cy="210" rx="7" ry="3" fill="none" stroke="#261b11" stroke-width="0.8"/>
    <!-- Timber Post Label -->
    <text x="502" y="195" fill="#d1d5db" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">TIMBER POST</text>
  </g>

  <!-- 3. Anchor Post: Rope passing IN FRONT OF Post (Drawn After Post) -->
  <path d="M 550 325 C 525 285 460 280 415 295" stroke="#000000" stroke-width="22" stroke-linecap="round" fill="none" filter="url(#shadowDeepOutcome)"/>
  <path d="M 550 325 C 525 285 460 280 415 295" stroke="url(#ropeManilaOutcome)" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 550 325 C 525 285 460 280 415 295" stroke="url(#braidManilaOutcome)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- 4. Main Standing Line (하중 받는 수직 원줄) -->
  <path d="M 315 75 L 315 190" stroke="#000000" stroke-width="24" stroke-linecap="round"/>
  <path d="M 315 75 L 315 190" stroke="url(#ropeManilaOutcome)" stroke-width="15" stroke-linecap="round"/>
  <path d="M 315 75 L 315 190" stroke="url(#braidManilaOutcome)" stroke-width="15" stroke-linecap="round" opacity="0.8"/>

  <!-- 5. Nipper Loop Ring (토끼굴 3D 고리) -->
  <path d="M 315 190 C 275 200 265 240 305 252 C 335 258 355 232 340 205 C 335 195 315 190 315 190" 
        stroke="#000000" stroke-width="24" stroke-linecap="round" fill="none" filter="url(#shadowDeepOutcome)"/>
  <path d="M 315 190 C 275 200 265 240 305 252 C 335 258 355 232 340 205 C 335 195 315 190 315 190" 
        stroke="url(#ropeManilaOutcome)" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M 315 190 C 275 200 265 240 305 252 C 335 258 355 232 340 205 C 335 195 315 190 315 190" 
        stroke="url(#braidManilaOutcome)" stroke-width="15" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- 6. Collar Loop (뒤통수 칼라 링) Wrapped around Standing Line -->
  <path d="M 310 248 C 295 230 290 190 315 180 C 345 170 365 205 340 245" 
        stroke="#000000" stroke-width="24" stroke-linecap="round" fill="none" filter="url(#shadowDeepOutcome)"/>
  <path d="M 310 248 C 295 230 290 190 315 180 C 345 170 365 205 340 245" 
        stroke="url(#ropeGreenOutcome)" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 310 248 C 295 230 290 190 315 180 C 345 170 365 205 340 245" 
        stroke="url(#braidGreenOutcome)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- 7. Working End Tail (고리 안쪽에 안전하게 잠긴 토끼 꼬리) -->
  <path d="M 335 240 L 365 295" stroke="#000000" stroke-width="22" stroke-linecap="round" filter="url(#shadowDeepOutcome)"/>
  <path d="M 335 240 L 365 295" stroke="url(#ropeGreenOutcome)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 335 240 L 365 295" stroke="url(#braidGreenOutcome)" stroke-width="14" stroke-linecap="round" opacity="0.75"/>

  <!-- 8. Eye Loop Leads connecting knot to anchor post -->
  <path d="M 305 252 C 295 285 350 310 410 325" stroke="#000000" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M 305 252 C 295 285 350 310 410 325" stroke="url(#ropeManilaOutcome)" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M 305 252 C 295 285 350 310 410 325" stroke="url(#braidManilaOutcome)" stroke-width="15" stroke-linecap="round" fill="none" opacity="0.8"/>

  <path d="M 415 295 C 380 285 350 270 335 240" stroke="#000000" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M 415 295 C 380 285 350 270 335 240" stroke="url(#ropeManilaOutcome)" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M 415 295 C 380 285 350 270 335 240" stroke="url(#braidManilaOutcome)" stroke-width="15" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Dynamic Opposing Tension Force Arrows -->
  <g stroke="#ef4444" stroke-width="2.5" fill="none">
    <!-- Tension upward on standing line -->
    <line x1="315" y1="135" x2="315" y2="95"/>
    <polygon points="315,86 308,100 322,100" fill="#ef4444"/>
    <!-- Tension pulling toward timber anchor post -->
    <line x1="410" y1="300" x2="445" y2="310"/>
    <polygon points="453,312 439,305 443,319" fill="#ef4444"/>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT TECHNICAL PANEL: 1-SECOND QUICK RELEASE MECHANISM -->
  <!-- ============================================================== -->
  <g id="quickReleasePanel">
    <rect x="560" y="80" width="205" height="195" fill="#111419" stroke="#ef4444" stroke-width="1"/>
    <rect x="560" y="80" width="205" height="24" fill="#241010"/>
    <text x="572" y="96" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">1-SEC BREAK-THE-BACK</text>

    <!-- Finger Action Principles -->
    <text x="572" y="122" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="bold">칼라(뒤통수) 꺾기 원리</text>
    <text x="572" y="140" fill="#9ca3af" font-family="'Chivo', sans-serif" font-size="8.5">1. 매듭 뒤편 둥근 칼라 고리 확인</text>
    <text x="572" y="156" fill="#9ca3af" font-family="'Chivo', sans-serif" font-size="8.5">2. 엄지로 칼라를 바깥쪽으로 젖힘</text>
    <text x="572" y="172" fill="#9ca3af" font-family="'Chivo', sans-serif" font-size="8.5">3. 마찰 락 즉시 풀려 1초 만에 해체</text>

    <!-- Mini Loupe Vector of the Release Action -->
    <circle cx="660" cy="225" r="32" fill="#080a0e" stroke="#262d35" stroke-width="1"/>
    <!-- Standing Rope in Loupe -->
    <line x1="660" y1="198" x2="660" y2="252" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
    <!-- Collar Loop being bent backwards -->
    <path d="M 645 225 C 645 208 675 208 675 225" stroke="#22c55e" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Thumb Push Arrow -->
    <line x1="660" y1="235" x2="660" y2="212" stroke="#38bdf8" stroke-width="2.2"/>
    <polygon points="660,205 654,216 666,216" fill="#38bdf8"/>
    <text x="660" y="248" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">PUSH UP</text>

    <!-- Bottom Jam-Proof Stamp -->
    <rect x="560" y="250" width="205" height="25" fill="#052e16"/>
    <text x="662" y="266" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">JAM-PROOF // 칼날 불필요</text>
  </g>

  <!-- Right Safety Warning Box -->
  <g id="safetyWarningBox">
    <rect x="560" y="290" width="205" height="110" fill="#140d0d" stroke="#ef4444" stroke-width="1"/>
    <rect x="560" y="290" width="205" height="20" fill="#2d1212"/>
    <text x="572" y="304" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">[FATAL MISTAKE 방지]</text>
    <text x="572" y="326" fill="#fca5a5" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="bold">토끼 꼬리는 반드시 고리 안쪽!</text>
    <text x="572" y="344" fill="#9ca3af" font-family="'Chivo', sans-serif" font-size="8">바깥으로 노출되면 마찰에 쓸려</text>
    <text x="572" y="358" fill="#9ca3af" font-family="'Chivo', sans-serif" font-size="8">매듭이 저절로 풀릴 수 있습니다.</text>
    <text x="572" y="382" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold">INSIDE TAIL = 100% SECURE</text>
  </g>

  <!-- ============================================================== -->
  <!-- TECHNICAL CALLOUTS & DIMENSIONS -->
  <!-- ============================================================== -->
  <g id="calloutsMaster" font-family="'JetBrains Mono', monospace" font-size="9.5">
    <!-- Callout 1: Standing Line -->
    <line x1="315" y1="130" x2="365" y2="130" stroke="#9ca3af" stroke-width="1"/>
    <circle cx="315" cy="130" r="2.5" fill="#f59e0b"/>
    <text x="375" y="126" fill="#ffffff" font-weight="bold">STANDING PART</text>
    <text x="375" y="140" fill="#9ca3af">하중을 받는 주 원줄</text>

    <!-- Callout 2: Fixed Eye Loop -->
    <line x1="450" y1="330" x2="450" y2="370" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="450" cy="330" r="2.5" fill="#38bdf8"/>
    <text x="450" y="386" fill="#38bdf8" font-weight="bold">FIXED EYE LOOP</text>
    <text x="450" y="400" fill="#9ca3af">하중에도 줄어들지 않는 고리</text>

    <!-- Callout 3: Working End Tail -->
    <line x1="365" y1="290" x2="320" y2="335" stroke="#22c55e" stroke-width="1"/>
    <circle cx="365" cy="290" r="2.5" fill="#22c55e"/>
    <text x="310" y="340" fill="#4ade80" font-weight="bold" text-anchor="end">WORKING END TAIL</text>
    <text x="310" y="354" fill="#9ca3af" text-anchor="end">고리 안쪽으로 단단히 잠김</text>
  </g>
</svg>
