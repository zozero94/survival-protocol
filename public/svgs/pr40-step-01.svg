<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg40s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="jacket40s1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pole40s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <pattern id="grid40s1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow40s1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg40s1)"/>
  <rect width="400" height="400" fill="url(#grid40s1)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Label 1 -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.2" font-weight="bold">FIG. 01 // 긴 막대 2개 점검 + 지퍼 잠금·소매 안쪽 뒤집기</text>

  <!-- Label 2 -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9">성인 키보다 긴 단단한 막대 2개 휨·균열 사전 점검</text>

  <!-- Main Visual: 2 Long Sturdy Poles + Zipped Jacket With Inside-Out Sleeve Arrows -->
  <g filter="url(#shadow40s1)">
    <!-- Top Sturdy Pole -->
    <rect x="30" y="96" width="340" height="12" rx="5" fill="url(#pole40s1)" stroke="#fde047" stroke-width="1.2"/>
    <!-- Bottom Sturdy Pole -->
    <rect x="30" y="256" width="340" height="12" rx="5" fill="url(#pole40s1)" stroke="#fde047" stroke-width="1.2"/>

    <!-- Center Heavy Zipped Jacket Body -->
    <polygon points="140,126 260,126 274,158 264,242 136,242 126,158" fill="url(#jacket40s1)" stroke="#94a3b8" stroke-width="1.8"/>
    <!-- Collar Top -->
    <path d="M 176 126 Q 200 140 224 126" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Locked Center Zipper Seam -->
    <line x1="200" y1="133" x2="200" y2="242" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 2"/>
    <circle cx="200" cy="137" r="4" fill="#fde047" stroke="#78350f"/>

    <!-- Ghost Outline of Unfolded Sleeves Left & Right -->
    <polygon points="140,126 86,150 96,174 134,158" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 3"/>
    <polygon points="260,126 314,150 304,174 266,158" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Inside-Out Sleeves Pulled Into Jacket Torso (Left & Right Internal Tunnels) -->
    <rect x="148" y="138" width="24" height="96" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="228" y="138" width="24" height="96" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Inversion Arrows Pulling Sleeves Inward -->
    <path d="M 98 162 L 154 162" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="150,157 160,162 150,167" fill="#38bdf8"/>
    <path d="M 302 162 L 246 162" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="250,157 240,162 250,167" fill="#38bdf8"/>

    <!-- Check Badge for Locked Zipper -->
    <circle cx="200" cy="190" r="11" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <polyline points="195,190 199,194 206,186" fill="none" stroke="#86efac" stroke-width="2"/>
  </g>

  <!-- Label 3 -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="315" fill="#cbd5e1" font-family="monospace" font-size="9">두꺼운 점퍼 2벌 앞 지퍼를 목 끝까지 빈틈없이 잠금</text>

  <!-- Label 4 -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#1e1b18" stroke="#d97706" stroke-width="1"/>
  <text x="24" y="344" fill="#fed7aa" font-family="monospace" font-size="9">양쪽 소매를 몸통 안쪽으로 끝까지 곧게 뒤집어 넣기</text>

  <!-- Label 5 -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="376" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">[핵심] 소매 안쪽 뒤집기로 몸통 전체가 막대 하중 분산</text>
</svg>
