<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg27out" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a0e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="metal27out" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <pattern id="grid27out" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow27out" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background & Tactical Frame -->
  <rect width="800" height="450" fill="url(#bg27out)"/>
  <rect width="800" height="450" fill="url(#grid27out)"/>
  <rect x="10" y="10" width="780" height="430" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header Banner (Label 1) -->
  <rect x="20" y="20" width="760" height="38" rx="3" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="36" y="44" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold">PR-27 완성체 // 무전력 120dB 호루라기 · 10km 햇빛 반사경</text>

  <!-- 4-Stage Horizontal Engineering Pipeline -->
  <g filter="url(#shadow27out)">
    <!-- STAGE 01 Card -->
    <rect x="20" y="74" width="178" height="296" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="28" y="84" width="162" height="28" rx="2" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="32" y="103" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold">STAGE 01: T자 금속판 재단</text>

    <!-- T-Shape Sheet & Straight Strip + Grinding Stone Visual -->
    <rect x="52" y="138" width="24" height="96" rx="2" fill="url(#metal27out)" stroke="#f8fafc" stroke-width="1.2"/>
    <path d="M114,138 L142,138 L142,168 L166,168 L166,196 L142,196 L142,234 L114,234 L114,196 L90,196 L90,168 L114,168 Z" fill="url(#metal27out)" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="109" cy="272" rx="46" ry="16" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M85,272 L133,272" stroke="#fde047" stroke-width="2" stroke-dasharray="4,2"/>

    <rect x="28" y="316" width="162" height="42" rx="2" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="32" y="341" fill="#e2e8f0" font-family="monospace" font-size="9.5">폭 1.5cm 띠 + 모서리 연마</text>

    <!-- STAGE 02 Card -->
    <rect x="214" y="74" width="178" height="296" rx="4" fill="#0b1120" stroke="#fde047" stroke-width="1.2"/>
    <rect x="222" y="84" width="162" height="28" rx="2" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
    <text x="226" y="103" fill="#fde047" font-family="monospace" font-size="10.5" font-weight="bold">STAGE 02: 취구·공명실 성형</text>

    <!-- Folded Fipple Channel & Cylindrical Chamber Side Profile -->
    <polygon points="240,168 308,168 308,184 240,184" fill="url(#metal27out)" stroke="#fde047" stroke-width="1.5"/>
    <circle cx="332" cy="204" r="28" fill="#1e293b" stroke="url(#metal27out)" stroke-width="5"/>
    <circle cx="332" cy="204" r="10" fill="#090d16" stroke="#fde047" stroke-width="1.2"/>
    <!-- 2-3mm Sound Window Gap -->
    <path d="M308,176 L324,182" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <path d="M232,176 L296,176" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,2"/>

    <rect x="222" y="316" width="162" height="42" rx="2" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="226" y="341" fill="#fef08a" font-family="monospace" font-size="9.5">납작 바람길 + 연필 굵기 원통</text>

    <!-- STAGE 03 Card -->
    <rect x="408" y="74" width="178" height="296" rx="4" fill="#0b1120" stroke="#10b981" stroke-width="1.2"/>
    <rect x="416" y="84" width="162" height="28" rx="2" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="420" y="103" fill="#34d399" font-family="monospace" font-size="10.5" font-weight="bold">STAGE 03: 양옆 밀폐 120dB</text>

    <!-- Thumb & Index Finger Sealing Cylinder Ends + 120dB Acoustic Waves -->
    <ellipse cx="462" cy="202" rx="18" ry="26" fill="#d97706" stroke="#fde047" stroke-width="1.5"/>
    <rect x="476" y="186" width="42" height="32" rx="6" fill="url(#metal27out)" stroke="#f8fafc" stroke-width="1.5"/>
    <ellipse cx="532" cy="202" rx="18" ry="26" fill="#d97706" stroke="#fde047" stroke-width="1.5"/>
    <!-- 3,000Hz Acoustic Shockwaves -->
    <path d="M476,162 Q497,144 518,162" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M464,148 Q497,124 530,148" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M452,134 Q497,104 542,134" fill="none" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="416" y="316" width="162" height="42" rx="2" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="420" y="341" fill="#a7f3d0" font-family="monospace" font-size="9.5">엄지·검지 밀폐 + 3회 조난음</text>

    <!-- STAGE 04 Card -->
    <rect x="602" y="74" width="178" height="296" rx="4" fill="#0b1120" stroke="#f97316" stroke-width="1.2"/>
    <rect x="610" y="84" width="162" height="28" rx="2" fill="#0f172a" stroke="#f97316" stroke-width="1"/>
    <text x="612" y="103" fill="#fdba74" font-family="monospace" font-size="10.5" font-weight="bold">STAGE 04: V자 조준 반사경</text>

    <!-- Mirror Plate + V-Finger Sight + 10km Solar Beam to Helicopter -->
    <rect x="622" y="196" width="32" height="48" rx="3" fill="url(#metal27out)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- V-Finger Sight -->
    <path d="M676,244 L692,192 M712,244 L696,192" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <!-- Reflected Sun Flash Spot & Beam -->
    <circle cx="694" cy="186" r="7" fill="#fef08a" stroke="#f97316" stroke-width="2"/>
    <path d="M638,214 L694,186 L754,142" fill="none" stroke="#fde047" stroke-width="2.5" stroke-dasharray="4,2"/>
    <!-- Distant Search Target -->
    <circle cx="754" cy="142" r="10" fill="#451a03" stroke="#fde047" stroke-width="1.8"/>

    <rect x="610" y="316" width="162" height="42" rx="2" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="612" y="341" fill="#fed7aa" font-family="monospace" font-size="9.5">손가락 V자 가늠자 + SOS 섬광</text>
  </g>

  <!-- Bottom Verification Banner (Label 10) -->
  <rect x="20" y="388" width="760" height="40" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="36" y="413" fill="#ecfdf5" font-family="monospace" font-size="13" font-weight="bold">야전 검증 완료 // 호흡 소모 1/5 절감 · 주간 10km 광학 신호 도달</text>
</svg>
