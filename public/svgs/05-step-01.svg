<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-05 [EDIBLE-PLANT-TEST]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 01</text>

  <!-- 절단된 식물 줄기 단면 (Cut Stem) -->
  <rect x="180" y="110" width="40" height="110" fill="#141414" stroke="#FFFFFF" stroke-width="2"/>
  <ellipse cx="200" cy="110" rx="20" ry="8" fill="#262626" stroke="#FFFFFF" stroke-width="2"/>

  <!-- 유백색 독성 유즙 방출 (Milky White Sap Drop) -->
  <path d="M 195 118 Q 190 145 200 155 Q 210 145 205 118 Z" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <ellipse cx="200" cy="170" rx="12" ry="16" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  
  <!-- 치명적 독성 금지 표식 (Disallowed Cross) -->
  <circle cx="200" cy="170" r="32" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="177" y1="147" x2="223" y2="193" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="223" y1="147" x2="177" y2="193" stroke="#FFFFFF" stroke-width="3"/>

  <!-- 배제 판별 텍스트 박스 -->
  <rect x="50" y="235" width="300" height="60" fill="#0A0A0A" stroke="#404040" stroke-width="1"/>
  <text x="65" y="255" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">1. MILKY SAP (LATEX ALKALOIDS) ➔ DISCARD</text>
  <text x="65" y="272" fill="#E5E5E5" font-family="monospace" font-size="10">2. BITTER ALMOND ODOR (CYANIDE) ➔ DISCARD</text>
  <text x="65" y="287" fill="#A3A3A3" font-family="monospace" font-size="10">3. FINE STINGING HAIRS ➔ DISCARD</text>

  <!-- 하단 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 01: IMMEDIATE VISUAL &amp; OLFACTORY EXCLUSION</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">IMMEDIATELY REJECT ANY SPECIMEN WITH MILKY SAP OR ALMOND SCENT</text>
</svg>
