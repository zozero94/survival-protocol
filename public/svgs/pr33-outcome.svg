<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg33out" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="wood33out" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b4834e"/>
      <stop offset="100%" stop-color="#785028"/>
    </linearGradient>
    <radialGradient id="ember33out" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <linearGradient id="water33out" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid33out" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow33out" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg33out)"/>
  <rect width="800" height="450" fill="url(#grid33out)"/>
  <rect x="10" y="10" width="780" height="430" fill="none" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Top Header Banner (Label 1) -->
  <rect x="20" y="20" width="760" height="38" rx="3" fill="#18181b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="36" y="44" fill="#f4f4f5" font-family="monospace" font-size="11.5" font-weight="bold">PR-33 완성체 // 숯불 파내기 통나무 냄비 &amp; 마른 화강암 100℃ 돌 끓이기</text>

  <!-- 4 Stage Cards -->
  <g filter="url(#shadow33out)">
    <!-- STAGE 01 -->
    <rect x="20" y="74" width="178" height="296" rx="4" fill="#0f1014" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="28" y="84" width="162" height="28" rx="2" fill="#18181b" stroke="#d97706" stroke-width="1"/>
    <text x="34" y="102" fill="#f59e0b" font-family="monospace" font-size="8.5" font-weight="bold">STAGE 01: 진흙 둑 &amp; 중심 탄화</text>

    <!-- Visual 1: Log + Clay Dam + Embers + Blowpipe -->
    <path d="M 54 184 L 54 246 A 55 14 0 0 0 164 246 L 164 184 Z" fill="#4b301d" stroke="#291a10" stroke-width="2"/>
    <ellipse cx="109" cy="184" rx="55" ry="18" fill="url(#wood33out)" stroke="#a16207"/>
    <ellipse cx="109" cy="183" rx="47" ry="14" fill="none" stroke="#b45309" stroke-width="8"/>
    <ellipse cx="109" cy="184" rx="26" ry="8" fill="url(#ember33out)"/>
    <line x1="118" y1="176" x2="174" y2="136" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>

    <rect x="28" y="316" width="162" height="42" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
    <text x="34" y="341" fill="#94a3b8" font-family="monospace" font-size="8">테두리 3~4cm 진흙 보호 + 숯불 송풍</text>

    <!-- STAGE 02 -->
    <rect x="214" y="74" width="178" height="296" rx="4" fill="#0f1014" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="222" y="84" width="162" height="28" rx="2" fill="#18181b" stroke="#0284c7" stroke-width="1"/>
    <text x="228" y="102" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">STAGE 02: 돌날 긁기 반복 성형</text>

    <!-- Visual 2: Cross-section bowl + 3-4cm walls + stone scraper -->
    <rect x="242" y="160" width="122" height="96" rx="10" fill="url(#wood33out)" stroke="#6b4423" stroke-width="2.5"/>
    <path d="M 264 160 L 268 218 Q 270 232 303 232 Q 336 232 338 218 L 342 160 Z" fill="#171717" stroke="#f59e0b" stroke-width="1.5"/>
    <polygon points="292,202 322,178 332,194 304,216" fill="#9ca3af" stroke="#e5e7eb" stroke-width="1.2"/>
    <line x1="242" y1="200" x2="266" y2="200" stroke="#4ade80" stroke-width="2"/>

    <rect x="222" y="316" width="162" height="42" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
    <text x="228" y="341" fill="#94a3b8" font-family="monospace" font-size="8">숯 층 제거 3~4회로 15cm 깊이 확보</text>

    <!-- STAGE 03 -->
    <rect x="408" y="74" width="178" height="296" rx="4" fill="#0f1014" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="416" y="84" width="162" height="28" rx="2" fill="#18181b" stroke="#dc2626" stroke-width="1"/>
    <text x="422" y="102" fill="#ef4444" font-family="monospace" font-size="8.5" font-weight="bold">STAGE 03: 마른 육지 돌 30분 가열</text>

    <!-- Visual 3: Dry hillside granite heating in campfire embers -->
    <ellipse cx="497" cy="236" rx="64" ry="20" fill="#1c1917" stroke="#44403c" stroke-width="1.5"/>
    <ellipse cx="472" cy="226" rx="16" ry="11" fill="url(#ember33out)" stroke="#fca5a5"/>
    <ellipse cx="497" cy="232" rx="18" ry="12" fill="url(#ember33out)" stroke="#fde68a"/>
    <ellipse cx="522" cy="226" rx="16" ry="11" fill="url(#ember33out)" stroke="#fca5a5"/>
    <path d="M 480 202 Q 474 184 482 168 M 497 198 Q 503 180 495 162 M 514 202 Q 508 184 516 168" fill="none" stroke="#fb923c" stroke-width="1.8" stroke-dasharray="3 3"/>
    <!-- Check circle -->
    <circle cx="556" cy="144" r="12" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <polyline points="550,144 554,148 562,140" fill="none" stroke="#86efac" stroke-width="2.2" stroke-linecap="round"/>

    <rect x="416" y="316" width="162" height="42" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
    <text x="422" y="341" fill="#94a3b8" font-family="monospace" font-size="8">강돌 금지! 마른 언덕 화강암 붉게 예열</text>

    <!-- STAGE 04 -->
    <rect x="602" y="74" width="178" height="296" rx="4" fill="#0f1014" stroke="#10b981" stroke-width="1.2"/>
    <rect x="610" y="84" width="162" height="28" rx="2" fill="#18181b" stroke="#059669" stroke-width="1"/>
    <text x="616" y="102" fill="#10b981" font-family="monospace" font-size="8.5" font-weight="bold">STAGE 04: 생나무 집게 100℃ 비등</text>

    <!-- Visual 4: Stone Boiling Wood Tongs & Bubbles -->
    <rect x="630" y="178" width="122" height="84" rx="10" fill="url(#wood33out)" stroke="#6b4423" stroke-width="2.5"/>
    <path d="M 652 178 L 655 232 Q 657 244 691 244 Q 725 244 727 232 L 730 178 Z" fill="#141416"/>
    <path d="M 653 196 L 655 232 Q 657 244 691 244 Q 725 244 727 232 L 729 196 Z" fill="url(#water33out)"/>
    <ellipse cx="691" cy="226" rx="15" ry="10" fill="url(#ember33out)" stroke="#fde68a"/>
    <circle cx="672" cy="196" r="3" fill="#e0f2fe"/>
    <circle cx="708" cy="196" r="3" fill="#e0f2fe"/>
    <!-- Forked wood tongs -->
    <path d="M 684 176 L 748 134 L 702 180" fill="none" stroke="#84cc16" stroke-width="4" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 676 164 Q 670 148 678 134 M 696 162 Q 702 146 694 132" fill="none" stroke="#e2e8f0" stroke-width="1.8" stroke-dasharray="3 3"/>

    <rect x="610" y="316" width="162" height="42" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
    <text x="616" y="341" fill="#94a3b8" font-family="monospace" font-size="8">재 1초 털고 교대 투입해 식수 살균</text>
  </g>

  <!-- Bottom Core Principle Banner (Label 10) -->
  <rect x="20" y="388" width="760" height="42" rx="3" fill="#18181b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="36" y="413" fill="#fef08a" font-family="monospace" font-size="10.5" font-weight="bold">[공학 원리] 점토 방화벽으로 목재 용기를 성형하고 수분 제로 화강암 열전달로 100℃ 비등 달성</text>
</svg>