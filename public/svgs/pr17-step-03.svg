<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg1703" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#0e1319"/>
    </linearGradient>
    <linearGradient id="clayVatPit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="60%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#271815"/>
    </linearGradient>
    <linearGradient id="tannedHideCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="animalTallow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="drop1703" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="grid1703" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16202c" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg1703)"/>
  <rect width="400" height="400" fill="url(#grid1703)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#253342" stroke-width="1"/>

  <!-- Top Header (Label 1) -->
  <rect x="16" y="14" width="368" height="28" rx="2" fill="#0f1722" stroke="#2c3e50" stroke-width="1"/>
  <text x="24" y="32" fill="#fde68a" font-family="monospace" font-size="10.2" font-weight="bold">FIG. 03 // PROGRESSIVE OAK BARK SOAK &amp; CORE CHECK</text>

  <!-- Main 3D Illustration: Clay Lined Tannin Vat & Cross-Section Core Inspection Loupe -->
  <g filter="url(#drop1703)">
    <!-- Left: Clay-Lined Ground Pit Vat Filled with Rich Tannin Liquor -->
    <path d="M 32 140 L 218 140 L 200 262 C 196 272 180 278 125 278 C 70 278 54 272 50 262 Z" fill="url(#clayVatPit)" stroke="#b45309" stroke-width="1.5"/>
    <ellipse cx="125" cy="140" rx="93" ry="14" fill="#450a0a" stroke="#ea580c" stroke-width="1.2"/>

    <!-- Submerged Hide Layers & Wooden Stirring Pole -->
    <path d="M 62 182 Q 125 204 188 182 Q 155 235 125 242 Q 95 235 62 182 Z" fill="url(#tannedHideCore)" stroke="#fde68a" stroke-width="1.2"/>
    <line x1="155" y1="102" x2="112" y2="232" stroke="#a16207" stroke-width="6" stroke-linecap="round"/>
    <!-- Daily Agitation Arrows -->
    <path d="M 88 168 C 105 156 145 156 162 168" fill="none" stroke="#fde68a" stroke-width="1.8" stroke-dasharray="3 2"/>

    <!-- Right: Zoomed Cross-Section Cutaway (100% Core Tanning + Warm Tallow Rub) -->
    <circle cx="302" cy="198" r="68" fill="#0f1722" stroke="#f59e0b" stroke-width="1.6"/>
    <!-- Fully Tanned Uniform Amber-Brown Hide Cross-Section (No White Raw Center) -->
    <rect x="252" y="176" width="100" height="44" rx="4" fill="url(#tannedHideCore)" stroke="#fde68a" stroke-width="1.3"/>
    <!-- Collagen Cross-Link Fiber Grid Inside Cross Section -->
    <line x1="260" y1="188" x2="344" y2="188" stroke="#fef3c7" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>
    <line x1="260" y1="198" x2="344" y2="198" stroke="#fef3c7" stroke-width="1.2" opacity="0.85"/>
    <line x1="260" y1="208" x2="344" y2="208" stroke="#fef3c7" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>

    <!-- Warm Animal Oil / Tallow Droplets Absorbing from Top -->
    <circle cx="282" cy="158" r="5" fill="url(#animalTallow)"/>
    <circle cx="302" cy="154" r="6" fill="url(#animalTallow)"/>
    <circle cx="322" cy="158" r="5" fill="url(#animalTallow)"/>
    <path d="M 302 162 L 302 174" stroke="#fde68a" stroke-width="1.8"/>
  </g>

  <!-- Label 2 -->
  <rect x="20" y="60" width="360" height="22" rx="2" fill="#141a23" stroke="#334155" stroke-width="1"/>
  <text x="28" y="75" fill="#fde68a" font-family="monospace" font-size="8.5" font-weight="bold">진흙 바른 구덩이 속에서 하루 2~3번 나뭇가지로 뒤집기</text>

  <!-- Label 3 -->
  <rect x="20" y="295" width="360" height="22" rx="2" fill="#141a23" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="28" y="310" fill="#f59e0b" font-family="monospace" font-size="8.2" font-weight="bold">가죽 모서리 단면 확인 (가운데 하얀 줄 없이 속까지 갈색)</text>

  <!-- Label 4 -->
  <rect x="20" y="330" width="360" height="22" rx="2" fill="#141a23" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="28" y="345" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">반쯤 말린 가죽 안쪽에 따뜻한 동물 기름 문질러 바르기</text>

  <!-- Label 5 -->
  <rect x="16" y="368" width="368" height="22" rx="2" fill="#1e293b" stroke="#e02424" stroke-width="1"/>
  <text x="24" y="383" fill="#ffffff" font-family="monospace" font-size="9.0" font-weight="bold">[3단계 핵심] 연한 물에서 진한 물로 속까지 완전히 물들이기</text>
</svg>