<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 340" class="w-full max-w-2xl h-auto" xmlns="http://www.w3.org/2000/svg" width="680" height="340">
  <defs>
    <marker id="arrow-white" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#F5F5F5" />
    </marker>
    <marker id="arrow-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E02424" />
    </marker>
  </defs>

  <!-- Grid borders -->
  <rect x="10" y="10" width="660" height="320" fill="none" stroke="#262626" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Hand Socket Block (Top Pressure Block) -->
  <path d="M 285 25 L 375 25 L 390 55 L 270 55 Z" fill="#222222" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="330" y="42" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">손잡이 누름판</text>

  <!-- Vertical Force Vector F_down -->
  <line x1="330" y1="12" x2="330" y2="25" stroke="#E02424" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="345" y="18" fill="#E02424" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">위에서 체중 실어 누르기 (12~15kg)</text>

  <!-- Spindle Axis (Rotating cylinder) -->
  <rect x="318" y="55" width="24" height="175" fill="#1e1e1e" stroke="#F5F5F5" stroke-width="1.5"/>
  
  <!-- Bow Cord Looped Around Spindle (1 Turn Loop) -->
  <!-- Bow Stick -->
  <path d="M 60 135 C 180 110, 480 110, 600 135" fill="none" stroke="#888888" stroke-width="6" stroke-linecap="square"/>
  <text x="110" y="102" fill="#AAAAAA" font-family="'JetBrains Mono', monospace" font-size="10">활대 (길이 65cm 휘어진 나뭇가지)</text>

  <!-- String with Tension & Single Wrap Loop around Spindle -->
  <path d="M 60 135 L 318 140" fill="none" stroke="#E5E5E5" stroke-width="2"/>
  <ellipse cx="330" cy="142" rx="16" ry="6" fill="none" stroke="#E5E5E5" stroke-width="2.5"/>
  <path d="M 342 144 L 600 135" fill="none" stroke="#E5E5E5" stroke-width="2"/>

  <!-- Horizontal Bow Stroke Sawing Arrows -->
  <line x1="180" y1="160" x2="480" y2="160" stroke="#E5E5E5" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="230" y1="160" x2="190" y2="160" stroke="#E5E5E5" stroke-width="2" marker-end="url(#arrow-white)"/>
  <line x1="430" y1="160" x2="470" y2="160" stroke="#E5E5E5" stroke-width="2" marker-end="url(#arrow-white)"/>
  <text x="330" y="175" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">활대 끝에서 끝까지 길게 당기고 밀기</text>

  <!-- Rotation RPM Velocity Vector -->
  <path d="M 360 85 A 25 15 0 1 1 360 105" fill="none" stroke="#E02424" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="385" y="98" fill="#E02424" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">빠르게 양방향 회전</text>

  <!-- Hearth Board Base -->
  <rect x="200" y="230" width="260" height="40" fill="#141414" stroke="#888888" stroke-width="1.5"/>
  <text x="210" y="254" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="9">바닥 받침 나무</text>

  <!-- Friction Contact Heat & Smoke Generation Point -->
  <circle cx="330" cy="230" r="5" fill="#E02424"/>
  
  <!-- Thermal Wave / Heat Glow Ring -->
  <circle cx="330" cy="230" r="14" fill="none" stroke="#E02424" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="330" cy="230" r="24" fill="none" stroke="#E02424" stroke-width="0.8" stroke-dasharray="1,3"/>
  
  <!-- Smoke Stream SVG Paths -->
  <path d="M 326 225 Q 315 210 322 195 T 310 180" fill="none" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M 334 225 Q 345 208 338 190 T 350 175" fill="none" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M 330 220 Q 330 200 325 185" fill="none" stroke="#E5E5E5" stroke-width="1"/>

  <text x="295" y="210" fill="#CCCCCC" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">하얀 연기가 피어오름</text>

  <!-- Technical Specification Box on the right -->
  <rect x="490" y="215" width="170" height="70" fill="#141414" stroke="#333333" stroke-width="1"/>
  <text x="500" y="232" fill="#E02424" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">불씨 만드는 핵심:</text>
  <text x="500" y="248" fill="#F5F5F5" font-family="'JetBrains Mono', monospace" font-size="9">마찰 열기: 400°C 이상</text>
  <text x="500" y="262" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">누르는 힘: 약하게 → 세게</text>
  <text x="500" y="276" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">활대 전체 길이를 끝까지 사용</text>
</svg>
