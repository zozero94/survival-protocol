<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-06 [SOLAR-STILL-WATER]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 01</text>

  <!-- 지표면 선 -->
  <line x1="40" y1="180" x2="360" y2="180" stroke="#404040" stroke-width="2"/>
  <text x="50" y="170" fill="#737373" font-family="monospace" font-size="9">GROUND LEVEL</text>

  <!-- 깔때기형 원형 웅덩이 단면 (Pit Excavation) -->
  <path d="M 80 180 Q 140 280 200 280 Q 260 280 320 180" fill="#121212" stroke="#FFFFFF" stroke-width="2"/>

  <!-- 직경 1.0m 치수선 -->
  <line x1="80" y1="160" x2="320" y2="160" stroke="#E5E5E5" stroke-width="1.5"/>
  <path d="M 85 155 L 80 160 L 85 165 M 315 155 L 320 160 L 315 165" fill="none" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="200" y="152" fill="#FFFFFF" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">DIAMETER 1.0m</text>

  <!-- 깊이 50cm 치수선 -->
  <line x1="340" y1="180" x2="340" y2="280" stroke="#E5E5E5" stroke-width="1.5"/>
  <path d="M 335 185 L 340 180 L 345 185 M 335 275 L 340 280 L 345 275" fill="none" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="350" y="235" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold">0.5m</text>

  <!-- 바닥 중앙 토기 안착 홈 (Pot Hollow) -->
  <rect x="180" y="275" width="40" height="15" fill="#262626" stroke="#737373" stroke-width="1"/>
  <text x="200" y="298" fill="#737373" font-family="monospace" font-size="8" text-anchor="middle">POT HOLLOW</text>

  <!-- 경사벽 생 잎사귀 충진 (Transpiration Foliage) -->
  <circle cx="120" cy="210" r="12" fill="#1C1C1C" stroke="#A3A3A3" stroke-width="1"/>
  <circle cx="150" cy="245" r="10" fill="#1C1C1C" stroke="#A3A3A3" stroke-width="1"/>
  <circle cx="280" cy="210" r="12" fill="#1C1C1C" stroke="#A3A3A3" stroke-width="1"/>
  <circle cx="250" cy="245" r="10" fill="#1C1C1C" stroke="#A3A3A3" stroke-width="1"/>
  <text x="135" y="230" fill="#A3A3A3" font-family="monospace" font-size="8">NON-TOXIC LEAVES (2x YIELD)</text>

  <!-- 하단 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 01: 1m CONICAL PIT &amp; FOLIAGE PACK</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">DIG 1m x 0.5m PIT IN SUNNY GROUND; PACK WITH EDIBLE LEAVES FOR TRANSPIRATION</text>
</svg>
