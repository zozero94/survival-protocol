<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg0103" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="100%" stop-color="#0d131c"/>
    </linearGradient>
    <linearGradient id="woodPole03" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="45%" stop-color="#78350f"/>
      <stop offset="75%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#2e1305"/>
    </linearGradient>
    <linearGradient id="barkWall03" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#574c41"/>
      <stop offset="50%" stop-color="#9e8d7c"/>
      <stop offset="100%" stop-color="#453b32"/>
    </linearGradient>
    <pattern id="sandBed03" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#855826"/>
      <circle cx="2" cy="2" r="1.3" fill="#fbbf24"/>
      <circle cx="7" cy="4" r="1.1" fill="#fde68a"/>
      <circle cx="4" cy="7" r="1.4" fill="#d97706"/>
      <circle cx="8" cy="8" r="1.2" fill="#f59e0b"/>
    </pattern>
    <pattern id="charcoalBed03" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#11151c"/>
      <polygon points="2,2 6,1 7,5 2,6" fill="#262f3d"/>
      <polygon points="7,6 11,5 10,10 6,11" fill="#1e2631"/>
    </pattern>
    <filter id="drop0103" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <pattern id="grid0103" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16212e" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg0103)"/>
  <rect width="400" height="400" fill="url(#grid0103)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#243447" stroke-width="1"/>

  <!-- Top Header (Label 1, y=32) -->
  <rect x="16" y="14" width="368" height="28" rx="2" fill="#0e1621" stroke="#2e4359" stroke-width="1"/>
  <text x="24" y="32" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">FIG. 03 // PURIFICATION STEP 3: 미세 모래층 적층</text>

  <!-- Main 3D Illustration Area (y: 84 ~ 288) -->
  <g filter="url(#drop0103)">
    <!-- LEFT PANEL: Cutaway Cone Mounted in Tripod Frame + 6cm Fine River Sand Layer (x: 20 ~ 238) -->
    <rect x="20" y="86" width="218" height="202" rx="3" fill="#0b1119" stroke="#26374a" stroke-width="1"/>

    <!-- Back Tripod Leg & Mid Horizontal Cradle Bar -->
    <path d="M 122 90 L 130 90 L 132 280 L 122 280 Z" fill="#3b1d0a" stroke="#261105" stroke-width="1"/>
    <path d="M 52 198 L 198 198 L 198 208 L 52 208 Z" fill="url(#woodPole03)" stroke="#d97706" stroke-width="1"/>

    <!-- Front Tripod Legs (Outside Cone) -->
    <path d="M 114 90 L 124 92 L 46 280 L 34 280 Z" fill="url(#woodPole03)" stroke="#261105" stroke-width="1.2"/>
    <path d="M 128 92 L 138 90 L 216 280 L 204 280 Z" fill="url(#woodPole03)" stroke="#261105" stroke-width="1.2"/>
    <!-- Top Tripod Apex Vine Lashing -->
    <path d="M 110 95 L 142 95 L 140 106 L 112 106 Z" fill="#b45309" stroke="#fde68a" stroke-width="1.2"/>
    <!-- Cradle Bar Leg Lashings -->
    <path d="M 68 195 L 82 211 M 82 195 L 68 211" stroke="#fde68a" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 168 195 L 182 211 M 182 195 L 168 211" stroke="#fde68a" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Cutaway Birch-Bark Cone Shell -->
    <path d="M 88 122 L 164 122 L 139 262 L 113 262 Z" fill="#11161f" stroke="url(#barkWall03)" stroke-width="3.5"/>
    <!-- Upper Rim Vine Ties -->
    <path d="M 88 122 L 99 118 M 164 122 L 153 118" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Layer 0: Bottom Sphagnum Moss Plug (y: 244 ~ 262) -->
    <path d="M 110 244 L 142 244 L 139 262 L 113 262 Z" fill="#15803d" stroke="#4ade80" stroke-width="1.2"/>

    <!-- Layer 1: 8cm Crushed Charcoal Bed (y: 194 ~ 244) -->
    <path d="M 101 194 L 151 194 L 142 244 L 110 244 Z" fill="url(#charcoalBed03)" stroke="#475569" stroke-width="1.2"/>

    <!-- Layer 2: 6cm Washed Fine River Sand Bed (y: 148 ~ 194) -->
    <path d="M 93 148 L 159 148 L 151 194 L 101 194 Z" fill="url(#sandBed03)" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- Horizontal Leveling Guide Arrows on Sand Surface (수평 다듬기) -->
    <line x1="98" y1="142" x2="154" y2="142" stroke="#fde68a" stroke-width="1.8" stroke-dasharray="4 2"/>
    <polygon points="96,142 103,138 103,146" fill="#fde68a"/>
    <polygon points="156,142 149,138 149,146" fill="#fde68a"/>

    <!-- 6cm (손가락 3마디) Dimension Callout Bracket on Cone Side -->
    <path d="M 163 148 L 172 148 L 172 194 L 163 194" fill="none" stroke="#fde68a" stroke-width="1.8"/>
    <!-- 3 Finger Knuckle Gauge Bars (손가락 3마디 척도 = 6cm) -->
    <rect x="176" y="149" width="22" height="13" rx="4" fill="#d97706" stroke="#fde68a" stroke-width="0.9"/>
    <rect x="176" y="164" width="22" height="13" rx="4" fill="#d97706" stroke="#fde68a" stroke-width="0.9"/>
    <rect x="176" y="179" width="22" height="13" rx="4" fill="#d97706" stroke="#fde68a" stroke-width="0.9"/>

    <!-- RIGHT PANEL TOP: Rinsing River Sand in Stream Water (x: 246 ~ 380, y: 86 ~ 182) -->
    <rect x="246" y="86" width="134" height="96" rx="3" fill="#0b1119" stroke="#38bdf8" stroke-width="1.1"/>
    <!-- Wooden Rinsing Bowl with Clean Golden Sand Settled at Bottom -->
    <path d="M 266 132 L 360 132 L 348 168 L 278 168 Z" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
    <path d="M 275 150 L 351 150 L 347 166 L 279 166 Z" fill="url(#sandBed03)" stroke="#fbbf24" stroke-width="1"/>
    <!-- Muddy Silt Cloud Pouring Off Top -->
    <path d="M 272 132 Q 313 122 354 132" fill="#0284c7" opacity="0.55"/>
    <path d="M 332 124 C 346 112 358 106 368 114" fill="none" stroke="#a16207" stroke-width="2.5" stroke-dasharray="3 2"/>
    <circle cx="352" cy="112" r="2.5" fill="#78350f"/>
    <circle cx="362" cy="116" r="2" fill="#92400e"/>

    <!-- RIGHT PANEL BOTTOM: Interlocking Sand Grains Trapping Fine Silt (x: 246 ~ 380, y: 190 ~ 288) -->
    <rect x="246" y="190" width="134" height="98" rx="3" fill="#0b1119" stroke="#f59e0b" stroke-width="1.1"/>
    <circle cx="313" cy="239" r="36" fill="#1c1610" stroke="#fbbf24" stroke-width="1.5"/>
    <!-- Dense Quartz Sand Grains -->
    <circle cx="298" cy="228" r="8" fill="#d97706" stroke="#fde68a" stroke-width="1"/>
    <circle cx="315" cy="226" r="8.5" fill="#f59e0b" stroke="#fde68a" stroke-width="1"/>
    <circle cx="330" cy="230" r="7.5" fill="#b45309" stroke="#fde68a" stroke-width="1"/>
    <circle cx="305" cy="244" r="8" fill="#f59e0b" stroke="#fde68a" stroke-width="1"/>
    <circle cx="322" cy="245" r="8" fill="#d97706" stroke="#fde68a" stroke-width="1"/>
    <!-- Mud Silt Particles Blocked at Top Gaps -->
    <circle cx="306" cy="218" r="3" fill="#78350f" stroke="#ef4444" stroke-width="0.8"/>
    <circle cx="323" cy="219" r="2.8" fill="#78350f" stroke="#ef4444" stroke-width="0.8"/>
    <!-- Filtered Clearer Water Trickling Down Below Sand -->
    <path d="M 313 254 L 313 268" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="313,271 309,265 317,265" fill="#38bdf8"/>
  </g>

  <!-- Label 2 (y=75) -->
  <rect x="20" y="60" width="360" height="22" rx="2" fill="#141c26" stroke="#334155" stroke-width="1"/>
  <text x="28" y="75" fill="#fde68a" font-family="monospace" font-size="8.5" font-weight="bold">물에 두세 번 깨끗이 헹궈 진흙을 뺀 고운 강모래</text>

  <!-- Label 3 (y=310) -->
  <rect x="20" y="295" width="360" height="22" rx="2" fill="#141c26" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="28" y="310" fill="#f59e0b" font-family="monospace" font-size="8.5" font-weight="bold">촘촘한 모래 알갱이 틈새로 미세한 흙먼지 찌꺼기 차단</text>

  <!-- Label 4 (y=345) -->
  <rect x="20" y="330" width="360" height="22" rx="2" fill="#141c26" stroke="#38bdf8" stroke-width="0.9"/>
  <text x="28" y="345" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">숯층 위로 손가락 세 마디 높이 (6cm) 평평하게 채우기</text>

  <!-- Label 5 (y=383) -->
  <rect x="16" y="368" width="368" height="22" rx="2" fill="#1e293b" stroke="#e02424" stroke-width="1"/>
  <text x="24" y="383" fill="#ffffff" font-family="monospace" font-size="8.8" font-weight="bold">[3단계 핵심] 숯 위에 모래를 6cm 평평하게 깔기</text>
</svg>
