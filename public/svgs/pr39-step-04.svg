<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg39s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="cup39s4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <pattern id="grid39s4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow39s4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg39s4)"/>
  <rect width="400" height="400" fill="url(#grid39s4)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Label 1 -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.2" font-weight="bold">FIG. 04 // 의식·대답 확인 후 경구수액 반 모금씩 보충</text>

  <!-- Label 2 -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9">눈맞춤 + 이름·질문 또렷이 대답할 때만 음수 허용</text>

  <!-- Main Dual Safety Visual: Left Alert Awake Small Sip (V) vs Right Unconscious Pouring Choking Hazard (X) -->
  <g filter="url(#shadow39s4)">
    <!-- Left Card: Conscious Upright Alert Head + Wooden Cup Small Half-Sip (GOOD V) -->
    <rect x="26" y="96" width="166" height="176" rx="6" fill="#052e16" fill-opacity="0.45" stroke="#22c55e" stroke-width="1.8"/>
    <circle cx="158" cy="122" r="14" fill="#052e16" stroke="#22c55e" stroke-width="1.8"/>
    <polyline points="151,122 156,127 165,117" fill="none" stroke="#86efac" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Awake Eye-Contact Head -->
    <circle cx="88" cy="148" r="22" fill="#334155" stroke="#86efac" stroke-width="1.8"/>
    <circle cx="96" cy="143" r="3.5" fill="#fef08a"/>
    <path d="M 88 156 L 104 156" stroke="#86efac" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Rustic Wooden Drinking Cup Held Up Gently -->
    <path d="M 106 184 L 112 222 Q 114 230 134 230 Q 154 230 156 222 L 162 184 Z" fill="url(#cup39s4)" stroke="#fde047" stroke-width="1.8"/>
    <ellipse cx="134" cy="188" rx="24" ry="6" fill="#38bdf8" fill-opacity="0.8"/>
    <!-- Small Controlled Drop Line Upward -->
    <circle cx="108" cy="170" r="3" fill="#7dd3fc"/>
    <circle cx="102" cy="162" r="2.5" fill="#7dd3fc"/>

    <!-- Right Card: Supine Unconscious Pouring Into Mouth -> Airway Choking (BAD X) -->
    <rect x="208" y="96" width="166" height="176" rx="6" fill="#2a0f14" fill-opacity="0.55" stroke="#ef4444" stroke-width="1.8"/>
    <circle cx="342" cy="122" r="14" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
    <line x1="335" y1="115" x2="349" y2="129" stroke="#fecaca" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="349" y1="115" x2="335" y2="129" stroke="#fecaca" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Supine Horizontal Unconscious Head (Closed X Eyes) -->
    <circle cx="272" cy="214" r="22" fill="#334155" stroke="#fca5a5" stroke-width="1.8"/>
    <line x1="264" y1="206" x2="270" y2="212" stroke="#fca5a5" stroke-width="2"/>
    <line x1="270" y1="206" x2="264" y2="212" stroke="#fca5a5" stroke-width="2"/>
    <!-- Tipped Wooden Bowl Pouring Stream Directly Down Into Airway -->
    <path d="M 278 140 L 318 158 L 308 176 L 268 158 Z" fill="url(#cup39s4)" stroke="#ef4444" stroke-width="1.5"/>
    <path d="M 272 162 L 272 192" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="272" cy="222" r="5" fill="#ef4444"/>
  </g>

  <!-- Label 3 -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#2a0f14" stroke="#ef4444" stroke-width="1"/>
  <text x="24" y="315" fill="#fca5a5" font-family="monospace" font-size="9">정신 혼미·누운 채 억지 급수(X) 기도 질식 위험 엄금</text>

  <!-- Label 4 -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#1e1b18" stroke="#d97706" stroke-width="1"/>
  <text x="24" y="344" fill="#fed7aa" font-family="monospace" font-size="9">소금·설탕 탄 물 나무 컵으로 5분 간격 반 모금씩</text>

  <!-- Label 5 -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="376" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">[핵심] 의식 100% 확인 후 소량 ORS 급수 + 구조 신호</text>
</svg>