<line stroke-dasharray="2,2" x1="95" x2="95" y1="198" y2="204"></line>
<line stroke-dasharray="2,2" x1="100" x2="100" y1="198" y2="204"></line>
<line stroke-dasharray="2,2" x1="105" x2="105" y1="198" y2="204"></line>
