<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 340" class="w-full max-w-2xl h-auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E02424" />
    </marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F5F5" />
    </marker>
  </defs>

  <!-- Background technical coordinate lines -->
  <rect x="0" y="0" width="680" height="340" fill="#131313" />
  <rect x="10" y="10" width="660" height="320" fill="none" stroke="#262626" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="340" y1="20" x2="340" y2="320" stroke="#222222" stroke-width="1" />

  <!-- Core River Stone (Base Cobble) -->
  <path d="M 220 275 C 180 265 145 225 155 180 C 165 140 210 130 260 135 C 310 140 345 165 350 210 C 355 250 310 280 220 275 Z" 
        fill="#1c1b1b" stroke="#F5F5F5" stroke-width="1.8" />
  
  <!-- Flake detachment line & fracture cone -->
  <path d="M 310 150 Q 325 180 340 215" stroke="#E02424" stroke-width="2.2" stroke-dasharray="3 3" />
  <path d="M 340 215 C 360 210 395 185 400 160 C 390 145 350 140 310 150 Z" 
        fill="#262626" stroke="#E02424" stroke-width="2" />

  <!-- Detached Sharp Axe Blade (Separating Flake) -->
  <path d="M 430 190 Q 480 145 520 180 Q 490 225 430 190 Z" 
        fill="#1a1a1a" stroke="#F5F5F5" stroke-width="2" />
  <path d="M 430 190 Q 475 160 520 180" stroke="#E02424" stroke-width="2" />

  <!-- Hammerstone (Striking Stone) -->
  <ellipse cx="280" cy="70" rx="42" ry="30" fill="#222222" stroke="#F5F5F5" stroke-width="1.8" transform="rotate(-25 280 70)" />
  
  <!-- 45 Degree Kinetic Strike Vector -->
  <line x1="260" y1="85" x2="310" y2="148" stroke="#E02424" stroke-width="3" marker-end="url(#arrow)" />
  
  <!-- 45 Degree Angle Arc & Guide Lines -->
  <line x1="310" y1="150" x2="380" y2="150" stroke="#737373" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="310" y1="150" x2="260" y2="90" stroke="#737373" stroke-width="1" stroke-dasharray="3 3" />
  <path d="M 350 150 A 40 40 0 0 0 338 122" fill="none" stroke="#E02424" stroke-width="1.8" />

  <!-- Technical dimension line -->
  <line x1="155" y1="295" x2="350" y2="295" stroke="#525252" stroke-width="1" />
  <line x1="155" y1="290" x2="155" y2="300" stroke="#525252" stroke-width="1" />
  <line x1="350" y1="290" x2="350" y2="300" stroke="#525252" stroke-width="1" />

  <!-- 5 Clear Korean labels placed in non-overlapping safe zones -->
  <rect x="25" y="28" width="205" height="24" fill="#0e0e0e" stroke="#333333" stroke-width="1" />
  <text x="35" y="44" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5F5F5">① 둥근 망치돌 (내리치는 돌)</text>

  <rect x="25" y="84" width="215" height="24" fill="#0e0e0e" stroke="#333333" stroke-width="1" />
  <text x="35" y="100" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E02424">② 모서리 45° 비스듬히 치기</text>

  <rect x="420" y="112" width="225" height="24" fill="#0e0e0e" stroke="#333333" stroke-width="1" />
  <text x="430" y="128" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E02424" font-weight="bold">날카로운 돌날 (두께 1~2cm)</text>

  <rect x="420" y="245" width="230" height="24" fill="#0e0e0e" stroke="#333333" stroke-width="1" />
  <text x="430" y="261" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5F5F5">④ 쪼개져 나온 도끼날 돌조각</text>

  <text x="250" y="316" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9E9E9E" text-anchor="middle">③ 바닥에 받친 큰 강돌 (너비 15~20cm)</text>
</svg>
