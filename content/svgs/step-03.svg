<?xml version="1.0" encoding="UTF-8"?>
<svg class="w-full max-w-[320px] h-auto" viewBox="0 0 280 155" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Boiling Pot Diagram -->
  <rect x="30" y="45" width="80" height="60" stroke="#FFF" stroke-width="1.5" fill="#181818"></rect>
  <line x1="20" y1="55" x2="30" y2="55" stroke="#FFF" stroke-width="1.5"></line>
  <line x1="110" y1="55" x2="120" y2="55" stroke="#FFF" stroke-width="1.5"></line>
  <!-- Rolling boil violent bubbles -->
  <circle cx="50" cy="75" r="4" stroke="#FFF" stroke-width="1"></circle>
  <circle cx="70" cy="65" r="5" stroke="#FFF" stroke-width="1"></circle>
  <circle cx="90" cy="72" r="3.5" stroke="#FFF" stroke-width="1"></circle>
  <circle cx="60" cy="85" r="3" stroke="#FFF" stroke-width="1"></circle>
  <circle cx="80" cy="88" r="4.5" stroke="#FFF" stroke-width="1"></circle>
  <!-- Steam waves -->
  <path d="M50 35 Q55 25 50 15" stroke="#888" stroke-width="1"></path>
  <path d="M70 35 Q75 25 70 15" stroke="#888" stroke-width="1"></path>
  <path d="M90 35 Q95 25 90 15" stroke="#888" stroke-width="1"></path>
  <!-- Campfire underneath -->
  <path d="M40 115 L70 106 L100 115" stroke="#E02424" stroke-width="1.5"></path>
  <path d="M55 125 L70 110 L85 125" stroke="#E02424" stroke-width="1.5"></path>
  <text x="70" y="137" fill="#E02424" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle">100°C 직화 가열</text>

  <!-- Threshold timer graph on right -->
  <line x1="145" y1="120" x2="255" y2="120" stroke="#555" stroke-width="1"></line>
  <line x1="145" y1="25" x2="145" y2="120" stroke="#555" stroke-width="1"></line>
  
  <!-- Curve -->
  <path d="M145 110 Q175 95 190 40 L250 40" stroke="#FFFFFF" stroke-width="1.5" fill="none"></path>
  <line x1="190" y1="20" x2="190" y2="120" stroke="#E02424" stroke-width="0.8" stroke-dasharray="2 2"></line>
  
  <text x="148" y="35" fill="#AAA" font-family="'JetBrains Mono', monospace" font-size="7">100°C</text>
  <text x="192" y="32" fill="#E02424" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold">3분 지속</text>
  <text x="220" y="65" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="7.5">사멸률 99.9%</text>
  
  <text x="200" y="133" fill="#888" font-family="'JetBrains Mono', monospace" font-size="7">비등 유지 시간 (MIN)</text>
</svg>