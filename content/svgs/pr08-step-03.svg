<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgP08S3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b"/>
      <stop offset="50%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>
    <linearGradient id="woodGrad3A" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#713f12"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="woodGrad3B" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadowP08S3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="400" height="400" fill="url(#bgP08S3)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#22262c" stroke-width="1"/>

  <!-- Technical Corner Crosshairs -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#374151" stroke-width="1"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#374151" stroke-width="1"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#374151" stroke-width="1"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#374151" stroke-width="1"/>

  <!-- Label 1: Blueprint Header -->
  <text x="24" y="28" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="0.5">FIG. 03 // 3-POINT TENSION EQUILIBRIUM (NUMERAL 4)</text>
  <line x1="24" y1="36" x2="376" y2="36" stroke="#262d35" stroke-width="1"/>

  <!-- Ground Plane Baseline -->
  <line x1="30" y1="310" x2="370" y2="310" stroke="#374151" stroke-width="1.5"/>

  <!-- The 3 Sticks Assembled (Numeral 4 Structure) -->
  <g filter="url(#shadowP08S3)">
    <!-- 1. Vertical Post: (x: 120, y: 70 to 310) -->
    <rect x="110" y="70" width="18" height="240" rx="3" fill="url(#woodGrad3A)" stroke="#451a03" stroke-width="1"/>
    <!-- Top Chisel tip -->
    <polygon points="110,70 119,50 128,70" fill="#fde68a" stroke="#78350f" stroke-width="1"/>

    <!-- 2. Diagonal Strut: From top of post (119,50) down-right to (260, 205) -->
    <line x1="119" y1="52" x2="260" y2="210" stroke="#000000" stroke-width="22" stroke-linecap="round"/>
    <line x1="119" y1="52" x2="260" y2="210" stroke="url(#woodGrad3B)" stroke-width="16" stroke-linecap="round"/>

    <!-- 3. Horizontal Bait Stick: (x: 80 to 340, y: 195 to 210) -->
    <rect x="80" y="195" width="260" height="15" rx="2" fill="url(#woodGrad3A)" stroke="#451a03" stroke-width="1"/>
    <!-- Pointed Bait Tip at x=340 -->
    <polygon points="340,195 355,202 340,210" fill="#fde68a" stroke="#78350f" stroke-width="1"/>
  </g>

  <!-- Pivot Contact Vectors & Dots -->
  <!-- Top Interlock (Contact 1) -->
  <circle cx="119" cy="52" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
  <path d="M 125 45 L 145 35" stroke="#ef4444" stroke-width="1"/>

  <!-- Pivot A: Post & Bait Stick (Contact 2) -->
  <circle cx="119" cy="202" r="5" fill="#fbbf24" stroke="#ffffff" stroke-width="1"/>
  <!-- Label 2: Pivot A -->
  <text x="32" y="165" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="bold">PIVOT A (기둥-미끼대 수평 맞물림 홈)</text>
  <path d="M 75 170 L 115 198" stroke="#fbbf24" stroke-width="0.8"/>

  <!-- Pivot B: Strut Bottom & Bait Stick (Contact 3) -->
  <circle cx="260" cy="202" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
  <!-- Label 3: Pivot B -->
  <text x="170" y="145" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="bold">PIVOT B (버팀목 하단-미끼대 후방 홈)</text>
  <path d="M 230 150 L 260 195" stroke="#38bdf8" stroke-width="0.8"/>

  <!-- Counter Tension Equilibrium Dynamic Curve & Force Lines -->
  <path d="M 130 90 Q 200 130 250 190" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M 235 210 L 140 210" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Label 4: Counter Tension -->
  <text x="80" y="245" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="bold">COUNTER TENSION (세 막대의 상호 반발력)</text>

  <!-- Action Highlight Block (Label 5) -->
  <rect x="24" y="338" width="352" height="38" rx="2" fill="#111827" stroke="#374151" stroke-width="1"/>
  <rect x="24" y="338" width="4" height="38" fill="#a855f7"/>
  <!-- Label 5: Step Core Instruction -->
  <text x="38" y="362" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">[3단계 핵심] 끈 없이 마찰력만으로 스스로 서는 4자 틀</text>
</svg>
