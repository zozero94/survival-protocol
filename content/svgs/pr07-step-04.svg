<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
              <rect width="400" height="400" fill="#0d0d0d" />
              <text x="20" y="30" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">FIG. 04 // TAUT-LINE HITCH (당김매듭) 장력 조절 단면도</text>
              <line x1="20" y1="38" x2="380" y2="38" stroke="#1f1f1f" stroke-width="1" />

              <!-- Main Tension Line (Horizontal White Line) -->
              <line x1="30" y1="200" x2="370" y2="200" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
              <text x="30" y="180" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10">① 기둥/팩 회전 유턴선</text>
              <line x1="30" y1="188" x2="100" y2="188" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#arrow-white)" />

              <!-- Ground Peg on Right -->
              <rect x="340" y="130" width="16" height="140" fill="#252525" stroke="#444444" transform="rotate(15 348 200)" />
              <text x="260" y="150" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">말뚝을 돌아서 돌아오는 밧줄</text>

              <!-- Turn around the peg -->
              <path d="M 340 195 C 365 205 365 235 330 240" stroke="#E0FE10" stroke-width="5" fill="none" />

              <!-- Working Rope returning and coiling around standing line -->
              <!-- Loop 1 (Inside Coil 1) -->
              <path d="M 280 240 L 250 200" stroke="#E0FE10" stroke-width="5" />
              <path d="M 250 200 C 245 160 225 160 220 200" stroke="#E0FE10" stroke-width="5" fill="none" />
              <path d="M 220 200 C 215 240 235 240 240 200" stroke="#E0FE10" stroke-width="5" fill="none" />

              <!-- Loop 2 (Inside Coil 2 - Next to coil 1) -->
              <path d="M 215 200 C 210 160 190 160 185 200" stroke="#E0FE10" stroke-width="5" fill="none" />
              <path d="M 185 200 C 180 240 200 240 205 200" stroke="#E0FE10" stroke-width="5" fill="none" />

              <!-- Outer Half Hitch (Outside Coil towards the peg) -->
              <path d="M 205 200 L 265 200" stroke="#E0FE10" stroke-width="4" stroke-dasharray="3 2" />
              <path d="M 265 200 C 270 155 295 155 290 200" stroke="#E0FE10" stroke-width="5" fill="none" />
              <path d="M 290 200 L 285 270" stroke="#E0FE10" stroke-width="5" stroke-linecap="round" />
              <polygon points="285,278 280,264 292,266" fill="#E0FE10" />

              <!-- Annotations on Coils -->
              <rect x="100" y="70" width="135" height="42" fill="#141414" stroke="#E0FE10" stroke-width="1" />
              <text x="105" y="88" fill="#E0FE10" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">② 내부 2회 마찰 권선</text>
              <text x="105" y="102" fill="#aaaaaa" font-family="'JetBrains Mono', monospace" font-size="8">장력을 흡수하는 이중 루프</text>
              <line x1="210" y1="112" x2="210" y2="160" stroke="#E0FE10" stroke-width="1" />

              <rect x="245" y="70" width="135" height="42" fill="#141414" stroke="#262626" stroke-width="1" />
              <text x="250" y="88" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">③ 바깥쪽 1회 잠금 매듭</text>
              <text x="250" y="102" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">풀림을 방지하는 락 매듭</text>
              <line x1="290" y1="112" x2="290" y2="160" stroke="#666666" stroke-width="1" />

              <!-- Slide Arrow showing adjustment -->
              <g stroke="#E0FE10" stroke-width="2">
                <line x1="150" y1="310" x2="250" y2="310" marker-end="url(#arrow)" marker-start="url(#arrow-rev)" />
              </g>
              <text x="135" y="335" fill="#E0FE10" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">④ 손으로 잡고 미는 슬라이드 방향</text>

              <defs>
                <marker id="arrow-white" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF" />
                </marker>
                <marker id="arrow-rev" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                  <path d="M 10 0 L 0 5 L 10 10 z" fill="#E0FE10" />
                </marker>
              </defs>
              <text x="304.9" y="206" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">줄 길이를 늘리고 줄이는 자유 이동</text>
  <text x="314.2" y="228" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">⑤ 텐트 장력 작용 시 자동 잠금</text>
  <text x="302.9" y="250" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">바람이 당기면 마찰력으로 쐐기 체결</text>
</svg>