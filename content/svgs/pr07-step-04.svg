<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="standingRope4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2883e"/>
      <stop offset="50%" stop-color="#f5b867"/>
      <stop offset="100%" stop-color="#946123"/>
    </linearGradient>
    <linearGradient id="workingRope4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bg04)"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#222" stroke-width="1"/>

  <!-- Blueprint Header -->
  <text x="20" y="30" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">FIG. 04 // BOWLINE STEP 4: 토끼굴 재진입</text>
  <line x1="20" y1="38" x2="380" y2="38" stroke="#262626" stroke-width="1"/>

  <!-- Back Turn of Working Rope Behind Tree -->
  <path d="M 210 130 C 210 85 255 75 270 90 C 285 110 240 125 180 125" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 210 130 C 210 85 255 75 270 90 C 285 110 240 125 180 125" stroke="url(#workingRope4)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Standing Part of Rope (원줄 나무 - Drawn in Front) -->
  <path d="M 200 45 L 200 130" stroke="#050505" stroke-width="14" stroke-linecap="round"/>
  <path d="M 200 45 L 200 130" stroke="url(#standingRope4)" stroke-width="8" stroke-linecap="round"/>

  <!-- Main Hanging Eye Loop -->
  <path d="M 160 145 C 130 160 110 220 130 280 C 150 320 220 320 250 280 C 270 250 260 210 240 170" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 160 145 C 130 160 110 220 130 280 C 150 320 220 320 250 280 C 270 250 260 210 240 170" stroke="url(#standingRope4)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- The 6-Loop (토끼굴) Ring Structure -->
  <path d="M 200 130 C 130 140 130 220 200 230 C 240 235 260 210 240 170" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 200 130 C 130 140 130 220 200 230 C 240 235 260 210 240 170" stroke="url(#standingRope4)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- First Upward Strand (from Step 2) -->
  <path d="M 230 250 C 220 210 210 170 210 130" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 230 250 C 220 210 210 170 210 130" stroke="url(#workingRope4)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Working End Diving DOWN into the Rabbit Hole (Drawn in Front) -->
  <path d="M 180 125 C 150 135 155 180 175 220 L 180 250" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 180 125 C 150 135 155 180 175 220 L 180 250" stroke="url(#workingRope4)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Downward Motion Vector Arrow -->
  <line x1="162" y1="145" x2="175" y2="215" stroke="#4ade80" stroke-width="2.5"/>
  <polygon points="178,225 168,212 181,210" fill="#4ade80"/>

  <!-- Callouts -->
  <!-- 1. Diving Down Label (Top Left) -->
  <rect x="25" y="65" width="145" height="42" fill="#181818" stroke="#333" stroke-width="1"/>
  <text x="35" y="82" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">BACK INTO HOLE</text>
  <text x="35" y="96" fill="#e0e0e0" font-family="'JetBrains Mono', monospace" font-size="9">위에서 아래로 재진입</text>

  <!-- 2. Parallel Pair in the Loop (Center Right) -->
  <circle cx="195" cy="235" r="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="211" y1="235" x2="265" y2="235" stroke="#38bdf8" stroke-width="1"/>
  <text x="275" y="232" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">PARALLEL STRANDS</text>
  <text x="275" y="245" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">두 가닥이 나란히 정렬</text>

  <!-- 3. Collar Forming (Top Right) -->
  <line x1="250" y1="110" x2="310" y2="140" stroke="#f5b867" stroke-width="1"/>
  <circle cx="250" cy="110" r="2" fill="#f5b867"/>
  <text x="275" y="152" fill="#f5b867" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">COLLAR LOOP</text>
  <text x="275" y="165" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">나무를 감싼 뒤통수 고리</text>

  <!-- Bottom Instruction Box -->
  <rect x="20" y="335" width="360" height="45" fill="#141414" stroke="#262626" stroke-width="1"/>
  <text x="30" y="352" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">[4단계 핵심] 토끼가 굴 속으로 다시 쏙 들어감</text>
  <text x="30" y="368" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">나무를 돌아 나온 끝단을 처음 나왔던 토끼굴에 위에서 아래로 찔러 넣습니다.</text>
</svg>