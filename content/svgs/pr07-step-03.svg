<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="standingRope3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2883e"/>
      <stop offset="50%" stop-color="#f5b867"/>
      <stop offset="100%" stop-color="#946123"/>
    </linearGradient>
    <linearGradient id="workingRope3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bg03)"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#222" stroke-width="1"/>

  <!-- Blueprint Header -->
  <text x="20" y="30" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">FIG. 03 // BOWLINE STEP 3: 나무(원줄) 뒤편 선회</text>
  <line x1="20" y1="38" x2="380" y2="38" stroke="#262626" stroke-width="1"/>

  <!-- Working Rope Behind the Standing Part (Draw First) -->
  <path d="M 190 120 C 190 85 240 70 260 85 C 275 100 240 125 185 125" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 190 120 C 190 85 240 70 260 85 C 275 100 240 125 185 125" stroke="url(#workingRope3)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Standing Part of Rope (원줄 나무 - Drawn in FRONT of the working rope) -->
  <path d="M 200 45 L 200 130" stroke="#050505" stroke-width="14" stroke-linecap="round"/>
  <path d="M 200 45 L 200 130" stroke="url(#standingRope3)" stroke-width="8" stroke-linecap="round"/>

  <!-- Working Rope Emerging to the Left (Drawn in Front) -->
  <path d="M 185 125 C 150 125 140 160 160 185" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 185 125 C 150 125 140 160 160 185" stroke="url(#workingRope3)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Main Hanging Eye Loop -->
  <path d="M 160 145 C 130 160 110 220 130 280 C 150 320 220 320 250 280 C 270 250 260 210 240 170" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 160 145 C 130 160 110 220 130 280 C 150 320 220 320 250 280 C 270 250 260 210 240 170" stroke="url(#standingRope3)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- The 6-Loop (토끼굴) Ring Structure -->
  <path d="M 200 130 C 130 140 130 220 200 230 C 240 235 260 210 240 170" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 200 130 C 130 140 130 220 200 230 C 240 235 260 210 240 170" stroke="url(#standingRope3)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Motion Curving Arrow Behind Tree -->
  <path d="M 200 100 Q 255 80 250 110 Q 230 130 170 130" fill="none" stroke="#E02424" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="160,130 172,124 172,136" fill="#E02424"/>

  <!-- Callouts -->
  <!-- 1. Around Behind Tree (Top Right) -->
  <rect x="235" y="55" width="145" height="42" fill="#181818" stroke="#333" stroke-width="1"/>
  <text x="245" y="72" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">AROUND THE TREE</text>
  <text x="245" y="86" fill="#e0e0e0" font-family="'JetBrains Mono', monospace" font-size="9">원줄 '뒤쪽'을 감아 돔</text>

  <!-- 2. Standing Trunk (Top Left) -->
  <line x1="200" y1="65" x2="130" y2="65" stroke="#888" stroke-width="1"/>
  <circle cx="200" cy="65" r="2" fill="#888"/>
  <text x="50" y="62" fill="#f5b867" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">TREE (나무 기둥줄)</text>
  <text x="50" y="75" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">토끼가 돌아 나갈 중심 축</text>

  <!-- 3. Target Re-Entry Point (Center Left) -->
  <circle cx="170" cy="190" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="20" y="210" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">RE-ENTRY READY</text>
  <text x="20" y="223" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">다시 굴로 진입할 준비</text>

  <!-- Bottom Instruction Box -->
  <rect x="20" y="335" width="360" height="45" fill="#141414" stroke="#262626" stroke-width="1"/>
  <text x="30" y="352" fill="#f5b867" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">[3단계 핵심] 굴에서 나온 토끼가 원줄 뒤편을 감싸 돎</text>
  <text x="30" y="368" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">반드시 원줄의 '뒤'로 돌아야 단단히 조여지는 칼라(Collar) 루프가 만들어집니다.</text>
</svg>