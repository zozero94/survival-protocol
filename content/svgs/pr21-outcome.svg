<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <pattern id="grid21out" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#161f2c" stroke-width="0.7"/>
    </pattern>
    <linearGradient id="foilRef21out" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="oilPool21out" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="flameOut21" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow21out" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <marker id="arrOutHeat" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f97316"/>
    </marker>
  </defs>

  <!-- 16:9 Widescreen Background -->
  <rect x="0" y="0" width="800" height="450" fill="#080b10"/>
  <rect x="12" y="12" width="776" height="426" fill="url(#grid21out)" stroke="#263346" stroke-width="1.2"/>

  <!-- Top Master Header Banner -->
  <rect x="24" y="20" width="752" height="32" rx="3" fill="#111827" stroke="#f59e0b" stroke-width="1.2"/>

  <!-- Left Column: Stage 01 & Stage 02 Cards -->
  <!-- Stage 01 Card -->
  <rect x="24" y="68" width="210" height="72" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>
  <line x1="234" y1="104" x2="322" y2="334" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Stage 02 Card -->
  <rect x="24" y="156" width="210" height="72" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="234" y1="192" x2="352" y2="256" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Right Column: Stage 03 & Stage 04 Cards -->
  <!-- Stage 03 Card -->
  <rect x="566" y="68" width="210" height="72" rx="4" fill="#1c1917" stroke="#fbbf24" stroke-width="1.2"/>
  <line x1="566" y1="104" x2="466" y2="292" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Stage 04 Card -->
  <rect x="566" y="156" width="210" height="72" rx="4" fill="#2a1205" stroke="#f97316" stroke-width="1.2"/>
  <line x1="566" y1="192" x2="458" y2="184" stroke="#f97316" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Center 3D Complete Tuna Can Oil Wick Heater & Foil Reflector Assembly -->
  <g filter="url(#shadow21out)">
    <!-- Accordion-Folded Silver Foil Reflector Wall (Behind Can) -->
    <polygon points="268,94 316,80 316,320 268,336" fill="url(#foilRef21out)" stroke="#f8fafc" stroke-width="1.3"/>
    <polygon points="316,80 374,74 374,312 316,320" fill="#cbd5e1" stroke="#f8fafc" stroke-width="1.3"/>
    <polygon points="374,74 434,78 434,314 374,312" fill="url(#foilRef21out)" stroke="#f8fafc" stroke-width="1.3"/>
    <polygon points="434,78 482,92 482,328 434,314" fill="#94a3b8" stroke="#f8fafc" stroke-width="1.3"/>

    <!-- Ceramic/Slate Bottom Base Shield -->
    <ellipse cx="400" cy="356" rx="135" ry="22" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>

    <!-- Corrugated Steel Tuna Can Body Cutaway -->
    <path d="M 304 252 L 304 342 A 96 18 0 0 0 496 342 L 496 252 Z" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- 1cm Pebble Thermal Buffer at Bottom -->
    <path d="M 308 322 A 92 14 0 0 0 492 322 L 492 340 A 92 16 0 0 1 308 340 Z" fill="#57534e" stroke="#a8a29e" stroke-width="1"/>
    <circle cx="336" cy="331" r="6" fill="#a8a29e"/>
    <circle cx="364" cy="333" r="6.5" fill="#78716c"/>
    <circle cx="396" cy="332" r="6" fill="#a8a29e"/>
    <circle cx="428" cy="333" r="6.5" fill="#78716c"/>
    <circle cx="460" cy="331" r="6" fill="#a8a29e"/>

    <!-- 80% Cooking Oil Reservoir -->
    <path d="M 306 268 A 94 15 0 0 0 494 268 L 494 322 A 94 15 0 0 1 306 322 Z" fill="url(#oilPool21out)" stroke="#fbbf24" stroke-width="1.2"/>
    <ellipse cx="400" cy="268" rx="94" ry="15" fill="#fde68a" fill-opacity="0.35" stroke="#fbbf24" stroke-width="1"/>

    <!-- 3 Twisted Tissue Wicks & Multi-Fold Foil Bridge Clip -->
    <rect x="354" y="254" width="10" height="68" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
    <rect x="395" y="254" width="10" height="70" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
    <rect x="436" y="254" width="10" height="68" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1"/>

    <path d="M 296 254 L 504 254 L 496 262 L 304 262 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="350" y="244" width="18" height="16" rx="2" fill="#cbd5e1" stroke="#f8fafc" stroke-width="1"/>
    <rect x="391" y="244" width="18" height="16" rx="2" fill="#cbd5e1" stroke="#f8fafc" stroke-width="1"/>
    <rect x="432" y="244" width="18" height="16" rx="2" fill="#cbd5e1" stroke="#f8fafc" stroke-width="1"/>

    <!-- 3 Smokeless Flames -->
    <circle cx="359" cy="224" r="18" fill="url(#flameOut21)"/>
    <path d="M 359 200 C 351 214 351 228 359 238 C 367 228 367 214 359 200 Z" fill="#f97316" stroke="#fef08a" stroke-width="1"/>
    <circle cx="400" cy="220" r="20" fill="url(#flameOut21)"/>
    <path d="M 400 194 C 391 210 391 226 400 238 C 409 226 409 210 400 194 Z" fill="#f97316" stroke="#fef08a" stroke-width="1"/>
    <circle cx="441" cy="224" r="18" fill="url(#flameOut21)"/>
    <path d="M 441 200 C 433 214 433 228 441 238 C 449 228 449 214 441 200 Z" fill="#f97316" stroke="#fef08a" stroke-width="1"/>

    <!-- 2 Stripped Metal Wire Pot Stand Bars & Heated Metal Cup Above -->
    <line x1="292" y1="242" x2="508" y2="242" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="298" y1="248" x2="502" y2="248" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Metal Water Cup / Pot Being Heated Above Trivet -->
    <path d="M 348 128 L 348 192 A 52 10 0 0 0 452 192 L 452 128 Z" fill="#1e293b" fill-opacity="0.88" stroke="#94a3b8" stroke-width="1.4"/>
    <ellipse cx="400" cy="128" rx="52" ry="10" fill="#334155" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M 452 142 C 472 142 472 176 452 176" fill="none" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Forward Radiant Heat Rays -->
    <path d="M 468 214 L 548 202" stroke="#f97316" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrOutHeat)"/>
    <path d="M 472 232 L 554 232" stroke="#f97316" stroke-width="2.2" stroke-dasharray="5,3" marker-end="url(#arrOutHeat)"/>
  </g>

  <!-- Bottom Verification Banner -->
  <rect x="24" y="394" width="752" height="32" rx="3" fill="#111827" stroke="#34d399" stroke-width="1.2"/>

  <!-- 10 SVG TEXT LABELS (1:1 Match with outcome.svgLabels) -->
  <text x="400" y="41" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PR-21 OUTCOME // 72-HOUR TUNA CAN &amp; COOKING OIL WICK HEATER</text>

  <text x="129" y="94" fill="#cbd5e1" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">STAGE 01: CAN &amp; PEBBLE BUFFER</text>
  <text x="129" y="120" fill="#f8fafc" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">1cm 자갈·모래 바닥 단열층</text>

  <text x="129" y="182" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">STAGE 02: 3X TISSUE WICK &amp; FOIL</text>
  <text x="129" y="208" fill="#bae6fd" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">화장지 3중 심지 &amp; 호일 브릿지</text>

  <text x="671" y="94" fill="#fbbf24" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">STAGE 03: 80% COOKING OIL</text>
  <text x="671" y="120" fill="#fde68a" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">식용유 4/5 충진 &amp; 72시간 연소</text>

  <text x="671" y="182" fill="#fb923c" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">STAGE 04: FOIL REFLECTOR &amp; POT</text>
  <text x="671" y="208" fill="#fed7aa" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">은박 열 반사벽 &amp; 철사 냄비 받침대</text>

  <text x="400" y="415" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">FIELD VERIFIED // ZERO-SMOKE INDOOR HEAT &amp; HOT WATER SYSTEM</text>
</svg>
