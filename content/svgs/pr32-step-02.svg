<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg32s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="rod32s2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="50%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <pattern id="grid32s2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#27272a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow32s2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg32s2)"/>
  <rect width="400" height="400" fill="url(#grid32s2)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Header Banner (Label 1) -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#ef4444" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 02 // 매듭 사이 막대(숟가락·가지) 삽입 및 360도 회전 동맥 압착</text>

  <!-- Label 2 Callout Box -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9.5">한 뼘(15cm) 길이의 단단한 금속 숟가락·참나무 가지를 매듭에 끼워 회전</text>

  <!-- Main Illustration: Windlass Rod Twisting & Arterial Compression -->
  <g filter="url(#shadow32s2)">
    <!-- Limb cross-section / cylinder -->
    <rect x="135" y="86" width="130" height="202" rx="28" fill="#27272a" stroke="#52525b" stroke-width="3"/>
    <!-- Upper artery (active blood flow) -->
    <line x1="200" y1="88" x2="200" y2="150" stroke="#ef4444" stroke-width="6"/>
    <!-- Lower artery (occluded / stopped flow) -->
    <line x1="200" y1="184" x2="200" y2="284" stroke="#52525b" stroke-width="3" stroke-dasharray="4 4"/>

    <!-- Constricting wide belt -->
    <rect x="128" y="146" width="144" height="38" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="2.5"/>
    <!-- Twisted knot center -->
    <circle cx="200" cy="165" r="16" fill="#451a03" stroke="#fde68a" stroke-width="2"/>

    <!-- Windlass Rod (Spoon handle / sturdy stick) -->
    <rect x="92" y="158" width="216" height="14" rx="6" fill="url(#rod32s2)" stroke="#52525b" stroke-width="1.5" transform="rotate(-16 200 165)"/>

    <!-- 360 Degree Torque Arrows -->
    <path d="M 145 118 A 55 55 0 0 1 255 118" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-dasharray="5 3"/>
    <polygon points="258,120 248,112 249,124" fill="#fde68a"/>
    <path d="M 255 212 A 55 55 0 0 1 145 212" fill="none" stroke="#fde68a" stroke-width="2.5" stroke-dasharray="5 3"/>
    <polygon points="142,210 152,218 151,206" fill="#fde68a"/>

    <!-- Stopped bleeding indicator at wound -->
    <ellipse cx="200" cy="244" rx="24" ry="9" fill="#3f3f46" stroke="#4ade80" stroke-width="2"/>
    <polyline points="192,244 198,250 210,238" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  </g>

  <!-- Label 3: Compression Check -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="315" fill="#94a3b8" font-family="monospace" font-size="9">선홍색 피가 완전히 멈추고 손목·발목 맥박이 사라질 때까지 2~3바퀴 조임</text>

  <!-- Label 4: Warning Box -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#2d0607" stroke="#ef4444" stroke-width="1"/>
  <text x="24" y="344" fill="#fca5a5" font-family="monospace" font-size="9">어설픈 압박 금지: 정맥만 막히고 동맥이 열리면 울혈로 출혈이 더 심해짐</text>

  <!-- Label 5: Core Principle Footer -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#ef4444" stroke-width="1.2"/>
  <text x="24" y="376" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">[지렛대 원리] 막대 회전 토크로 뼈 주변 깊은 대동맥을 100% 물리적 폐쇄</text>
</svg>
