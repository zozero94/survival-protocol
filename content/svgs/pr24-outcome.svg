<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg24out" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070a0e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="water24out" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="metal24out" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="grid24out" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow24out" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background & Tactical Frame -->
  <rect width="800" height="450" fill="url(#bg24out)"/>
  <rect width="800" height="450" fill="url(#grid24out)"/>
  <rect x="10" y="10" width="780" height="430" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header Banner (Label 1) -->
  <rect x="20" y="20" width="760" height="38" rx="3" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="36" y="44" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold">PR-24 완성체 // WHO 표준 경구수액(ORS) · 0.9% 상처 세척 식염수</text>

  <!-- 4-Stage Horizontal Engineering Pipeline -->
  <g filter="url(#shadow24out)">
    <!-- STAGE 01 Card -->
    <rect x="20" y="74" width="178" height="296" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="28" y="84" width="162" height="28" rx="2" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="36" y="103" fill="#38bdf8" font-family="monospace" font-size="11.5" font-weight="bold">STAGE 01: 무균 용매 1L</text>

    <!-- Boiling Pot + Two 500mL Bottles Visual -->
    <rect x="46" y="138" width="60" height="48" rx="3" fill="url(#metal24out)" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="52" y="150" width="48" height="32" fill="url(#water24out)"/>
    <circle cx="66" cy="170" r="4" fill="#ffffff"/>
    <circle cx="84" cy="164" r="4.5" fill="#ffffff"/>
    <!-- Two 500mL Bottles -->
    <rect x="118" y="130" width="24" height="62" rx="3" fill="url(#water24out)" stroke="#bae6fd" stroke-width="1.2"/>
    <rect x="148" y="130" width="24" height="62" rx="3" fill="url(#water24out)" stroke="#bae6fd" stroke-width="1.2"/>
    <path d="M44,218 L174,218" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="109" cy="256" r="22" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <path d="M100,256 L107,263 L120,249" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="28" y="316" width="162" height="42" rx="2" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="34" y="341" fill="#e2e8f0" font-family="monospace" font-size="10">3분 끓여 식힌 물 500mL 용기 2개</text>

    <!-- STAGE 02 Card -->
    <rect x="214" y="74" width="178" height="296" rx="4" fill="#0b1120" stroke="#fde047" stroke-width="1.2"/>
    <rect x="222" y="84" width="162" height="28" rx="2" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
    <text x="230" y="103" fill="#fde047" font-family="monospace" font-size="11.5" font-weight="bold">STAGE 02: 경구수액(ORS)</text>

    <!-- 1L ORS Pitcher + Salt Pinch + 2 Level Spoons Sugar -->
    <path d="M270,132 L336,132 L330,224 L276,224 Z" fill="url(#water24out)" stroke="#bae6fd" stroke-width="1.5"/>
    <ellipse cx="303" cy="176" rx="20" ry="6" fill="none" stroke="#fde047" stroke-width="1.2" stroke-dasharray="3,2"/>
    <!-- Salt & Sugar Spoons -->
    <ellipse cx="250" cy="158" rx="14" ry="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="250" cy="156" r="4" fill="#ffffff"/>
    <ellipse cx="356" cy="158" rx="16" ry="6" fill="#fef08a" stroke="#eab308" stroke-width="1"/>
    <ellipse cx="356" cy="178" rx="16" ry="6" fill="#fef08a" stroke="#eab308" stroke-width="1"/>
    <circle cx="303" cy="262" r="22" fill="#0f172a" stroke="#fde047" stroke-width="1.5"/>
    <path d="M293,268 L301,254 L307,260 L315,248" fill="none" stroke="#fde047" stroke-width="2.2" stroke-linecap="round"/>

    <rect x="222" y="316" width="162" height="42" rx="2" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="228" y="341" fill="#fef08a" font-family="monospace" font-size="10">물 1L + 소금 2꼬집 + 설탕 2스푼</text>

    <!-- STAGE 03 Card -->
    <rect x="408" y="74" width="178" height="296" rx="4" fill="#0b1120" stroke="#10b981" stroke-width="1.2"/>
    <rect x="416" y="84" width="162" height="28" rx="2" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="424" y="103" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="bold">STAGE 03: 소량 분할 섭취</text>

    <!-- Tear Drop Check + 5-Min Clock + Small Sip Cup -->
    <path d="M456,136 C456,136 442,156 442,166 C442,175 448,182 456,182 C464,182 470,175 470,166 C470,156 456,136 456,136 Z" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.2"/>
    <circle cx="530" cy="162" r="26" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
    <path d="M530,162 L530,140 A22,22 0 0,1 549,151 Z" fill="#10b981" fill-opacity="0.5"/>
    <path d="M530,162 L530,142 M530,162 L546,153" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- Cup & Spoon -->
    <rect x="476" y="216" width="42" height="52" rx="3" fill="url(#water24out)" stroke="#bae6fd" stroke-width="1.2"/>
    <ellipse cx="454" cy="232" rx="12" ry="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>

    <rect x="416" y="316" width="162" height="42" rx="2" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="422" y="341" fill="#a7f3d0" font-family="monospace" font-size="10">눈물 맛 검증 후 5분마다 2모금</text>

    <!-- STAGE 04 Card -->
    <rect x="602" y="74" width="178" height="296" rx="4" fill="#0b1120" stroke="#f97316" stroke-width="1.2"/>
    <rect x="610" y="84" width="162" height="28" rx="2" fill="#0f172a" stroke="#f97316" stroke-width="1"/>
    <text x="612" y="103" fill="#fdba74" font-family="monospace" font-size="10.5" font-weight="bold">STAGE 04: 0.9% 상처 식염수</text>

    <!-- Sugar-Free 500mL Saline Irrigation Stream onto Forearm Wound -->
    <g transform="translate(708, 134) rotate(125)">
      <rect x="-14" y="-32" width="28" height="48" rx="3" fill="#0284c7" stroke="#bae6fd" stroke-width="1.2"/>
    </g>
    <path d="M688,154 L678,224 L694,224 Z" fill="url(#water24out)"/>
    <rect x="622" y="220" width="138" height="24" rx="4" fill="#d6b498" stroke="#f8fafc" stroke-width="1.2"/>
    <ellipse cx="686" cy="224" rx="16" ry="4.5" fill="#dc2626" stroke="#fecaca" stroke-width="1"/>
    <!-- Sugar Crossed Out Badge -->
    <circle cx="644" cy="162" r="16" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
    <path d="M636,154 L652,170 M652,154 L636,170" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>

    <rect x="610" y="316" width="162" height="42" rx="2" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="612" y="341" fill="#fed7aa" font-family="monospace" font-size="9.5">무설탕 물 500mL + 소금 반 작은술</text>
  </g>

  <!-- Bottom Verification Banner (Label 10) -->
  <rect x="20" y="388" width="760" height="40" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="36" y="413" fill="#ecfdf5" font-family="monospace" font-size="13" font-weight="bold">야전 검증 완료 // 급성 설사 탈수 쇼크 구명 &amp; 무통증 상처 세척</text>
</svg>
