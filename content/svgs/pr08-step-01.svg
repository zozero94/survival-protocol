<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgP08S1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b"/>
      <stop offset="50%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>
    <linearGradient id="stickGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="35%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="notchWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadowP08" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="400" height="400" fill="url(#bgP08S1)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#22262c" stroke-width="1"/>

  <!-- Technical Corner Crosshairs -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#374151" stroke-width="1"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#374151" stroke-width="1"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#374151" stroke-width="1"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#374151" stroke-width="1"/>

  <!-- Label 1: Blueprint Header -->
  <text x="24" y="28" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="0.5">FIG. 01 // COMPONENT SPEC &amp; NOTCH BLUEPRINT</text>
  <line x1="24" y1="36" x2="376" y2="36" stroke="#262d35" stroke-width="1"/>

  <!-- Technical Grid Guide Lines -->
  <line x1="40" y1="50" x2="40" y2="320" stroke="#161c24" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="360" y1="50" x2="360" y2="320" stroke="#161c24" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 1. Vertical Post (Top) -->
  <g filter="url(#shadowP08)">
    <!-- Base Stick -->
    <rect x="60" y="65" width="220" height="20" rx="3" fill="url(#stickGrad1)" stroke="#451a03" stroke-width="1"/>
    <!-- Top Chisel Tip (Left End) -->
    <polygon points="60,65 42,75 60,85" fill="url(#notchWood)" stroke="#78350f" stroke-width="1"/>
    <!-- Middle Square Notch -->
    <polygon points="160,65 174,65 174,77 160,77" fill="url(#notchWood)" stroke="#78350f" stroke-width="1"/>
    <rect x="160" y="77" width="14" height="8" fill="#18181b" opacity="0.6"/>
  </g>
  <!-- Label 2: Vertical Post -->
  <text x="50" y="108" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">VERTICAL POST (수직 기둥 20cm)</text>

  <!-- 2. Diagonal Strut (Middle) -->
  <g filter="url(#shadowP08)">
    <rect x="60" y="145" width="260" height="20" rx="3" fill="url(#stickGrad1)" stroke="#451a03" stroke-width="1"/>
    <!-- Top Notch (Left End 45-deg cutout) -->
    <polygon points="75,145 92,145 75,165" fill="url(#notchWood)" stroke="#78350f" stroke-width="1"/>
    <!-- Bottom Bevel (Right End) -->
    <polygon points="320,145 320,165 300,165" fill="url(#notchWood)" stroke="#78350f" stroke-width="1"/>
  </g>
  <!-- Label 3: Diagonal Strut -->
  <text x="50" y="188" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">DIAGONAL STRUT (대각 버팀대 25cm)</text>

  <!-- 3. Horizontal Bait Stick (Bottom) -->
  <g filter="url(#shadowP08)">
    <rect x="50" y="225" width="300" height="18" rx="3" fill="url(#stickGrad1)" stroke="#451a03" stroke-width="1"/>
    <!-- Front Notch A (matches vertical post middle notch) -->
    <polygon points="120,225 132,225 132,236 120,236" fill="url(#notchWood)" stroke="#78350f" stroke-width="1"/>
    <!-- Rear Notch B (catches diagonal strut bottom) -->
    <polygon points="215,225 230,225 215,243" fill="url(#notchWood)" stroke="#78350f" stroke-width="1"/>
    <!-- Pointed Bait End (Right tip) -->
    <polygon points="350,225 368,234 350,243" fill="url(#notchWood)" stroke="#78350f" stroke-width="1"/>
  </g>
  <!-- Label 4: Bait Stick -->
  <text x="50" y="268" fill="#4ade80" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">BAIT STICK (수평 미끼대 30cm)</text>

  <!-- Dimension Indicator Lines -->
  <path d="M 45 60 L 45 90 M 42 75 L 368 75" stroke="#4b5563" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Action Highlight Block (Label 5) -->
  <rect x="24" y="338" width="352" height="38" rx="2" fill="#111827" stroke="#374151" stroke-width="1"/>
  <rect x="24" y="338" width="4" height="38" fill="#f59e0b"/>
  <!-- Label 5: Step Core Instruction -->
  <text x="38" y="362" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">[1단계 핵심] 45도 각진 쐐기와 사각 걸림턱 가공</text>
</svg>
