<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-04 [PRIMITIVE-STONE-AXE]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 03</text>

  <!-- 조립된 도끼 손잡이 및 석기 날 -->
  <rect x="185" y="160" width="30" height="130" fill="#141414" stroke="#737373" stroke-width="1.5"/>
  <polygon points="130,110 200,60 270,110 225,170 175,170" fill="#262626" stroke="#FFFFFF" stroke-width="2"/>

  <!-- 8자형 교차 칡 섬유 바인딩 (Figure-8 Lashings) -->
  <line x1="140" y1="120" x2="230" y2="190" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="145" y1="130" x2="225" y2="200" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="150" y1="140" x2="220" y2="210" stroke="#FFFFFF" stroke-width="2.5"/>

  <line x1="260" y1="120" x2="170" y2="190" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="255" y1="130" x2="175" y2="200" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="250" y1="140" x2="180" y2="210" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- 수평 감기 밴드 (Frapping Turns) -->
  <rect x="175" y="155" width="50" height="25" fill="none" stroke="#E5E5E5" stroke-width="2" stroke-dasharray="3 2"/>

  <!-- 송진 + 숯가루 혼합 코팅층 (Black Pine Pitch Cement) -->
  <path d="M 160 145 Q 200 135 240 145 Q 235 215 200 215 Q 165 215 160 145 Z" fill="#0A0A0A" fill-opacity="0.7" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="200" y="235" fill="#FFFFFF" font-family="monospace" font-size="10" text-anchor="middle" font-weight="black">PINE PITCH + CHARCOAL CEMENT</text>

  <!-- 수축 장력 화살표 (Shrinkage Tension) -->
  <path d="M 140 185 L 160 175 M 260 185 L 240 175" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="80" y="190" fill="#A3A3A3" font-family="monospace" font-size="9">WET KUDZU SHRINKAGE</text>

  <!-- 하단 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 03: FIGURE-8 LASHINGS &amp; RESIN SEAL</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">WET FIBERS SHRINK TIGHT LIKE IRON; SEAL WITH CHARCOAL PITCH TO LOCK</text>
</svg>
