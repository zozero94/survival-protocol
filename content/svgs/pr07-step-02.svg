<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="standingRope2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2883e"/>
      <stop offset="50%" stop-color="#f5b867"/>
      <stop offset="100%" stop-color="#946123"/>
    </linearGradient>
    <linearGradient id="workingRope2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bg02)"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#222" stroke-width="1"/>

  <!-- Blueprint Header -->
  <text x="20" y="30" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">FIG. 02 // BOWLINE STEP 2: 토끼굴 상향 탈출</text>
  <line x1="20" y1="38" x2="380" y2="38" stroke="#262626" stroke-width="1"/>

  <!-- Standing Part of Rope (원줄) -->
  <path d="M 200 45 L 200 130" stroke="#050505" stroke-width="14" stroke-linecap="round"/>
  <path d="M 200 45 L 200 130" stroke="url(#standingRope2)" stroke-width="8" stroke-linecap="round"/>

  <!-- Lower Main Loop Hanging Down (큰 메인 고리 형성 부) -->
  <path d="M 160 145 C 130 160 110 220 130 280 C 150 320 220 320 250 280 C 270 250 260 210 240 170" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 160 145 C 130 160 110 220 130 280 C 150 320 220 320 250 280 C 270 250 260 210 240 170" stroke="url(#standingRope2)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- The 6-Loop (토끼굴) Ring Structure -->
  <path d="M 200 130 C 130 140 130 220 200 230 C 240 235 260 210 240 170" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 200 130 C 130 140 130 220 200 230 C 240 235 260 210 240 170" stroke="url(#standingRope2)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Working End (녹색 토끼 줄) Penetrating UPWARDS from underneath the hole -->
  <!-- Layer under loop entering back-to-front -->
  <path d="M 250 280 C 240 240 200 220 190 200 L 190 120" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 250 280 C 240 240 200 220 190 200 L 190 120" stroke="url(#workingRope2)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Front Crossing Over Ring Edge -->
  <path d="M 200 130 C 175 135 160 145 160 145" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 200 130 C 175 135 160 145 160 145" stroke="url(#standingRope2)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Upward Motion Vector Arrow (수직 상향 화살표) -->
  <line x1="190" y1="180" x2="190" y2="105" stroke="#4ade80" stroke-width="2.5"/>
  <polygon points="190,95 183,110 197,110" fill="#4ade80"/>

  <!-- Callouts -->
  <!-- 1. Upward Exit Label (Top Left) -->
  <rect x="25" y="70" width="145" height="42" fill="#181818" stroke="#333" stroke-width="1"/>
  <text x="35" y="87" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">EMERGE FROM HOLE</text>
  <text x="35" y="101" fill="#e0e0e0" font-family="'JetBrains Mono', monospace" font-size="9">굴 아래에서 위로 탈출</text>

  <!-- 2. Rabbit Head Working Tip (Top Center) -->
  <circle cx="190" cy="120" r="10" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="210" y="115" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">토끼 머리 15cm</text>
  <text x="210" y="128" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">충분한 길이 인출</text>

  <!-- 3. Lower Loop Description (Bottom Right) -->
  <text x="260" y="270" fill="#f5b867" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">MAIN EYE LOOP</text>
  <text x="260" y="284" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">최종 하중을 받을 큰 고리</text>

  <!-- Bottom Instruction Box -->
  <rect x="20" y="335" width="360" height="45" fill="#141414" stroke="#262626" stroke-width="1"/>
  <text x="30" y="352" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">[2단계 핵심] 굴 밑바닥에서 위쪽으로 토끼를 쑥 뽑아 올림</text>
  <text x="30" y="368" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">위에서 아래로 찌르면 매듭이 풀리는 올가미가 되므로 절대 주의하십시오.</text>
</svg>