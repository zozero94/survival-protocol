<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg22s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#11161d"/>
    </linearGradient>
    <linearGradient id="boxExt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b88b54"/>
      <stop offset="100%" stop-color="#7c562b"/>
    </linearGradient>
    <linearGradient id="foilSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="sh22s2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background & HUD Frame -->
  <rect width="400" height="400" fill="url(#bg22s2)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#334155" stroke-width="1"/>
  <path d="M8 24 L24 8 M376 8 L392 24 M8 376 L24 392 M376 392 L392 376" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="14" y="14" width="372" height="28" fill="#131922" stroke="#475569" stroke-width="1"/>
  <text x="24" y="32" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">FIG. 02 // 은박 호일 내장 골판지 보온 후드 터널</text>

  <!-- Label 1 Callout Box: U-Shaped Cardboard Hood -->
  <rect x="20" y="50" width="360" height="28" rx="2" fill="#1c1917" stroke="#f59e0b" stroke-width="1"/>
  <text x="32" y="68" fill="#fef3c7" font-family="sans-serif" font-size="11" font-weight="bold">어깨너비(60cm) 상체 감싸는 ㄷ자형 골판지 터널 후드</text>

  <!-- Label 2 Callout Box: Inner Foil Reflective Lining -->
  <rect x="20" y="84" width="360" height="28" rx="2" fill="#161f2c" stroke="#94a3b8" stroke-width="1"/>
  <text x="32" y="102" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="bold">상자 내벽 천장에 부착한 주방 은박 호일 반사층</text>

  <!-- 3D Cutaway of Cardboard Tunnel Hood with Shiny Foil Ceiling -->
  <g filter="url(#sh22s2)">
    <!-- Base 3-Layer Cardboard Mat -->
    <polygon points="45,282 355,282 375,302 25,302" fill="#875f32" stroke="#d97706" stroke-width="1.2"/>
    <rect x="25" y="302" width="350" height="8" fill="#5c3d1e" stroke="#92400e" stroke-width="1"/>

    <!-- Outer Cardboard Arch / U-Hood -->
    <path d="M68,292 L68,158 L112,126 L288,126 L332,158 L332,292 L308,292 L308,168 L278,144 L122,144 L92,168 L92,292 Z" fill="url(#boxExt)" stroke="#fde047" stroke-width="1.5"/>

    <!-- Inner Silver Foil Lining on Ceiling & Side Walls -->
    <polygon points="94,284 94,170 124,146 276,146 306,170 306,284 294,284 294,176 270,156 130,156 106,176 106,284" fill="url(#foilSheen)" stroke="#e2e8f0" stroke-width="1.2"/>
    <!-- Metallic Foil Glint Lines -->
    <line x1="145" y1="150" x2="160" y2="156" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="230" y1="150" x2="245" y2="156" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Human Head & Shoulders Silhouette Inside Hood (Clear Anatomical Pictogram) -->
    <circle cx="200" cy="242" r="20" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M148,292 C148,266 172,262 200,262 C228,262 252,266 252,292 Z" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Upward Body Heat & Downward Reflected IR Heat Arrows -->
    <!-- Center Reflection -->
    <path d="M200,218 L200,162" stroke="#f97316" stroke-width="2" stroke-dasharray="3,2"/>
    <path d="M200,162 L182,212 M179,205 L182,212 L188,208" stroke="#fbbf24" stroke-width="2.2" fill="none"/>
    <path d="M200,162 L218,212 M212,208 L218,212 L221,205" stroke="#fbbf24" stroke-width="2.2" fill="none"/>

    <!-- Left Wall Reflection -->
    <path d="M168,238 L114,195" stroke="#f97316" stroke-width="1.8" stroke-dasharray="3,2"/>
    <path d="M114,195 L156,252 M149,250 L156,252 L156,245" stroke="#fbbf24" stroke-width="2" fill="none"/>

    <!-- Right Wall Reflection -->
    <path d="M232,238 L286,195" stroke="#f97316" stroke-width="1.8" stroke-dasharray="3,2"/>
    <path d="M286,195 L244,252 M244,245 L244,252 L251,250" stroke="#fbbf24" stroke-width="2" fill="none"/>
  </g>

  <!-- Label 3 Callout Box: 90% IR Heat Reflection -->
  <rect x="20" y="314" width="360" height="28" rx="2" fill="#271712" stroke="#f97316" stroke-width="1"/>
  <text x="32" y="332" fill="#fed7aa" font-family="sans-serif" font-size="11" font-weight="bold">인체 체열(100W 적외선) 90% 하향 재반사 구조</text>

  <!-- Footer Key Takeaway Banner -->
  <rect x="14" y="352" width="372" height="32" fill="#1e1b18" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="26" y="372" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">[핵심] 데울 공기 부피 축소 및 복사열 손실 차단</text>
</svg>
