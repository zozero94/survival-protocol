<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1602" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#0e1319"/>
    </linearGradient>
    <linearGradient id="outerClay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="innerClay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="sandBed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="drop1602" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="grid1602" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16202c" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg1602)"/>
  <rect width="400" height="400" fill="url(#grid1602)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#253342" stroke-width="1"/>

  <!-- Top Header (Label 1) -->
  <rect x="16" y="14" width="368" height="28" rx="2" fill="#0f1722" stroke="#2c3e50" stroke-width="1"/>
  <text x="26" y="32" fill="#fde68a" font-family="monospace" font-size="11" font-weight="bold">FIG. 02 // CONCENTRIC POT NESTING &amp; BASE BEDDING</text>

  <!-- Label 2: Base Sand Bedding -->
  <rect x="20" y="54" width="360" height="22" rx="2" fill="#141a23" stroke="#d97706" stroke-width="0.8"/>
  <text x="28" y="69" fill="#fde68a" font-family="monospace" font-size="8.5" font-weight="bold">큰 토기 바닥 세척 강 모래 4~5cm(손가락 두 마디) 포설</text>

  <!-- Cross-Section Cutaway of Nested Pots -->
  <g filter="url(#drop1602)">
    <!-- Flush Rim Alignment Reference Line -->
    <line x1="65" y1="115" x2="335" y2="115" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Large Outer Pot Cutaway -->
    <path d="M 85 115 L 315 115 L 290 275 C 285 288 265 292 200 292 C 135 292 115 288 110 275 Z" fill="url(#outerClay)" stroke="#fb923c" stroke-width="1.5"/>
    <path d="M 97 115 L 303 115 L 280 268 L 120 268 Z" fill="#0b1118"/>

    <!-- Bottom Sand Layer (4~5cm / 2 knuckles thick) -->
    <path d="M 118 242 L 282 242 L 280 268 L 120 268 Z" fill="url(#sandBed)" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="150" cy="255" r="2" fill="#fef08a"/>
    <circle cx="185" cy="252" r="2" fill="#ffffff"/>
    <circle cx="215" cy="258" r="2" fill="#fef08a"/>
    <circle cx="250" cy="254" r="2" fill="#ffffff"/>

    <!-- Small Inner Pot Nested Concentrically on Sand Bed -->
    <path d="M 130 115 L 270 115 L 255 242 L 145 242 Z" fill="url(#innerClay)" stroke="#fdba74" stroke-width="1.5"/>
    <path d="M 140 115 L 260 115 L 246 232 L 154 232 Z" fill="#131b26"/>

    <!-- Uniform 3~4cm Side Gap Arrows (Left & Right) -->
    <path d="M 99 165 L 128 165" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="99,162 99,168 94,165" fill="#38bdf8"/>
    <polygon points="128,162 128,168 133,165" fill="#38bdf8"/>

    <path d="M 272 165 L 301 165" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="272,162 272,168 267,165" fill="#38bdf8"/>
    <polygon points="301,162 301,168 306,165" fill="#38bdf8"/>
  </g>

  <!-- Label 3: Concentric Centering -->
  <rect x="20" y="302" width="360" height="22" rx="2" fill="#141a23" stroke="#334155" stroke-width="1"/>
  <text x="28" y="317" fill="#94a3b8" font-family="monospace" font-size="8.5" font-weight="bold">작은 토기 정중앙 동심원 수평 안착</text>

  <!-- Label 4: Uniform 3-4cm Gap -->
  <rect x="20" y="334" width="360" height="22" rx="2" fill="#141a23" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="28" y="349" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">사방 벽면 사이 손가락 두 개(3~4cm) 균일 간격 확보</text>

  <!-- Label 5: Step 2 Callout -->
  <rect x="16" y="368" width="368" height="22" rx="2" fill="#1e293b" stroke="#e02424" stroke-width="1"/>
  <text x="24" y="383" fill="#ffffff" font-family="monospace" font-size="9.5" font-weight="bold">[2단계 핵심] 내·외부 토기 상단 테두리 수평 정렬</text>
</svg>
