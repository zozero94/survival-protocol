<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="standingRope5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2883e"/>
      <stop offset="50%" stop-color="#f5b867"/>
      <stop offset="100%" stop-color="#946123"/>
    </linearGradient>
    <linearGradient id="workingRope5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bg05)"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#222" stroke-width="1"/>

  <!-- Blueprint Header -->
  <text x="20" y="30" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">FIG. 05 // BOWLINE STEP 5: 락킹 및 1초 해체</text>
  <line x1="20" y1="38" x2="380" y2="38" stroke="#262626" stroke-width="1"/>

  <!-- Standing Line Under Strong Tension (Upward) -->
  <path d="M 180 45 L 180 150" stroke="#050505" stroke-width="14" stroke-linecap="round"/>
  <path d="M 180 45 L 180 150" stroke="url(#standingRope5)" stroke-width="8" stroke-linecap="round"/>

  <!-- Tightened Nipper Loop (조여진 토끼굴 루프) -->
  <path d="M 180 150 C 150 160 140 190 170 200 C 195 205 205 185 195 165 C 190 155 180 150 180 150" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 180 150 C 150 160 140 190 170 200 C 195 205 205 185 195 165 C 190 155 180 150 180 150" stroke="url(#standingRope5)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Collar Loop Around Standing Line (뒤통수 칼라 링) -->
  <path d="M 175 195 C 160 185 155 155 180 145 C 205 140 215 170 195 195" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 175 195 C 160 185 155 155 180 145 C 205 140 215 170 195 195" stroke="url(#workingRope5)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Parallel Working Tail & Main Eye Loop (Tightly Pinched Together) -->
  <!-- Working End Tail -->
  <path d="M 190 190 L 220 230" stroke="#050505" stroke-width="14" stroke-linecap="round"/>
  <path d="M 190 190 L 220 230" stroke="url(#workingRope5)" stroke-width="8" stroke-linecap="round"/>

  <!-- Main Fixed Eye Loop (Hanging Rigid Below) -->
  <path d="M 170 200 C 130 240 120 280 150 310 C 180 330 220 330 240 300 C 260 270 240 230 220 200" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 170 200 C 130 240 120 280 150 310 C 180 330 220 330 240 300 C 260 270 240 230 220 200" stroke="url(#standingRope5)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Cinching Grip Indicator (Hand Grip Zone) -->
  <ellipse cx="205" cy="215" rx="20" ry="24" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-dasharray="3 2"/>

  <!-- Tension Vector Arrows -->
  <!-- Upward Pull on Standing Line -->
  <line x1="180" y1="90" x2="180" y2="55" stroke="#E02424" stroke-width="2.5"/>
  <polygon points="180,48 173,62 187,62" fill="#E02424"/>

  <!-- Downward Pull on Eye Loop -->
  <line x1="205" y1="260" x2="205" y2="295" stroke="#E02424" stroke-width="2.5"/>
  <polygon points="205,302 198,288 212,288" fill="#E02424"/>

  <!-- 1-Sec Quick Release "Break the Back" Indicator Box (Right Side) -->
  <g id="quickReleaseBox">
    <rect x="250" y="70" width="135" height="100" fill="#181818" stroke="#E02424" stroke-width="1"/>
    <text x="260" y="88" fill="#E02424" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">1-SEC QUICK RELEASE</text>
    <text x="260" y="103" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9">뒤통수(칼라) 꺾기 비법</text>

    <!-- Finger Push Motion Diagram -->
    <path d="M 280 145 C 295 125 320 125 335 145" stroke="#f5b867" stroke-width="4" fill="none"/>
    <line x1="307" y1="148" x2="307" y2="128" stroke="#4ade80" stroke-width="2"/>
    <polygon points="307,122 302,132 312,132" fill="#4ade80"/>
    <text x="260" y="160" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="8">엄지로 칼라를 꺾으면 즉시 해체</text>
  </g>

  <!-- Callouts -->
  <!-- 1. Pull Standing Line (Top Left) -->
  <text x="40" y="75" fill="#f5b867" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">PULL STANDING</text>
  <text x="40" y="88" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">원줄을 위로 강하게 당김</text>

  <!-- 2. Grip Together (Center Right) -->
  <line x1="225" y1="215" x2="270" y2="215" stroke="#4ade80" stroke-width="1"/>
  <circle cx="225" cy="215" r="2" fill="#4ade80"/>
  <text x="280" y="212" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">GRIP TOGETHER</text>
  <text x="280" y="225" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">끝단과 고리를 한 손에 쥠</text>

  <!-- 3. Fixed Loop (Bottom Left) -->
  <text x="25" y="280" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">LOCKED FIXED LOOP</text>
  <text x="25" y="293" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">하중을 받아도 크기 불변</text>

  <!-- Bottom Instruction Box -->
  <rect x="20" y="335" width="360" height="45" fill="#141414" stroke="#262626" stroke-width="1"/>
  <text x="30" y="352" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">[5단계 핵심] 양손으로 잡고 반대로 당겨 락킹 체결</text>
  <text x="30" y="368" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">풀 때는 매듭 뒤편 칼라 링을 엄지로 젖히면 칼 없이 1초 만에 풀립니다.</text>
</svg>