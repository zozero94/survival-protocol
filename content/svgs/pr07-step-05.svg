<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
              <rect width="400" height="400" fill="#0d0d0d" />
              <text x="20" y="30" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">FIG. 05 // SQUARE LASHING (사각 결속 &amp; 프래핑 조임)</text>
              <line x1="20" y1="38" x2="380" y2="38" stroke="#1f1f1f" stroke-width="1" />

              <!-- Vertical Timber (Bottom log) -->
              <rect x="165" y="55" width="70" height="290" rx="3" fill="#161616" stroke="#2d2d2d" stroke-width="1.5" />
              <text x="175" y="75" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="9">① 세로 기둥 말뚝매듭 시작점</text>

              <!-- Horizontal Timber (Top log crossing at 90 deg) -->
              <rect x="55" y="165" width="290" height="70" rx="3" fill="#1c1c1c" stroke="#383838" stroke-width="1.5" />
              <text x="65" y="185" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="9">흔들림 없는 기본 고정 체결</text>

              <!-- Starting Clove Hitch on Vertical Log (Below cross) -->
              <path d="M 165 255 L 235 255" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="3 2" />
              <text x="80" y="265" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">② 십자 3회 사각 래핑선 (Wrapping)</text>

              <!-- 3 Wrapping Turns (White Lines around outer perimeter) -->
              <rect x="145" y="145" width="110" height="110" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
              <rect x="140" y="140" width="120" height="120" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round" />
              <rect x="135" y="135" width="130" height="130" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round" />
              <text x="35" y="135" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">가로목과 세로목을 직각으로 둘러 감기</text>

              <!-- 3 Frapping Turns (Fluorescent #E0FE10 tight circles BETWEEN the two logs!) -->
              <!-- Squeezing the ropes tightly -->
              <ellipse cx="200" cy="200" rx="35" ry="35" fill="none" stroke="#E0FE10" stroke-width="6" stroke-linecap="round" />
              <ellipse cx="200" cy="200" rx="30" ry="30" fill="none" stroke="#E0FE10" stroke-width="4" stroke-linecap="round" />
              
              <!-- Directional Squeeze Arrows (Inward vectors) -->
              <g stroke="#E0FE10" stroke-width="2">
                <line x1="150" y1="200" x2="170" y2="200" marker-end="url(#arrow)" />
                <line x1="250" y1="200" x2="230" y2="200" marker-end="url(#arrow)" />
                <line x1="200" y1="150" x2="200" y2="170" marker-end="url(#arrow)" />
                <line x1="200" y1="250" x2="200" y2="230" marker-end="url(#arrow)" />
              </g>

              <!-- Frapping Label & Callout -->
              <rect x="250" y="270" width="130" height="56" fill="#141414" stroke="#E0FE10" stroke-width="1" />
              <text x="214.5" y="288" fill="#E0FE10" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">③ 틈새 3회 강력 프래핑 조임 (Frapping)</text>
              <text x="260" y="302" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="8">나무 사이를 쥐어짜 유격 완전 제거</text>
              <text x="231.1" y="315" fill="#aaaaaa" font-family="'JetBrains Mono', monospace" font-size="8">④ 가로 통나무 지지선 (Horizontal Spar)</text>

              <line x1="230" y1="220" x2="250" y2="270" stroke="#E0FE10" stroke-width="1" />
              <text x="316.5" y="206" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">하중을 지탱하는 횡방향 구조목</text>
  <text x="334.2" y="228" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">⑤ 최종 말뚝매듭 마감선</text>
  <text x="313.3" y="250" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">못 없이 완성하는 반영구 결속체</text>
</svg>