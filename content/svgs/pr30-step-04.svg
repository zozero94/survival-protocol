<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg30s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="soil30s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="can30s4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="water30s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <pattern id="grid30s4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow30s4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg30s4)"/>
  <rect width="400" height="400" fill="url(#grid30s4)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Header Banner (Label 1) -->
  <rect x="14" y="14" width="372" height="28" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="32" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">FIG. 04 // 투명 막 흙 밀폐 및 중앙 조약돌 45도 역원뿔 깔때기 형성</text>

  <!-- Label 2 Callout Box -->
  <rect x="16" y="50" width="368" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="66" fill="#bae6fd" font-family="monospace" font-size="10.5">구덩이 위를 투명 막으로 덮고 둘레를 파낸 흙과 돌로 밀폐</text>

  <!-- Main Illustration: Sealed Solar Still with inverted cone and water droplets -->
  <g filter="url(#shadow30s4)">
    <!-- Soil pit profile -->
    <path d="M60,130 L115,255 L285,255 L340,130 Z" fill="url(#soil30s4)" stroke="#78350f" stroke-width="2.5"/>

    <!-- Central container -->
    <rect x="175" y="180" width="50" height="70" rx="3" fill="url(#can30s4)" stroke="#f8fafc" stroke-width="1.8"/>
    <ellipse cx="200" cy="180" rx="25" ry="6" fill="#475569" stroke="#f8fafc" stroke-width="1.5"/>
    <rect x="177" y="225" width="46" height="23" rx="1" fill="url(#water30s4)"/>

    <!-- Inverted cone clear membrane spanning pit opening -->
    <path d="M50,130 Q125,140 200,172 Q275,140 350,130" fill="none" stroke="#38bdf8" stroke-width="2.8"/>

    <!-- Weight rocks & soil berm securing edges -->
    <ellipse cx="45" cy="128" rx="15" ry="9" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="355" cy="128" rx="15" ry="9" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M25,135 Q45,120 65,135 Z" fill="#78350f"/>
    <path d="M335,135 Q355,120 375,135 Z" fill="#78350f"/>

    <!-- Center pebble weighting the membrane downwards into an inverted cone (45 deg angle) -->
    <ellipse cx="200" cy="172" rx="14" ry="9" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>

    <!-- 45 deg slope annotation -->
    <path d="M140,148 L170,160" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="120" y="162" fill="#fbbf24" font-family="monospace" font-size="8.5">45° 경사</text>

    <!-- Droplets sliding down underside of membrane to center point -->
    <circle cx="120" cy="144" r="2.5" fill="#38bdf8"/>
    <circle cx="150" cy="154" r="2.8" fill="#38bdf8"/>
    <circle cx="178" cy="164" r="3" fill="#38bdf8"/>

    <circle cx="280" cy="144" r="2.5" fill="#38bdf8"/>
    <circle cx="250" cy="154" r="2.8" fill="#38bdf8"/>
    <circle cx="222" cy="164" r="3" fill="#38bdf8"/>

    <!-- Water drops dripping from center pebble tip directly into container -->
    <circle cx="200" cy="186" r="3" fill="#38bdf8"/>
    <circle cx="200" cy="198" r="3" fill="#38bdf8"/>
    <circle cx="200" cy="210" r="2.5" fill="#38bdf8"/>

    <!-- Ripple in collected water -->
    <ellipse cx="200" cy="225" rx="12" ry="3" fill="none" stroke="#bae6fd" stroke-width="1.2"/>
  </g>

  <!-- Label 3 Callout Box -->
  <rect x="16" y="295" width="368" height="24" rx="2" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="24" y="311" fill="#fef08a" font-family="monospace" font-size="10.5">수집 그릇 바로 위 중앙에 호두 크기 매끈한 조약돌 얹기</text>

  <!-- Label 4 Callout Box -->
  <rect x="16" y="324" width="368" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="340" fill="#bae6fd" font-family="monospace" font-size="10.5">45도 역원뿔 경사를 타고 맺힌 물방울이 그릇 중앙으로 낙하</text>

  <!-- Bottom Core Principle Strip (Label 5) -->
  <rect x="14" y="354" width="372" height="34" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="24" y="375" fill="#ecfdf5" font-family="monospace" font-size="10.5" font-weight="bold">[핵심] 밀폐 태양열 온실 효과로 수증기 응축 및 자동 중력 집수</text>
</svg>
