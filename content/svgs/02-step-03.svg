<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 340" class="w-full max-w-2xl h-auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-white" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#F5F5F5" />
    </marker>
  </defs>

  <rect x="10" y="10" width="660" height="320" fill="none" stroke="#262626" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- LEFT SIDE: TINDER NEST & AIRFLOW DYNAMICS -->
  <!-- Tinder Nest Cup Profile (Bird's nest shape) -->
  <path d="M 60 250 C 90 280, 230 280, 260 250 C 270 210, 240 180, 160 170 C 80 180, 50 210, 60 250 Z" 
        fill="#181818" stroke="#777777" stroke-width="1.5"/>
  <!-- Fibers pattern inside nest -->
  <path d="M 70 230 Q 160 255 250 230" fill="none" stroke="#444444" stroke-width="1"/>
  <path d="M 80 210 Q 160 240 240 210" fill="none" stroke="#444444" stroke-width="1"/>
  <path d="M 95 195 Q 160 225 225 195" fill="none" stroke="#444444" stroke-width="1"/>

  <!-- Central Ember Core (Glowing Hot Carbon Coal) -->
  <ellipse cx="160" cy="220" rx="14" ry="10" fill="#E02424" stroke="#FFAA00" stroke-width="1.5"/>
  <circle cx="160" cy="220" r="4" fill="#FFEE55"/>
  <text x="160" y="245" fill="#FFAA00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">EMBER CORE (450°C)</text>

  <!-- Gentle Air Stream Vectors (Breathing 45-degree angle vectors) -->
  <path d="M 70 120 C 100 130, 120 160, 150 195" fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-white)"/>
  <path d="M 90 105 C 120 120, 135 155, 158 190" fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-white)"/>
  <text x="75" y="95" fill="#00D4FF" font-family="'JetBrains Mono', monospace" font-size="10">GENTLE CONTINUOUS BREATH (균일한 저속 날숨)</text>

  <!-- Smoke and Flame Transition Emitters -->
  <path d="M 160 195 Q 150 150 170 110 T 165 70" fill="none" stroke="#E5E5E5" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 170 195 Q 185 145 175 105 T 190 65" fill="none" stroke="#E5E5E5" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <!-- Ignition Flame Burst Outline (Transient stage) -->
  <path d="M 160 160 Q 140 120 160 90 Q 180 120 160 160 Z" fill="#E02424" fill-opacity="0.3" stroke="#E02424" stroke-width="1.5"/>
  <text x="160" y="55" fill="#E02424" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">FLAME IGNITION BURST (자연 발화 단계)</text>

  <!-- Cupping Angle 45° Spec -->
  <line x1="260" y1="250" x2="310" y2="200" stroke="#888888" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="280" y="270" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">45° ELEVATION CUPPING</text>

  <!-- RIGHT SIDE: TEMPERATURE IGNITION THRESHOLD GRAPH -->
  <rect x="360" y="45" width="295" height="255" fill="#141414" stroke="#333333" stroke-width="1"/>
  <text x="375" y="68" fill="#F5F5F5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">TEMPERATURE RISE &amp; IGNITION MATRIX</text>

  <!-- Graph Axes -->
  <line x1="410" y1="260" x2="630" y2="260" stroke="#666666" stroke-width="1"/>
  <line x1="410" y1="260" x2="410" y2="90" stroke="#666666" stroke-width="1"/>

  <text x="635" y="264" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="9">TIME (초)</text>
  <text x="375" y="95" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="9">TEMP (°C)</text>

  <!-- Threshold Line 600°C Flame Point -->
  <line x1="410" y1="125" x2="630" y2="125" stroke="#E02424" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="415" y="120" fill="#E02424" font-family="'JetBrains Mono', monospace" font-size="9">600°C FLAME IGNITION THRESHOLD</text>

  <!-- Threshold Line 400°C Ember Point -->
  <line x1="410" y1="185" x2="630" y2="185" stroke="#FFAA00" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="415" y="180" fill="#FFAA00" font-family="'JetBrains Mono', monospace" font-size="9">400°C CARBON SMOLDER POINT</text>

  <!-- Temperature Curve Line -->
  <path d="M 410 255 Q 460 240 500 185 T 570 125 T 620 100" fill="none" stroke="#F5F5F5" stroke-width="2.5"/>
  
  <!-- Key Milestone Dots -->
  <circle cx="500" cy="185" r="4" fill="#FFAA00"/>
  <circle cx="570" cy="125" r="4" fill="#E02424"/>
  
  <text x="505" y="200" fill="#FFAA00" font-family="'JetBrains Mono', monospace" font-size="8">엠버 이식 (0초)</text>
  <text x="560" y="145" fill="#E02424" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">화염 점화 (15~20초)</text>
</svg>
