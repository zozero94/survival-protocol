<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <!-- 필드 매뉴얼 외곽 테두리 및 그리드 -->
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 메타데이터 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-02 [FIRE-BOW-DRILL]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 03</text>

  <!-- 새둥지형 마른 부싯깃 번들 (Tinder Bundle) -->
  <ellipse cx="200" cy="220" rx="90" ry="40" fill="#121212" stroke="#737373" stroke-width="1.5" stroke-dasharray="4 2"/>
  <ellipse cx="200" cy="220" rx="70" ry="30" fill="none" stroke="#525252" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- 방사형 건초 섬유 라인 -->
  <line x1="120" y1="220" x2="160" y2="220" stroke="#737373" stroke-width="1"/>
  <line x1="240" y1="220" x2="280" y2="220" stroke="#737373" stroke-width="1"/>
  <line x1="150" y1="200" x2="175" y2="215" stroke="#737373" stroke-width="1"/>
  <line x1="250" y1="200" x2="225" y2="215" stroke="#737373" stroke-width="1"/>

  <!-- 중앙 붉은/백색 고온 불씨 (Glowing Ember) -->
  <circle cx="200" cy="220" r="14" fill="#FFFFFF"/>
  <circle cx="200" cy="220" r="22" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="200" y="224" fill="#000000" font-family="monospace" font-size="9" text-anchor="middle" font-weight="black">EMBER</text>

  <!-- 부드러운 산소 유입 기류선 (Oxygen Inflow Vectors) -->
  <path d="M 80 180 Q 140 200 180 215" fill="none" stroke="#E5E5E5" stroke-width="2"/>
  <polygon points="180,215 170,210 173,218" fill="#E5E5E5"/>
  <path d="M 80 240 Q 140 230 180 225" fill="none" stroke="#E5E5E5" stroke-width="2"/>
  <polygon points="180,225 173,222 170,230" fill="#E5E5E5"/>
  <text x="70" y="170" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold">OXYGEN FLOW (GENTLE BREATH)</text>

  <!-- 발화 화염 기둥 (Ignition / Flame Crest) -->
  <path d="M 190 200 Q 200 130 200 110 Q 205 140 215 170 Q 210 190 200 200" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M 195 190 Q 200 150 200 130 Q 203 160 207 185" fill="none" stroke="#A3A3A3" stroke-width="1.5"/>
  <text x="200" y="95" fill="#FFFFFF" font-family="monospace" font-size="12" text-anchor="middle" font-weight="black">[OPEN FLAME IGNITION]</text>

  <!-- 하단 설명 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 03: TINDER NEST TRANSFER &amp; OXYGEN BLOW</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">LONG STEADY EXHALATIONS UNTIL BURSTING INTO OPEN FLAME</text>
</svg>
