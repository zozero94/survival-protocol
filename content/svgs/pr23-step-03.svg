<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg23s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="100%" stop-color="#111824"/>
    </linearGradient>
    <linearGradient id="petBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="aeratedWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="sh23s3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background & HUD Frame -->
  <rect width="400" height="400" fill="url(#bg23s3)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#334155" stroke-width="1"/>
  <path d="M8 24 L24 8 M376 8 L392 24 M8 376 L24 392 M376 392 L392 376" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="14" y="14" width="372" height="28" fill="#131922" stroke="#475569" stroke-width="1"/>
  <text x="22" y="32" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">FIG. 03 // 무색 투명 PET 병 선별 및 20초 산소 폭기</text>

  <!-- Label 1 Callout Box -->
  <rect x="20" y="50" width="360" height="28" rx="2" fill="#161f2c" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="34" cy="64" r="4" fill="#38bdf8"/>
  <text x="44" y="68" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold">라벨 제거한 2L 이하 무색 투명 PET(1번) 용기 준비</text>

  <!-- Label 2 Callout Box -->
  <rect x="20" y="86" width="360" height="28" rx="2" fill="#1c1917" stroke="#f59e0b" stroke-width="1"/>
  <text x="30" y="104" fill="#fef3c7" font-family="sans-serif" font-size="11" font-weight="bold">병 반대편 손금·글씨가 또렷이 보이는 투명도 확인</text>

  <!-- Center 3D Clear PET Bottle & 20s Vertical Shaking Aeration -->
  <g filter="url(#sh23s3)">
    <!-- Up & Down Vigorous Shaking Motion Arrows (Left & Right) -->
    <path d="M115,155 L115,275 M108,165 L115,155 L122,165 M108,265 L115,275 L122,265" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <path d="M285,155 L285,275 M278,165 L285,155 L292,165 M278,265 L285,275 L292,265" fill="none" stroke="#f59e0b" stroke-width="2.5"/>

    <!-- Bottle Cap -->
    <rect x="184" y="124" width="32" height="14" rx="2" fill="#0284c7" stroke="#bae6fd" stroke-width="1.5"/>
    <!-- Bottle Neck & Shoulder -->
    <path d="M186,138 L214,138 L244,172 L244,292 C244,298 238,302 232,302 L168,302 C162,302 156,298 156,292 L156,172 Z" fill="url(#petBody)" stroke="#bae6fd" stroke-width="2"/>

    <!-- 3/4 Water Level Inside Bottle During Shaking -->
    <path d="M158,192 Q178,186 200,192 T242,192 L242,292 C242,296 237,300 232,300 L168,300 C163,300 158,296 158,292 Z" fill="url(#aeratedWater)"/>
    <!-- 3/4 Level Indicator Line -->
    <line x1="142" y1="192" x2="258" y2="192" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="4,2"/>

    <!-- Swirling Dissolved Oxygen Micro-Bubbles Inside Water -->
    <circle cx="176" cy="212" r="3.5" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="195" cy="205" r="2.5" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="218" cy="215" r="4" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="182" cy="235" r="3" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="204" cy="228" r="4.5" fill="#ffffff" fill-opacity="0.9"/>
    <circle cx="225" cy="242" r="2.8" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="172" cy="258" r="3.8" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="192" cy="252" r="2.5" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="212" cy="264" r="3.5" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="185" cy="278" r="3" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="206" cy="282" r="2.5" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="224" cy="275" r="3.2" fill="#ffffff" fill-opacity="0.85"/>

    <!-- PET #1 Recycling Triangle Badge (Right Inset) -->
    <circle cx="336" cy="220" r="34" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <polygon points="336,196 314,234 358,234" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M336,208 L336,226 M331,212 L336,208" fill="none" stroke="#f8fafc" stroke-width="2.2"/>
  </g>

  <!-- Label 3 Callout Box -->
  <rect x="20" y="314" width="360" height="28" rx="2" fill="#161f2c" stroke="#38bdf8" stroke-width="1"/>
  <text x="30" y="332" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="bold">물 3/4 채운 후 20초간 흔들어 미세 산소 기포 용해</text>

  <!-- Footer Key Takeaway Banner -->
  <rect x="14" y="352" width="372" height="32" fill="#1e1b18" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="24" y="372" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">[핵심] 자외선과 결합해 세균 파괴하는 용존산소 극대화</text>
</svg>
