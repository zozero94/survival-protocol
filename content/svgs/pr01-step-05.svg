<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg0105" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="100%" stop-color="#0d131c"/>
    </linearGradient>
    <linearGradient id="clayVessel05" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="35%" stop-color="#7c2d12"/>
      <stop offset="70%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#2a0e02"/>
    </linearGradient>
    <linearGradient id="flame05" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="boilWater05" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="drop0105" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <pattern id="grid0105" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16212e" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg0105)"/>
  <rect width="400" height="400" fill="url(#grid0105)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#243447" stroke-width="1"/>

  <!-- Top Header (Label 1, y=32) -->
  <rect x="16" y="14" width="368" height="28" rx="2" fill="#0e1621" stroke="#2e4359" stroke-width="1"/>
  <text x="24" y="32" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">FIG. 05 // PURIFICATION STEP 5: 100℃ 비등 멸균</text>

  <!-- Main 3D Illustration Area (y: 84 ~ 288) -->
  <g filter="url(#drop0105)">
    <!-- LEFT PANEL: Clay Pot Seated Stably on 3 Hearth Stones Over Campfire (x: 20 ~ 238) -->
    <rect x="20" y="86" width="218" height="202" rx="3" fill="#0b1119" stroke="#26374a" stroke-width="1"/>

    <!-- Burning Hardwood Logs at Base -->
    <path d="M 62 268 L 194 252 L 198 264 L 66 280 Z" fill="#451a03" stroke="#261105" stroke-width="1.2"/>
    <path d="M 66 252 L 198 268 L 194 280 L 62 264 Z" fill="#3b1502" stroke="#1c0a00" stroke-width="1.2"/>

    <!-- Rising Campfire Flame Tongues -->
    <path d="M 98 268 C 90 242 108 220 116 204 C 124 222 120 246 112 268 Z" fill="url(#flame05)"/>
    <path d="M 120 268 C 114 236 132 212 136 196 C 146 218 142 246 134 268 Z" fill="url(#flame05)"/>
    <path d="M 142 268 C 146 242 162 224 156 208 C 152 228 148 250 154 268 Z" fill="url(#flame05)"/>

    <!-- Left & Right Hearth Support Stones (화덕 받침돌 - 토기 하단 지지) -->
    <path d="M 46 278 C 44 236 58 214 78 214 C 90 214 94 242 90 278 Z" fill="#475569" stroke="#94a3b8" stroke-width="1.3"/>
    <path d="M 168 278 C 164 242 168 214 180 214 C 200 214 214 236 212 278 Z" fill="#475569" stroke="#94a3b8" stroke-width="1.3"/>

    <!-- Earthen Clay Vessel Seated on Hearth Stones (Cutaway View) -->
    <path d="M 68 144 L 190 144 L 176 220 C 172 232 154 238 129 238 C 104 238 86 232 82 220 Z" fill="url(#clayVessel05)" stroke="#fdba74" stroke-width="1.8"/>
    <ellipse cx="129" cy="144" rx="61" ry="11" fill="#431407" stroke="#fdba74" stroke-width="1.4"/>

    <!-- Vigorous Boiling Water Inside Cutaway Vessel -->
    <path d="M 76 156 L 182 156 L 171 216 C 168 226 150 231 129 231 C 108 231 90 226 87 216 Z" fill="url(#boilWater05)"/>
    <ellipse cx="129" cy="156" rx="53" ry="8.5" fill="#7dd3fc" stroke="#e0f2fe" stroke-width="1.2"/>

    <!-- Large Rolling Boil Convection Bubbles (주먹만 한 큰 거품 연속 솟구침) -->
    <circle cx="105" cy="198" r="5" fill="#e0f2fe" opacity="0.85"/>
    <circle cx="132" cy="206" r="6" fill="#e0f2fe" opacity="0.85"/>
    <circle cx="152" cy="194" r="5.5" fill="#e0f2fe" opacity="0.85"/>
    <circle cx="114" cy="174" r="7" fill="#ffffff" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="142" cy="176" r="7.5" fill="#ffffff" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="98" cy="156" r="6.5" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <circle cx="126" cy="154" r="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <circle cx="154" cy="156" r="7" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>

    <!-- Rising Hot Steam Plumes -->
    <path d="M 104 134 C 98 118 110 106 104 92" fill="none" stroke="#bae6fd" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 129 132 C 135 116 123 104 129 90" fill="none" stroke="#e0f2fe" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 154 134 C 160 118 148 106 154 92" fill="none" stroke="#bae6fd" stroke-width="2.2" stroke-linecap="round"/>

    <!-- RIGHT PANEL TOP: True Rolling Boil vs Simmer Comparison (x: 246 ~ 380, y: 86 ~ 182) -->
    <rect x="246" y="86" width="134" height="96" rx="3" fill="#0b1119" stroke="#f59e0b" stroke-width="1.1"/>
    <!-- Left Sub-Box: Weak Simmer (Small Bottom Bubbles Only -> NOT YET X) -->
    <rect x="254" y="106" width="54" height="62" rx="3" fill="#111827" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="258" y="128" width="46" height="36" fill="#0369a1" opacity="0.6"/>
    <circle cx="272" cy="158" r="2" fill="#bae6fd"/>
    <circle cx="288" cy="158" r="2" fill="#bae6fd"/>
    <path d="M 275 112 L 287 124 M 287 112 L 275 124" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Right Sub-Box: Full Rolling Boil for 3+ Min (Big Surface Bubbles -> PASS Check) -->
    <rect x="318" y="106" width="54" height="62" rx="3" fill="#111827" stroke="#22c55e" stroke-width="1.4"/>
    <rect x="322" y="128" width="46" height="36" fill="url(#boilWater05)"/>
    <circle cx="334" cy="132" r="5" fill="#ffffff" stroke="#0284c7" stroke-width="0.9"/>
    <circle cx="348" cy="130" r="5.5" fill="#ffffff" stroke="#0284c7" stroke-width="0.9"/>
    <circle cx="358" cy="133" r="4.5" fill="#ffffff" stroke="#0284c7" stroke-width="0.9"/>
    <path d="M 336 118 L 343 124 L 355 110" fill="none" stroke="#4ade80" stroke-width="2.4" stroke-linecap="round"/>

    <!-- RIGHT PANEL BOTTOM: 100°C Thermal Pathogen & Cyst Eradication Zoom (x: 246 ~ 380, y: 190 ~ 288) -->
    <rect x="246" y="190" width="134" height="98" rx="3" fill="#0b1119" stroke="#22c55e" stroke-width="1.1"/>
    <circle cx="313" cy="239" r="36" fill="#0f172a" stroke="#4ade80" stroke-width="1.5"/>
    <!-- Ruptured / Denatured Microbe Cysts under 100°C Heat -->
    <ellipse cx="298" cy="230" rx="10" ry="6" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 2"/>
    <path d="M 291 224 L 305 236 M 305 224 L 291 236" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="328" cy="246" rx="10" ry="6" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="3 2"/>
    <path d="M 321 240 L 335 252 M 335 240 L 321 252" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <!-- Sterile Safe Drinking Water Checkmark -->
    <path d="M 302 260 L 310 267 L 326 251" fill="none" stroke="#4ade80" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- Label 2 (y=75) -->
  <rect x="20" y="60" width="360" height="22" rx="2" fill="#141c26" stroke="#334155" stroke-width="1"/>
  <text x="28" y="75" fill="#fde68a" font-family="monospace" font-size="8.5" font-weight="bold">받침돌 위 용기에서 큰 거품이 솟구치는 펄펄 끓는 물</text>

  <!-- Label 3 (y=310) -->
  <rect x="20" y="295" width="360" height="22" rx="2" fill="#141c26" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="28" y="310" fill="#f59e0b" font-family="monospace" font-size="8.5" font-weight="bold">큰 물방울이 연속으로 올라온 뒤 최소 3분 이상 유지 (산속은 5분)</text>

  <!-- Label 4 (y=345) -->
  <rect x="20" y="330" width="360" height="22" rx="2" fill="#141c26" stroke="#22c55e" stroke-width="0.9"/>
  <text x="28" y="345" fill="#4ade80" font-family="monospace" font-size="8.5" font-weight="bold">여과기를 통과한 미세 세균과 기생충까지 99.9% 완전 박멸</text>

  <!-- Label 5 (y=383) -->
  <rect x="16" y="368" width="368" height="22" rx="2" fill="#1e293b" stroke="#e02424" stroke-width="1"/>
  <text x="24" y="383" fill="#ffffff" font-family="monospace" font-size="8.8" font-weight="bold">[5단계 핵심] 투명한 물도 반드시 3분 이상 펄펄 끓여 마시기</text>
</svg>
