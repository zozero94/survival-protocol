<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradP05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b"/>
      <stop offset="50%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>

    <!-- Clay Pot Shading -->
    <linearGradient id="clayPotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="30%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#2a0d01"/>
    </linearGradient>

    <!-- Campfire Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Boiling Water Steam/Surface -->
    <linearGradient id="boilingWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowP05" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="400" height="400" fill="url(#bgGradP05)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#22262c" stroke-width="1"/>

  <!-- Technical Corner Crosshairs -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#374151" stroke-width="1"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#374151" stroke-width="1"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#374151" stroke-width="1"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#374151" stroke-width="1"/>

  <!-- Blueprint Header (Label 1) -->
  <text x="24" y="28" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="0.5">FIG. 05 // PURIFICATION STEP 5: 100℃ 비등 멸균</text>
  <line x1="24" y1="36" x2="376" y2="36" stroke="#262d35" stroke-width="1"/>

  <!-- Campfire Flames at Base -->
  <g id="fireBase">
    <!-- Firewood logs -->
    <line x1="130" y1="305" x2="230" y2="285" stroke="#3d2817" stroke-width="14" stroke-linecap="round"/>
    <line x1="150" y1="285" x2="250" y2="305" stroke="#2a1b0e" stroke-width="14" stroke-linecap="round"/>
    <!-- Dynamic Flame Tongues -->
    <path d="M 160 300 C 150 260 170 230 180 215 C 190 235 185 265 175 300" fill="url(#flameGrad)" opacity="0.9"/>
    <path d="M 180 300 C 175 250 195 220 200 205 C 210 230 205 265 195 300" fill="url(#flameGrad)" opacity="0.95"/>
    <path d="M 200 300 C 205 260 225 240 220 225 C 215 245 210 270 215 300" fill="url(#flameGrad)" opacity="0.85"/>
  </g>

  <!-- Clay Pot Cooking Vessel -->
  <path d="M 135 150 C 120 185 125 250 155 265 C 175 272 225 272 245 265 C 275 250 280 185 265 150 Z" 
        fill="url(#clayPotGrad)" stroke="#1c0c04" stroke-width="2" filter="url(#shadowP05)"/>
  <!-- Pot Rim Ellipse -->
  <ellipse cx="200" cy="150" rx="65" ry="14" fill="#5c2406" stroke="#1c0c04" stroke-width="1.8"/>

  <!-- Boiling Water Inside Pot -->
  <ellipse cx="200" cy="154" rx="55" ry="11" fill="url(#boilingWater)"/>

  <!-- Rolling Boil Bubbles (큰 거품) -->
  <circle cx="180" cy="152" r="6" fill="#ffffff" opacity="0.8" stroke="#0284c7" stroke-width="0.8"/>
  <circle cx="215" cy="154" r="7.5" fill="#ffffff" opacity="0.85" stroke="#0284c7" stroke-width="0.8"/>
  <circle cx="198" cy="156" r="5" fill="#ffffff" opacity="0.75" stroke="#0284c7" stroke-width="0.8"/>
  <circle cx="165" cy="155" r="4.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="230" cy="153" r="4" fill="#ffffff" opacity="0.8"/>

  <!-- Steam Vapor Waves -->
  <path d="M 175 140 C 170 120 180 105 175 85" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 200 138 C 205 118 195 102 200 82" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 225 140 C 230 122 220 108 225 88" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- 3-Minute Timer Stopwatch Dial (Right Top Inset) -->
  <circle cx="310" cy="115" r="32" fill="#0d1117" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="310" cy="115" r="26" fill="#181111"/>
  <!-- Stopwatch Hand pointing to 3 min -->
  <line x1="310" y1="115" x2="310" y2="95" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <line x1="310" y1="115" x2="328" y2="122" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="310" cy="115" r="3" fill="#ffffff"/>
  <!-- 3-Min Arc Badge -->
  <path d="M 310 93 A 22 22 0 0 1 332 115" stroke="#22c55e" stroke-width="3" fill="none"/>

  <!-- Technical Callouts -->
  <!-- Callout 1: Boiling 100°C (Label 2) -->
  <line x1="165" y1="154" x2="115" y2="75" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="165" cy="154" r="2.5" fill="#ef4444"/>
  <text x="24" y="70" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold">BOILING 100°C (펄펄 끓이기)</text>

  <!-- Callout 2: Time 3+ Min (Label 3) -->
  <text x="376" y="70" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="end">TIME: 3+ MIN (3분 이상)</text>

  <!-- Callout 3: Pathogen Free (Label 4) -->
  <line x1="240" y1="160" x2="285" y2="165" stroke="#22c55e" stroke-width="1"/>
  <circle cx="240" cy="160" r="2.5" fill="#22c55e"/>
  <text x="376" y="165" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="end">PATHOGEN FREE (세균 99.9% 사멸)</text>

  <!-- Bottom Tactical Note Strip -->
  <rect x="18" y="340" width="364" height="34" fill="#111419" stroke="#262d35" stroke-width="1"/>
  <rect x="18" y="340" width="4" height="34" fill="#ef4444"/>
  <!-- Label 5: Step Core Instruction -->
  <text x="32" y="361" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">[5단계 핵심] 큰 거품이 솟구치도록 3분 이상 가열</text>
</svg>
