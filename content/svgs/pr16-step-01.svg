<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1601" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#0e1319"/>
    </linearGradient>
    <linearGradient id="terracottaOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="terracottaInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="pitchPlug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="drop1601" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="grid1601" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16202c" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg1601)"/>
  <rect width="400" height="400" fill="url(#grid1601)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#253342" stroke-width="1"/>

  <!-- Top Header (Label 1) -->
  <rect x="16" y="14" width="368" height="28" rx="2" fill="#0f1722" stroke="#2c3e50" stroke-width="1"/>
  <text x="26" y="32" fill="#fde68a" font-family="monospace" font-size="11" font-weight="bold">FIG. 01 // UNGLAZED CLAY POT SELECTION &amp; SEALING</text>

  <!-- Large & Small Unglazed Clay Pots Illustration -->
  <g filter="url(#drop1601)">
    <!-- Large Outer Terracotta Pot (38cm Diameter) -->
    <path d="M 45 120 L 185 120 L 165 255 C 162 270 150 278 115 278 C 80 278 68 270 65 255 Z" fill="url(#terracottaOuter)" stroke="#fb923c" stroke-width="1.2"/>
    <ellipse cx="115" cy="120" rx="70" ry="16" fill="#431407" stroke="#ea580c" stroke-width="1.2"/>
    <!-- Porous Breathable Texture Dots -->
    <circle cx="85" cy="175" r="1.5" fill="#fed7aa" opacity="0.6"/>
    <circle cx="110" cy="195" r="1.5" fill="#fed7aa" opacity="0.6"/>
    <circle cx="135" cy="165" r="1.5" fill="#fed7aa" opacity="0.6"/>
    <circle cx="95" cy="220" r="1.5" fill="#fed7aa" opacity="0.6"/>
    <circle cx="140" cy="215" r="1.5" fill="#fed7aa" opacity="0.6"/>

    <!-- Bottom Drain Hole Plugged with Flat Stone & Pine Pitch -->
    <rect x="98" y="272" width="34" height="10" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="115" cy="278" rx="22" ry="6" fill="url(#pitchPlug)" stroke="#fde68a" stroke-width="1"/>

    <!-- Small Inner Terracotta Pot (26cm Diameter) -->
    <path d="M 235 145 L 345 145 L 330 255 C 328 266 315 272 290 272 C 265 272 252 266 250 255 Z" fill="url(#terracottaInner)" stroke="#fdba74" stroke-width="1.2"/>
    <ellipse cx="290" cy="145" rx="55" ry="13" fill="#431407" stroke="#fb923c" stroke-width="1.2"/>

    <!-- Boiling Water & Lye Soap Sanitization Sparkles Inside Small Pot -->
    <path d="M 275 180 C 280 170 295 170 305 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 2"/>
    <circle cx="280" cy="195" r="4" fill="#38bdf8" opacity="0.7"/>
    <circle cx="300" cy="190" r="5" fill="#bae6fd" opacity="0.8"/>
    <circle cx="290" cy="208" r="3.5" fill="#38bdf8" opacity="0.7"/>
  </g>

  <!-- Label 2: Large & Small Pot Selection -->
  <rect x="20" y="60" width="360" height="22" rx="2" fill="#141a23" stroke="#334155" stroke-width="1"/>
  <text x="28" y="75" fill="#fde68a" font-family="monospace" font-size="8.5" font-weight="bold">무유약 다공성 큰 토기(38cm) &amp; 작은 토기(26cm) 선별</text>

  <!-- Label 3: Bottom Drain Plug -->
  <rect x="20" y="295" width="360" height="22" rx="2" fill="#141a23" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="28" y="310" fill="#f59e0b" font-family="monospace" font-size="8.5" font-weight="bold">바닥 배수 구멍 납작돌 &amp; 소나무 송진 완전 밀봉</text>

  <!-- Label 4: Inner Sanitization -->
  <rect x="20" y="330" width="360" height="22" rx="2" fill="#141a23" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="28" y="345" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">작은 토기 내벽 끓인 물·잿물 비누 무균 소독</text>

  <!-- Label 5: Step 1 Callout -->
  <rect x="16" y="368" width="368" height="22" rx="2" fill="#1e293b" stroke="#e02424" stroke-width="1"/>
  <text x="24" y="383" fill="#ffffff" font-family="monospace" font-size="9.5" font-weight="bold">[1단계 핵심] 수분 증발용 미세 숨구멍(기공) 확보</text>
</svg>
