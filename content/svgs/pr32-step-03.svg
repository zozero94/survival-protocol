<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg32s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <pattern id="grid32s3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#27272a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow32s3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg32s3)"/>
  <rect width="400" height="400" fill="url(#grid32s3)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Header Banner (Label 1) -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 03 // 회전 막대 양끝 풀림 방지 결속 및 지혈 시작 시각(T) 기록</text>

  <!-- Label 2 Callout Box -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9.5">벨트 끝자락이나 보조 끈으로 막대 끝을 묶고 이마·밴드에 시각(T) 기재</text>

  <!-- Main Illustration: Locked Windlass & Time Record -->
  <g filter="url(#shadow32s3)">
    <!-- Limb cylinder -->
    <rect x="135" y="86" width="130" height="202" rx="28" fill="#27272a" stroke="#52525b" stroke-width="3"/>

    <!-- Constricting belt -->
    <rect x="128" y="130" width="144" height="38" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="2.5"/>

    <!-- Horizontal locked windlass rod -->
    <rect x="96" y="142" width="208" height="14" rx="6" fill="#e4e4e7" stroke="#71717a" stroke-width="1.5"/>

    <!-- Keeper Straps locking both ends of the rod -->
    <rect x="108" y="124" width="18" height="50" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <rect x="274" y="124" width="18" height="50" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>

    <!-- Time Record White Tape Banner on Limb ("T 14:30") -->
    <rect x="138" y="196" width="124" height="44" rx="3" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
    <!-- Stylized "T" and clock icon in vector paths -->
    <line x1="154" y1="208" x2="174" y2="208" stroke="#dc2626" stroke-width="3.5"/>
    <line x1="164" y1="208" x2="164" y2="230" stroke="#dc2626" stroke-width="3.5"/>
    <circle cx="205" cy="218" r="11" fill="none" stroke="#18181b" stroke-width="2"/>
    <polyline points="205,211 205,218 211,218" fill="none" stroke="#18181b" stroke-width="2"/>
    <line x1="226" y1="214" x2="248" y2="214" stroke="#18181b" stroke-width="2.5"/>
    <line x1="226" y1="223" x2="244" y2="223" stroke="#dc2626" stroke-width="2.5"/>
  </g>

  <!-- Label 3: Time Limit Spec -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="315" fill="#94a3b8" font-family="monospace" font-size="9">지혈대를 옷이나 담요로 덮지 말고 눈에 잘 띄게 노출시켜 의료진에 인계</text>

  <!-- Label 4: Warning Box -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#2d0607" stroke="#ef4444" stroke-width="1"/>
  <text x="24" y="344" fill="#fca5a5" font-family="monospace" font-size="9">현장에서 임의로 지혈대 풀기 금지: 재출혈 쇼크 및 독소 역류로 심정지 위험</text>

  <!-- Label 5: Core Principle Footer -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="376" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold">[골든타임] 2시간 이내 외과 처치 인계를 위해 정확한 장착 시각 기록 필수</text>
</svg>
