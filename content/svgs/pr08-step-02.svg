<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgP08S2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b"/>
      <stop offset="50%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>
    <linearGradient id="woodPost" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#713f12"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="woodStrut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#3b1d03"/>
    </linearGradient>
    <linearGradient id="notchWood2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadowP08S2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="400" height="400" fill="url(#bgP08S2)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#22262c" stroke-width="1"/>

  <!-- Technical Corner Crosshairs -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#374151" stroke-width="1"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#374151" stroke-width="1"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#374151" stroke-width="1"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#374151" stroke-width="1"/>

  <!-- Label 1: Blueprint Header -->
  <text x="24" y="28" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="0.5">FIG. 02 // TOP PIVOT INTERLOCK ASSEMBLY</text>
  <line x1="24" y1="36" x2="376" y2="36" stroke="#262d35" stroke-width="1"/>

  <!-- Ground Plane Baseline -->
  <line x1="40" y1="310" x2="360" y2="310" stroke="#374151" stroke-width="1.5"/>
  <path d="M 60 315 L 75 325 M 110 315 L 125 325 M 160 315 L 175 325 M 210 315 L 225 325 M 260 315 L 275 325 M 310 315 L 325 325" stroke="#1f2937" stroke-width="1"/>

  <!-- 1. Vertical Post (Standing on ground) -->
  <g filter="url(#shadowP08S2)">
    <!-- Main Upright Stick -->
    <rect x="140" y="85" width="22" height="225" rx="3" fill="url(#woodPost)" stroke="#451a03" stroke-width="1"/>
    <!-- Top Chisel Wedge Point -->
    <polygon points="140,85 151,60 162,85" fill="url(#notchWood2)" stroke="#78350f" stroke-width="1"/>
    <!-- Middle Notch for Step 3 Preview -->
    <rect x="140" y="190" width="10" height="14" fill="url(#notchWood2)" stroke="#78350f" stroke-width="1"/>
  </g>

  <!-- 2. Diagonal Strut Leaning at 45 Degrees -->
  <g filter="url(#shadowP08S2)" transform="rotate(-45 151 60)">
    <!-- Strut Stick -->
    <rect x="140" y="60" width="20" height="240" rx="3" fill="url(#woodStrut)" stroke="#3b1d03" stroke-width="1"/>
    <!-- Notch cut out receiving the chisel tip -->
    <polygon points="140,60 151,78 160,60" fill="url(#notchWood2)" stroke="#78350f" stroke-width="1"/>
  </g>

  <!-- Technical Circular Loupe Inset (Top Pivot Enlarged) -->
  <g transform="translate(250, 70)">
    <circle cx="50" cy="50" r="45" fill="#0b0f14" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowP08S2)"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3"/>
    <!-- Enlarged Chisel Tip & Notch Interlock -->
    <polygon points="40,65 50,30 60,65" fill="url(#notchWood2)" stroke="#78350f" stroke-width="1.5"/>
    <polygon points="32,25 50,48 68,25" fill="#d97706" stroke="#451a03" stroke-width="1.5"/>
    <!-- Contact Vector Dots -->
    <circle cx="50" cy="38" r="3" fill="#ef4444"/>
  </g>
  <!-- Loupe Connecting Callout Line -->
  <path d="M 160 65 L 245 105" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Gravity / Load Force Arrows -->
  <path d="M 151 35 L 151 55 M 146 48 L 151 56 L 156 48" stroke="#ef4444" stroke-width="2" fill="none"/>

  <!-- Technical Labels 2, 3, 4 -->
  <!-- Label 2: Chisel Tip -->
  <text x="32" y="75" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="bold">CHISEL TIP (기둥 상단 납작 끌형 쐐기)</text>
  <path d="M 115 78 L 140 75" stroke="#fbbf24" stroke-width="0.8"/>

  <!-- Label 3: Top Notch -->
  <text x="220" y="185" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="bold">TOP NOTCH (버팀목 45도 상단 홈 결합)</text>

  <!-- Label 4: Gravity Vector -->
  <text x="32" y="130" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="bold">GRAVITY VECTOR (하향 수직 압력선)</text>
  <path d="M 130 135 L 148 145" stroke="#f87171" stroke-width="0.8"/>

  <!-- Action Highlight Block (Label 5) -->
  <rect x="24" y="338" width="352" height="38" rx="2" fill="#111827" stroke="#374151" stroke-width="1"/>
  <rect x="24" y="338" width="4" height="38" fill="#38bdf8"/>
  <!-- Label 5: Step Core Instruction -->
  <text x="38" y="362" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">[2단계 핵심] 헛돌지 않게 맞물리는 상단 지렛대 결합</text>
</svg>
