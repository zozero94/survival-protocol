<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOut17" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a0e"/>
      <stop offset="50%" stop-color="#0c121a"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="woodLogOut17" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#5c4033"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="tanninVatOut17" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="55%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="buckskinHideOut17" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="smokeOut17" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadowOut17" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <pattern id="gridOut17" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#152230" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgOut17)"/>
  <rect width="800" height="450" fill="url(#gridOut17)"/>
  <rect x="12" y="12" width="776" height="426" fill="none" stroke="#253548" stroke-width="1.2"/>

  <!-- Top Tactical Header Banner (Label 1, y=42) -->
  <rect x="24" y="20" width="752" height="34" rx="2" fill="#0d141f" stroke="#d97706" stroke-width="1.2"/>
  <text x="38" y="42" fill="#fde68a" font-family="monospace" font-size="11.5" font-weight="bold">PR-17 OUTCOME // OAK BARK &amp; SMOKED WATERPROOF LEATHER</text>

  <!-- SECTION 1 (LEFT): Fleshing Beam & Wood-Ash Lye Dehairing (x: 28 ~ 258) -->
  <g filter="url(#shadowOut17)">
    <rect x="28" y="64" width="230" height="310" rx="3" fill="#0b111a" stroke="#2a3f55" stroke-width="1"/>
    <rect x="28" y="64" width="230" height="24" fill="#131e2b"/>

    <!-- Inclined Fleshing Beam Log & Blunt Stone Scraper -->
    <path d="M 48 265 L 118 125 L 152 135 L 82 275 Z" fill="url(#woodLogOut17)" stroke="#b45309" stroke-width="1.3"/>
    <path d="M 62 245 L 112 145 L 142 153 L 94 252 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.1"/>
    <rect x="78" y="178" width="46" height="16" rx="7" transform="rotate(15 101 186)" fill="#475569" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Wood-Ash Lye Dehairing Vat -->
    <path d="M 155 182 L 244 182 L 234 275 L 165 275 Z" fill="#334155" stroke="#94a3b8" stroke-width="1.2"/>
    <ellipse cx="199" cy="182" rx="44" ry="9" fill="#94a3b8" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="188" cy="215" r="3.5" fill="#f8fafc"/>
    <circle cx="208" cy="228" r="4" fill="#38bdf8"/>
    <circle cx="196" cy="248" r="3.5" fill="#f8fafc"/>
  </g>

  <!-- Label 2 (y=80) -->
  <rect x="32" y="66" width="222" height="18" fill="none"/>
  <text x="36" y="80" fill="#fde68a" font-family="monospace" font-size="7.6" font-weight="bold">1단계: 뭉툭한 돌로 안쪽 비계 밀어내기 및 하얀 잿물로 털 벗기기</text>

  <!-- Label 3 (y=338) -->
  <rect x="34" y="323" width="218" height="22" rx="2" fill="#141a23" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="38" y="338" fill="#f59e0b" font-family="monospace" font-size="7.5" font-weight="bold">2단계: 참나무 붉은 속껍질 짓이기기 및 차갑게 식힌 떫은 물 우리기</text>

  <!-- SECTION 2 (CENTER): Cold Oak Bark Tannin Vat & 100% Core Penetration (x: 268 ~ 508) -->
  <g filter="url(#shadowOut17)">
    <rect x="268" y="64" width="240" height="310" rx="3" fill="#0b111a" stroke="#2a3f55" stroke-width="1"/>
    <rect x="268" y="64" width="240" height="38" fill="#131e2b"/>

    <!-- Clay-Lined Ground Pit Tannin Vat -->
    <path d="M 288 148 L 488 148 L 468 265 C 464 275 446 282 388 282 C 330 282 312 275 308 265 Z" fill="url(#tanninVatOut17)" stroke="#ea580c" stroke-width="1.5"/>
    <ellipse cx="388" cy="148" rx="100" ry="14" fill="#450a0a" stroke="#f97316" stroke-width="1.2"/>

    <!-- Immersed Hide Absorbing Tannin Molecules -->
    <path d="M 316 178 Q 388 205 460 178 Q 438 242 388 250 Q 338 242 316 178 Z" fill="url(#buckskinHideOut17)" stroke="#fde68a" stroke-width="1.3"/>

    <!-- Cross-Section Cutaway Bar Showing 100% Uniform Amber Core -->
    <rect x="312" y="294" width="152" height="34" rx="4" fill="url(#buckskinHideOut17)" stroke="#fef08a" stroke-width="1.4"/>
    <line x1="322" y1="305" x2="454" y2="305" stroke="#fef3c7" stroke-width="1" stroke-dasharray="4 2"/>
    <line x1="322" y1="317" x2="454" y2="317" stroke="#fef3c7" stroke-width="1" stroke-dasharray="4 2"/>
  </g>

  <!-- Label 4 (y=95) -->
  <rect x="272" y="78" width="232" height="22" fill="none"/>
  <text x="276" y="95" fill="#38bdf8" font-family="monospace" font-size="7.5" font-weight="bold">3단계: 가죽 단면 한가운데까지 100% 갈색 물들이기 및 기름 바르기</text>

  <!-- Label 5 (y=360) -->
  <rect x="274" y="345" width="228" height="22" rx="2" fill="#141a23" stroke="#22c55e" stroke-width="0.9"/>
  <text x="278" y="360" fill="#4ade80" font-family="monospace" font-size="7.5" font-weight="bold">4단계: 둥근 나무 말뚝에 문질러 부드럽게 풀기 및 나무 연기 코팅</text>

  <!-- SECTION 3 (RIGHT): Staking Post, Conical Smoke Cure & Waterproof Buckskin (x: 518 ~ 772) -->
  <g filter="url(#shadowOut17)">
    <rect x="518" y="64" width="254" height="310" rx="3" fill="#0b111a" stroke="#2a3f55" stroke-width="1"/>
    <rect x="518" y="64" width="254" height="60" fill="#131e2b"/>

    <!-- Left Sub-Element: Rounded Wooden Staking Post -->
    <path d="M 556 172 C 556 156 584 156 584 172 L 584 295 L 556 295 Z" fill="url(#woodLogOut17)" stroke="#b45309" stroke-width="1.2"/>
    <path d="M 532 225 Q 570 140 608 225" fill="none" stroke="#fde68a" stroke-width="8" stroke-linecap="round"/>

    <!-- Right Sub-Element: Conical Smoked Buckskin Hide & Water Repellent Drops -->
    <ellipse cx="695" cy="292" rx="46" ry="12" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <path d="M 688 290 C 678 262 708 242 695 210" fill="none" stroke="url(#smokeOut17)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 695 142 L 642 282 Q 695 296 748 282 Z" fill="url(#buckskinHideOut17)" stroke="#fde68a" stroke-width="1.5"/>

    <!-- Beaded Water Droplets Repelled Off Smoked Buckskin Surface -->
    <circle cx="672" cy="222" r="4" fill="#38bdf8" stroke="#bae6fd" stroke-width="0.8"/>
    <circle cx="715" cy="235" r="4.5" fill="#38bdf8" stroke="#bae6fd" stroke-width="0.8"/>
    <circle cx="688" cy="252" r="4" fill="#38bdf8" stroke="#bae6fd" stroke-width="0.8"/>
  </g>

  <!-- Label 6 (y=115) -->
  <rect x="522" y="98" width="246" height="22" fill="none"/>
  <text x="526" y="115" fill="#fde68a" font-family="monospace" font-size="7.6" font-weight="bold">완성 가죽: 비에 젖어도 썩지 않는 방한 외투·신발용 천연 가죽</text>

  <!-- Bottom Tactical Verification Bar (Label 7, y=414) -->
  <rect x="24" y="392" width="752" height="34" rx="2" fill="#141e2b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="38" y="414" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">FIELD VERIFIED // PERMANENT WATERPROOF &amp; SUPPLE BUCKSKIN</text>
</svg>