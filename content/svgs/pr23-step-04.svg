<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg23s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d14"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="foilSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="horizBottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="sh23s4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background & HUD Frame -->
  <rect width="400" height="400" fill="url(#bg23s4)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#334155" stroke-width="1"/>
  <path d="M8 24 L24 8 M376 8 L392 24 M8 376 L24 392 M376 392 L392 376" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="14" y="14" width="372" height="28" fill="#131922" stroke="#475569" stroke-width="1"/>
  <text x="22" y="32" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">FIG. 04 // 은박 반사판 6시간 태양광(SODIS) 복합 살균</text>

  <!-- Label 1 Callout Box -->
  <rect x="20" y="50" width="360" height="28" rx="2" fill="#161f2c" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="34" cy="64" r="4" fill="#38bdf8"/>
  <text x="44" y="68" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold">골판지 위에 부착한 주방 은박 호일 V자 집광 반사판</text>

  <!-- Label 2 Callout Box -->
  <rect x="20" y="86" width="360" height="28" rx="2" fill="#1c1917" stroke="#f59e0b" stroke-width="1"/>
  <text x="30" y="104" fill="#fef3c7" font-family="sans-serif" font-size="11" font-weight="bold">투명 PET 용기를 수평으로 눕혀 수심 10cm 이하로 유지</text>

  <!-- Center 3D SODIS Foil Reflector Cradle & Horizontal PET Bottle -->
  <g filter="url(#sh23s4)">
    <!-- Sun Icon & Incoming UV-A Solar Rays -->
    <circle cx="84" cy="144" r="18" fill="#f59e0b" stroke="#fef08a" stroke-width="2"/>
    <path d="M108,154 L165,212 M160,204 L165,212 L156,210" fill="none" stroke="#fde047" stroke-width="2"/>
    <path d="M124,144 L210,212 M205,204 L210,212 L201,210" fill="none" stroke="#fde047" stroke-width="2"/>
    <path d="M142,138 L255,212 M250,204 L255,212 L246,210" fill="none" stroke="#fde047" stroke-width="2"/>

    <!-- Corrugated Cardboard Base Support -->
    <polygon points="44,262 115,198 356,224 295,296" fill="#92400e" stroke="#d97706" stroke-width="1.5"/>
    <!-- Shiny Aluminum Foil V-Reflector Lining -->
    <polygon points="50,256 118,195 348,220 290,288" fill="url(#foilSurface)" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- Horizontally Laid Clear PET Water Bottle (Depth < 10cm) -->
    <rect x="116" y="206" width="184" height="54" rx="18" fill="url(#horizBottle)" stroke="#e0f2fe" stroke-width="2"/>
    <!-- Bottle Neck & Tightly Closed Cap on Right -->
    <rect x="300" y="222" width="18" height="22" rx="3" fill="#bae6fd" stroke="#e0f2fe" stroke-width="1.5"/>
    <rect x="316" y="220" width="12" height="26" rx="2" fill="#0284c7" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- Upward Bounced UV-A & IR Heat Rays from Foil into Bottle -->
    <path d="M155,268 L175,232 M168,236 L175,232 L176,240" fill="none" stroke="#fb923c" stroke-width="2"/>
    <path d="M210,272 L230,234 M223,238 L230,234 L231,242" fill="none" stroke="#fb923c" stroke-width="2"/>
    <path d="M262,276 L278,238 M271,242 L278,238 L279,246" fill="none" stroke="#fb923c" stroke-width="2"/>

    <!-- 10cm Shallow Depth Dimension Indicator -->
    <line x1="98" y1="206" x2="98" y2="260" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="92" y1="206" x2="104" y2="206" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="92" y1="260" x2="104" y2="260" stroke="#38bdf8" stroke-width="1.8"/>
  </g>

  <!-- Label 3 Callout Box -->
  <rect x="20" y="314" width="360" height="28" rx="2" fill="#161f2c" stroke="#38bdf8" stroke-width="1"/>
  <text x="30" y="332" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="bold">맑은 날 직사광선 6시간 노출로 UV-A·50C 열 복합 살균</text>

  <!-- Footer Key Takeaway Banner -->
  <rect x="14" y="352" width="372" height="32" fill="#1e1b18" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="24" y="372" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">[핵심] 연료 소모 0%로 배탈 세균·바이러스 99.9% 사멸</text>
</svg>
