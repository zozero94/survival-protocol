<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg35s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="jug35s1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.92"/>
    </linearGradient>
    <pattern id="grid35s1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow35s1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg35s1)"/>
  <rect width="400" height="400" fill="url(#grid35s1)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Label 1 -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 01 // 바닥 배수구 3겹 고무장갑·방수 막 + 10kg+ 무게 압착</text>

  <!-- Label 2 -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9.5">배수구 덮개 닫은 채 손바닥 한 뼘 넓게 3겹 방수막 덮기</text>

  <!-- Main Cross-Section: Tiled Floor + Closed Drain Grate + 3-Layer Rubber/Waterproof Sheet + 10kg+ Water Container Pushing Down -->
  <g filter="url(#shadow35s1)">
    <!-- Sewer Pipe Below Tiles with Rising Dirty Backflow Pressure -->
    <rect x="28" y="222" width="122" height="18" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
    <rect x="250" y="222" width="122" height="18" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
    <!-- Vertical Drain Shaft -->
    <rect x="150" y="222" width="100" height="66" fill="#1c1917" stroke="#52525b" stroke-width="1.8"/>
    <!-- Muddy Backflow Water Level inside Pipe & Upward Force Arrows -->
    <rect x="152" y="232" width="96" height="54" fill="#78350f" opacity="0.85"/>
    <line x1="178" y1="278" x2="178" y2="246" stroke="#ef4444" stroke-width="2.5"/>
    <polygon points="178,240 173,249 183,249" fill="#ef4444"/>
    <line x1="222" y1="278" x2="222" y2="246" stroke="#ef4444" stroke-width="2.5"/>
    <polygon points="222,240 217,249 227,249" fill="#ef4444"/>

    <!-- Closed Metal Drain Cover Grate Flush with Floor -->
    <rect x="150" y="220" width="100" height="8" rx="1" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- 3-Layer Waterproof Bag & Thick Rubber Glove Seal Wide Over Grate -->
    <rect x="112" y="212" width="176" height="5" rx="1" fill="#f59e0b" stroke="#fde68a" stroke-width="1"/>
    <rect x="118" y="206" width="164" height="5" rx="1" fill="#ea580c" stroke="#fed7aa" stroke-width="1"/>
    <rect x="124" y="200" width="152" height="5" rx="1" fill="#dc2626" stroke="#fca5a5" stroke-width="1"/>

    <!-- Heavy 10kg+ Full Water Jug Centered Directly on 3-Layer Seal -->
    <rect x="156" y="102" width="88" height="96" rx="8" fill="url(#jug35s1)" stroke="#bae6fd" stroke-width="2"/>
    <rect x="186" y="88" width="28" height="14" rx="2" fill="#0369a1" stroke="#e0f2fe" stroke-width="1.5"/>
    <!-- Strong Downward Counterweight Force Arrows -->
    <line x1="118" y1="124" x2="118" y2="188" stroke="#4ade80" stroke-width="3"/>
    <polygon points="118,194 112,184 124,184" fill="#4ade80"/>
    <line x1="282" y1="124" x2="282" y2="188" stroke="#4ade80" stroke-width="3"/>
    <polygon points="282,194 276,184 288,184" fill="#4ade80"/>
  </g>

  <!-- Label 3 -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="315" fill="#cbd5e1" font-family="monospace" font-size="9">두꺼운 고무장갑 + 방수 봉투 층 위에 10kg 이상 물통 적재</text>

  <!-- Label 4 -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#0f291e" stroke="#22c55e" stroke-width="1"/>
  <text x="24" y="344" fill="#86efac" font-family="monospace" font-size="9">하수관 수압 역류 시 물통 무게가 위로 솟는 힘 완벽 억제</text>

  <!-- Label 5 -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="376" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">[핵심] 가장 낮은 바닥 배수구부터 3겹 고무막·중량으로 1차 봉쇄</text>
</svg>