<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg40s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="jacket40s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pole40s2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <pattern id="grid40s2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow40s2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg40s2)"/>
  <rect width="400" height="400" fill="url(#grid40s2)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Label 1 -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.2" font-weight="bold">FIG. 02 // 점퍼 2벌 일렬 관통 + 지퍼 면 바닥 방향 배치</text>

  <!-- Label 2 -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9">두 점퍼 밑단 한 뼘 겹쳐 성인 몸 길이 침상 형성</text>

  <!-- Main Visual: Top View 2 Jackets Overlapped + Parallel Poles Threaded Through + Zipper Down Arrow -->
  <g filter="url(#shadow40s2)">
    <!-- Jacket 1 (Left Half - Smooth Back Up, Dotted Zipper Down) -->
    <rect x="78" y="114" width="132" height="126" rx="6" fill="url(#jacket40s2)" stroke="#cbd5e1" stroke-width="1.8"/>
    <!-- Jacket 2 (Right Half - Overlapped at Hem x=186..210) -->
    <rect x="186" y="114" width="136" height="126" rx="6" fill="url(#jacket40s2)" stroke="#cbd5e1" stroke-width="1.8"/>

    <!-- Overlap Seam Highlight Bracket (1 Hand-Span) -->
    <rect x="186" y="114" width="24" height="126" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 2"/>

    <!-- Zipper Line Underneath (Dashed Hidden Facing Ground) -->
    <line x1="88" y1="177" x2="312" y2="177" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Top Parallel Pole Threaded All the Way Through Left-to-Right Handles -->
    <rect x="26" y="128" width="348" height="12" rx="4" fill="url(#pole40s2)" stroke="#fde047" stroke-width="1.4"/>
    <!-- Sleeve Tunnel Guides Along Top Pole -->
    <rect x="82" y="124" width="236" height="20" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 3"/>

    <!-- Bottom Parallel Pole Threaded All the Way Through Left-to-Right Handles -->
    <rect x="26" y="214" width="348" height="12" rx="4" fill="url(#pole40s2)" stroke="#fde047" stroke-width="1.4"/>
    <!-- Sleeve Tunnel Guides Along Bottom Pole -->
    <rect x="82" y="210" width="236" height="20" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 3"/>

    <!-- Handle Overhang Measure Brackets (Left & Right Ends) -->
    <line x1="28" y1="252" x2="76" y2="252" stroke="#22c55e" stroke-width="2"/>
    <line x1="28" y1="246" x2="28" y2="258" stroke="#22c55e" stroke-width="1.5"/>
    <line x1="76" y1="246" x2="76" y2="258" stroke="#22c55e" stroke-width="1.5"/>

    <line x1="324" y1="252" x2="372" y2="252" stroke="#22c55e" stroke-width="2"/>
    <line x1="324" y1="246" x2="324" y2="258" stroke="#22c55e" stroke-width="1.5"/>
    <line x1="372" y1="246" x2="372" y2="258" stroke="#22c55e" stroke-width="1.5"/>

    <!-- Zipper Down Rotation Cue -->
    <path d="M 164 268 Q 200 286 236 268" fill="none" stroke="#f59e0b" stroke-width="2.2"/>
    <polygon points="232,264 242,265 236,274" fill="#f59e0b"/>
  </g>

  <!-- Label 3 -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="315" fill="#cbd5e1" font-family="monospace" font-size="9">막대 2개 양쪽 소매 터널 관통·양끝 손잡이 확보</text>

  <!-- Label 4 -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#1e1b18" stroke="#d97706" stroke-width="1"/>
  <text x="24" y="344" fill="#fed7aa" font-family="monospace" font-size="9">지퍼·단추 면 바닥으로 뒤집어 매끈한 등판 위로</text>

  <!-- Label 5 -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="376" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">[핵심] 허리 틈새 빠짐 방지 + 지퍼 배김 없는 안전 침상</text>
</svg>
