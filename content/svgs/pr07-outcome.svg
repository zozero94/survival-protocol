<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
  <defs>
    <linearGradient id="bgGradBowline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c0f"/>
      <stop offset="100%" stop-color="#12161c"/>
    </linearGradient>

    <!-- Timber Anchor Post Gradients -->
    <linearGradient id="anchorPost" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d2c1e"/>
      <stop offset="50%" stop-color="#694e36"/>
      <stop offset="100%" stop-color="#2a1e14"/>
    </linearGradient>

    <!-- Rope 3D Tubular Shading -->
    <linearGradient id="mainRopeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="workingTailGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <!-- Technical Canvas Backdrop -->
  <rect x="0" y="0" width="800" height="450" fill="url(#bgGradBowline)"/>
  <rect x="15" y="15" width="770" height="420" fill="none" stroke="#222222" stroke-width="1"/>

  <!-- Crosshairs -->
  <path d="M 25 35 L 45 35 M 35 25 L 35 45" stroke="#444" stroke-width="1"/>
  <path d="M 775 35 L 755 35 M 765 25 L 765 45" stroke="#444" stroke-width="1"/>
  <path d="M 25 415 L 45 415 M 35 405 L 35 425" stroke="#444" stroke-width="1"/>
  <path d="M 775 415 L 755 415 M 765 405 L 765 425" stroke="#444" stroke-width="1"/>

  <!-- Metadata -->
  <text x="35" y="55" fill="#555" font-family="monospace" font-size="10" letter-spacing="1">ARCHIVE // OUTCOME SPECIFICATION</text>
  <text x="35" y="70" fill="#E02424" font-family="monospace" font-size="11" font-weight="bold">TARGET: BOWLINE KNOT (매듭의 왕) [KING OF KNOTS SPEC]</text>
  <text x="765" y="55" fill="#555" font-family="monospace" font-size="10" text-anchor="end">RELEASE TIME: 1.0 SEC</text>

  <!-- Left Spec Box -->
  <g id="specBoxLeft" font-family="monospace" font-size="10">
    <rect x="45" y="100" width="180" height="155" fill="#141414" stroke="#333" stroke-width="1"/>
    <rect x="45" y="100" width="180" height="22" fill="#1f1f1f"/>
    <text x="55" y="115" fill="#E02424" font-weight="bold">BOWLINE SPECS</text>
    <text x="55" y="140" fill="#aaa">· KNOT TYPE: FIXED LOOP</text>
    <text x="55" y="160" fill="#aaa">· SLIPPAGE: ZERO (0%)</text>
    <text x="55" y="180" fill="#aaa">· STRENGTH EFF: 75% RATING</text>
    <text x="55" y="200" fill="#aaa">· JAMMING: 100% JAM-PROOF</text>
    <text x="55" y="220" fill="#aaa">· RELEASE: BREAK THE BACK</text>
    <text x="55" y="240" fill="#4ade80">· LOAD CAPACITY: 500+ KG</text>
  </g>

  <!-- Ground Plane Shadow -->
  <ellipse cx="430" cy="400" rx="230" ry="18" fill="#050608" opacity="0.9"/>

  <!-- Anchor Timber Post (Right Anchor) -->
  <!-- 1. Rope segment passing BEHIND post (Drawn before post) -->
  <path d="M 440 310 C 470 330 520 330 550 310" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 440 310 C 470 330 520 330 550 310" stroke="url(#mainRopeGold)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- 2. Timber Post Standing Solid -->
  <polygon points="480,220 520,220 515,410 475,410" fill="url(#anchorPost)" stroke="#1a120b" stroke-width="2"/>
  <ellipse cx="500" cy="220" rx="20" ry="8" fill="#4d3826" stroke="#261b11" stroke-width="1.5"/>

  <!-- 3. Rope segment passing IN FRONT OF post (Drawn after post) -->
  <path d="M 550 310 C 530 270 470 270 440 280" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 550 310 C 530 270 470 270 440 280" stroke="url(#mainRopeGold)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Main Bowline Knot Rigging Under Tension -->
  <!-- Standing Line from top anchor -->
  <path d="M 330 75 L 330 190" stroke="#050505" stroke-width="16" stroke-linecap="round"/>
  <path d="M 330 75 L 330 190" stroke="url(#mainRopeGold)" stroke-width="10" stroke-linecap="round"/>

  <!-- The Nipper Loop Ring (토끼굴) -->
  <path d="M 330 190 C 290 200 280 240 320 250 C 350 255 365 230 350 205 C 345 195 330 190 330 190" stroke="#050505" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M 330 190 C 290 200 280 240 320 250 C 350 255 365 230 350 205 C 345 195 330 190 330 190" stroke="url(#mainRopeGold)" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Collar Loop (뒤통수 칼라 링) Wrapped Around Standing Line -->
  <path d="M 325 245 C 310 230 305 195 330 185 C 360 175 375 210 350 245" stroke="#050505" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M 325 245 C 310 230 305 195 330 185 C 360 175 375 210 350 245" stroke="url(#workingTailGreen)" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Working End Tail (Parallel beside eye loop line) -->
  <path d="M 345 240 L 375 285" stroke="#050505" stroke-width="16" stroke-linecap="round"/>
  <path d="M 345 240 L 375 285" stroke="url(#workingTailGreen)" stroke-width="10" stroke-linecap="round"/>

  <!-- Loop Lead Going to Timber Post Anchor -->
  <path d="M 320 250 C 310 280 370 300 440 310" stroke="#050505" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M 320 250 C 310 280 370 300 440 310" stroke="url(#mainRopeGold)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M 440 280 C 400 270 365 260 345 240" stroke="#050505" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M 440 280 C 400 270 365 260 345 240" stroke="url(#mainRopeGold)" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Tension Direction Arrows -->
  <g stroke="#E02424" stroke-width="2.5" fill="none">
    <line x1="330" y1="130" x2="330" y2="95"/>
    <polygon points="330,88 323,102 337,102" fill="#E02424"/>
    <line x1="420" y1="285" x2="455" y2="295"/>
    <polygon points="462,297 448,290 452,304" fill="#E02424"/>
  </g>

  <!-- Right Technical Panel: 1-Second Quick Release Mechanism -->
  <g id="quickReleasePanel">
    <rect x="565" y="90" width="195" height="180" fill="#141414" stroke="#E02424" stroke-width="1"/>
    <rect x="565" y="90" width="195" height="24" fill="#241010"/>
    <text x="575" y="106" fill="#E02424" font-weight="bold">1-SEC BREAK-THE-BACK</text>

    <!-- Finger Action Diagram -->
    <text x="575" y="132" fill="#ffffff" font-weight="bold">칼라(뒤통수) 꺾기 원리</text>
    <text x="575" y="148" fill="#aaa">1. 매듭 뒤편 둥근 칼라 고리 확인</text>
    <text x="575" y="164" fill="#aaa">2. 엄지로 칼라를 바깥쪽으로 젖힘</text>
    <text x="575" y="180" fill="#aaa">3. 마찰 락 즉시 풀려 1초 만에 해체</text>

    <!-- Mini Vector of the Release Action -->
    <path d="M 610 230 C 630 205 670 205 690 230" stroke="#fbbf24" stroke-width="6" fill="none"/>
    <line x1="650" y1="235" x2="650" y2="210" stroke="#4ade80" stroke-width="2.5"/>
    <polygon points="650,202 643,215 657,215" fill="#4ade80"/>
    <text x="660" y="222" fill="#4ade80" font-size="9">PUSH UP</text>
    <text x="575" y="255" fill="#4ade80" font-weight="bold">JAM-PROOF // 칼날 불필요</text>
  </g>

  <!-- Technical Callouts -->
  <g id="callouts" font-family="monospace" font-size="10" fill="#cccccc">
    <!-- Callout 1: Standing Line -->
    <line x1="330" y1="130" x2="380" y2="130" stroke="#888" stroke-width="1"/>
    <circle cx="330" cy="130" r="2" fill="#888"/>
    <text x="390" y="126" fill="#ffffff" font-weight="bold" text-anchor="start">STANDING PART</text>
    <text x="390" y="139" fill="#888888" text-anchor="start">하중을 받는 주 원줄</text>

    <!-- Callout 2: Fixed Loop -->
    <line x1="460" y1="310" x2="460" y2="350" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="460" cy="310" r="2" fill="#38bdf8"/>
    <text x="460" y="365" fill="#38bdf8" font-weight="bold">FIXED EYE LOOP</text>
    <text x="460" y="378" fill="#888888">하중에도 줄어들지 않는 고리</text>

    <!-- Callout 3: Working Tail -->
    <line x1="375" y1="280" x2="330" y2="330" stroke="#4ade80" stroke-width="1"/>
    <circle cx="375" cy="280" r="2" fill="#4ade80"/>
    <text x="320" y="335" fill="#4ade80" font-weight="bold" text-anchor="end">WORKING END TAIL</text>
    <text x="320" y="348" fill="#888888" text-anchor="end">고리 안쪽으로 단단히 잠김</text>
  </g>
</svg>
