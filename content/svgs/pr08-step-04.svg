<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgS4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Heavy Slate Rock Texture Gradient -->
    <linearGradient id="rockGradS4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Wood Bark Gradient -->
    <linearGradient id="woodBarkS4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- Motion Blur Ghost Fill for Falling Rock -->
    <linearGradient id="rockGhost" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="shadowS4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgS4)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#232830" stroke-width="1.2"/>

  <!-- Technical Corner Ticks -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#475569" stroke-width="1.2"/>

  <!-- Top Header Strip (Label 1) -->
  <rect x="20" y="16" width="360" height="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="16" width="3" height="20" fill="#f59e0b"/>
  <text x="30" y="30" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" letter-spacing="0.5">FIG. 04 // ROCK LOAD &amp; 0.1S COLLAPSE</text>

  <!-- Ground Plane Baseline -->
  <line x1="25" y1="310" x2="375" y2="310" stroke="#334155" stroke-width="1.5"/>
  <path d="M 40 312 L 55 322 M 80 312 L 95 322 M 120 312 L 135 322 M 160 312 L 175 322 M 200 312 L 215 322" stroke="#1e293b" stroke-width="1"/>

  <!-- ============================================== -->
  <!-- 0.1s COLLAPSE MOTION GHOST (Falling Rock Trajectory) -->
  <!-- ============================================== -->
  <!-- Ghost Falling Rock Outline -->
  <polygon points="40,305 270,305 260,265 40,265" fill="url(#rockGhost)" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Downward Impact Arrows -->
  <path d="M 100 210 L 100 265 M 150 200 L 150 265 M 200 210 L 200 265" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="97,265 100,272 103,265" fill="#38bdf8"/>
  <polygon points="147,265 150,272 153,265" fill="#38bdf8"/>
  <polygon points="197,265 200,272 203,265" fill="#38bdf8"/>

  <!-- ============================================== -->
  <!-- 1. FIGURE-4 STICK TRIGGER MECHANISM (Beneath Rock) -->
  <!-- ============================================== -->
  <g filter="url(#shadowS4)">
    <!-- Vertical Post (1번 세움대) -->
    <rect x="135" y="165" width="16" height="145" rx="2" fill="url(#woodBarkS4)" stroke="#271408" stroke-width="1"/>

    <!-- Diagonal Strut (2번 빗장대) -->
    <line x1="143" y1="140" x2="245" y2="240" stroke="#78350f" stroke-width="14" stroke-linecap="round"/>

    <!-- Horizontal Bait Stick (3번 먹이대) -->
    <line x1="110" y1="220" x2="310" y2="220" stroke="#92400e" stroke-width="10" stroke-linecap="round"/>

    <!-- Red Berry Bait on Inner Pin -->
    <circle cx="310" cy="220" r="5" fill="#ef4444"/>
    <circle cx="310" cy="220" r="8" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2"/>
  </g>

  <!-- ============================================== -->
  <!-- 2. HEAVY SLATE ROCK (45-deg Angle) -->
  <!-- ============================================== -->
  <polygon points="35,310 265,115 285,130 65,310" fill="url(#rockGradS4)" stroke="#1e293b" stroke-width="2" filter="url(#shadowS4)"/>
  <!-- Top Rock Thickness Rim -->
  <polygon points="265,115 285,130 295,120 275,105" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <polygon points="35,310 45,302 275,105 265,115" fill="#94a3b8" opacity="0.6"/>
  <!-- Rock Surface Fracture Lines -->
  <path d="M 85 270 L 130 220 L 175 190 M 150 200 L 210 150" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Prey Touch Action Trigger Icon -->
  <path d="M 355 185 C 335 185 330 205 318 215" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="316,212 312,220 320,217" fill="#ef4444"/>

  <!-- Label 2: Heavy Rock -->
  <text x="60" y="90" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">15kg 평평한 바위 안착</text>

  <!-- Label 3: Bait Mount -->
  <text x="280" y="245" fill="#f59e0b" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">먹이대 끝 미끼 장착</text>

  <!-- Label 4: Instant Collapse -->
  <text x="45" y="235" fill="#ef4444" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">톡 건드리면 0.1초 만에 바위 낙하</text>

  <!-- Bottom Visual Callout Box (Label 5) -->
  <rect x="20" y="325" width="360" height="52" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <rect x="20" y="325" width="3" height="52" fill="#f59e0b"/>
  <text x="32" y="355" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">[핵심] 스치기만 해도 와르르 무너지는 민감도</text>
</svg>
