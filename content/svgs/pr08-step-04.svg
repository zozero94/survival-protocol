<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgS4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Heavy Slate Rock Texture Gradient -->
    <linearGradient id="rockGradS4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="35%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Rock Rim 3D Gradient -->
    <linearGradient id="rockRimS4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Wood Bark Gradient -->
    <linearGradient id="woodBarkS4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="35%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#3d210f"/>
    </linearGradient>

    <!-- Diagonal Strut Gradient -->
    <linearGradient id="strutBarkS4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d210f"/>
      <stop offset="40%" stop-color="#854d0e"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#2d1607"/>
    </linearGradient>

    <!-- Carved Inner Wood Notch -->
    <linearGradient id="carvedWoodS4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Motion Blur Ghost Fill for Falling Rock -->
    <linearGradient id="rockGhostS4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08"/>
    </linearGradient>

    <filter id="shadowS4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgS4)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#232830" stroke-width="1.2"/>

  <!-- Technical Corner Ticks -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#475569" stroke-width="1.2"/>

  <!-- Top Header Strip (Label 1) -->
  <rect x="20" y="16" width="360" height="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="16" width="3" height="20" fill="#f59e0b"/>
  <text x="30" y="30" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" letter-spacing="0.5">FIG. 04 // ROCK LOAD &amp; 0.1S COLLAPSE</text>

  <!-- Ground Plane Baseline -->
  <line x1="25" y1="310" x2="375" y2="310" stroke="#334155" stroke-width="1.5"/>
  <path d="M 35 312 L 50 322 M 70 312 L 85 322 M 105 312 L 120 322 M 140 312 L 155 322 M 175 312 L 190 322 M 210 312 L 225 322 M 245 312 L 260 322 M 280 312 L 295 322 M 315 312 L 330 322 M 350 312 L 365 322" stroke="#1e293b" stroke-width="1"/>

  <!-- Ground Contact Shadow beneath Trap & Rock Base -->
  <ellipse cx="148" cy="311" rx="25" ry="4" fill="#000000" opacity="0.8"/>
  <ellipse cx="335" cy="311" rx="40" ry="5" fill="#000000" opacity="0.9"/>

  <!-- ============================================== -->
  <!-- 0.1s COLLAPSE MOTION GHOST (Falling Rock Trajectory) -->
  <!-- ============================================== -->
  <!-- Ghost Rock Dropped Flat on Ground -->
  <polygon points="160,308 360,308 355,280 165,280" fill="url(#rockGhostS4)" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Downward Impact Motion Trajectory Arrows -->
  <path d="M 185 140 L 185 270 M 235 180 L 235 270 M 285 220 L 285 270" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="182,270 185,277 188,270" fill="#38bdf8"/>
  <polygon points="232,270 235,277 238,270" fill="#38bdf8"/>
  <polygon points="282,270 285,277 288,270" fill="#38bdf8"/>

  <!-- ============================================== -->
  <!-- 1. HEAVY SLATE ROCK (45-deg Angle, Propped on Strut Tip) -->
  <!-- ============================================== -->
  <!-- Slate Rock Body: Underside connects front lip (165,108) down to ground (325,310) -->
  <g filter="url(#shadowS4)">
    <!-- 3D Rear Bevel Facet -->
    <polygon points="180,94 365,310 375,302 192,84" fill="url(#rockRimS4)" stroke="#334155" stroke-width="0.8"/>
    <!-- Top Face of Heavy Slate -->
    <polygon points="165,108 325,310 365,310 180,94" fill="url(#rockGradS4)" stroke="#1e293b" stroke-width="1.8"/>
    <!-- Front Lifted Lip Thickness (Where it rests on strut notch) -->
    <polygon points="165,108 180,94 192,84 175,98" fill="#94a3b8" stroke="#475569" stroke-width="0.8"/>
    <!-- Rock Geological Surface Cleavage Fracture Lines -->
    <path d="M 205 135 L 245 190 L 305 240 M 260 170 L 330 220 M 220 160 L 275 225" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- ============================================== -->
  <!-- 2. FIGURE-4 STICK TRIGGER MECHANISM (In Foreground) -->
  <!-- ============================================== -->
  <g filter="url(#shadowS4)">
    <!-- Stick 1: Vertical Post (세움대 - Stands upright at x=138 to 156, y=145 to 310) -->
    <rect x="138" y="160" width="18" height="150" rx="2.5" fill="url(#woodBarkS4)" stroke="#271408" stroke-width="1.2"/>
    <!-- Post Top Chisel Head (납작 쐐기 - y=130 to 160) -->
    <polygon points="138,160 147,130 156,160" fill="url(#carvedWoodS4)" stroke="#78350f" stroke-width="1"/>
    <!-- Post Middle Notch (네모 홈 - y=222 to 238) -->
    <rect x="138" y="222" width="10" height="16" fill="url(#carvedWoodS4)" stroke="#78350f" stroke-width="0.8"/>
    <!-- Post Bark Lines -->
    <line x1="143" y1="180" x2="143" y2="215" stroke="#271408" stroke-width="0.8"/>
    <line x1="151" y1="245" x2="151" y2="295" stroke="#271408" stroke-width="0.8"/>

    <!-- Stick 2: Diagonal Strut (빗장대 - Slanted piece propping the rock) -->
    <!-- Extends from top support notch (165,108) down to bait stick rear joint (195,238) -->
    <polygon points="160,102 170,114 198,238 186,242" fill="url(#strutBarkS4)" stroke="#271408" stroke-width="1.2"/>
    <!-- Upper Support Tip Notch (Mates over Post Chisel and props Rock) -->
    <polygon points="160,102 170,114 165,108" fill="url(#carvedWoodS4)" stroke="#b45309" stroke-width="1"/>
    <!-- Mating Notch over Post Chisel -->
    <polygon points="144,130 154,138 152,126" fill="url(#carvedWoodS4)" stroke="#b45309" stroke-width="0.8"/>
    <!-- Critical Mechanical Contact Pivot (Rock resting on Strut) -->
    <circle cx="165" cy="108" r="4" fill="#ef4444" opacity="0.95"/>
    <circle cx="165" cy="108" r="7.5" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Stick 3: Horizontal Bait Stick (먹이대 - Runs from x=122 through to x=310, y=226) -->
    <!-- Runs underneath the tilted rock into the danger zone -->
    <path d="M 122 226 L 290 226 L 315 232 L 290 238 L 122 238 Z" fill="url(#woodBarkS4)" stroke="#271408" stroke-width="1.2"/>
    <!-- Front Ledge on Bait Stick (Locked into Post middle notch) -->
    <rect x="136" y="224" width="12" height="14" fill="url(#carvedWoodS4)" stroke="#b45309" stroke-width="0.8"/>
    <!-- Rear Catch Notch on Bait Stick (Locked with Strut bottom) -->
    <polygon points="186,226 198,226 192,238" fill="url(#carvedWoodS4)" stroke="#b45309" stroke-width="0.8"/>
    <!-- Pointed Inner Bait Pin under the Rock -->
    <polygon points="290,226 315,232 290,238" fill="url(#carvedWoodS4)" stroke="#b45309" stroke-width="0.8"/>
    <!-- Juicy Red Wild Berries Bait -->
    <circle cx="310" cy="232" r="5" fill="#ef4444"/>
    <circle cx="316" cy="229" r="4" fill="#dc2626"/>
    <circle cx="310" cy="232" r="8" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2"/>
  </g>

  <!-- Prey Touch Action Trigger Pointer -->
  <path d="M 350 205 C 335 205 330 220 322 228" stroke="#ef4444" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polygon points="320,225 316,233 324,230" fill="#ef4444"/>

  <!-- ============================================== -->
  <!-- TECHNICAL LABELS & POINTERS -->
  <!-- ============================================== -->
  <!-- Label 2: Heavy Rock -->
  <line x1="260" y1="125" x2="280" y2="78" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="260" cy="125" r="3" fill="#38bdf8"/>
  <rect x="200" y="65" width="150" height="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="275" y="79" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">15kg 평평한 바위 안착</text>

  <!-- Label 3: Bait Mount -->
  <line x1="312" y1="240" x2="312" y2="260" stroke="#f59e0b" stroke-width="1.2"/>
  <circle cx="312" cy="240" r="3" fill="#f59e0b"/>
  <rect x="235" y="260" width="140" height="20" fill="#18181b" stroke="#f59e0b" stroke-width="1"/>
  <text x="305" y="274" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">먹이대 끝 미끼 장착</text>

  <!-- Label 4: Instant Collapse -->
  <line x1="185" y1="210" x2="135" y2="200" stroke="#ef4444" stroke-width="1.2"/>
  <circle cx="185" cy="210" r="3" fill="#ef4444"/>
  <rect x="25" y="190" width="155" height="20" fill="#1c1917" stroke="#ef4444" stroke-width="1"/>
  <text x="102" y="204" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">톡 건드리면 0.1초 만에 바위 낙하</text>

  <!-- Bottom Visual Callout Box (Label 5) -->
  <rect x="20" y="325" width="360" height="52" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <rect x="20" y="325" width="3" height="52" fill="#f59e0b"/>
  <text x="32" y="355" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">[핵심] 스치기만 해도 와르르 무너지는 민감도</text>
</svg>
