<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgS4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Heavy Slate Rock Texture Gradient -->
    <linearGradient id="rockGradS4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="35%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Rock Underside Cavern Shadow Gradient -->
    <linearGradient id="rockUnderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Rock Rim 3D Gradient -->
    <linearGradient id="rockRimS4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Wood Bark Gradient -->
    <linearGradient id="woodBarkS4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="35%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#3d210f"/>
    </linearGradient>

    <!-- Diagonal Strut Gradient -->
    <linearGradient id="strutBarkS4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d210f"/>
      <stop offset="40%" stop-color="#854d0e"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#2d1607"/>
    </linearGradient>

    <!-- Carved Inner Wood Notch -->
    <linearGradient id="carvedWoodS4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Motion Blur Ghost Fill for Falling Rock -->
    <linearGradient id="rockGhostS4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08"/>
    </linearGradient>

    <filter id="shadowS4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgS4)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#232830" stroke-width="1.2"/>

  <!-- Technical Corner Ticks -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#475569" stroke-width="1.2"/>

  <!-- Top Header Strip (Label 1) -->
  <rect x="20" y="16" width="360" height="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="16" width="3" height="20" fill="#f59e0b"/>
  <text x="30" y="30" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" letter-spacing="0.5">FIG. 04 // ROCK LOAD &amp; 0.1S COLLAPSE</text>

  <!-- Ground Plane Baseline -->
  <line x1="25" y1="310" x2="375" y2="310" stroke="#334155" stroke-width="1.5"/>
  <path d="M 35 312 L 50 322 M 70 312 L 85 322 M 105 312 L 120 322 M 140 312 L 155 322 M 175 312 L 190 322 M 210 312 L 225 322 M 245 312 L 260 322 M 280 312 L 295 322 M 315 312 L 330 322 M 350 312 L 365 322" stroke="#1e293b" stroke-width="1"/>

  <!-- Ground Shadows -->
  <ellipse cx="156" cy="311" rx="28" ry="5" fill="#000000" opacity="0.8"/>
  <ellipse cx="320" cy="311" rx="45" ry="6" fill="#000000" opacity="0.9"/>

  <!-- ============================================== -->
  <!-- 0.1s COLLAPSE MOTION GHOST (Falling Rock Trajectory) -->
  <!-- ============================================== -->
  <!-- Ghost Rock Dropped Flat on Ground Crushing Bait Area -->
  <polygon points="135,308 355,308 350,282 140,282" fill="url(#rockGhostS4)" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Downward Impact Motion Trajectory Arrows -->
  <path d="M 180 120 L 180 270 M 235 135 L 235 270 M 285 145 L 285 270" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <polygon points="177,270 180,277 183,270" fill="#38bdf8"/>
  <polygon points="232,270 235,277 238,270" fill="#38bdf8"/>
  <polygon points="282,270 285,277 288,270" fill="#38bdf8"/>

  <!-- ============================================== -->
  <!-- 1. HEAVY 15KG SLATE ROCK (3D Propped Ceiling Slab) -->
  <!-- ============================================== -->
  <!-- The massive stone slab rests its back edge on ground (290..365, 310) and is propped up at front lip (138, 77) by Strut -->
  <g filter="url(#shadowS4)">
    <!-- 3D Rear Bevel Facet -->
    <polygon points="154,63 365,310 375,302 166,53" fill="url(#rockRimS4)" stroke="#334155" stroke-width="0.8"/>
    <!-- Top Face of Heavy Slate Slab -->
    <polygon points="138,77 325,310 365,310 154,63" fill="url(#rockGradS4)" stroke="#1e293b" stroke-width="1.8"/>
    <!-- Front Lifted Lip Thickness (Resting cleanly on Strut top notch) -->
    <polygon points="138,77 154,63 166,53 148,69" fill="#94a3b8" stroke="#475569" stroke-width="0.8"/>
    <!-- Rock Surface Geological Cleavage Fracture Lines -->
    <path d="M 190 100 L 235 150 L 305 210 M 245 125 L 325 185 M 205 120 L 265 175" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- ============================================== -->
  <!-- 2. FIGURE-4 STICK TRIGGER MECHANISM (In Foreground) -->
  <!-- ============================================== -->
  <g filter="url(#shadowS4)">
    <!-- Stick 1: Vertical Post (세움대 - Stands upright at x=145 to 167, y=125 to 310) -->
    <rect x="145" y="125" width="22" height="185" rx="2.5" fill="url(#woodBarkS4)" stroke="#271408" stroke-width="1.2"/>
    <!-- Post Top Chisel Head (납작 쐐기 - Peak at (156, 95)) -->
    <polygon points="145,125 156,95 167,125" fill="url(#carvedWoodS4)" stroke="#78350f" stroke-width="1"/>
    <!-- Post Middle Notch (네모 홈 - y=192 to 208) -->
    <rect x="145" y="192" width="12" height="16" fill="url(#carvedWoodS4)" stroke="#78350f" stroke-width="0.8"/>
    <!-- Post Bark Lines -->
    <line x1="150" y1="140" x2="150" y2="185" stroke="#271408" stroke-width="0.8"/>
    <line x1="162" y1="215" x2="162" y2="290" stroke="#271408" stroke-width="0.8"/>

    <!-- Stick 2: Diagonal Strut (Mathematically 45.0°, Top at (156, 95) down to (258, 196)) -->
    <!-- Extends above post to (138, 77) where it directly props up the rock's front underside lip -->
    <polygon points="128,67 140,79 156,95 168,83 178,93 268,183 258,196 248,186 148,87 138,77 118,57" fill="url(#strutBarkS4)" stroke="#271408" stroke-width="1.2"/>

    <!-- Upper Support Tip Notch (Props Rock at (138, 77)) -->
    <polygon points="128,67 140,79 138,77" fill="url(#carvedWoodS4)" stroke="#b45309" stroke-width="1"/>
    <!-- Mating Notch over Post Chisel (156, 95) -->
    <polygon points="148,87 156,95 164,87 156,92" fill="url(#carvedWoodS4)" stroke="#b45309" stroke-width="0.8"/>
    <!-- Bottom Beveled Tip (Locks into Bait stick rear notch at y=192 to 198) -->
    <polygon points="248,186 258,196 268,183 258,180" fill="url(#carvedWoodS4)" stroke="#b45309" stroke-width="0.8"/>

    <!-- Critical Mechanical Contact Pivots -->
    <circle cx="138" cy="77" r="4.5" fill="#ef4444" opacity="0.95"/>
    <circle cx="138" cy="77" r="8" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2"/>
    <circle cx="156" cy="95" r="3.5" fill="#38bdf8" opacity="0.9"/>
    <circle cx="258" cy="196" r="3.5" fill="#38bdf8" opacity="0.9"/>

    <!-- Stick 3: Horizontal Bait Stick (Runs from x=110 across to x=305, y=192 to 208) -->
    <!-- Extends into the sheltered cavern under the rock, bait clearly inside the fall zone -->
    <path d="M 110 192 L 285 192 L 305 200 L 285 208 L 110 208 Z" fill="url(#woodBarkS4)" stroke="#271408" stroke-width="1.2"/>
    <!-- Front Ledge on Bait Stick (Locked into Post middle notch) -->
    <polygon points="145,192 157,192 157,208 145,208" fill="url(#carvedWoodS4)" stroke="#b45309" stroke-width="0.8"/>
    <!-- Rear Catch Notch on Bait Stick (Locked with Strut bottom) -->
    <polygon points="250,192 266,192 258,204" fill="url(#carvedWoodS4)" stroke="#b45309" stroke-width="0.8"/>
    <!-- Pointed Inner Bait Pin under the Rock -->
    <polygon points="285,192 305,200 285,208" fill="url(#carvedWoodS4)" stroke="#b45309" stroke-width="0.8"/>
    <!-- Juicy Red Wild Berries Bait (Positioned under the rock in open air) -->
    <circle cx="300" cy="200" r="5" fill="#ef4444"/>
    <circle cx="306" cy="197" r="4" fill="#dc2626"/>
    <circle cx="300" cy="200" r="8" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2"/>
  </g>

  <!-- Prey Touch Action Trigger Pointer -->
  <path d="M 345 175 C 330 175 322 190 312 198" stroke="#ef4444" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <polygon points="310,195 306,203 314,200" fill="#ef4444"/>

  <!-- ============================================== -->
  <!-- TECHNICAL LABELS & POINTERS -->
  <!-- ============================================== -->
  <!-- Label 2: Heavy Rock -->
  <line x1="230" y1="100" x2="270" y2="65" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="230" cy="100" r="3" fill="#38bdf8"/>
  <rect x="200" y="55" width="150" height="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="275" y="69" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">15kg 평평한 바위 안착</text>

  <!-- Label 3: Bait Mount (Points directly to berries inside the drop zone) -->
  <line x1="300" y1="210" x2="300" y2="245" stroke="#f59e0b" stroke-width="1.2"/>
  <circle cx="300" cy="210" r="3" fill="#f59e0b"/>
  <rect x="230" y="245" width="140" height="20" fill="#18181b" stroke="#f59e0b" stroke-width="1"/>
  <text x="300" y="259" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">먹이대 끝 미끼 장착</text>

  <!-- Label 4: Instant Collapse -->
  <line x1="180" y1="210" x2="135" y2="225" stroke="#ef4444" stroke-width="1.2"/>
  <circle cx="180" cy="210" r="3" fill="#ef4444"/>
  <rect x="25" y="215" width="155" height="20" fill="#1c1917" stroke="#ef4444" stroke-width="1"/>
  <text x="102" y="229" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">톡 건드리면 0.1초 만에 바위 낙하</text>

  <!-- Bottom Visual Callout Box (Label 5) -->
  <rect x="20" y="325" width="360" height="52" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <rect x="20" y="325" width="3" height="52" fill="#f59e0b"/>
  <text x="32" y="355" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">[핵심] 스치기만 해도 와르르 무너지는 민감도</text>
</svg>
