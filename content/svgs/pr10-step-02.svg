<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgS2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Stone Dish Gradient -->
    <linearGradient id="stoneDishGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Liquid Amber Resin Pool -->
    <radialGradient id="liquidResinGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <!-- Glowing Embers Radial -->
    <radialGradient id="emberGlowS2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="25%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="85%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowS2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgS2)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#232830" stroke-width="1.2"/>

  <!-- Technical Corner Ticks -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#475569" stroke-width="1.2"/>

  <!-- Top Header Strip (Label 1) -->
  <rect x="20" y="16" width="360" height="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="16" width="3" height="20" fill="#f59e0b"/>
  <text x="30" y="30" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" letter-spacing="0.5">FIG. 02 // GENTLE EMBER MELTING PROCESS</text>

  <!-- Ground Bed Level -->
  <line x1="20" y1="320" x2="380" y2="320" stroke="#334155" stroke-width="1.5"/>

  <!-- Glowing Charcoal Ember Bed on Right Side -->
  <g filter="url(#shadowS2)">
    <!-- Charcoal Mound -->
    <ellipse cx="310" cy="305" rx="65" ry="25" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <!-- Glowing Coals Clusters -->
    <circle cx="280" cy="300" r="12" fill="url(#emberGlowS2)"/>
    <circle cx="305" cy="290" r="16" fill="url(#emberGlowS2)"/>
    <circle cx="335" cy="302" r="14" fill="url(#emberGlowS2)"/>
    <circle cx="295" cy="310" r="11" fill="url(#emberGlowS2)"/>
    <circle cx="325" cy="312" r="10" fill="url(#emberGlowS2)"/>

    <!-- Ember Cores Specular Glow -->
    <circle cx="305" cy="290" r="6" fill="#fffbeb"/>
    <circle cx="280" cy="300" r="4" fill="#fef08a"/>

    <!-- Radiant Heat Waves from Embers -->
    <path d="M 270 275 Q 240 260 215 265" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.8"/>
    <path d="M 280 255 Q 245 240 210 248" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.8"/>
    <path d="M 295 240 Q 255 220 205 230" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3 3" fill="none" opacity="0.7"/>
  </g>

  <!-- Concave Stone Dish Resting on Support Stones (Left/Center) -->
  <g filter="url(#shadowS2)">
    <!-- Support Stones Beneath Dish -->
    <ellipse cx="100" cy="315" rx="20" ry="10" fill="#334155" stroke="#1e293b" stroke-width="1"/>
    <ellipse cx="160" cy="315" rx="22" ry="11" fill="#334155" stroke="#1e293b" stroke-width="1"/>

    <!-- Outer Concave Stone Dish Body -->
    <path d="M 45 245 C 50 310, 210 310, 215 245 C 190 265, 70 265, 45 245 Z" fill="url(#stoneDishGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <ellipse cx="130" cy="245" rx="85" ry="24" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

    <!-- Molten Golden Pine Resin Pool inside Dish Cavity -->
    <ellipse cx="130" cy="247" rx="72" ry="18" fill="url(#liquidResinGrad)" stroke="#92400e" stroke-width="1.2"/>

    <!-- Melting Resin Chunks & Bubbles -->
    <ellipse cx="115" cy="244" rx="14" ry="7" fill="#b45309" opacity="0.6"/>
    <circle cx="100" cy="246" r="3" fill="#fde047" opacity="0.85"/>
    <circle cx="145" cy="248" r="3.5" fill="#fde047" opacity="0.85"/>
    <circle cx="165" cy="245" r="2.5" fill="#fffbeb" opacity="0.9"/>
    <!-- Specular Highlight on Liquid Surface -->
    <path d="M 85 243 Q 130 252 175 243" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- Label 2: Molten Golden Resin inside Concave Stone Dish -->
  <g>
    <line x1="130" y1="247" x2="130" y2="120" stroke="#fbbf24" stroke-width="1.2"/>
    <circle cx="130" cy="247" r="2.5" fill="#fbbf24"/>
    <rect x="40" y="108" width="180" height="16" fill="#1c1308" rx="3" stroke="#b45309" stroke-width="1"/>
    <text x="130" y="120" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">오목한 돌판 속 황금빛 액상 송진</text>
  </g>

  <!-- Dimension Indicator: 10cm Gap from Direct Flame (Label 3) -->
  <g>
    <line x1="215" y1="290" x2="265" y2="290" stroke="#38bdf8" stroke-width="1.2"/>
    <path d="M 215 287 L 208 290 L 215 293 Z" fill="#38bdf8"/>
    <path d="M 265 287 L 272 290 L 265 293 Z" fill="#38bdf8"/>
    <line x1="215" y1="270" x2="215" y2="300" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="265" y1="270" x2="265" y2="300" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 2"/>
    <rect x="180" y="150" width="180" height="16" fill="#0b1726" rx="3" stroke="#0284c7" stroke-width="1"/>
    <text x="270" y="162" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">숯불 가장자리 10cm 간접 거치</text>
    <line x1="240" y1="290" x2="270" y2="166" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="2 2"/>
  </g>

  <!-- Flame Barrier / Radiant Heating Indicator (Label 4) -->
  <g>
    <path d="M 245 220 L 245 260" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="245" cy="240" r="3" fill="#ef4444"/>
    <rect x="170" y="180" width="205" height="16" fill="#200a0a" rx="3" stroke="#b91c1c" stroke-width="1"/>
    <text x="272" y="192" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">직화 불꽃 차단 및 은근한 복사열 가열</text>
  </g>

  <!-- Bottom Core Insight Briefing Box (Label 5) -->
  <rect x="20" y="348" width="360" height="26" fill="#111827" rx="4" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="20" y="348" width="4" height="26" fill="#f59e0b" rx="1"/>
  <text x="200" y="364" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">[핵심] 인화 방지를 위한 100% 잔열 용융</text>
</svg>
