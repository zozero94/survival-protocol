<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1701" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#0e1319"/>
    </linearGradient>
    <linearGradient id="woodBeam17" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#5c4033"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="rawHide17" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ashLyeVat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="drop1701" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="grid1701" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16202c" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg1701)"/>
  <rect width="400" height="400" fill="url(#grid1701)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#253342" stroke-width="1"/>

  <!-- Top Header (Label 1) -->
  <rect x="16" y="14" width="368" height="28" rx="2" fill="#0f1722" stroke="#2c3e50" stroke-width="1"/>
  <text x="24" y="32" fill="#fde68a" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 01 // FLESHING BEAM &amp; WOOD ASH LYE DEHAIRING</text>

  <!-- Main 3D Illustration: Fleshing Log Beam (Left) & Wood Ash Lye Dehairing Vat (Right) -->
  <g filter="url(#drop1701)">
    <!-- Left: Inclined Smooth Fleshing Log Beam -->
    <path d="M 42 268 L 138 112 L 178 124 L 82 280 Z" fill="url(#woodBeam17)" stroke="#a16207" stroke-width="1.3"/>
    <ellipse cx="158" cy="118" rx="21" ry="9" transform="rotate(17 158 118)" fill="#b45309" stroke="#fde68a" stroke-width="1"/>

    <!-- Draped Rawhide Over Log Beam -->
    <path d="M 62 248 L 128 138 L 166 148 L 104 258 C 92 262 74 258 62 248 Z" fill="url(#rawHide17)" stroke="#f59e0b" stroke-width="1.2"/>

    <!-- Blunt Rounded Stone Scraper Pushing Fat Layer Down -->
    <rect x="92" y="172" width="54" height="20" rx="9" transform="rotate(16 119 182)" fill="#475569" stroke="#cbd5e1" stroke-width="1.3"/>
    <!-- Scraped White Subcutaneous Fat Roll -->
    <path d="M 86 196 Q 112 206 136 202" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Downward Scraping Motion Arrow -->
    <path d="M 110 210 L 96 235" stroke="#fde68a" stroke-width="2" stroke-linecap="round"/>
    <polygon points="92,240 94,230 102,235" fill="#fde68a"/>

    <!-- Right: Wood Ash Lye Pit Vat & Stream Rinse -->
    <path d="M 218 145 L 362 145 L 346 258 C 344 268 330 274 290 274 C 250 274 236 268 234 258 Z" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
    <ellipse cx="290" cy="152" rx="68" ry="14" fill="url(#ashLyeVat)" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Submerged Hide & Loosened Hair Follicles in Lye Solution -->
    <path d="M 248 168 Q 290 192 332 168 L 324 236 Q 290 248 256 236 Z" fill="#e2e8f0" opacity="0.85" stroke="#94a3b8" stroke-width="1"/>
    <!-- Alkaline Ash Bubbles (KOH Swelling) -->
    <circle cx="268" cy="195" r="3.5" fill="#f8fafc"/>
    <circle cx="295" cy="185" r="4" fill="#f8fafc"/>
    <circle cx="315" cy="205" r="3" fill="#f8fafc"/>
    <circle cx="282" cy="218" r="3.5" fill="#38bdf8"/>
    <circle cx="308" cy="224" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Label 2 -->
  <rect x="20" y="60" width="360" height="22" rx="2" fill="#141a23" stroke="#334155" stroke-width="1"/>
  <text x="28" y="75" fill="#fde68a" font-family="monospace" font-size="8.5" font-weight="bold">기울인 통나무 위에서 뭉툭한 돌로 안쪽 비계 밀어내기</text>

  <!-- Label 3 -->
  <rect x="20" y="295" width="360" height="22" rx="2" fill="#141a23" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="28" y="310" fill="#f59e0b" font-family="monospace" font-size="8.5" font-weight="bold">하얀 나무재 푼 잿물에 2~3일 담가 털구멍 불리기</text>

  <!-- Label 4 -->
  <rect x="20" y="330" width="360" height="22" rx="2" fill="#141a23" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="28" y="345" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">뭉툭한 나무 주걱으로 털 밀어내고 개울물에 헹구기</text>

  <!-- Label 5 -->
  <rect x="16" y="368" width="368" height="22" rx="2" fill="#1e293b" stroke="#e02424" stroke-width="1"/>
  <text x="24" y="383" fill="#ffffff" font-family="monospace" font-size="9.0" font-weight="bold">[1단계 핵심] 가죽 상처 없이 기름·털·잿물 깨끗이 제거</text>
</svg>