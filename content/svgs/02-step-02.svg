<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <!-- 필드 매뉴얼 외곽 테두리 및 그리드 -->
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 메타데이터 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-02 [FIRE-BOW-DRILL]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 02</text>

  <!-- 수평 바닥 밑판 -->
  <rect x="60" y="250" width="280" height="30" fill="#121212" stroke="#E5E5E5" stroke-width="2"/>
  
  <!-- 수직 스핀들 -->
  <rect x="193" y="110" width="14" height="140" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/>
  <ellipse cx="200" cy="100" rx="35" ry="10" fill="#262626" stroke="#FFFFFF" stroke-width="2"/>

  <!-- 활대 (곡선형 물푸레나무 활) -->
  <path d="M 60 170 Q 200 135 340 170" fill="none" stroke="#E5E5E5" stroke-width="3"/>
  <!-- 활 시위 (스핀들을 한 바퀴 감은 끈) -->
  <line x1="60" y1="170" x2="193" y2="180" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2"/>
  <ellipse cx="200" cy="180" rx="10" ry="5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="207" y1="180" x2="340" y2="170" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- 수평 왕복 스트로크 양방향 화살표 -->
  <path d="M 90 145 H 310" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="90,140 75,145 90,150" fill="#FFFFFF"/>
  <polygon points="310,140 325,145 310,150" fill="#FFFFFF"/>
  <text x="200" y="138" fill="#FFFFFF" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">RECIPROCATING BOW MOTION (&gt;400 RPM)</text>

  <!-- 스핀들 고속 회전 인디케이터 화살표 -->
  <path d="M 180 200 A 25 10 0 1 0 220 200" fill="none" stroke="#E5E5E5" stroke-width="2"/>
  <polygon points="220,196 226,203 218,206" fill="#E5E5E5"/>

  <!-- 접촉면 400°C 마찰열 연기 기둥 표현 -->
  <path d="M 195 248 Q 185 235 190 220" fill="none" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 205 248 Q 215 235 210 220" fill="none" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- 흑색 탄화 분말 집적 (V-Notch 밑) -->
  <circle cx="200" cy="254" r="5" fill="#FFFFFF"/>
  <text x="220" y="260" fill="#E5E5E5" font-family="monospace" font-size="9" font-weight="bold">CARBON COAL (400°C+)</text>

  <!-- 하단 설명 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 02: HIGH-FRICTION RECIPROCAL DRILLING</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">FULL BOW LENGTH STROKES UNTIL DENSE WHITE SMOKE TURNS PURE BLACK</text>
</svg>
