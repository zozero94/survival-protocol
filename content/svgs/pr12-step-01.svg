<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1201" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090b0e"/>
      <stop offset="100%" stop-color="#0e1318"/>
    </linearGradient>
    <linearGradient id="steelCyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="burnInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d12"/>
    </linearGradient>
    <linearGradient id="copperWire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadow1201" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.78"/>
    </filter>
    <pattern id="grid1201" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#18222d" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#bg1201)"/>
  <rect width="400" height="400" fill="url(#grid1201)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#263545" stroke-width="1"/>

  <!-- Top HUD Header -->
  <rect x="16" y="14" width="368" height="28" fill="#101720" stroke="#2c3e50" stroke-width="1"/>
  <text x="26" y="32" fill="#fde68a" font-family="monospace" font-size="11" font-weight="bold">FIG. 01 // STEEL CAN SELECTION &amp; LINER BURN-OFF</text>

  <!-- Left: Large Outer Steel Can (12~15cm) with Inner Can (8~10cm) Gap Comparison -->
  <g filter="url(#shadow1201)">
    <!-- Outer Can Cylinder Body -->
    <path d="M 65 150 L 65 280 A 68 18 0 0 0 201 280 L 201 150 Z" fill="url(#steelCyl)" stroke="#cbd5e1" stroke-width="1.2"/>
    <ellipse cx="133" cy="150" rx="68" ry="18" fill="url(#burnInner)" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Corrugation Ribs on Outer Steel Can -->
    <path d="M 65 185 A 68 16 0 0 0 201 185" fill="none" stroke="#334155" stroke-width="2"/>
    <path d="M 65 215 A 68 16 0 0 0 201 215" fill="none" stroke="#334155" stroke-width="2"/>
    <path d="M 65 245 A 68 16 0 0 0 201 245" fill="none" stroke="#334155" stroke-width="2"/>

    <!-- Inner Small Can Cylinder Concentric Preview -->
    <ellipse cx="133" cy="150" rx="45" ry="12" fill="#0f172a" stroke="#fde68a" stroke-width="1.8" stroke-dasharray="4,2"/>
    <!-- 1.5~2cm Annular Air Gap Arrows -->
    <line x1="66" y1="150" x2="88" y2="150" stroke="#38bdf8" stroke-width="2"/>
    <line x1="178" y1="150" x2="200" y2="150" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Right: Pre-Burn (Liner Burn-Off) & Stripped Copper/Steel Wire Coil -->
  <g filter="url(#shadow1201)">
    <path d="M 248 175 L 248 275 A 45 13 0 0 0 338 275 L 338 175 Z" fill="url(#steelCyl)" stroke="#cbd5e1" stroke-width="1.2"/>
    <ellipse cx="293" cy="175" rx="45" ry="13" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Pre-burn Flame Purging Epoxy Coating -->
    <path d="M 272 175 C 272 142, 286 135, 293 118 C 300 135, 314 142, 314 175 Z" fill="#f97316" opacity="0.85"/>
    <path d="M 281 175 C 281 152, 289 145, 293 132 C 297 145, 305 152, 305 175 Z" fill="#fde68a"/>

    <!-- Stripped Copper/Steel Salvage Wire Coil Below -->
    <ellipse cx="295" cy="296" rx="36" ry="10" fill="none" stroke="url(#copperWire)" stroke-width="3.5"/>
    <ellipse cx="295" cy="293" rx="32" ry="8" fill="none" stroke="url(#copperWire)" stroke-width="2.5"/>
  </g>

  <!-- Callouts & Labels -->
  <!-- Label 2: Outer (12-15cm) & Inner Can -->
  <line x1="133" y1="132" x2="133" y2="76" stroke="#fde68a" stroke-width="1.2"/>
  <circle cx="133" cy="132" r="3" fill="#fde68a"/>
  <rect x="18" y="52" width="335" height="24" rx="3" fill="#0f172a" stroke="#fde68a" stroke-width="1"/>
  <text x="26" y="68" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">외부 대형 철제 깡통 (직경 12~15cm) &amp; 내부 소형 깡통</text>

  <!-- Label 3: 1.5~2cm finger-width air gap -->
  <line x1="189" y1="150" x2="215" y2="110" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="189" cy="150" r="3" fill="#38bdf8"/>
  <rect x="75" y="86" width="307" height="24" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="83" y="102" fill="#f8fafc" font-family="sans-serif" font-size="11">내외측 벽면 사이 손가락 한 마디 (1.5~2cm) 공기 틈</text>

  <!-- Label 4: 5-min pre-burn to remove epoxy liner -->
  <line x1="293" y1="245" x2="245" y2="310" stroke="#f97316" stroke-width="1.2"/>
  <circle cx="293" cy="245" r="3" fill="#f97316"/>
  <rect x="24" y="310" width="305" height="24" rx="3" fill="#0f172a" stroke="#f97316" stroke-width="1"/>
  <text x="32" y="326" fill="#fde68a" font-family="sans-serif" font-size="11">사용 전 5분 공소로 내부 에폭시 코팅 완전 제거</text>

  <!-- Label 5: Core Rule -->
  <rect x="18" y="344" width="364" height="34" rx="4" fill="#141e28" stroke="#eab308" stroke-width="1.2"/>
  <text x="28" y="365" fill="#fde68a" font-family="sans-serif" font-size="11.5" font-weight="bold">[핵심] 고열 강철 깡통 선별 &amp; 피복 벗긴 폐전선 확보</text>
</svg>
