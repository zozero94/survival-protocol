<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-07 [PINE-RESIN-OINTMENT]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 01</text>

  <!-- 소나무 수피 단면 (Pine Bark Trunk) -->
  <rect x="60" y="90" width="70" height="190" fill="#141414" stroke="#737373" stroke-width="1.5"/>
  <!-- 소나무 상처 및 송진 덩어리 (Resin Globules) -->
  <polygon points="130,130 110,145 130,160" fill="#262626" stroke="#FFFFFF" stroke-width="1"/>
  <ellipse cx="132" cy="175" rx="8" ry="14" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="75" y="145" fill="#A3A3A3" font-family="monospace" font-size="9">PINE TRUNK</text>

  <!-- 긁어모으는 석기 스크레이퍼 -->
  <polygon points="165,150 145,170 155,180" fill="#E5E5E5" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M 160 160 L 140 175" stroke="#FFFFFF" stroke-width="2"/>
  <polygon points="140,175 145,168 148,175" fill="#FFFFFF"/>
  <text x="175" y="165" fill="#FFFFFF" font-family="monospace" font-size="9">SCRAPE RAW RESIN</text>

  <!-- 오목한 조리 편평석 (Concave Hearth Stone) -->
  <path d="M 210 210 Q 280 250 350 210 L 330 260 Q 280 270 230 260 Z" fill="#1A1A1A" stroke="#E5E5E5" stroke-width="2"/>
  <!-- 녹은 액상 송진 웅덩이 -->
  <ellipse cx="280" cy="225" rx="45" ry="12" fill="#FFFFFF" fill-opacity="0.9"/>
  <text x="280" y="228" fill="#000000" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">LIQUID RESIN (MELTED)</text>

  <!-- 하부 숯불 간접열 (Charcoal Indirect Heat) -->
  <circle cx="250" cy="280" r="8" fill="#404040" stroke="#737373" stroke-width="1"/>
  <circle cx="280" cy="285" r="9" fill="#404040" stroke="#737373" stroke-width="1"/>
  <circle cx="310" cy="280" r="8" fill="#404040" stroke="#737373" stroke-width="1"/>
  <path d="M 280 275 L 280 250" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="280" y="302" fill="#E5E5E5" font-family="monospace" font-size="9" text-anchor="middle">INDIRECT COAL HEAT (NO DIRECT FLAME)</text>

  <!-- 하단 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 01: RESIN HARVEST &amp; GENTLE INDIRECT MELTING</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">SCRAPE HARD AMBER RESIN; MELT GENTLY OVER COALS AWAY FROM OPEN FIRE</text>
</svg>
