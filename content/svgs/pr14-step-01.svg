<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1401" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080a0e"/>
      <stop offset="100%" stop-color="#0e1319"/>
    </linearGradient>
    <linearGradient id="stoneSlab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boneShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="boneHollow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="waterDroplet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="drop1401" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="grid1401" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#16202c" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg1401)"/>
  <rect width="400" height="400" fill="url(#grid1401)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#253342" stroke-width="1"/>

  <!-- Top Header (Label 1) -->
  <rect x="16" y="14" width="368" height="28" rx="2" fill="#0f1722" stroke="#2c3e50" stroke-width="1"/>
  <text x="26" y="32" fill="#fde68a" font-family="monospace" font-size="11" font-weight="bold">FIG. 01 // BONE SPLINTER BLANK PREPARATION</text>

  <!-- Split Bone Cylinder Illustration (Top-Left) -->
  <g filter="url(#drop1401)">
    <!-- Split Femur/Tibia Cross Section -->
    <path d="M 40 85 L 140 85 C 145 105 145 125 140 145 L 40 145 C 35 125 35 105 40 85 Z" fill="url(#boneShade)" stroke="#94a3b8" stroke-width="1.2"/>
    <ellipse cx="40" cy="115" rx="8" ry="30" fill="url(#boneHollow)" stroke="#475569" stroke-width="1"/>
    <ellipse cx="140" cy="115" rx="8" ry="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <!-- Fracture Crack Lines -->
    <path d="M 40 100 L 140 100" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 2"/>
    <path d="M 40 130 L 140 130" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="3 2"/>
  </g>

  <!-- Label 2: Split Bone -->
  <rect x="30" y="155" width="165" height="22" rx="2" fill="#141a23" stroke="#334155" stroke-width="1"/>
  <text x="38" y="170" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="bold">사슴 정강이뼈 치밀골 세로 쪼개기</text>

  <!-- 3D Wet Quartzite Sharpening Stone Slab (Center-Bottom) -->
  <g filter="url(#drop1401)">
    <!-- Main Slate Block -->
    <path d="M 80 230 L 320 200 L 370 290 L 120 330 Z" fill="url(#stoneSlab)" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 80 230 L 80 245 L 120 345 L 370 305 L 370 290 L 120 330 Z" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <path d="M 120 330 L 120 345" stroke="#334155" stroke-width="1.5"/>

    <!-- Water Film on Stone -->
    <ellipse cx="230" cy="265" rx="90" ry="35" fill="url(#waterDroplet)"/>
    <ellipse cx="190" cy="275" rx="6" ry="3" fill="#bae6fd" opacity="0.8"/>
    <ellipse cx="260" cy="255" rx="8" ry="4" fill="#bae6fd" opacity="0.7"/>

    <!-- Grinding Wear Groove on Quartzite -->
    <line x1="160" y1="280" x2="280" y2="245" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Label 3: Wet Sharpening Stone -->
  <rect x="210" y="175" width="165" height="22" rx="2" fill="#141a23" stroke="#334155" stroke-width="1"/>
  <text x="218" y="190" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="bold">물 묻힌 거친 규암 숫돌 표면 연마</text>

  <!-- Bone Blank Needle in Grinding Motion (Diagonal 45/30 deg) -->
  <g filter="url(#drop1401)">
    <!-- Bone Needle Blank Being Sharpened -->
    <path d="M 150 310 L 290 220 C 293 218 296 220 295 224 L 290 227 L 155 315 Z" fill="url(#boneShade)" stroke="#475569" stroke-width="1.2"/>
    <!-- Needle Point (Zoom Detail Arrow) -->
    <path d="M 285 222 L 310 205 L 292 229 Z" fill="#ffffff" stroke="#e02424" stroke-width="1.5"/>
    <!-- Rotation/Motion Arc Indicator -->
    <path d="M 215 260 A 25 25 0 0 1 235 240" fill="none" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="2 2"/>
    <polygon points="238,240 231,237 234,245" fill="#fde68a"/>
  </g>

  <!-- Label 4: Finger Length Blank -->
  <rect x="25" y="340" width="170" height="22" rx="2" fill="#141a23" stroke="#334155" stroke-width="1"/>
  <text x="32" y="355" fill="#fde68a" font-family="monospace" font-size="10" font-weight="bold">손가락 길이 (7~8cm) &amp; 원형 막대 성형</text>

  <!-- Label 5: Step 1 Callout -->
  <rect x="16" y="368" width="368" height="22" rx="2" fill="#1e293b" stroke="#e02424" stroke-width="1"/>
  <text x="24" y="383" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">[1단계 핵심] 30° 회전 연마로 날카로운 촉 완성</text>
</svg>
