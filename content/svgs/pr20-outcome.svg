<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg20out" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a0e"/>
      <stop offset="100%" stop-color="#0f1722"/>
    </linearGradient>
    <linearGradient id="potGrad20" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="mossGrad20" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="phaseGrad20" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="45%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="fireGlow20" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow20out" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background & Technical Blueprint Grid -->
  <rect width="800" height="450" fill="url(#bg20out)"/>
  <g stroke="#1e293b" stroke-width="0.6" opacity="0.45">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <rect x="6" y="6" width="788" height="438" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Header Banner (Text 1) -->
  <rect x="14" y="12" width="772" height="28" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="31" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">FIG. OUTCOME // CLAY POT &amp; WET MOSS BAMBOO CONDENSER DESALINATION STILL</text>

  <!-- Stage 1 & Stage 2 Top Callout Cards (Texts 2 & 3) -->
  <rect x="20" y="50" width="370" height="26" rx="3" fill="#131c27" stroke="#f59e0b" stroke-width="1"/>
  <text x="205" y="68" fill="#fde68a" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">STAGE 1: 1m 대나무 마디 관통 &amp; 뚜껑 송진·찰흙 완전 밀봉</text>

  <rect x="410" y="50" width="370" height="26" rx="3" fill="#131c27" stroke="#38bdf8" stroke-width="1"/>
  <text x="595" y="68" fill="#bae6fd" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">STAGE 2: 토기 바닷물 2/3 채우기 &amp; 30도 하향 경사 거치</text>

  <!-- Stage 3 & Stage 4 Sub Callout Cards (Texts 4 & 5) -->
  <rect x="20" y="84" width="370" height="26" rx="3" fill="#131c27" stroke="#22c55e" stroke-width="1"/>
  <text x="205" y="102" fill="#86efac" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">STAGE 3: 젖은 물이끼·삼베 냉각 포대 &amp; 칡끈 물끊기 고리</text>

  <rect x="410" y="84" width="370" height="26" rx="3" fill="#131c27" stroke="#e2e8f0" stroke-width="1"/>
  <text x="595" y="102" fill="#f8fafc" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">STAGE 4: 첫 50ml 버리기 &amp; 맑은 민물·바닥 천연 소금 확보</text>

  <!-- Central Master 3D Cross-Section Scene -->
  <g filter="url(#shadow20out)">
    <!-- Coastal Ground Base -->
    <rect x="20" y="332" width="760" height="16" rx="2" fill="#1c1917" stroke="#44403c" stroke-width="1"/>

    <!-- Left: Clay & Stone Hearth with Glowing Fire -->
    <polygon points="55,332 72,272 218,272 235,332" fill="#44403c" stroke="#a8a29e" stroke-width="1.8"/>
    <ellipse cx="145" cy="306" rx="56" ry="22" fill="url(#fireGlow20)"/>
    <polygon points="108,324 125,292 142,316 158,288 178,324" fill="#f97316" stroke="#fef08a" stroke-width="1"/>

    <!-- Earthen Boiling Pot (2/3 Seawater + Bottom Salt & Pebbles) -->
    <path d="M 75,165 C 58,215 64,262 88,280 L 202,280 C 226,262 232,215 215,165 Z" fill="#1e130c" stroke="#d97706" stroke-width="2.5"/>
    <!-- 2/3 Seawater Level -->
    <path d="M 68,208 Q 106,202 145,208 Q 184,214 222,208 C 225,244 218,266 202,278 L 88,278 C 72,266 65,244 68,208 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- White Sea Salt Crystal Layer & Anti-Boil Pebbles at Bottom -->
    <polygon points="94,276 116,262 138,268 162,260 194,276" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <ellipse cx="110" cy="272" rx="10" ry="5" fill="#94a3b8"/>
    <ellipse cx="176" cy="272" rx="10" ry="5" fill="#94a3b8"/>

    <!-- Rising Steam Bubbles -->
    <circle cx="118" cy="246" r="4" fill="none" stroke="#bae6fd" stroke-width="1.2"/>
    <circle cx="148" cy="234" r="4.5" fill="none" stroke="#bae6fd" stroke-width="1.2"/>
    <circle cx="172" cy="248" r="3.5" fill="none" stroke="#bae6fd" stroke-width="1.2"/>

    <!-- Sealed Dome Lid + Pine Resin & Clay Collar -->
    <path d="M 68,165 Q 145,122 222,165 Z" fill="url(#potGrad20)" stroke="#f59e0b" stroke-width="2"/>
    <ellipse cx="75" cy="165" rx="10" ry="6" fill="#78716c" stroke="#d6d3d1" stroke-width="1"/>
    <ellipse cx="215" cy="165" rx="10" ry="6" fill="#78716c" stroke="#d6d3d1" stroke-width="1"/>
    <ellipse cx="175" cy="146" rx="20" ry="10" fill="#78716c" stroke="#d6d3d1" stroke-width="1.2"/>

    <!-- 100cm Angled Bamboo Condenser Pipe (30-Degree Slope) -->
    <g transform="translate(172, 136) rotate(18)">
      <!-- Wet Sphagnum Moss & Burlap Cooling Jacket in Middle -->
      <rect x="115" y="-16" width="210" height="58" rx="14" fill="url(#mossGrad20)" stroke="#4ade80" stroke-width="1.8"/>
      <line x1="155" y1="-16" x2="155" y2="42" stroke="#a16207" stroke-width="4"/>
      <line x1="220" y1="-16" x2="220" y2="42" stroke="#a16207" stroke-width="4"/>
      <line x1="285" y1="-16" x2="285" y2="42" stroke="#a16207" stroke-width="4"/>

      <!-- Hollowed Bamboo Conduit -->
      <rect x="0" y="0" width="430" height="24" rx="3" fill="#588157" stroke="#a3b18a" stroke-width="1.5"/>
      <rect x="4" y="6" width="422" height="12" fill="#0f172a"/>
      <rect x="8" y="8" width="414" height="8" rx="2" fill="url(#phaseGrad20)"/>

      <!-- Kudzu Cordage Drip-Stop Ring Near Tip -->
      <rect x="372" y="-5" width="9" height="34" rx="2" fill="#d97706" stroke="#fef08a" stroke-width="1.2"/>
      <path d="M 376,29 L 368,54" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Cool Seawater Ladle Pouring Over Moss Jacket -->
    <path d="M 375,126 C 375,142 408,142 408,126 L 446,118 L 446,125 L 410,134 Z" fill="#92400e" stroke="#f59e0b" stroke-width="1.2"/>
    <path d="M 382,140 L 378,168" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,3"/>
    <path d="M 398,142 L 394,172" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,3"/>

    <!-- Y-Forked Support Stick Holding Condenser Pipe -->
    <path d="M 425,332 L 425,242 L 408,214 M 425,242 L 442,220" fill="none" stroke="#92400e" stroke-width="8" stroke-linecap="round"/>
    <path d="M 425,332 L 425,242 L 408,214 M 425,242 L 442,220" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bark Deflector Catching Salty Cooling Runoff -->
    <polygon points="330,295 515,320 512,330 327,305" fill="#57534e" stroke="#a8a29e" stroke-width="1.2"/>
    <circle cx="495" cy="302" r="3.5" fill="#94a3b8"/>

    <!-- Right: Pure Freshwater Collection Bowl (With 2-Finger Air Gap Above Water) -->
    <circle cx="582" cy="286" r="4.5" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.2"/>
    <circle cx="582" cy="300" r="4.5" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.2"/>
    <path d="M 542,292 L 554,332 L 612,332 L 624,292 Z" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 548,308 Q 583,302 618,308 L 610,330 L 556,330 Z" fill="#0284c7" stroke="#bae6fd" stroke-width="1.2"/>

    <!-- Right Summary Card: Pure Water + Sea Salt Dual Output Verification -->
    <g transform="translate(646, 152)">
      <rect x="0" y="0" width="132" height="172" rx="6" fill="#0d1824" stroke="#22c55e" stroke-width="1.5"/>
      <!-- Pure Water Droplet Icon + Check -->
      <path d="M 42,26 C 28,46 56,46 42,26 Z" fill="#38bdf8" stroke="#bae6fd" stroke-width="1.5"/>
      <circle cx="42" cy="44" r="10" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.2"/>
      <circle cx="92" cy="42" r="13" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
      <path d="M 86,42 L 91,47 L 99,37" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>

      <!-- White Sea Salt Crystal Mound Icon + Check -->
      <polygon points="22,126 38,98 52,108 66,94 82,126" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <circle cx="102" cy="112" r="13" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
      <path d="M 96,112 L 101,117 L 109,107" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Safety Warning Strip (Text 6) -->
  <rect x="14" y="358" width="772" height="30" rx="3" fill="#2a0a0a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="400" y="378" fill="#fca5a5" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">SAFETY RULE: 관 끝 수면 잠김 금지(역류 방지) &amp; 화학 폐수 금지</text>

  <!-- Bottom Master Formula Banner (Text 7) -->
  <rect x="14" y="396" width="772" height="40" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="421" fill="#38bdf8" font-family="sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle">[최종 완성] 바닷물 가열 증기 + 물이끼 냉각 = 100% 순수 식수 &amp; 천연 소금</text>
</svg>
