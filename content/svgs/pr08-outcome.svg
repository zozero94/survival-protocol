<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgOut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#0f131a"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Heavy Slate Rock Texture Gradient -->
    <linearGradient id="rockOut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#64748b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Rock Side Thickness Gradient -->
    <linearGradient id="rockRimOut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Hardwood Cylinder 3D Gradient -->
    <linearGradient id="stick3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d210f"/>
      <stop offset="35%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#a15112"/>
      <stop offset="100%" stop-color="#3d210f"/>
    </linearGradient>

    <!-- Diagonal Strut Gradient -->
    <linearGradient id="strut3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d210f"/>
      <stop offset="40%" stop-color="#854d0e"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#2d1607"/>
    </linearGradient>

    <!-- Carved Notch Pale Wood -->
    <linearGradient id="carvedOut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Deep Ground Cast Shadow -->
    <filter id="shadowOut" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgOut)"/>
  <rect x="12" y="12" width="776" height="426" fill="none" stroke="#222831" stroke-width="1.5"/>

  <!-- Technical Corner Ticks -->
  <path d="M 20 32 L 36 32 M 28 24 L 28 40" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M 780 32 L 764 32 M 772 24 L 772 40" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M 20 418 L 36 418 M 28 410 L 28 426" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M 780 418 L 764 418 M 772 410 L 772 426" stroke="#4b5563" stroke-width="1.5"/>

  <!-- Top Technical Header Strip -->
  <rect x="28" y="24" width="744" height="34" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="28" y="24" width="4" height="34" fill="#ef4444"/>
  <text x="44" y="45" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" letter-spacing="1">TARGET OUTCOME // FIGURE-4 DEADFALL TRAP</text>
  <text x="756" y="45" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">PR-08 // FULL ASSEMBLY OVERVIEW</text>

  <!-- Ground Plane Baseline -->
  <line x1="40" y1="365" x2="760" y2="365" stroke="#334155" stroke-width="2"/>
  <path d="M 60 370 L 80 385 M 120 370 L 140 385 M 180 370 L 200 385 M 240 370 L 260 385 M 300 370 L 320 385 M 360 370 L 380 385 M 420 370 L 440 385 M 480 370 L 500 385 M 540 370 L 560 385 M 600 370 L 620 385" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Ground Shadow Beneath Trap -->
  <ellipse cx="280" cy="370" rx="200" ry="20" fill="#000000" opacity="0.8" filter="url(#shadowOut)"/>

  <!-- ============================================== -->
  <!-- 1. FIGURE-4 INTERLOCKING FRAME (The 3 Sticks) -->
  <!-- ============================================== -->
  <g filter="url(#shadowOut)">
    <!-- Stick 1: Vertical Post (세움대 - x=230 to 254, y=145 to 365) -->
    <rect x="230" y="175" width="24" height="190" rx="3" fill="url(#stick3D)" stroke="#271408" stroke-width="1.2"/>
    <!-- Post Chisel Top -->
    <polygon points="230,175 242,142 254,175" fill="url(#carvedOut)" stroke="#78350f" stroke-width="1"/>
    <!-- Middle Notch in Post -->
    <rect x="230" y="248" width="13" height="18" fill="url(#carvedOut)" stroke="#78350f" stroke-width="1"/>
    <!-- Wood Bark Lines -->
    <line x1="236" y1="210" x2="236" y2="240" stroke="#271408" stroke-width="1"/>
    <line x1="248" y1="280" x2="248" y2="340" stroke="#271408" stroke-width="1"/>

    <!-- Stick 2: Diagonal Strut (빗장대 - Leans from (242, 142) down to (375, 275)) -->
    <polygon points="228,130 256,154 375,268 350,288" fill="url(#strut3D)" stroke="#271408" stroke-width="1.5"/>
    <!-- Mating Notch over Post Chisel -->
    <polygon points="234,138 252,152 260,140" fill="url(#carvedOut)"/>

    <!-- Stick 3: Horizontal Bait Stick (먹이대 - x=190 horizontally through to x=510, y=250) -->
    <!-- Extends deeply into the danger/safe zone under the rock -->
    <path d="M 190 250 L 480 250 L 515 258 L 480 266 L 190 266 Z" fill="url(#stick3D)" stroke="#271408" stroke-width="1.5"/>
    <!-- Catch Ledge on Bait Stick (locked with post at x=230) -->
    <polygon points="228,248 245,248 245,266 228,266" fill="url(#carvedOut)" stroke="#b45309" stroke-width="1"/>
    <!-- Rear Notch on Bait Stick (locked with strut bottom at x=355) -->
    <polygon points="348,250 368,250 358,266" fill="url(#carvedOut)" stroke="#b45309" stroke-width="1"/>

    <!-- Sharp Bait Pin at Far Right -->
    <polygon points="480,250 515,258 480,266" fill="url(#carvedOut)" stroke="#b45309" stroke-width="1"/>
    <!-- Juicy Red Wild Berries Bait -->
    <circle cx="510" cy="258" r="6" fill="#ef4444"/>
    <circle cx="516" cy="254" r="5" fill="#dc2626"/>
    <circle cx="515" cy="263" r="4.5" fill="#b91c1c"/>
  </g>

  <!-- ============================================== -->
  <!-- 2. HEAVY 15KG SLATE ROCK (45-degree angle) -->
  <!-- ============================================== -->
  <!-- Main Massive Slate Rock Body (Resting ground left at x=70, propped on strut at (242, 142)) -->
  <polygon points="60,365 375,105 415,128 105,365" fill="url(#rockOut)" stroke="#1e293b" stroke-width="2.5" filter="url(#shadowOut)"/>
  <!-- Rock 3D Thickness Upper Rim -->
  <polygon points="375,105 415,128 435,115 395,92" fill="url(#rockRimOut)" stroke="#334155" stroke-width="1.2"/>
  <polygon points="60,365 75,355 395,92 375,105" fill="#64748b" opacity="0.65"/>
  <!-- Rock Surface Geological Cleavage & Fractures -->
  <path d="M 120 320 L 190 260 L 260 215 M 220 235 L 310 165 M 160 290 L 240 230" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ============================================== -->
  <!-- TECHNICAL LABELS & POINTERS -->
  <!-- ============================================== -->
  <!-- 1. Rock Pointer -->
  <line x1="280" y1="100" x2="310" y2="78" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="280" cy="100" r="3.5" fill="#38bdf8"/>
  <rect x="310" y="65" width="230" height="22" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="320" y="80" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="bold">15kg 넓적한 평평한 바위 (45도 기울임)</text>

  <!-- 2. Post 1 Pointer -->
  <line x1="230" y1="310" x2="160" y2="310" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="230" cy="310" r="3.5" fill="#f59e0b"/>
  <rect x="35" y="299" width="125" height="22" fill="#18181b" stroke="#f59e0b" stroke-width="1"/>
  <text x="45" y="314" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="bold">1번 세움대 (땅에 똑바로 선 기둥)</text>

  <!-- 3. Strut 2 Pointer -->
  <line x1="320" y1="210" x2="380" y2="175" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="320" cy="210" r="3.5" fill="#f59e0b"/>
  <rect x="380" y="164" width="165" height="22" fill="#18181b" stroke="#f59e0b" stroke-width="1"/>
  <text x="390" y="179" fill="#fbbf24" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="bold">2번 빗장대 (바위를 떠받치는 버팀목)</text>

  <!-- 4. Bait Stick 3 Pointer -->
  <line x1="510" y1="258" x2="550" y2="235" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="510" cy="258" r="3.5" fill="#ef4444"/>
  <rect x="550" y="224" width="175" height="22" fill="#18181b" stroke="#ef4444" stroke-width="1"/>
  <text x="560" y="239" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="bold">3번 먹이대 (먹이를 꽂아둔 가로 막대)</text>

  <!-- Bottom Right Summary Callout Box -->
  <rect x="430" y="335" width="335" height="52" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
  <rect x="430" y="335" width="4" height="52" fill="#22c55e"/>
  <text x="445" y="354" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">[완성 기준] 먹이를 톡 건드리면 0.1초 만에 붕괴</text>
  <text x="445" y="369" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">・끈 하나 없이 세 막대의 맞물림만으로 15kg 바위를 지탱합니다.</text>
  <text x="445" y="381" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5">・안쪽 미끼를 건드리는 즉시 뼈대가 풀려 바위가 단번에 덮칩니다.</text>
</svg>
