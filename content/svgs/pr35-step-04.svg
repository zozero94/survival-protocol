<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg35s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="flood35s4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="brick35s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid35s4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow35s4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg35s4)"/>
  <rect width="400" height="400" fill="url(#grid35s4)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Label 1 -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 04 // 방수 시트 감싸기 + 2줄 지그재그 30cm 방수 둑 완성</text>

  <!-- Label 2 -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9.5">바닥부터 양옆 벽 30cm까지 넓은 방수 시트 ㄷ자 배치</text>

  <!-- Cross-Section: Outdoor Muddy Floodwater Blocked by Tarp-Wrapped Two-Row Staggered 30cm Dam -->
  <g filter="url(#shadow35s4)">
    <!-- Outdoor Storm Floodwater Left (Blocked at 25-30cm) -->
    <rect x="18" y="158" width="128" height="114" fill="url(#flood35s4)" opacity="0.88"/>
    <path d="M 18 158 Q 42 150 66 158 T 114 158 T 146 158" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <!-- External Hydrostatic Pressure Pressing Sheet Tight -->
    <line x1="68" y1="214" x2="132" y2="214" stroke="#ef4444" stroke-width="2.5"/>
    <polygon points="138,214 129,209 129,219" fill="#ef4444"/>

    <!-- Dry Indoor Floor Right -->
    <rect x="18" y="272" width="364" height="14" fill="#27272a" stroke="#52525b"/>
    <line x1="274" y1="266" x2="364" y2="266" stroke="#4ade80" stroke-width="2.5" stroke-dasharray="4 3"/>

    <!-- Row 1 & Row 2 Staggered Water Bricks Inside Tarp -->
    <rect x="148" y="226" width="60" height="40" rx="8" fill="url(#brick35s4)" stroke="#bae6fd" stroke-width="1.8"/>
    <rect x="210" y="226" width="60" height="40" rx="8" fill="url(#brick35s4)" stroke="#bae6fd" stroke-width="1.8"/>
    <!-- Second Tier Centered Over Joint of Row 1 & 2 (Staggered Running Bond) -->
    <rect x="176" y="182" width="68" height="42" rx="8" fill="url(#brick35s4)" stroke="#e0f2fe" stroke-width="2"/>

    <!-- Continuous U-Shape / Envelope Waterproof Tarp Sheet Wrapping Bottom, Front & Top Over Dam -->
    <path d="M 78 270 L 144 270 L 144 176 Q 144 166 156 166 L 266 166 Q 274 166 274 176 L 274 270 L 310 270" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Waterproof Anchor Flap Taped on Indoor Side -->
    <rect x="274" y="264" width="38" height="6" fill="#fde047"/>

    <!-- 30cm Dam Height Gauge on Right -->
    <line x1="330" y1="166" x2="330" y2="270" stroke="#38bdf8" stroke-width="2"/>
    <line x1="324" y1="166" x2="336" y2="166" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="324" y1="270" x2="336" y2="270" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Label 3 -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="315" fill="#cbd5e1" font-family="monospace" font-size="9">1열·2열 이음새가 엇갈리게 지그재그 벽돌 쌓기 적용</text>

  <!-- Label 4 -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="24" y="344" fill="#fde68a" font-family="monospace" font-size="9">시트 앞날개 위로 말아 덮어 바깥 수압에 밀착 봉인</text>

  <!-- Label 5 -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="376" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">[핵심] ㄷ자 방수 시트 + 지그재그 2열 둑으로 30cm 침수 원천 방어</text>
</svg>