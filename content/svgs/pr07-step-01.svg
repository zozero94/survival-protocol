<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="standingRope" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2883e"/>
      <stop offset="50%" stop-color="#f5b867"/>
      <stop offset="100%" stop-color="#946123"/>
    </linearGradient>
    <linearGradient id="workingRope" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bg01)"/>
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#222" stroke-width="1"/>

  <!-- Blueprint Header -->
  <text x="20" y="30" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">FIG. 01 // BOWLINE STEP 1: 토끼굴 고리 형성</text>
  <line x1="20" y1="38" x2="380" y2="38" stroke="#262626" stroke-width="1"/>

  <!-- Standing Part of Rope (원줄 / 나무 기둥줄) -->
  <!-- Outline Shadow -->
  <path d="M 200 45 L 200 130" stroke="#050505" stroke-width="14" stroke-linecap="round"/>
  <path d="M 200 45 L 200 130" stroke="url(#standingRope)" stroke-width="8" stroke-linecap="round"/>

  <!-- The 6-shaped Loop (토끼굴) -->
  <!-- Loop Back Arc (underneath) -->
  <path d="M 200 130 C 130 140 130 220 200 230 C 240 235 260 210 240 170 C 225 140 185 130 160 145" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 200 130 C 130 140 130 220 200 230 C 240 235 260 210 240 170 C 225 140 185 130 160 145" stroke="url(#standingRope)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Working End (작동 줄 - 녹색 토끼 줄) Crossing OVER the Standing Line -->
  <!-- Crossing Segment with Clean Masking Shadow -->
  <path d="M 160 145 C 130 160 100 210 110 270 L 115 310" stroke="#050505" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 160 145 C 130 160 100 210 110 270 L 115 310" stroke="url(#workingRope)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Motion Twist Arrow Showing Clockwise Loop Formation -->
  <path d="M 175 160 C 160 175 165 205 185 210 C 205 215 220 195 215 175" fill="none" stroke="#E02424" stroke-width="1.8" stroke-dasharray="3 3"/>
  <polygon points="218,170 210,180 224,180" fill="#E02424"/>

  <!-- Target Center Marker of the Rabbit Hole -->
  <circle cx="190" cy="180" r="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="190" cy="180" r="3" fill="#38bdf8"/>

  <!-- Callout Indicators & Labels -->
  <!-- 1. Standing Line Label (Top Right) -->
  <line x1="205" y1="80" x2="280" y2="80" stroke="#888" stroke-width="1"/>
  <circle cx="205" cy="80" r="2" fill="#888"/>
  <text x="290" y="78" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">STANDING PART</text>
  <text x="290" y="91" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">원줄 (서 있는 나무)</text>

  <!-- 2. Rabbit Hole Label (Center Left) -->
  <line x1="174" y1="180" x2="80" y2="180" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="174" cy="180" r="2" fill="#38bdf8"/>
  <text x="20" y="177" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">RABBIT HOLE (고리)</text>
  <text x="20" y="190" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">숫자 6 모양의 토끼굴</text>

  <!-- 3. Over-Cross Rule Label (Lower Right) -->
  <rect x="180" y="250" width="200" height="42" fill="#181818" stroke="#333" stroke-width="1"/>
  <text x="190" y="267" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">WORKING END (토끼)</text>
  <text x="190" y="281" fill="#e0e0e0" font-family="'JetBrains Mono', monospace" font-size="9">작동 끝단이 원줄 '위'로 교차</text>

  <!-- Bottom Instruction Box -->
  <rect x="20" y="335" width="360" height="45" fill="#141414" stroke="#262626" stroke-width="1"/>
  <text x="30" y="352" fill="#f5b867" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">[1단계 핵심] 원줄 위에 작동 줄을 얹어 6자 루프 형성</text>
  <text x="30" y="368" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="9">작동 줄이 반드시 원줄의 위쪽에 위치해야 잠금 구조가 완성됩니다.</text>
</svg>