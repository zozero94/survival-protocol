<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
              <!-- Background -->
              <rect width="400" height="400" fill="#0d0d0d" />
              
              <!-- Blueprint Title & Spec Header -->
              <text x="20" y="30" fill="#666666" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1">FIG. 01 // CLOVE HITCH (말뚝매듭) 결속 구조도</text>
              <line x1="20" y1="38" x2="380" y2="38" stroke="#1f1f1f" stroke-width="1" />

              <!-- Post / Timber Log (Vertical) -->
              <rect x="160" y="60" width="80" height="280" rx="4" fill="#181818" stroke="#333333" stroke-width="1.5" />
              <!-- Wood texture grain lines -->
              <line x1="180" y1="60" x2="180" y2="340" stroke="#222222" stroke-width="1" stroke-dasharray="8 6" />
              <line x1="200" y1="60" x2="200" y2="340" stroke="#242424" stroke-width="1" />
              <line x1="220" y1="60" x2="220" y2="340" stroke="#222222" stroke-width="1" stroke-dasharray="6 8" />
              <text x="175" y="80" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="10">① 기둥 1회 권선 (X자 교차선 형성)</text>

              <!-- Standing Line (White) from top-left -->
              <path d="M 90 120 L 160 140" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
              <text x="60" y="115" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10">기둥을 감싸며 첫 번째 교차</text>

              <!-- Wrap 1 across post: Diagonal down-right (White) -->
              <path d="M 160 140 L 240 180" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

              <!-- Rope goes behind post (Dashed line) -->
              <path d="M 240 180 C 270 200 270 220 240 230" stroke="#555555" stroke-width="4" stroke-dasharray="4 4" fill="none" />
              <path d="M 240 230 L 160 230" stroke="#555555" stroke-width="4" stroke-dasharray="4 4" fill="none" />

              <!-- Wrap 2: Working Rope (Fluorescent #E0FE10) crossing over the first wrap in an X shape -->
              <path d="M 160 230 L 240 190" stroke="#E0FE10" stroke-width="6" stroke-linecap="round" />
              
              <!-- The X Intersection Marker -->
              <circle cx="200" cy="185" r="14" fill="none" stroke="#E0FE10" stroke-width="1.5" stroke-dasharray="3 2" />
              <text x="218" y="165" fill="#E0FE10" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">+</text>
              <line x1="208" y1="172" x2="216" y2="166" stroke="#E0FE10" stroke-width="1" />

              <!-- Working end tucks under the crossing line (Fluorescent Green) -->
              <path d="M 240 190 C 255 180 255 160 235 150" stroke="#E0FE10" stroke-width="5" stroke-dasharray="3 3" fill="none" />
              <!-- Passes under the middle wrap and exits downward -->
              <path d="M 220 160 L 180 210" stroke="#E0FE10" stroke-width="6" stroke-linecap="round" />
              <path d="M 180 210 L 130 280" stroke="#E0FE10" stroke-width="6" stroke-linecap="round" />

              <!-- Direction Arrow on Working End -->
              <polygon points="122,292 124,276 138,284" fill="#E0FE10" />
              <text x="45" y="295" fill="#E0FE10" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">② 2회 권선 후 X자 교차선 밑으로 통과</text>

              <!-- Friction Lock Vectors (Arrows showing pinch compression) -->
              <g stroke="#E0FE10" stroke-width="1.5">
                <line x1="190" y1="230" x2="190" y2="200" marker-end="url(#arrow)" />
                <line x1="210" y1="170" x2="210" y2="195" marker-end="url(#arrow)" />
              </g>
              <!-- Arrow Marker Definition -->
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#E0FE10" />
                </marker>
              </defs>

              <rect x="250" y="270" width="130" height="46" fill="#141414" stroke="#2a2a2a" stroke-width="1" />
              <text x="234.4" y="308" fill="#E0FE10" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">줄 끝을 교차선 아래 틈새로 밀어 넣기</text>
              <text x="260" y="304" fill="#888888" font-family="'JetBrains Mono', monospace" font-size="8">+</text>
              <text x="299.1" y="184" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">③ 양방향 수평 인장 (Locking 완료)</text>
  <text x="304.6" y="206" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">양쪽으로 당겨 마찰 락(Lock) 체결</text>
  <text x="339.4" y="228" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">④ 평행선 정렬 점검선</text>
  <text x="310.1" y="250" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">두 줄이 꼬이지 않고 기둥에 밀착</text>
  <text x="336.3" y="272" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">⑤ 하중 인장 방향 표시</text>
</svg>