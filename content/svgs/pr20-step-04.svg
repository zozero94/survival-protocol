<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg20s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#111722"/>
    </linearGradient>
    <linearGradient id="pureWater20" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="saltCrystal20" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow20s4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg20s4)"/>
  <g stroke="#1e293b" stroke-width="0.6" opacity="0.45">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>
  <rect x="4" y="4" width="392" height="392" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Header Banner (Text 1) -->
  <rect x="8" y="10" width="384" height="24" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="14" y="26" fill="#38bdf8" font-family="monospace" font-size="8.8" font-weight="bold">FIG. 04 // FIRST-RUN DISCARD, PURE FRESHWATER COLLECTION &amp; SALT HARVEST</text>

  <!-- Sub-banner 1 (Text 2) -->
  <rect x="20" y="44" width="360" height="22" rx="2" fill="#131922" stroke="#ef4444" stroke-width="0.8"/>
  <text x="200" y="59" fill="#fca5a5" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">대나무 먼지와 냄새가 섞인 처음 반 컵(50ml)은 마시지 않고 버리기</text>

  <!--Sub-banner 2 (Text 3) -->
  <rect x="20" y="74" width="360" height="22" rx="2" fill="#131922" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="200" y="89" fill="#f8fafc" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">혀끝으로 짠맛이 전혀 없는지 확인하며 100% 맑은 민물 그릇에 모으기</text>

  <!-- 3-Panel Visual Comparison Area -->
  <g filter="url(#shadow20s4)">
    <!-- Panel 1 (Left): First 50ml Cloudy Runoff Discard -->
    <g transform="translate(14, 108)">
      <rect x="0" y="0" width="114" height="192" rx="6" fill="#161116" stroke="#ef4444" stroke-width="1.2"/>
      <!-- Tilted Cup Pouring Out Cloudy Initial 50ml -->
      <polygon points="28,62 72,48 82,92 38,104" fill="#57534e" stroke="#a8a29e" stroke-width="1.5"/>
      <!-- Cloudy Yellow-Gray Water Stream Poured Away -->
      <path d="M 74,56 Q 94,76 88,124" fill="none" stroke="#a3a3a3" stroke-width="5" stroke-dasharray="5,3" stroke-linecap="round"/>
      <circle cx="84" cy="136" r="3.5" fill="#a3a3a3"/>
      <circle cx="92" cy="144" r="3" fill="#737373"/>
      <!-- Red Crossmark Badge (DO NOT DRINK FIRST 50ML) -->
      <circle cx="57" cy="158" r="16" fill="#450a0a" stroke="#ef4444" stroke-width="1.8"/>
      <path d="M 50,151 L 64,165 M 64,151 L 50,165" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Panel 2 (Center): 100% Pure Freshwater Collection with Air Gap -->
    <g transform="translate(138, 108)">
      <rect x="0" y="0" width="124" height="192" rx="6" fill="#0d1824" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Bamboo Pipe Tip Suspended Above Bowl (2-Finger Air Gap) -->
      <polygon points="12,18 76,38 70,54 6,34" fill="#588157" stroke="#a3b18a" stroke-width="1.5"/>
      <!-- Crystal Clear Freshwater Droplets Falling Through Air Gap -->
      <path d="M 68,62 C 63,72 73,72 68,62 Z" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.5"/>
      <circle cx="68" cy="82" r="4.5" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.2"/>
      <!-- Earthen Collection Bowl Filled with Pure Blue Water -->
      <path d="M 22,98 L 32,144 L 94,144 L 104,98 Z" fill="#78350f" stroke="#f59e0b" stroke-width="1.8"/>
      <path d="M 27,114 Q 63,108 99,114 L 92,142 L 34,142 Z" fill="url(#pureWater20)" stroke="#bae6fd" stroke-width="1.2"/>
      <!-- Green Checkmark Badge (100% PURE WATER) -->
      <circle cx="62" cy="166" r="16" fill="#052e16" stroke="#22c55e" stroke-width="1.8"/>
      <path d="M 54,166 L 60,172 L 71,159" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Panel 3 (Right): White Sea Salt Crystal Harvest at Pot Bottom -->
    <g transform="translate(272, 108)">
      <rect x="0" y="0" width="114" height="192" rx="6" fill="#0f1720" stroke="#22c55e" stroke-width="1.2"/>
      <!-- Cooled Clay Pot Cutaway Bottom -->
      <path d="M 16,66 L 26,128 L 88,128 L 98,66" fill="#291509" stroke="#d97706" stroke-width="2"/>
      <!-- White Crystalline Sea Salt Mound at Bottom -->
      <polygon points="28,126 44,98 58,106 72,94 86,126" fill="url(#saltCrystal20)" stroke="#ffffff" stroke-width="1.2"/>
      <rect x="46" y="110" width="5" height="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.6"/>
      <rect x="64" y="108" width="6" height="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.6"/>
      <!-- Wooden Spatula Scraping Salt Crystals -->
      <polygon points="62,88 96,42 104,48 70,94" fill="#b45309" stroke="#fde68a" stroke-width="1"/>
      <!-- Green Checkmark Badge (BONUS SEA SALT) -->
      <circle cx="57" cy="166" r="16" fill="#052e16" stroke="#22c55e" stroke-width="1.8"/>
      <path d="M 49,166 L 55,172 L 66,159" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Sub-banner 3 (Text 4) -->
  <rect x="20" y="314" width="360" height="22" rx="2" fill="#131922" stroke="#22c55e" stroke-width="0.8"/>
  <text x="200" y="329" fill="#fde68a" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">증류 후 토기 바닥에 남은 하얀 천연 바닷소금 결정을 긁어내어 보관</text>

  <!-- Footer Key Summary Banner (Text 5) -->
  <rect x="8" y="352" width="384" height="36" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="200" y="374" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">[4단계 핵심] 첫 반 컵 배제 후 순수 식수 확보 및 부가 산물 천연 소금 수확</text>
</svg>
