<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 340" class="w-full h-auto max-w-[680px]" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="680" height="340" fill="none" stroke="#222222" stroke-width="1"/>

  <!-- Top strand: Thinned old strand + New thick strand overlap -->
  <g transform="translate(80, 120)">
    <path d="M0,20 L160,20" stroke="#888888" stroke-width="5"/>
    <path d="M160,20 L260,20" stroke="#888888" stroke-width="2.5" stroke-dasharray="2 2"/>
    <path d="M160,10 L260,10" stroke="#10B981" stroke-width="3"/>
    <path d="M260,10 L430,10" stroke="#10B981" stroke-width="6"/>
    <line x1="160" y1="-5" x2="260" y2="-5" stroke="#E02424" stroke-width="1.5"/>
    <line x1="160" y1="-10" x2="160" y2="0" stroke="#E02424" stroke-width="1.5"/>
    <line x1="260" y1="-10" x2="260" y2="0" stroke="#E02424" stroke-width="1.5"/>
  </g>

  <!-- Bottom strand: Staggered junction 15cm further right -->
  <g transform="translate(80, 200)">
    <path d="M0,20 L300,20" stroke="#888888" stroke-width="5"/>
    <path d="M300,20 L400,20" stroke="#888888" stroke-width="2.5" stroke-dasharray="2 2"/>
    <path d="M300,10 L400,10" stroke="#D97706" stroke-width="3"/>
    <path d="M400,10 L470,10" stroke="#D97706" stroke-width="6"/>
    <line x1="210" y1="45" x2="350" y2="45" stroke="#E5E5E5" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="210,41 202,45 210,49" fill="#E5E5E5"/>
    <polygon points="350,41 358,45 350,49" fill="#E5E5E5"/>
  </g>

  <!-- Smooth twisted rope preview on far right -->
  <path d="M520,165 C545,150 570,180 595,165" fill="none" stroke="#E5E5E5" stroke-width="8"/>

  <!-- 5 Clean, Non-Overlapping Top-Level Labels -->
  <text x="75" y="58" fill="#9E9E9E" font-family="'Space Grotesk', sans-serif" font-size="11">① 끝이 10cm쯤 남아 가늘어진 기존 가닥</text>
  <text x="235" y="96" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">② 새 섬유 다발을 10cm 나란히 겹쳐 대기</text>
  <text x="75" y="178" fill="#E5E5E5" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">③ 겹친 두 줄을 한 가닥처럼 함께 비틀어 감기</text>
  <text x="360" y="232" fill="#E5E5E5" font-family="'Space Grotesk', sans-serif" font-size="11">④ 불룩해지지 않고 매끄럽게 이어진 연결부</text>
  <text x="150" y="295" fill="#D97706" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">⑤ 위·아래 이음매 위치를 한 뼘(15cm) 어긋나게 배치</text>
</svg>