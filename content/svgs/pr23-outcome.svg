<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg23out" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="100%" stop-color="#101722"/>
    </linearGradient>
    <linearGradient id="waterBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="foilGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="sh23out" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background & Master HUD Frame -->
  <rect width="800" height="450" fill="url(#bg23out)"/>
  <rect x="10" y="10" width="780" height="430" fill="none" stroke="#334155" stroke-width="1.2"/>
  <path d="M10 28 L28 10 M772 10 L790 28 M10 422 L28 440 M772 440 L790 422" stroke="#38bdf8" stroke-width="2"/>

  <!-- Top Master Title Banner (Label 1) -->
  <rect x="20" y="20" width="760" height="36" fill="#131c28" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="34" y="43" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold">PR-23 완성체 // 무연료 수건 모세관 여과 · 태양광 SODIS 살균기</text>

  <!-- ================= STAGE 01 PANEL ================= -->
  <g filter="url(#sh23out)">
    <rect x="20" y="70" width="180" height="310" rx="4" fill="#111824" stroke="#334155" stroke-width="1.2"/>
    <rect x="28" y="80" width="164" height="28" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="36" y="98" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">STAGE 01: 비상 원수 침전</text>
    <text x="32" y="126" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold">도기 수조·빗물 1시간 중력 분리</text>

    <!-- Ceramic Cistern & Settling Pot Graphic -->
    <rect x="48" y="155" width="52" height="82" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <rect x="53" y="168" width="42" height="62" fill="url(#waterBlue)"/>
    <path d="M104,195 L118,195" stroke="#38bdf8" stroke-width="2"/>
    <rect x="120" y="172" width="58" height="75" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="124" y="180" width="50" height="45" fill="url(#waterBlue)"/>
    <rect x="124" y="225" width="50" height="20" fill="#78350f"/>
    <circle cx="110" cy="310" r="24" fill="#064e3b" stroke="#22c55e" stroke-width="1.5"/>
    <path d="M100,310 L107,317 L122,302" fill="none" stroke="#4ade80" stroke-width="2.5"/>
  </g>

  <!-- ================= STAGE 02 PANEL ================= -->
  <g filter="url(#sh23out)">
    <rect x="213" y="70" width="180" height="310" rx="4" fill="#111824" stroke="#334155" stroke-width="1.2"/>
    <rect x="221" y="80" width="164" height="28" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="229" y="98" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">STAGE 02: 순면 수건 사이펀</text>
    <text x="225" y="126" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold">15cm 단차 모세관 맑은 물 여과</text>

    <!-- Two-Tier Pots & Cotton Towel Bridge -->
    <rect x="230" y="220" width="64" height="45" fill="#92400e" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="234" y="175" width="56" height="45" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="238" y="184" width="48" height="32" fill="#0369a1"/>
    <rect x="312" y="218" width="64" height="48" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="316" y="242" width="56" height="20" fill="url(#waterBlue)"/>
    <path d="M266,195 C266,148 310,148 338,195 L338,215" fill="none" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
    <circle cx="338" cy="228" r="3" fill="#7dd3fc"/>
    <circle cx="338" cy="236" r="3" fill="#38bdf8"/>
    <circle cx="303" cy="310" r="24" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M303,296 C295,308 296,318 303,318 C310,318 311,308 303,296 Z" fill="#38bdf8"/>
  </g>

  <!-- ================= STAGE 03 PANEL ================= -->
  <g filter="url(#sh23out)">
    <rect x="406" y="70" width="180" height="310" rx="4" fill="#111824" stroke="#334155" stroke-width="1.2"/>
    <rect x="414" y="80" width="164" height="28" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="422" y="98" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">STAGE 03: 투명병 산소 폭기</text>
    <text x="418" y="126" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold">무색 PET 3/4 채워 20초 흔들기</text>

    <!-- Clear PET Bottle & Bubbles -->
    <rect x="484" y="152" width="24" height="10" fill="#0284c7"/>
    <rect x="466" y="162" width="60" height="108" rx="10" fill="url(#waterBlue)" stroke="#e0f2fe" stroke-width="1.8"/>
    <line x1="458" y1="192" x2="534" y2="192" stroke="#fde047" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="482" cy="212" r="3" fill="#ffffff"/>
    <circle cx="504" cy="220" r="3.5" fill="#ffffff"/>
    <circle cx="488" cy="240" r="3" fill="#ffffff"/>
    <circle cx="508" cy="250" r="3" fill="#ffffff"/>
    <path d="M448,185 L448,245 M443,192 L448,185 L453,192 M443,238 L448,245 L453,238" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="496" cy="310" r="24" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="488" cy="306" r="5" fill="none" stroke="#bae6fd" stroke-width="1.8"/>
    <circle cx="504" cy="314" r="6" fill="none" stroke="#bae6fd" stroke-width="1.8"/>
  </g>

  <!-- ================= STAGE 04 PANEL ================= -->
  <g filter="url(#sh23out)">
    <rect x="599" y="70" width="181" height="310" rx="4" fill="#111824" stroke="#334155" stroke-width="1.2"/>
    <rect x="607" y="80" width="165" height="28" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="615" y="98" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold">STAGE 04: 은박 반사 6시간</text>
    <text x="611" y="126" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold">UV-A + 50C 열 세균 99.9% 살균</text>

    <!-- Sun, Foil Reflector & Horizontal Bottle -->
    <circle cx="642" cy="162" r="14" fill="#f59e0b" stroke="#fef08a" stroke-width="1.5"/>
    <path d="M660,172 L695,210 M672,164 L725,210" stroke="#fde047" stroke-width="1.8"/>
    <polygon points="614,248 655,212 766,225 732,268" fill="url(#foilGrad)" stroke="#f8fafc" stroke-width="1.2"/>
    <rect x="642" y="216" width="96" height="30" rx="10" fill="url(#waterBlue)" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="738" y="224" width="10" height="14" fill="#0284c7"/>
    <circle cx="690" cy="310" r="24" fill="#422006" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M680,310 L687,317 L702,302" fill="none" stroke="#fde047" stroke-width="2.5"/>
  </g>

  <!-- Bottom Master Verification Banner (Label 10) -->
  <rect x="20" y="392" width="760" height="36" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="34" y="415" fill="#fde68a" font-family="monospace" font-size="13" font-weight="bold">야전 검증 완료 // 연료 소모 0% 도시 단수·블랙아웃 식수 확보</text>
</svg>
