<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg25s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="charcoal25s3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid25s3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow25s3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg25s3)"/>
  <rect width="400" height="400" fill="url(#grid25s3)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Header Banner (Label 1) -->
  <rect x="14" y="14" width="372" height="28" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="32" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">FIG. 03 // 참나무 숯가루·나무재 도포 탈취 및 구스넥 이중 밀봉</text>

  <!-- Label 2 Callout Box -->
  <rect x="16" y="50" width="368" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="66" fill="#bae6fd" font-family="monospace" font-size="10.5">용변 직후 분쇄 참나무 숯가루·백색 나무재 종이컵 2컵 도포</text>

  <!-- Main Illustration: Left (Charcoal + Wood Ash Blanket Covering Waste) & Right (Gooseneck Double-Tie Seal) -->
  <g filter="url(#shadow25s3)">
    <!-- Left Card: Charcoal & White Wood Ash Deodorizing/Alkaline Layer -->
    <rect x="22" y="86" width="174" height="154" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Tilted Cup Pouring Crushed Charcoal & Ash -->
    <g transform="translate(96, 108) rotate(130)">
      <polygon points="-14,-24 14,-24 10,16 -10,16" fill="#cbd5e1" stroke="#f8fafc" stroke-width="1.2"/>
    </g>
    <!-- Falling Charcoal & Ash Particles -->
    <circle cx="96" cy="136" r="3" fill="#1e293b" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="108" cy="142" r="2.5" fill="#e2e8f0"/>
    <circle cx="102" cy="150" r="3" fill="#1e293b" stroke="#94a3b8" stroke-width="0.8"/>
    <circle cx="116" cy="152" r="2.5" fill="#e2e8f0"/>

    <!-- Layered Cross-Section Inside Liner Bag -->
    <path d="M44,142 L174,142 L166,226 L52,226 Z" fill="#111827" stroke="#64748b" stroke-width="1.5"/>
    <!-- Bottom Paper Bed -->
    <rect x="54" y="202" width="110" height="20" fill="#92400e" opacity="0.85"/>
    <!-- Top Charcoal + White Ash Blanket Sealing Odor -->
    <rect x="52" y="170" width="114" height="18" fill="url(#charcoal25s3)" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="52" y="160" width="114" height="10" fill="#cbd5e1" opacity="0.9"/>

    <!-- Right Card: Gooseneck Double-Knot Hermetic Seal -->
    <rect x="208" y="86" width="170" height="154" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>

    <!-- Bag Body with Air Pressed Out -->
    <path d="M246,168 C236,192 242,222 264,226 L322,226 C344,222 350,192 340,168 Z" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Twisted Neck + Folded Gooseneck Loop + Double Cord Tie -->
    <rect x="284" y="138" width="18" height="30" rx="3" fill="#334155" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Folded Gooseneck Top Loop -->
    <path d="M293,138 C293,108 328,108 328,138 L318,154" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <!-- Double Binding Cord (Yellow/Green) -->
    <rect x="280" y="146" width="46" height="6" rx="2" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>
    <rect x="280" y="156" width="46" height="6" rx="2" fill="#10b981" stroke="#047857" stroke-width="1"/>

    <!-- Approved Checkmark -->
    <circle cx="234" cy="112" r="11" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <path d="M229,112 L233,116 L240,107" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Label 3 Callout Box -->
  <rect x="16" y="254" width="368" height="26" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="271" fill="#e0f2fe" font-family="monospace" font-size="10.5">숯의 냄새 가스 포집 및 나무재 강알칼리(pH 11) 살균 작용</text>

  <!-- Label 4 Callout Box -->
  <rect x="16" y="288" width="368" height="26" rx="2" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="24" y="305" fill="#a7f3d0" font-family="monospace" font-size="10.5">봉투 내부 공기를 빼고 비틀어 접어 묶는 구스넥 이중 매듭</text>

  <!-- Bottom Core Principle Strip (Label 5) -->
  <rect x="14" y="348" width="372" height="34" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="24" y="369" fill="#ecfdf5" font-family="monospace" font-size="10.5" font-weight="bold">[핵심] 황화수소·암모니아 악취 95% 제거 및 파리·세균 완벽 밀봉</text>
</svg>
