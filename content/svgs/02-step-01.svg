<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <!-- 필드 매뉴얼 외곽 테두리 및 그리드 -->
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 메타데이터 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-02 [FIRE-BOW-DRILL]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 01</text>

  <!-- 중앙 도면: 마른 참나무 밑판 (Fire Board) -->
  <rect x="60" y="240" width="280" height="40" fill="#121212" stroke="#E5E5E5" stroke-width="2"/>
  <line x1="60" y1="260" x2="340" y2="260" stroke="#404040" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- 45도 V자 노치(홈) 가공 단면 -->
  <polygon points="185,240 215,240 200,275" fill="#050505" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="200" y1="275" x2="200" y2="285" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- 밑판 밑에 받친 나뭇잎/껍질 패드 -->
  <path d="M160 285 Q200 295 240 285" fill="none" stroke="#737373" stroke-width="2"/>
  <text x="245" y="295" fill="#737373" font-family="monospace" font-size="9">[EMBER TRAY]</text>

  <!-- 수직 회전축 스핀들 (Spindle) -->
  <rect x="193" y="100" width="14" height="140" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/>
  <!-- 상하단 원뿔 가공 -->
  <polygon points="193,100 207,100 200,88" fill="#E5E5E5" stroke="#FFFFFF" stroke-width="1.5"/>
  <polygon points="193,240 207,240 200,250" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- 상단 누름목 (Handhold Socket) -->
  <ellipse cx="200" cy="85" rx="35" ry="12" fill="#262626" stroke="#FFFFFF" stroke-width="2"/>

  <!-- 45도 V자 각도 인디케이터 -->
  <path d="M188 230 A 20 20 0 0 1 212 230" fill="none" stroke="#E5E5E5" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="200" y="222" fill="#E5E5E5" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">45° V-NOTCH</text>

  <!-- 부품 라벨링 인출선 -->
  <line x1="120" y1="95" x2="165" y2="85" stroke="#737373" stroke-width="1"/>
  <text x="60" y="98" fill="#A3A3A3" font-family="monospace" font-size="10">HAND SOCKET</text>

  <line x1="280" y1="160" x2="207" y2="160" stroke="#737373" stroke-width="1"/>
  <text x="285" y="163" fill="#A3A3A3" font-family="monospace" font-size="10">SPINDLE (Ø2cm)</text>

  <!-- 하단 설명 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 01: V-NOTCH ALIGNMENT &amp; SOCKET</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">CARVE 45° DRAIN NOTCH BEFORE APPLYING PRESSURE</text>
</svg>
