<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg36s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="stream36s3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.7"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="cloth36s3" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#a8a29e"/>
    </radialGradient>
    <pattern id="grid36s3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow36s3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg36s3)"/>
  <rect width="400" height="400" fill="url(#grid36s3)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Label 1 -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 03 // 면 천 주머니 + 찬물 2~4일 붉은 떫은물 빼기</text>

  <!-- Label 2 -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9">촘촘한 면 천으로 싸서 굵은 찌꺼기 이탈 방지</text>

  <!-- Main Visual: Cold Mountain Stream + Woven Cotton Pouch + Anchor Stones + Cold vs Hot Check -->
  <g filter="url(#shadow36s3)">
    <!-- Stream Bed -->
    <rect x="26" y="138" width="348" height="136" rx="8" fill="#0c192c" stroke="#1e3a5f" stroke-width="1.5"/>
    <rect x="26" y="162" width="348" height="86" fill="url(#stream36s3)"/>
    <!-- Creek pebbles -->
    <ellipse cx="64" cy="256" rx="18" ry="8" fill="#475569"/>
    <ellipse cx="122" cy="260" rx="22" ry="9" fill="#334155"/>
    <ellipse cx="268" cy="258" rx="20" ry="8" fill="#475569"/>
    <ellipse cx="332" cy="254" rx="24" ry="9" fill="#334155"/>

    <!-- Cold Incoming Flow Arrows (Blue) -->
    <path d="M 38 196 L 106 196" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
    <polygon points="100,190 112,196 100,202" fill="#7dd3fc"/>
    <path d="M 44 222 L 106 222" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="100,217 110,222 100,227" fill="#38bdf8"/>

    <!-- Woven Cotton Cloth Pouch Tied at Top + Weighted by River Stone -->
    <ellipse cx="182" cy="212" rx="46" ry="30" fill="url(#cloth36s3)" stroke="#e7e5e4" stroke-width="2"/>
    <path d="M 164 184 Q 182 162 200 184 Z" fill="#d6d3d1" stroke="#78716c" stroke-width="1.5"/>
    <line x1="166" y1="184" x2="198" y2="184" stroke="#92400e" stroke-width="4" stroke-linecap="round"/>
    <!-- Anchor stone holding pouch down -->
    <ellipse cx="182" cy="208" rx="18" ry="12" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Outgoing Bitter Reddish-Amber Plumes Clearing Downstream -->
    <path d="M 232 198 Q 272 190 328 198" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="5 3"/>
    <polygon points="322,192 334,199 321,204" fill="#d97706"/>
    <path d="M 232 224 Q 282 232 344 222" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="4 3"/>
    <polygon points="338,216 350,222 339,228" fill="#b45309"/>

    <!-- Cold (Check) vs Hot Flame (X) Indicator Pill -->
    <rect x="256" y="102" width="110" height="44" rx="4" fill="#18181b" stroke="#475569" stroke-width="1.2"/>
    <circle cx="284" cy="124" r="12" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <polyline points="278,124 282,128 290,119" fill="none" stroke="#86efac" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="338" cy="124" r="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <path d="M 338 116 Q 343 123 338 130 Q 333 123 338 116 Z" fill="#f97316"/>
    <line x1="331" y1="117" x2="345" y2="131" stroke="#fecaca" stroke-width="2.2"/>
  </g>

  <!-- Label 3 -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#2a0f14" stroke="#ef4444" stroke-width="1"/>
  <text x="24" y="315" fill="#fca5a5" font-family="monospace" font-size="9">뜨거운 물(X) 뭉침 엄금: 반드시 찬물(V)로 2~4일 침수</text>

  <!-- Label 4 -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#1e1b18" stroke="#d97706" stroke-width="1"/>
  <text x="24" y="344" fill="#fed7aa" font-family="monospace" font-size="9">붉고 갈색 떫은 물이 완전히 맑고 투명해질 때까지 헹굼</text>

  <!-- Label 5 -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="376" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">[핵심] 찬물 우려내기가 전분은 살리고 떫은 독만 씻어냄</text>
</svg>