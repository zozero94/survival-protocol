<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-04 [PRIMITIVE-STONE-AXE]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 01</text>

  <!-- 작업대 받침돌 (Anvil Stone) -->
  <polygon points="100,280 140,220 260,220 300,280" fill="#141414" stroke="#737373" stroke-width="2"/>
  <text x="200" y="260" fill="#525252" font-family="monospace" font-size="9" text-anchor="middle">ANVIL STONE</text>

  <!-- 가공할 규암 원석 도끼날 (Quartzite Core) -->
  <polygon points="150,220 180,130 230,130 250,220" fill="#262626" stroke="#FFFFFF" stroke-width="2"/>

  <!-- 둥근 망치돌 (Hammerstone) -->
  <circle cx="270" cy="100" r="28" fill="#1A1A1A" stroke="#E5E5E5" stroke-width="2"/>
  <text x="270" y="104" fill="#E5E5E5" font-family="monospace" font-size="8" text-anchor="middle">HAMMER</text>

  <!-- 70도 타격 궤적 벡터 화살표 -->
  <path d="M 255 125 L 215 155" stroke="#FFFFFF" stroke-width="2.5"/>
  <polygon points="215,155 228,148 221,140" fill="#FFFFFF"/>
  <text x="260" y="145" fill="#FFFFFF" font-family="monospace" font-size="10" font-weight="bold">70° STRIKE</text>

  <!-- 박편 파편 비산 궤적 (Flakes Splitting) -->
  <polygon points="175,145 160,160 170,170" fill="#737373" stroke="#A3A3A3" stroke-width="1"/>
  <polygon points="140,180 120,195 135,205" fill="#737373" stroke="#A3A3A3" stroke-width="1"/>
  <line x1="180" y1="150" x2="130" y2="190" stroke="#737373" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="110" y="175" fill="#A3A3A3" font-family="monospace" font-size="9">CHIPPED FLAKES</text>

  <!-- 양날 각도 표시 -->
  <path d="M 180 130 L 165 110 M 230 130 L 245 110" stroke="#E5E5E5" stroke-width="1"/>
  <text x="205" y="115" fill="#E5E5E5" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">BIFACIAL BEVEL</text>

  <!-- 하단 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 01: 70° HAMMERSTONE PERCUSSION FLAKING</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">STRIKE QUARTZITE RIM AT 70° TO DETACH RAZOR SHARP BIFACIAL FLAKES</text>
</svg>
