<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgS4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080a"/>
      <stop offset="50%" stop-color="#0e1117"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- Thick White Steam Smoke -->
    <radialGradient id="denseWhiteSmoke" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.7"/>
      <stop offset="85%" stop-color="#94a3b8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#07080a" stop-opacity="0"/>
    </radialGradient>

    <!-- Faint Pure Blue Pyrolysis Smoke -->
    <radialGradient id="faintBlueSmoke" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07080a" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Carbon Charcoal Gradient -->
    <linearGradient id="charcoalLump" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="25%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Charcoal Silver Sheen -->
    <linearGradient id="silverSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="shadowS4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgS4)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#232830" stroke-width="1.2"/>

  <!-- Technical Corner Ticks -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#475569" stroke-width="1.2"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#475569" stroke-width="1.2"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#475569" stroke-width="1.2"/>

  <!-- Top Header Strip (Label 1) -->
  <rect x="20" y="16" width="360" height="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="16" width="3" height="20" fill="#f97316"/>
  <text x="30" y="30" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" letter-spacing="0.5">FIG. 04 // SMOKE PHASE &amp; CHARCOAL HARVEST</text>

  <!-- ============================================== -->
  <!-- TOP HALF: SMOKE PHASE COMPARISON PANEL -->
  <!-- ============================================== -->
  <!-- Left Side: Phase 1 Dense White Steam Smoke -->
  <g>
    <!-- Background Box -->
    <rect x="20" y="44" width="175" height="110" fill="#0b1017" rx="4" stroke="#1e293b" stroke-width="1"/>
    <!-- Chimney Mini Silhouette -->
    <path d="M 85 140 L 85 125 L 115 125 L 115 140 Z" fill="#2d1d13" stroke="#452715" stroke-width="1"/>
    <ellipse cx="100" cy="125" rx="15" ry="4" fill="#140a04"/>

    <!-- Billowing Dense White Steam Clouds -->
    <circle cx="100" cy="105" r="14" fill="url(#denseWhiteSmoke)"/>
    <circle cx="85" cy="85" r="18" fill="url(#denseWhiteSmoke)"/>
    <circle cx="115" cy="80" r="16" fill="url(#denseWhiteSmoke)"/>
    <circle cx="95" cy="62" r="20" fill="url(#denseWhiteSmoke)"/>

    <!-- Label 2: Phase 1 White Smoke -->
    <rect x="24" y="48" width="167" height="15" fill="#030712" rx="3" stroke="#475569" stroke-width="1"/>
    <text x="107" y="59" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" text-anchor="middle">1단계: 짙은 백색 연기 (수분 증발)</text>
  </g>

  <!-- Transition Arrow -->
  <g>
    <path d="M 198 95 L 206 95" stroke="#f97316" stroke-width="2"/>
    <polygon points="208,95 204,91 204,99" fill="#f97316"/>
  </g>

  <!-- Right Side: Phase 2 Faint Blue Pyrolysis Smoke -->
  <g>
    <!-- Background Box -->
    <rect x="210" y="44" width="170" height="110" fill="#081422" rx="4" stroke="#0369a1" stroke-width="1"/>
    <!-- Chimney Mini Silhouette -->
    <path d="M 280 140 L 280 125 L 310 125 L 310 140 Z" fill="#2d1d13" stroke="#452715" stroke-width="1"/>
    <ellipse cx="295" cy="125" rx="15" ry="4" fill="#140a04"/>

    <!-- Delicate Wisps of Blue Pyrolysis Smoke -->
    <circle cx="295" cy="108" r="12" fill="url(#faintBlueSmoke)"/>
    <circle cx="282" cy="88" r="15" fill="url(#faintBlueSmoke)"/>
    <circle cx="308" cy="85" r="14" fill="url(#faintBlueSmoke)"/>
    <circle cx="292" cy="65" r="16" fill="url(#faintBlueSmoke)"/>

    <!-- Label 3: Phase 2 Blue Smoke -->
    <rect x="214" y="48" width="162" height="15" fill="#021d33" rx="3" stroke="#0284c7" stroke-width="1"/>
    <text x="295" y="59" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" text-anchor="middle">2단계: 옅은 청색 연기 (탄화 완료)</text>
  </g>

  <!-- ============================================== -->
  <!-- MIDDLE: HERMETIC MUD PLUG SEAL -->
  <!-- ============================================== -->
  <g filter="url(#shadowS4)">
    <!-- Plugged Kiln Dome Mound -->
    <path d="M 40 215 Q 200 170 360 215 L 330 255 Q 200 260 70 255 Z" fill="#2d1a0e" stroke="#452715" stroke-width="1.2"/>

    <!-- Mud Plug Ball on Chimney (진흙 반죽으로 꽉 틀어막은 마개) -->
    <circle cx="200" cy="188" r="16" fill="#543823" stroke="#854d0e" stroke-width="1.5"/>
    <ellipse cx="200" cy="185" rx="14" ry="10" fill="#3e2314"/>
    <!-- Sealed Air Intake Plugs -->
    <ellipse cx="65" cy="225" rx="7" ry="10" fill="#543823" stroke="#854d0e" stroke-width="1"/>
    <ellipse cx="335" cy="225" rx="7" ry="10" fill="#543823" stroke="#854d0e" stroke-width="1"/>

    <!-- Lock Clamps / Cooling Ice Thermometer Icon Vector -->
    <rect x="188" y="178" width="24" height="20" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
    <!-- Padlock Shackle / 100% Hermetic Symbol -->
    <path d="M 194 178 L 194 172 A 6 6 0 0 1 206 172 L 206 178" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="200" cy="187" r="2" fill="#38bdf8"/>
  </g>

  <!-- Label 4: Hermetic Mud Seal & Cooling -->
  <g>
    <rect x="75" y="215" width="250" height="16" fill="#180e06" rx="3" stroke="#b45309" stroke-width="1"/>
    <text x="200" y="227" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">모든 구멍 진흙 밀폐 후 완전 냉각</text>
  </g>

  <!-- ============================================== -->
  <!-- BOTTOM: HARVESTED METALLIC HARDWOOD CHARCOAL -->
  <!-- ============================================== -->
  <g filter="url(#shadowS4)">
    <!-- Charcoal Log Chunk 1 (Large Center) -->
    <g>
      <polygon points="120,305 155,275 220,280 235,310 180,335 130,330" fill="url(#charcoalLump)" stroke="#475569" stroke-width="1"/>
      <!-- Carbonized Facets & Silver Sheen Reflections -->
      <polygon points="155,275 220,280 200,305 145,298" fill="url(#silverSheen)" opacity="0.25"/>
      <line x1="165" y1="285" x2="195" y2="320" stroke="#020617" stroke-width="1.5"/>
      <line x1="140" y1="305" x2="175" y2="325" stroke="#020617" stroke-width="1.2"/>
      <!-- Metallic Ring Sound Wave Icon -->
      <path d="M 235,285 A 8 8 0 0 1 245,295" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>
      <path d="M 240,280 A 14 14 0 0 1 254,298" fill="none" stroke="#94a3b8" stroke-width="1"/>
    </g>

    <!-- Charcoal Chunk 2 (Left) -->
    <g>
      <polygon points="65,315 95,295 130,305 120,335 80,340" fill="url(#charcoalLump)" stroke="#475569" stroke-width="1"/>
      <polygon points="95,295 130,305 115,320 85,312" fill="url(#silverSheen)" opacity="0.3"/>
      <line x1="85" y1="310" x2="105" y2="335" stroke="#020617" stroke-width="1"/>
    </g>

    <!-- Charcoal Chunk 3 (Right) -->
    <g>
      <polygon points="230,310 265,290 305,302 295,335 250,338" fill="url(#charcoalLump)" stroke="#475569" stroke-width="1"/>
      <polygon points="265,290 305,302 285,320 250,310" fill="url(#silverSheen)" opacity="0.3"/>
      <line x1="260" y1="305" x2="280" y2="330" stroke="#020617" stroke-width="1"/>
    </g>

    <!-- Porous Micro-pores Detail (다공성 미세기공 점들) -->
    <circle cx="170" cy="310" r="1" fill="#475569"/>
    <circle cx="185" cy="305" r="1.2" fill="#475569"/>
    <circle cx="195" cy="315" r="1" fill="#475569"/>
    <circle cx="105" cy="320" r="1" fill="#475569"/>
    <circle cx="270" cy="318" r="1" fill="#475569"/>
  </g>

  <!-- Label 5: Harvested Metallic Dense Oak Charcoal -->
  <g>
    <rect x="75" y="270" width="250" height="16" fill="#090d16" rx="3" stroke="#334155" stroke-width="1"/>
    <text x="200" y="282" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" text-anchor="middle">쇳소리 나는 고밀도 참나무 숯 수확</text>
  </g>

  <!-- Bottom Core Insight Briefing Box (Label 6) -->
  <rect x="20" y="348" width="360" height="26" fill="#111827" rx="4" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="20" y="348" width="4" height="26" fill="#10b981" rx="1"/>
  <text x="200" y="364" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">[핵심] 푸른 연기 즉시 밀폐 &amp; 잔열 완전 냉각</text>
</svg>
