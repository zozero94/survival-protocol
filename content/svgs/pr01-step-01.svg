<svg viewBox="0 0 400 400" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradP01" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b"/>
      <stop offset="50%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>

    <!-- Timber Tripod Cylinder Shading -->
    <linearGradient id="woodLeg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d2817"/>
      <stop offset="45%" stop-color="#694627"/>
      <stop offset="70%" stop-color="#8c5d35"/>
      <stop offset="100%" stop-color="#2a1b0e"/>
    </linearGradient>

    <!-- Birch Bark Cone Funnel -->
    <linearGradient id="birchCone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#403830"/>
      <stop offset="35%" stop-color="#736658"/>
      <stop offset="65%" stop-color="#9e8d7c"/>
      <stop offset="100%" stop-color="#332c25"/>
    </linearGradient>

    <!-- Moss Plug Green Gradient -->
    <linearGradient id="mossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowP01" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="400" height="400" fill="url(#bgGradP01)"/>
  <rect x="8" y="8" width="384" height="384" fill="none" stroke="#22262c" stroke-width="1"/>

  <!-- Technical Corner Crosshairs -->
  <path d="M 14 22 L 26 22 M 20 16 L 20 28" stroke="#374151" stroke-width="1"/>
  <path d="M 386 22 L 374 22 M 380 16 L 380 28" stroke="#374151" stroke-width="1"/>
  <path d="M 14 378 L 26 378 M 20 372 L 20 384" stroke="#374151" stroke-width="1"/>
  <path d="M 386 378 L 374 378 M 380 372 L 380 384" stroke="#374151" stroke-width="1"/>

  <!-- Blueprint Header (Label 1) -->
  <text x="24" y="28" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="0.5">FIG. 01 // PURIFICATION STEP 1: 프레임 거치 및 하단 마개</text>
  <line x1="24" y1="36" x2="376" y2="36" stroke="#262d35" stroke-width="1"/>

  <!-- Tripod Legs (Back Leg first) -->
  <line x1="200" y1="65" x2="200" y2="320" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
  <line x1="200" y1="65" x2="200" y2="320" stroke="url(#woodLeg)" stroke-width="8" stroke-linecap="round"/>

  <!-- Cone Funnel Body (Birch Bark) with Drop Shadow -->
  <polygon points="140,110 260,110 215,260 185,260" fill="url(#birchCone)" stroke="#221c17" stroke-width="1.5" filter="url(#shadowP01)"/>
  <ellipse cx="200" cy="110" rx="60" ry="12" fill="#52473c" stroke="#221c17" stroke-width="1.5"/>

  <!-- Front Tripod Left Leg -->
  <line x1="200" y1="65" x2="120" y2="320" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
  <line x1="200" y1="65" x2="120" y2="320" stroke="url(#woodLeg)" stroke-width="10" stroke-linecap="round"/>

  <!-- Front Tripod Right Leg -->
  <line x1="200" y1="65" x2="280" y2="320" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
  <line x1="200" y1="65" x2="280" y2="320" stroke="url(#woodLeg)" stroke-width="10" stroke-linecap="round"/>

  <!-- Top Lash Knot Binding Tripod -->
  <rect x="188" y="58" width="24" height="16" rx="4" fill="#854d0e" stroke="#451a03" stroke-width="1.5"/>

  <!-- Bottom Spout Opening and Moss Plug -->
  <polygon points="185,260 215,260 210,282 190,282" fill="#2d241c" stroke="#1c1611" stroke-width="1"/>
  <!-- Moss / Fabric Plug Core -->
  <ellipse cx="200" cy="275" rx="11" ry="7" fill="url(#mossGrad)" stroke="#14532d" stroke-width="1"/>
  <!-- Texture dots for moss -->
  <circle cx="197" cy="274" r="1.5" fill="#86efac"/>
  <circle cx="203" cy="276" r="1.2" fill="#4ade80"/>

  <!-- Support Cord wrapped around Funnel -->
  <ellipse cx="200" cy="140" rx="48" ry="9" fill="none" stroke="#ca8a04" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Technical Callout Lines -->
  <!-- Callout 1: Tripod Frame (Label 2) -->
  <line x1="140" y1="160" x2="105" y2="75" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="140" cy="160" r="2.5" fill="#f59e0b"/>
  <text x="24" y="70" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold">TRIPOD FRAME (삼각대)</text>

  <!-- Callout 2: Cone Funnel (Label 3) -->
  <line x1="240" y1="170" x2="105" y2="165" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="240" cy="170" r="2.5" fill="#38bdf8"/>
  <text x="24" y="160" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold">CONE FUNNEL (여과관)</text>

  <!-- Callout 3: Moss Plug (Label 4) -->
  <line x1="200" y1="275" x2="105" y2="255" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="200" cy="275" r="2.5" fill="#22c55e"/>
  <text x="24" y="250" fill="#86efac" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold">MOSS PLUG (이끼 마개)</text>

  <!-- Bottom Tactical Note Strip -->
  <rect x="18" y="340" width="364" height="34" fill="#111419" stroke="#262d35" stroke-width="1"/>
  <rect x="18" y="340" width="4" height="34" fill="#38bdf8"/>
  <!-- Label 5: Step Core Instruction -->
  <text x="32" y="361" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="bold">[1단계 핵심] 흔들리지 않는 3점 지지대 결속</text>
</svg>
