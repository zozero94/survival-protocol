<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 340" class="w-full max-w-2xl h-auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-white" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#F5F5F5" />
    </marker>
    <marker id="arrow-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E02424" />
    </marker>
  </defs>

  <!-- Outer Frame Guideline -->
  <rect x="10" y="10" width="660" height="320" fill="none" stroke="#262626" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Rule Callout Box -->
  <rect x="25" y="24" width="335" height="44" fill="#141414" stroke="#333333" stroke-width="1" />
  <text x="35" y="41" fill="#F5F5F5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">THERMAL CONDUCTION SHIELD [바닥 단열 원칙]:</text>
  <text x="35" y="58" fill="#E02424" font-family="'JetBrains Mono', monospace" font-size="9.5">지면 열전도 차단: 압축 후 최소 15~20cm 두께 유지</text>

  <!-- Ground Baseline -->
  <line x1="60" y1="265" x2="620" y2="265" stroke="#666666" stroke-width="2" />

  <!-- Cross-Section A-Frame Rib Lattice (Center X = 340, Apex Y = 88) -->
  <!-- Left & Right Rib Poles at 52° Pitch -->
  <line x1="340" y1="88" x2="185" y2="265" stroke="#F5F5F5" stroke-width="4" />
  <line x1="340" y1="88" x2="495" y2="265" stroke="#F5F5F5" stroke-width="4" />
  <!-- Secondary Lattice Branches -->
  <line x1="295" y1="138" x2="412" y2="170" stroke="#777777" stroke-width="1.5" stroke-dasharray="5,3" />
  <line x1="255" y1="184" x2="445" y2="208" stroke="#777777" stroke-width="1.5" stroke-dasharray="5,3" />

  <!-- Ridgepole Cross-Section Circle at Apex -->
  <circle cx="340" cy="88" r="14" fill="#262626" stroke="#E02424" stroke-width="2.5" />
  <circle cx="340" cy="88" r="4" fill="#F5F5F5" />
  <line x1="354" y1="84" x2="430" y2="56" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="2,2" />
  <text x="436" y="59" fill="#F5F5F5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">RIDGEPOLE SPINE (중심 능선목 단면)</text>

  <!-- Rib Pitch Angle Indicator (45° ~ 60°) -->
  <path d="M 222,265 A 36 36 0 0 0 209,238" fill="none" stroke="#E02424" stroke-width="1.8" />
  <line x1="252" y1="188" x2="175" y2="145" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="2,2" />
  <text x="35" y="140" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="10">RIB LATTICE: 45°~60° (늑골 가지 격자벽)</text>

  <!-- Interior Floor Mattress: Initial 40cm Mound (Dashed) & Compressed 15~20cm Core (Solid) -->
  <path d="M 215,265 Q 340,175 465,265 Z" fill="#1c1b1b" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3" />
  <rect x="215" y="222" width="250" height="43" fill="#252323" stroke="#E02424" stroke-width="2" />
  <!-- Texture lines inside mattress -->
  <line x1="230" y1="236" x2="450" y2="236" stroke="#666666" stroke-width="1" stroke-dasharray="8,4" />
  <line x1="225" y1="250" x2="455" y2="250" stroke="#666666" stroke-width="1" stroke-dasharray="6,5" />

  <!-- Mattress Dimension Callout on Right -->
  <line x1="470" y1="235" x2="520" y2="205" stroke="#E02424" stroke-width="1.2" marker-end="url(#arrow-red)" />
  <text x="655" y="200" fill="#F5F5F5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="end">MATTRESS: 40cm → 20cm (낙엽 침상)</text>

  <!-- Ground Cold Conduction Blocked Vectors (Bottom) -->
  <line x1="270" y1="292" x2="270" y2="270" stroke="#E02424" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <line x1="340" y1="292" x2="340" y2="270" stroke="#E02424" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <line x1="410" y1="292" x2="410" y2="270" stroke="#E02424" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <text x="340" y="314" fill="#E02424" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">GROUND COLD CONDUCTION BLOCKED (지면 냉기 차단)</text>
</svg>