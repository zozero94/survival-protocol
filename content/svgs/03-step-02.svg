<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-03 [DEBRIS-HUT-SHELTER]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 02</text>

  <!-- 지면 기준선 -->
  <line x1="40" y1="280" x2="360" y2="280" stroke="#404040" stroke-width="2"/>

  <!-- 주 기둥 (중앙) -->
  <line x1="80" y1="160" x2="320" y2="280" stroke="#E5E5E5" stroke-width="5"/>

  <!-- 좌우 45도 빗살 갈비뼈 잔가지 (Rib Poles) -->
  <!-- 좌측 날개 -->
  <line x1="110" y1="175" x2="70" y2="280" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="140" y1="190" x2="105" y2="280" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="170" y1="205" x2="140" y2="280" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="200" y1="220" x2="175" y2="280" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="230" y1="235" x2="210" y2="280" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="260" y1="250" x2="245" y2="280" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="290" y1="265" x2="280" y2="280" stroke="#FFFFFF" stroke-width="2"/>

  <!-- 우측 날개 (원근 입체 표현) -->
  <line x1="110" y1="175" x2="160" y2="280" stroke="#737373" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="140" y1="190" x2="195" y2="280" stroke="#737373" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="170" y1="205" x2="230" y2="280" stroke="#737373" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="200" y1="220" x2="265" y2="280" stroke="#737373" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="230" y1="235" x2="300" y2="280" stroke="#737373" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- 가로 엮음 격자망 (Lattice Framework) -->
  <path d="M 65 250 Q 150 200 235 250" fill="none" stroke="#A3A3A3" stroke-width="1.5"/>
  <path d="M 75 220 Q 130 185 195 220" fill="none" stroke="#A3A3A3" stroke-width="1.5"/>

  <!-- 45도 각도 호선 인디케이터 -->
  <path d="M 120 280 A 25 25 0 0 1 135 258" fill="none" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="145" y="270" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold">45° SLOPE</text>

  <!-- 간격 표시 (10cm Spacing) -->
  <line x1="70" y1="290" x2="105" y2="290" stroke="#737373" stroke-width="1"/>
  <text x="87" y="303" fill="#737373" font-family="monospace" font-size="8" text-anchor="middle">&lt; 10cm &gt;</text>

  <!-- 하단 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 02: 45° RIB SKELETON &amp; LATTICE</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">DENSELY PACK RIBS EVERY 10cm TO PREVENT DEBRIS COLLAPSE</text>
</svg>
