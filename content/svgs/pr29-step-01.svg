<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg29s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="100%" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="dullCan29s1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="mirrorCan29s1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <pattern id="grid29s1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow29s1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg29s1)"/>
  <rect width="400" height="400" fill="url(#grid29s1)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Header Banner (Label 1) -->
  <rect x="14" y="14" width="372" height="28" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="32" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">FIG. 01 // 빈 캔 바닥 오목면 치약·나무재 거울 광택 연마</text>

  <!-- Label 2 Callout Box -->
  <rect x="16" y="50" width="368" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="66" fill="#bae6fd" font-family="monospace" font-size="10.5">오목한 캔 바닥에 치약 한 콩알(또는 고운 나무재) 바르기</text>

  <!-- Main Illustration: Left (Circular Rubbing) vs Right (Mirror Finish) -->
  <g filter="url(#shadow29s1)">
    <!-- Left panel: Polishing with paste in circular motion -->
    <rect x="24" y="88" width="170" height="150" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1.2"/>
    <circle cx="109" cy="163" r="52" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="109" cy="163" r="42" fill="url(#dullCan29s1)" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Dab of paste -->
    <circle cx="109" cy="163" r="10" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Circular rubbing arrows -->
    <path d="M82,150 A30,30 0 0,1 136,150" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,2"/>
    <path d="M132,145 L136,150 L130,153" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path d="M136,176 A30,30 0 0,1 82,176" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,2"/>
    <path d="M86,181 L82,176 L88,173" fill="none" stroke="#fbbf24" stroke-width="2"/>

    <!-- Right panel: Completed Parabolic Mirror Dome -->
    <rect x="206" y="88" width="170" height="150" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="291" cy="163" r="52" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="291" cy="163" r="42" fill="url(#mirrorCan29s1)" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Specular glint lines -->
    <line x1="268" y1="140" x2="305" y2="140" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="275" y1="152" x2="315" y2="152" stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Reflected focal rays -->
    <line x1="265" y1="175" x2="291" y2="120" stroke="#fde047" stroke-width="1.5"/>
    <line x1="317" y1="175" x2="291" y2="120" stroke="#fde047" stroke-width="1.5"/>
    <circle cx="291" cy="120" r="4" fill="#ef4444" stroke="#fde047" stroke-width="1.2"/>
  </g>

  <!-- Label 3 Callout Box -->
  <rect x="16" y="254" width="368" height="26" rx="2" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="24" y="271" fill="#fef08a" font-family="monospace" font-size="10.5">마른 천으로 5분간 원을 그리며 문질러 미세 산화막 제거</text>

  <!-- Label 4 Callout Box -->
  <rect x="16" y="288" width="368" height="26" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="305" fill="#bae6fd" font-family="monospace" font-size="10.5">눈코입이 또렷이 비치는 오목 거울면(반사율 85% 이상) 완성</text>

  <!-- Bottom Core Principle Strip (Label 5) -->
  <rect x="14" y="348" width="372" height="34" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="24" y="369" fill="#ecfdf5" font-family="monospace" font-size="10.5" font-weight="bold">[핵심] 오목한 금속 바닥을 거울처럼 닦아 태양열을 한 점에 집광</text>
</svg>
