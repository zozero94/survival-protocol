<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOut16" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a0e"/>
      <stop offset="50%" stop-color="#0c121a"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="wetClayOut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="dryClayIn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="wetSandMatrix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="coldAirChamber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c192c"/>
      <stop offset="50%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="burlapWeave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="oakLogOut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c4033"/>
      <stop offset="50%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#271815"/>
    </linearGradient>
    <filter id="shadowOut16" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <pattern id="gridOut16" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#152230" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgOut16)"/>
  <rect width="800" height="450" fill="url(#gridOut16)"/>
  <rect x="12" y="12" width="776" height="426" fill="none" stroke="#253548" stroke-width="1.2"/>

  <!-- Top Tactical Header Banner (Label 1, y=42) -->
  <rect x="24" y="20" width="752" height="34" rx="2" fill="#0d141f" stroke="#0284c7" stroke-width="1.2"/>
  <text x="38" y="42" fill="#fde68a" font-family="monospace" font-size="12" font-weight="bold">PR-16 OUTCOME // ZEER POT EVAPORATIVE CLAY REFRIGERATOR</text>

  <!-- SECTION 1 (LEFT): Capillary Clay Wall & Wet Sand Matrix Detail (x: 28 ~ 258) -->
  <g filter="url(#shadowOut16)">
    <rect x="28" y="64" width="230" height="310" rx="3" fill="#0b111a" stroke="#2a3f55" stroke-width="1"/>
    <rect x="28" y="64" width="230" height="24" fill="#131e2b"/>

    <!-- Zoomed Macro Cutaway of Double Wall + Sand Gap -->
    <!-- Outer Unglazed Terracotta Wall -->
    <rect x="55" y="110" width="38" height="195" rx="2" fill="url(#wetClayOut)" stroke="#ea580c" stroke-width="1.2"/>
    <!-- Capillary Micropores & Sweat Beads -->
    <circle cx="51" cy="140" r="2.5" fill="#38bdf8"/>
    <circle cx="51" cy="185" r="2.5" fill="#38bdf8"/>
    <circle cx="51" cy="230" r="2.5" fill="#38bdf8"/>
    <circle cx="51" cy="275" r="2.5" fill="#38bdf8"/>
    <!-- Evaporation Arrows (-2,260 J/g Latent Heat) -->
    <path d="M 48 140 L 34 134" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 48 185 L 34 179" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 48 230 L 34 224" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Middle Saturated Quartz Sand Buffer (3~4cm) -->
    <rect x="93" y="110" width="76" height="195" fill="url(#wetSandMatrix)" stroke="#f59e0b" stroke-width="1"/>
    <!-- Quartz & Water Droplet Matrix -->
    <circle cx="112" cy="135" r="2.5" fill="#fef08a"/>
    <circle cx="132" cy="150" r="2.5" fill="#38bdf8"/>
    <circle cx="150" cy="138" r="2" fill="#ffffff"/>
    <circle cx="118" cy="190" r="2.5" fill="#38bdf8"/>
    <circle cx="142" cy="205" r="2.5" fill="#fef08a"/>
    <circle cx="115" cy="245" r="2" fill="#ffffff"/>
    <circle cx="138" cy="260" r="2.5" fill="#38bdf8"/>
    <circle cx="152" cy="285" r="2" fill="#fef08a"/>

    <!-- Inner Dry Terracotta Wall -->
    <rect x="169" y="110" width="32" height="195" rx="2" fill="url(#dryClayIn)" stroke="#fdba74" stroke-width="1.2"/>
    <!-- Inner Cold Dry Zone -->
    <rect x="201" y="110" width="42" height="195" fill="url(#coldAirChamber)" stroke="#0284c7" stroke-width="1"/>
  </g>

  <!-- Label 2 (y=80) -->
  <rect x="32" y="66" width="222" height="18" fill="none"/>
  <text x="36" y="80" fill="#fde68a" font-family="monospace" font-size="8.2" font-weight="bold">외부 다공성 무유약 토기 (미세 기공 수분 증발 방열벽)</text>

  <!-- Label 3 (y=338) -->
  <rect x="34" y="323" width="218" height="22" rx="2" fill="#141a23" stroke="#38bdf8" stroke-width="0.9"/>
  <text x="38" y="338" fill="#38bdf8" font-family="monospace" font-size="8.0" font-weight="bold">수분 포화 규암질 강 모래 완충층 (두께 3~4cm 냉각 매트릭스)</text>

  <!-- SECTION 2 (CENTER): Full 3D Cross-Section of Zeer Pot Cooler (x: 268 ~ 508) -->
  <g filter="url(#shadowOut16)">
    <rect x="268" y="64" width="240" height="310" rx="3" fill="#0b111a" stroke="#2a3f55" stroke-width="1"/>
    <rect x="268" y="64" width="240" height="38" fill="#131e2b"/>

    <!-- Outer Large Clay Pot (38cm) -->
    <path d="M 292 135 L 484 135 L 462 305 C 457 318 442 325 388 325 C 334 325 319 318 314 305 Z" fill="url(#wetClayOut)" stroke="#ea580c" stroke-width="1.5"/>

    <!-- Saturated Sand Cavity Layer -->
    <path d="M 304 138 L 472 138 L 453 298 C 448 308 435 314 388 314 C 341 314 328 308 323 298 Z" fill="url(#wetSandMatrix)" stroke="#d97706" stroke-width="1"/>

    <!-- Pine Pitch Sealed Drain Plug at Base -->
    <rect x="374" y="314" width="28" height="10" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>

    <!-- Inner Small Dry Pot (26cm) -->
    <path d="M 326 138 L 450 138 L 436 276 C 432 285 420 290 388 290 C 356 290 344 285 340 276 Z" fill="url(#dryClayIn)" stroke="#fdba74" stroke-width="1.4"/>
    <path d="M 334 140 L 442 140 L 430 270 C 426 278 416 282 388 282 C 360 282 350 278 346 270 Z" fill="url(#coldAirChamber)" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Leaf-Wrapped Meat & Fish Inside Sterile Chamber -->
    <ellipse cx="388" cy="248" rx="34" ry="16" fill="#15803d" stroke="#4ade80" stroke-width="1.2"/>
    <ellipse cx="388" cy="248" rx="22" ry="9" fill="#be123c"/>
    <ellipse cx="388" cy="212" rx="30" ry="14" fill="#166534" stroke="#4ade80" stroke-width="1.2"/>
    <ellipse cx="388" cy="212" rx="18" ry="7" fill="#e11d48"/>

    <!-- Cold Downdraft Convection Arrows (12~15°C) -->
    <path d="M 362 152 L 362 186" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <polygon points="359,184 365,184 362,191" fill="#38bdf8"/>
    <path d="M 414 152 L 414 186" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <polygon points="411,184 417,184 414,191" fill="#38bdf8"/>

    <!-- Wet Burlap / Hemp Top Cover Draped Over Rim -->
    <path d="M 284 142 Q 292 124 316 126 L 460 126 Q 484 124 492 142" fill="none" stroke="url(#burlapWeave)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 284 142 Q 292 124 316 126 L 460 126 Q 484 124 492 142" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5 3"/>
  </g>

  <!-- Label 4 (y=96) -->
  <rect x="272" y="82" width="232" height="18" fill="none"/>
  <text x="276" y="96" fill="#fde68a" font-family="monospace" font-size="8.1" font-weight="bold">내부 건조 무균 토기 저장실 (외부 대비 8~12°C 저온 유지)</text>

  <!-- Label 5 (y=356) -->
  <rect x="274" y="341" width="228" height="22" rx="2" fill="#141a23" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="278" y="356" fill="#fde68a" font-family="monospace" font-size="8.0" font-weight="bold">물에 적신 천연 삼베 차광·방충 덮개 (냉기 하강 대류 유도)</text>

  <!-- SECTION 3 (RIGHT): Shaded Airflow & Oak Support Stand (x: 518 ~ 772) -->
  <g filter="url(#shadowOut16)">
    <rect x="518" y="64" width="254" height="310" rx="3" fill="#0b111a" stroke="#2a3f55" stroke-width="1"/>
    <rect x="518" y="64" width="254" height="54" fill="#131e2b"/>

    <!-- Forest Shade Canopy Silhouette at Top of Section 3 -->
    <path d="M 530 135 Q 580 150 645 135 Q 710 150 760 135" fill="none" stroke="#15803d" stroke-width="3"/>

    <!-- Elevated Zeer Pot on Oak Support Logs -->
    <path d="M 575 165 L 715 165 L 698 282 C 694 292 680 298 645 298 C 610 298 596 292 592 282 Z" fill="url(#wetClayOut)" stroke="#ea580c" stroke-width="1.4"/>
    <path d="M 568 168 Q 576 156 595 158 L 695 158 Q 714 156 722 168" fill="none" stroke="url(#burlapWeave)" stroke-width="6" stroke-linecap="round"/>

    <!-- Temperature Drop Badge Inside Pot -->
    <rect x="610" y="205" width="70" height="36" rx="3" fill="#082f49" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="628" y1="223" x2="662" y2="223" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="645" cy="223" r="6" fill="#22c55e"/>

    <!-- Oak Support Logs Blocking Ground Heat -->
    <circle cx="600" cy="312" r="14" fill="url(#oakLogOut)" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="600" cy="312" r="6" fill="#78350f"/>
    <circle cx="690" cy="312" r="14" fill="url(#oakLogOut)" stroke="#a16207" stroke-width="1.5"/>
    <circle cx="690" cy="312" r="6" fill="#78350f"/>
    <line x1="535" y1="327" x2="755" y2="327" stroke="#334155" stroke-width="2"/>

    <!-- 360° Dry Breeze & Under-Pot Airflow Vectors -->
    <path d="M 532 230 Q 552 222 570 230" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 720 230 Q 740 222 758 230" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M 622 312 L 668 312" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <!-- Label 6 (y=112, x=522) -->
  <rect x="522" y="98" width="246" height="18" fill="none"/>
  <text x="524" y="112" fill="#22c55e" font-family="monospace" font-size="8.0" font-weight="bold">통풍 그늘 받침목 거치대 (바닥 지열 차단 &amp; 360° 기류 순환)</text>

  <!-- Bottom Master Verification Banner (Label 7, y=412) -->
  <rect x="24" y="388" width="752" height="38" rx="2" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="38" y="412" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">FIELD VERIFIED // ZERO-POWER COLD STORAGE (7-DAY PRESERVATION)</text>
</svg>
