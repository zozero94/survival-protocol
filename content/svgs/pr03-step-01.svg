<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 340" class="w-full max-w-2xl h-auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-white" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#F5F5F5" />
    </marker>
    <marker id="arrow-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E02424" />
    </marker>
  </defs>

  <!-- Outer Frame Guideline -->
  <rect x="10" y="10" width="660" height="320" fill="none" stroke="#262626" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Rule Callout Box -->
  <rect x="25" y="24" width="330" height="44" fill="#141414" stroke="#333333" stroke-width="1" />
  <text x="35" y="41" fill="#F5F5F5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">움막 크기 핵심 규칙:</text>
  <text x="35" y="58" fill="#E02424" font-family="'JetBrains Mono', monospace" font-size="9.5">몸이 겨우 들어갈 크기 (어깨 옆 주먹 1개 여유)</text>

  <!-- Ground Baseline -->
  <line x1="40" y1="265" x2="640" y2="265" stroke="#666666" stroke-width="2" />
  <line x1="60" y1="273" x2="620" y2="273" stroke="#333333" stroke-width="1" stroke-dasharray="6,4" />

  <!-- Windward Force Vector (Left Side) -->
  <line x1="45" y1="195" x2="115" y2="195" stroke="#E02424" stroke-width="1.8" marker-end="url(#arrow-red)" />
  <line x1="45" y1="215" x2="105" y2="215" stroke="#E02424" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrow-red)" />
  <text x="45" y="182" fill="#E02424" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">바람 불어오는 쪽 (바닥에 고정)</text>

  <!-- Main Ridgepole (3.0~3.5m Hardwood Spine) from (110, 265) to (490, 115) -->
  <polygon points="105,265 492,110 498,124 125,265" fill="#262626" stroke="#F5F5F5" stroke-width="2" />
  <!-- Ground Stake / Anchor at Windward Tail -->
  <polygon points="102,248 112,248 112,282 102,282" fill="#E02424" stroke="#F5F5F5" stroke-width="1.2" />

  <!-- Ridgepole Label & Leader Line -->
  <line x1="280" y1="190" x2="250" y2="132" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="2,2" />
  <text x="165" y="124" fill="#F5F5F5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">중심 기둥 나무: 길이 3.0~3.5m</text>

  <!-- Y-Frame Bipod Support Sticks at Entrance (Apex at 490, 118) -->
  <line x1="445" y1="265" x2="508" y2="92" stroke="#CCCCCC" stroke-width="5" />
  <line x1="535" y1="265" x2="472" y2="92" stroke="#999999" stroke-width="5" />
  <!-- Vine Lashing Node at Apex -->
  <circle cx="490" cy="116" r="11" fill="#141414" stroke="#E02424" stroke-width="2" />
  <line x1="481" y1="112" x2="499" y2="120" stroke="#F5F5F5" stroke-width="1.5" />
  <line x1="481" y1="120" x2="499" y2="112" stroke="#F5F5F5" stroke-width="1.5" />

  <!-- Lashing Node Label -->
  <line x1="490" y1="102" x2="490" y2="68" stroke="#E02424" stroke-width="1" stroke-dasharray="2,2" />
  <text x="490" y="60" fill="#E5E5E5" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Y자 기둥 2개 맞물려 묶기</text>

  <!-- Interior Prone Body Clearance Envelope (Coffin Spec) -->
  <path d="M 165,258 L 455,258 L 455,212 L 385,205 L 165,242 Z" fill="#1c1b1b" stroke="#888888" stroke-width="1.2" stroke-dasharray="4,3" />
  <!-- Clearance Gap Arrows (+10cm Fist Tolerance) -->
  <line x1="365" y1="172" x2="365" y2="205" stroke="#E02424" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <text x="340" y="298" fill="#CCCCCC" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">내부 공간: 몸 둘레 + 10cm (주먹 1개 여유)</text>

  <!-- Vertical Elevation Dimension (0.8 ~ 1.0m) on Right -->
  <line x1="575" y1="116" x2="575" y2="265" stroke="#F5F5F5" stroke-width="1.2" />
  <line x1="565" y1="116" x2="585" y2="116" stroke="#F5F5F5" stroke-width="1.5" />
  <line x1="565" y1="265" x2="585" y2="265" stroke="#F5F5F5" stroke-width="1.5" />
  <text x="655" y="194" fill="#F5F5F5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="end">입구 높이: 0.8~1.0m</text>
</svg>
