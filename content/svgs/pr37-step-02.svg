<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg37s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="timberA37s2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="timberB37s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="grid37s2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow37s2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg37s2)"/>
  <rect width="400" height="400" fill="url(#grid37s2)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Label 1 -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.2" font-weight="bold">FIG. 02 // 네모 각목 90도 교차 우물정(井) 기초 괴임 쌓기</text>

  <!-- Label 2 -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9">평평한 네모 각목 2개씩 매 층 90도 직각 교차 적재</text>

  <!-- Main Visual: Left 2x2 Box Crib Isometric + Top-Down Interlock Grid + Bad Materials Check -->
  <g filter="url(#shadow37s2)">
    <!-- Solid Floor -->
    <rect x="22" y="258" width="232" height="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

    <!-- Layer 1 (Horizontal Parallel Pair) -->
    <rect x="44" y="236" width="188" height="22" fill="url(#timberA37s2)" stroke="#451a03" stroke-width="1.5"/>
    <!-- Layer 2 (End-Grain 90 deg perpendicular Pair) -->
    <rect x="68" y="214" width="30" height="22" fill="url(#timberB37s2)" stroke="#fef08a" stroke-width="1.5"/>
    <rect x="178" y="214" width="30" height="22" fill="url(#timberB37s2)" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Layer 3 (Horizontal Pair) -->
    <rect x="44" y="192" width="188" height="22" fill="url(#timberA37s2)" stroke="#451a03" stroke-width="1.5"/>
    <!-- Layer 4 (End-Grain Pair) -->
    <rect x="68" y="170" width="30" height="22" fill="url(#timberB37s2)" stroke="#fef08a" stroke-width="1.5"/>
    <rect x="178" y="170" width="30" height="22" fill="url(#timberB37s2)" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Layer 5 (Horizontal Pair) -->
    <rect x="44" y="148" width="188" height="22" fill="url(#timberA37s2)" stroke="#451a03" stroke-width="1.5"/>

    <!-- 4 Corner Load Dots Highlighting Contact Points -->
    <circle cx="83" cy="181" r="4" fill="#22c55e" stroke="#f0fdf4" stroke-width="1.2"/>
    <circle cx="193" cy="181" r="4" fill="#22c55e" stroke="#f0fdf4" stroke-width="1.2"/>
    <circle cx="83" cy="225" r="4" fill="#22c55e" stroke="#f0fdf4" stroke-width="1.2"/>
    <circle cx="193" cy="225" r="4" fill="#22c55e" stroke="#f0fdf4" stroke-width="1.2"/>

    <!-- Right Inset Top: Top-Down 2x2 # Grid Symbol (GOOD V) -->
    <rect x="268" y="94" width="108" height="92" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="282" y="122" width="80" height="10" fill="#f59e0b" stroke="#451a03"/>
    <rect x="282" y="150" width="80" height="10" fill="#f59e0b" stroke="#451a03"/>
    <rect x="298" y="106" width="10" height="70" fill="#d97706" stroke="#fde047"/>
    <rect x="336" y="106" width="10" height="70" fill="#d97706" stroke="#fde047"/>
    <circle cx="358" cy="112" r="10" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <polyline points="353,112 357,116 363,108" fill="none" stroke="#86efac" stroke-width="2"/>

    <!-- Right Inset Bottom: Rolling Round Log + Hollow Brick Crushing (BAD X) -->
    <rect x="268" y="196" width="108" height="78" rx="4" fill="#2a0f14" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="300" cy="242" r="15" fill="#92400e" stroke="#fca5a5" stroke-width="1.5"/>
    <rect x="328" y="226" width="32" height="32" fill="#475569" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="334" y="232" width="8" height="20" fill="#0f172a"/>
    <rect x="346" y="232" width="8" height="20" fill="#0f172a"/>
    <line x1="286" y1="220" x2="364" y2="262" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="364" y1="220" x2="286" y2="262" stroke="#ef4444" stroke-width="2.5"/>
  </g>

  <!-- Label 3 -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="315" fill="#cbd5e1" font-family="monospace" font-size="9">모서리 손가락 두 마디 돌출 + 높이&lt;=밑변 3배 유지</text>

  <!-- Label 4 -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#2a0f14" stroke="#ef4444" stroke-width="1"/>
  <text x="24" y="344" fill="#fca5a5" font-family="monospace" font-size="9">둥근 통나무·벽돌(X) 엄금: 각목 우물정(V) 사용</text>

  <!-- Label 5 -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="24" y="376" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">[핵심] 4군데 교차 접점이 하중을 사방으로 고르게 분산</text>
</svg>