<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-05 [EDIBLE-PLANT-TEST]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 03</text>

  <!-- 입술 및 혀 측면 프로파일 도해 (Oral Profile) -->
  <path d="M 120 120 Q 170 120 190 140 Q 210 160 180 180 Q 210 190 190 220 Q 150 230 110 230" fill="none" stroke="#E5E5E5" stroke-width="2"/>
  <!-- 혀 (Tongue Extended) -->
  <path d="M 175 175 C 220 170 250 185 240 200 C 220 210 185 200 175 195" fill="#1F1F1F" stroke="#FFFFFF" stroke-width="2"/>
  <text x="210" y="195" fill="#E5E5E5" font-family="monospace" font-size="9" font-weight="bold">TONGUE TIP</text>

  <!-- 식물 잎 미세 조각 안치 (Specimen Fragment) -->
  <polygon points="245,185 260,180 255,195 240,195" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <line x1="260" y1="160" x2="252" y2="182" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="265" y="155" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="bold">LEAF PIECE (15 MIN)</text>

  <!-- 침 삼킴 금지 경고 배지 (DO NOT SWALLOW) -->
  <rect x="220" y="80" width="130" height="40" fill="#121212" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="285" y="98" fill="#FFFFFF" font-family="monospace" font-size="10" text-anchor="middle" font-weight="black">DO NOT SWALLOW</text>
  <text x="285" y="112" fill="#A3A3A3" font-family="monospace" font-size="8" text-anchor="middle">HOLD SALIVA IN MOUTH</text>

  <!-- 단계별 시간 프로토콜 -->
  <rect x="50" y="240" width="300" height="55" fill="#0A0A0A" stroke="#404040" stroke-width="1"/>
  <text x="65" y="258" fill="#E5E5E5" font-family="monospace" font-size="10">STEP A: OUTER LIP CONTACT ➔ 3 MINUTES</text>
  <text x="65" y="275" fill="#E5E5E5" font-family="monospace" font-size="10">STEP B: TONGUE TIP CONTACT ➔ 15 MINUTES</text>
  <text x="65" y="290" fill="#737373" font-family="monospace" font-size="8">&gt; IF NUMBNESS OR BITTERNESS ➔ SPIT &amp; RINSE x3</text>

  <!-- 하단 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 03: LIP &amp; TONGUE TIP PROGRESSIVE CHECK</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">NEVER CHEW OR SWALLOW; DETECT NUMBNESS BEFORE ANY INGESTION</text>
</svg>
