<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg34s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="water34s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.82"/>
    </linearGradient>
    <pattern id="grid34s2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#22252a" stroke-width="0.6"/>
    </pattern>
    <filter id="shadow34s2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg34s2)"/>
  <rect width="400" height="400" fill="url(#grid34s2)"/>
  <rect x="6" y="6" width="388" height="388" fill="none" stroke="#3f3f46" stroke-width="1"/>

  <!-- Label 1 -->
  <rect x="14" y="14" width="372" height="28" rx="2" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="32" fill="#f4f4f5" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 02 // 정수 물 가득 채우기 + 표백제 3방울(소금) 녹조 차단</text>

  <!-- Label 2 -->
  <rect x="16" y="48" width="368" height="24" rx="2" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="24" y="64" fill="#38bdf8" font-family="monospace" font-size="9.5">거른 맑은 물을 병 목 끝까지 채워 공기층 최소화</text>

  <!-- Main Illustration: Full Water Bottle + 3 Bleach Droplets & Salt Bowl + Tightly Sealed Cap -->
  <g filter="url(#shadow34s2)">
    <!-- Clear Bottle Outline Filled Completely to Neck with Sparkling Water -->
    <path d="M 164 114 L 164 128 Q 134 144 132 168 L 132 274 Q 132 286 146 286 L 204 286 Q 218 286 218 274 L 218 168 Q 216 144 186 128 L 186 114 Z" fill="url(#water34s2)" stroke="#bae6fd" stroke-width="2"/>
    <line x1="144" y1="168" x2="144" y2="274" stroke="#ffffff" stroke-width="2.5" opacity="0.6" stroke-linecap="round"/>

    <!-- Dropper / Cap Pouring 3 Precise Drops into Bottle Opening -->
    <polygon points="168,84 182,84 178,104 172,104" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
    <!-- 3 Drops Falling -->
    <path d="M 175 108 Q 179 113 175 117 Q 171 113 175 108 Z" fill="#fef08a"/>
    <path d="M 175 121 Q 179 126 175 130 Q 171 126 175 121 Z" fill="#fef08a"/>
    <path d="M 175 134 Q 179 139 175 143 Q 171 139 175 134 Z" fill="#fef08a"/>

    <!-- Alternative Coarse Salt Bowl on Bottom Right -->
    <path d="M 262 246 Q 292 276 322 246 Z" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 272 246 Q 292 232 312 246 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Comparison Badge Top Right: Clear Water Check vs Murky Green Algae X -->
    <rect x="248" y="96" width="128" height="122" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <!-- Mini Green Algae Bottle (X) -->
    <rect x="266" y="114" width="32" height="58" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1.2"/>
    <circle cx="282" cy="192" r="11" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="276" y1="186" x2="288" y2="198" stroke="#fca5a5" stroke-width="2.2"/>
    <line x1="288" y1="186" x2="276" y2="198" stroke="#fca5a5" stroke-width="2.2"/>

    <!-- Mini Crystal Clear Bottle (Check) -->
    <rect x="322" y="114" width="32" height="58" rx="6" fill="#38bdf8" fill-opacity="0.7" stroke="#bae6fd" stroke-width="1.5"/>
    <circle cx="338" cy="192" r="11" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <polyline points="333,192 337,196 344,188" fill="none" stroke="#86efac" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Label 3 -->
  <rect x="16" y="300" width="368" height="22" rx="2" fill="#18181b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="315" fill="#cbd5e1" font-family="monospace" font-size="9">표백제 3방울 또는 소금 반 숟가락으로 녹조 예방</text>

  <!-- Label 4 -->
  <rect x="16" y="328" width="368" height="24" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="24" y="344" fill="#bae6fd" font-family="monospace" font-size="9">뚜껑 꽉 잠그고 테두리 감싸 5년 이상 수분 증발 차단</text>

  <!-- Label 5 -->
  <rect x="14" y="358" width="372" height="28" rx="2" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="24" y="376" fill="#fde68a" font-family="monospace" font-size="9.5" font-weight="bold">[핵심] 초록 물이끼를 영구 억제해 수정 같은 투명도 유지</text>
</svg>