<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 340" class="w-full max-w-2xl h-auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#E02424" />
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="340" fill="#131313" />
  <rect x="10" y="10" width="660" height="320" fill="none" stroke="#262626" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Wooden Shaft Handle -->
  <rect x="315" y="45" width="45" height="225" fill="#201f1f" stroke="#F5F5F5" stroke-width="1.8" />
  
  <!-- Stone Blade Head Fixed Horizontally -->
  <path d="M 200 90 L 470 90 L 440 145 L 230 145 Z" fill="#2e2d2d" stroke="#F5F5F5" stroke-width="2" />
  <path d="M 200 90 Q 180 115 230 145" stroke="#E02424" stroke-width="3" />

  <!-- Cross-Lashing Vine Bands (X-Pattern) -->
  <line x1="280" y1="80" x2="390" y2="160" stroke="#84cc16" stroke-width="4.5" stroke-linecap="round" />
  <line x1="285" y1="75" x2="395" y2="155" stroke="#4d7c0f" stroke-width="3" stroke-linecap="round" />
  <line x1="390" y1="80" x2="280" y2="160" stroke="#84cc16" stroke-width="4.5" stroke-linecap="round" />
  <line x1="395" y1="75" x2="285" y2="155" stroke="#4d7c0f" stroke-width="3" stroke-linecap="round" />

  <!-- Horizontal securing turns around shaft collar -->
  <rect x="305" y="165" width="65" height="40" fill="#3f6212" stroke="#84cc16" stroke-width="1.5" />
  <line x1="305" y1="175" x2="370" y2="175" stroke="#ecfccb" stroke-width="1" />
  <line x1="305" y1="185" x2="370" y2="185" stroke="#ecfccb" stroke-width="1" />
  <line x1="305" y1="195" x2="370" y2="195" stroke="#ecfccb" stroke-width="1" />

  <!-- Inward tension arrows (Shrinkage vectors) -->
  <line x1="250" y1="120" x2="290" y2="120" stroke="#E02424" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="420" y1="120" x2="380" y2="120" stroke="#E02424" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="337" y1="225" x2="337" y2="208" stroke="#E02424" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 5 Clear Korean labels in safe zones -->
  <rect x="415" y="30" width="235" height="24" fill="#0e0e0e" stroke="#333333" stroke-width="1" />
  <text x="425" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#84cc16">① 젖은 칡 속껍질 X자로 감기</text>

  <rect x="25" y="95" width="160" height="24" fill="#0e0e0e" stroke="#333333" stroke-width="1" />
  <text x="35" y="111" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E02424">② 날카로운 도끼 앞날</text>

  <rect x="415" y="172" width="235" height="24" fill="#0e0e0e" stroke="#333333" stroke-width="1" />
  <text x="425" y="188" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5F5F5">③ 자루 아래쪽 가로로 칭칭 감기</text>

  <rect x="415" y="232" width="235" height="24" fill="#0e0e0e" stroke="#333333" stroke-width="1" />
  <text x="425" y="248" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E02424">④ 마르면서 30% 줄어들며 꽉 조임</text>

  <text x="340" y="308" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5F5F5" text-anchor="middle" font-weight="bold">완성 상태: 세게 내리쳐도 돌날이 빠지지 않는 일체형 돌도끼</text>
</svg>
