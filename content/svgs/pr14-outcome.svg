<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOut14" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a0e"/>
      <stop offset="50%" stop-color="#0c121a"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="boneOut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="sinewOutAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="bootLeather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="80%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="pitchOutSeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="furLining" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadowOut14" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <pattern id="gridOut14" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#152230" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgOut14)"/>
  <rect width="800" height="450" fill="url(#gridOut14)"/>
  <rect x="12" y="12" width="776" height="426" fill="none" stroke="#253548" stroke-width="1.2"/>

  <!-- Top Tactical Header Banner (Label 1) -->
  <rect x="24" y="20" width="752" height="34" rx="2" fill="#0d141f" stroke="#2563eb" stroke-width="1.2"/>
  <text x="38" y="42" fill="#fde68a" font-family="monospace" font-size="12" font-weight="bold">PR-14 OUTCOME // BONE NEEDLE &amp; SINEW SEWING KIT</text>

  <!-- SECTION 1 (LEFT): Bone Needle & Eye Crafting (x: 30 ~ 260) -->
  <g filter="url(#shadowOut14)">
    <rect x="30" y="66" width="230" height="305" rx="3" fill="#0b111a" stroke="#2a3f55" stroke-width="1"/>
    <rect x="30" y="66" width="230" height="24" fill="#131e2b"/>

    <!-- Sharpening Slate Base Slab -->
    <path d="M 50 310 L 230 290 L 245 340 L 65 355 Z" fill="#1e293b" stroke="#475569" stroke-width="1"/>

    <!-- Complete Bone Needle (7.5cm, high polish) -->
    <g transform="rotate(-35 140 200)">
      <!-- Needle body tapering to point -->
      <path d="M 80 195 C 80 188 88 184 100 184 L 230 190 C 235 190 240 194 240 198 L 230 206 L 100 212 C 88 212 80 208 80 201 Z" fill="url(#boneOut)" stroke="#94a3b8" stroke-width="1.2"/>
      <!-- Sharp needle point -->
      <polygon points="230,190 260,198 230,206" fill="#ffffff" stroke="#e02424" stroke-width="1.2"/>
      <!-- Drilled eye (1.8mm) -->
      <ellipse cx="102" cy="198" rx="5" ry="9" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
      <ellipse cx="102" cy="198" rx="2" ry="4" fill="#000000"/>
    </g>

    <!-- Flint Awl Tool (Resting nearby) -->
    <path d="M 55 120 L 85 95 L 95 105 L 75 135 Z" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <polygon points="55,120 45,138 62,132" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>

    <!-- Needle Eye Zoom Circle -->
    <circle cx="195" cy="125" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="195" cy="125" rx="7" ry="14" fill="#020617" stroke="#fde68a" stroke-width="1.5"/>
    <path d="M 175 145 Q 195 125 215 105" stroke="#f8fafc" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Label 2: Bone Needle 7.5cm (Placed inside Section 1) -->
  <rect x="36" y="70" width="218" height="18" fill="none"/>
  <text x="40" y="83" fill="#fde68a" font-family="monospace" font-size="9" font-weight="bold">완성된 유백색 고밀도 치밀골 뼈바늘 (길이 7.5cm)</text>

  <!-- Label 3: Precision Eye 1.8mm (Placed inside Section 1) -->
  <rect x="36" y="155" width="165" height="20" rx="2" fill="#141a23" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="40" y="169" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="bold">부싯돌 송곳 양면 천공 정밀 바늘귀 (직경 1.8mm)</text>

  <!-- SECTION 2 (CENTER): Sinew Fiber Processing (x: 275 ~ 515) -->
  <g filter="url(#shadowOut14)">
    <rect x="275" y="66" width="240" height="305" rx="3" fill="#0b111a" stroke="#2a3f55" stroke-width="1"/>
    <rect x="275" y="66" width="240" height="24" fill="#131e2b"/>

    <!-- River Stone Anvil -->
    <path d="M 290 230 L 490 220 L 505 310 L 305 325 Z" fill="#1e293b" stroke="#475569" stroke-width="1"/>

    <!-- Dried Tendon Bundle Transition to Filaments -->
    <!-- Amber uncrushed root -->
    <path d="M 300 245 C 320 240 345 242 365 240 L 365 260 C 345 262 320 260 300 255 Z" fill="url(#sinewOutAmber)" stroke="#92400e" stroke-width="1"/>

    <!-- Pounded Fan of Silver-White Filaments -->
    <path d="M 365 245 C 400 220 440 200 485 180" stroke="#ffffff" stroke-width="1.2" fill="none"/>
    <path d="M 365 248 C 410 230 450 215 490 205" stroke="#f8fafc" stroke-width="1.2" fill="none"/>
    <path d="M 365 250 C 420 248 460 245 495 240" stroke="#f1f5f9" stroke-width="1.5" fill="none"/>
    <path d="M 365 253 C 410 265 450 275 490 280" stroke="#e2e8f0" stroke-width="1.2" fill="none"/>
    <path d="M 365 256 C 400 280 440 300 485 310" stroke="#cbd5e1" stroke-width="1.2" fill="none"/>

    <!-- Rolled Spool of Sinew Thread around Twig -->
    <rect x="420" y="115" width="65" height="16" rx="2" fill="#78350f" stroke="#b45309" stroke-width="1"/>
    <rect x="430" y="110" width="45" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Thread coils -->
    <line x1="435" y1="110" x2="435" y2="136" stroke="#94a3b8" stroke-width="1"/>
    <line x1="442" y1="110" x2="442" y2="136" stroke="#94a3b8" stroke-width="1"/>
    <line x1="450" y1="110" x2="450" y2="136" stroke="#94a3b8" stroke-width="1"/>
    <line x1="458" y1="110" x2="458" y2="136" stroke="#94a3b8" stroke-width="1"/>
    <line x1="466" y1="110" x2="466" y2="136" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Label 4: Pounded Sinew Threads (Placed inside Section 2) -->
  <rect x="281" y="70" width="228" height="18" fill="none"/>
  <text x="285" y="83" fill="#fde68a" font-family="monospace" font-size="8.8" font-weight="bold">나무 방망이로 두드려 분리한 은백색 고인장 힘줄 실 다발</text>

  <!-- SECTION 3 (RIGHT): Repaired Winter Leather Boot & Seam (x: 530 ~ 770) -->
  <g filter="url(#shadowOut14)">
    <rect x="530" y="66" width="240" height="305" rx="3" fill="#0b111a" stroke="#2a3f55" stroke-width="1"/>
    <rect x="530" y="66" width="240" height="24" fill="#131e2b"/>

    <!-- Field Repaired Winter Boot Silhouette -->
    <!-- Fur lining collar at top -->
    <ellipse cx="650" cy="120" rx="35" ry="12" fill="url(#furLining)" stroke="#94a3b8" stroke-width="1"/>
    <!-- Boot shaft & ankle -->
    <path d="M 618 122 L 620 220 L 560 250 L 550 280 L 730 280 L 730 260 L 685 220 L 682 122 Z" fill="url(#bootLeather)" stroke="#a16207" stroke-width="1.5"/>
    <!-- Sole block -->
    <path d="M 545 280 L 735 280 L 735 298 L 545 298 Z" fill="#0c0a09" stroke="#44403c" stroke-width="1.5"/>

    <!-- Repaired Seam with Saddle Stitching & Pine Pitch Coating -->
    <!-- Curved tear seam running down boot vamp -->
    <path d="M 625 210 Q 640 235 660 265" stroke="#ea580c" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 625 210 Q 640 235 660 265" stroke="url(#pitchOutSeam)" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Cross Saddle Stitches over the seam -->
    <line x1="622" y1="216" x2="632" y2="212" stroke="#ffffff" stroke-width="2"/>
    <line x1="626" y1="228" x2="636" y2="224" stroke="#ffffff" stroke-width="2"/>
    <line x1="634" y1="240" x2="644" y2="236" stroke="#ffffff" stroke-width="2"/>
    <line x1="642" y1="252" x2="652" y2="248" stroke="#ffffff" stroke-width="2"/>
    <line x1="650" y1="264" x2="660" y2="260" stroke="#ffffff" stroke-width="2"/>

    <!-- High-Tension Waterproof Seal Graphic Stamp -->
    <circle cx="715" cy="180" r="22" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <path d="M 705 180 L 712 187 L 725 174" fill="none" stroke="#22c55e" stroke-width="2"/>
  </g>

  <!-- Label 5: Saddle Stitch & Pine Pitch Seam (Inside Section 3) -->
  <rect x="534" y="70" width="232" height="18" fill="none"/>
  <text x="536" y="83" fill="#fde68a" font-family="monospace" font-size="8" font-weight="bold">새들 스티치 이중 결속 &amp; 소나무 송진 방수 밀봉 솔기 단면</text>

  <!-- Label 6: Fully Restored Boot (Inside Section 3) -->
  <rect x="540" y="325" width="220" height="22" rx="2" fill="#141a23" stroke="#22c55e" stroke-width="1"/>
  <text x="548" y="340" fill="#22c55e" font-family="monospace" font-size="9" font-weight="bold">완전 복원된 방한 가죽 장화 (체온 유실 100% 차단)</text>

  <!-- Bottom Master Verification Banner (Label 7) -->
  <rect x="24" y="388" width="752" height="38" rx="2" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="38" y="412" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">FIELD VERIFIED // TENSILE STRENGTH RATED &amp; WATERPROOF</text>
</svg>