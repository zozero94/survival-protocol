<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg19s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090b0e"/>
      <stop offset="100%" stop-color="#11151c"/>
    </linearGradient>
    <radialGradient id="emberGlow19" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ea580c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="greenLeaf19" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="smokePlume19" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f1f5f9" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow19s3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background & Grid -->
  <rect width="400" height="400" fill="url(#bg19s3)"/>
  <g stroke="#1e293b" stroke-width="0.6" opacity="0.45">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>
  <rect x="4" y="4" width="392" height="392" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Header Banner (Text 1) -->
  <rect x="8" y="10" width="384" height="24" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="16" y="26" fill="#fde68a" font-family="monospace" font-size="10.5" font-weight="bold">FIG. 03 // FLAMELESS OAK EMBER &amp; GREEN LEAF SMOKE PIT</text>

  <!-- Sub-banner 1 (Text 2) -->
  <rect x="20" y="52" width="360" height="22" rx="2" fill="#131922" stroke="#334155" stroke-width="0.8"/>
  <text x="200" y="67" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">삼발이 중앙 바닥 구덩이에 빨갛게 달군 참나무 숯불 깔기</text>

  <!-- Main Scene Area -->
  <g filter="url(#shadow19s3)">
    <!-- Billowing White Smoke Plumes Rising Upward -->
    <path d="M140,225 C115,185 150,150 135,95 C165,85 235,85 265,95 C250,150 285,185 260,225 Z" fill="url(#smokePlume19)"/>
    <path d="M165,215 Q145,160 170,105" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85"/>
    <path d="M200,215 Q218,160 198,100" fill="none" stroke="#f8fafc" stroke-width="2.8" stroke-dasharray="6,4" opacity="0.95"/>
    <path d="M235,215 Q255,160 230,105" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85"/>

    <!-- Chest-high Wooden Rack & Hanging Meat Strips (Height 120cm) -->
    <line x1="105" y1="96" x2="275" y2="96" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
    <line x1="105" y1="94" x2="275" y2="94" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <rect x="132" y="98" width="9" height="38" rx="2" fill="#7f1d1d" stroke="#f87171" stroke-width="0.8"/>
    <rect x="156" y="98" width="9" height="42" rx="2" fill="#7f1d1d" stroke="#f87171" stroke-width="0.8"/>
    <rect x="180" y="98" width="9" height="39" rx="2" fill="#7f1d1d" stroke="#f87171" stroke-width="0.8"/>
    <rect x="204" y="98" width="9" height="43" rx="2" fill="#7f1d1d" stroke="#f87171" stroke-width="0.8"/>
    <rect x="228" y="98" width="9" height="38" rx="2" fill="#7f1d1d" stroke="#f87171" stroke-width="0.8"/>

    <!-- Human Hand Warmth Gauge (Crystal-clear Hand Silhouette + Warmth Waves) -->
    <g transform="translate(284, 90)">
      <rect x="0" y="0" width="96" height="66" rx="5" fill="#0d141e" stroke="#fde68a" stroke-width="1.2"/>
      
      <!-- Clearly Defined Anatomical Open Hand Silhouette -->
      <g transform="translate(10, 10)">
        <!-- Palm & Thumb & 4 Fingers Silhouette -->
        <path d="M 6,38 C 4,32 5,26 8,22 L 14,14 C 15,12 18,13 18,15 L 17,21 L 22,7 C 23,5 26,5 27,7 L 26,20 L 31,5 C 32,3 35,3 36,5 L 34,20 L 39,8 C 40,6 43,7 43,9 L 40,24 C 42,25 43,28 42,32 C 40,38 34,42 24,42 C 14,42 8,41 6,38 Z" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
      </g>

      <!-- Warmth Heat Waves Rising Into Hand -->
      <path d="M 58,38 Q 63,33 58,28 Q 53,23 58,18" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
      <path d="M 66,40 Q 71,35 66,30 Q 61,25 66,20" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M 74,38 Q 79,33 74,28 Q 69,23 74,18" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>

      <!-- Comfort Check Indicator: 3-Second Safe Warmth Gauge -->
      <circle cx="82" cy="52" r="7" fill="#14532d" stroke="#22c55e" stroke-width="1.2"/>
      <path d="M 79,52 L 81,55 L 86,49" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Sub-banner 2 (Text 3) -->
    <rect x="20" y="174" width="360" height="22" rx="2" fill="#131922" stroke="#22c55e" stroke-width="0.9"/>
    <text x="200" y="189" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">숯불 위에 푸른 참나무 생가지와 잎을 덮어 불꽃 죽이기</text>

    <!-- Shallow Fire Pit & Oak Charcoal Embers Cross Section -->
    <!-- Earth Bed Cross Section -->
    <path d="M36,242 L108,242 Q128,298 200,298 Q272,298 292,242 L364,242 L364,304 L36,304 Z" fill="#241a13" stroke="#634127" stroke-width="1.5"/>
    
    <!-- Glowing Red Charcoal Embers in Pit Base -->
    <ellipse cx="200" cy="272" rx="76" ry="20" fill="url(#emberGlow19)"/>
    <polygon points="142,274 158,262 172,274 156,286" fill="#dc2626" stroke="#fde047" stroke-width="0.8"/>
    <polygon points="178,268 200,260 214,274 190,288" fill="#ef4444" stroke="#fde047" stroke-width="0.8"/>
    <polygon points="218,272 238,262 254,274 232,286" fill="#dc2626" stroke="#fde047" stroke-width="0.8"/>
    <polygon points="162,282 184,276 194,288 170,292" fill="#991b1b" stroke="#fb923c" stroke-width="0.8"/>
    <polygon points="204,282 226,276 236,288 212,292" fill="#991b1b" stroke="#fb923c" stroke-width="0.8"/>

    <!-- Thick Smothering Blanket of Fresh Green Oak Leaves & Twigs -->
    <g>
      <!-- Thick Wooden Green Sticks -->
      <line x1="120" y1="250" x2="280" y2="242" stroke="#14532d" stroke-width="3" stroke-linecap="round"/>
      <line x1="130" y1="244" x2="270" y2="252" stroke="#166534" stroke-width="2.5" stroke-linecap="round"/>
      
      <!-- Green Oak Leaves with Scalloped Edges Over Embers -->
      <ellipse cx="150" cy="242" rx="28" ry="13" transform="rotate(-15 150 242)" fill="url(#greenLeaf19)" stroke="#86efac" stroke-width="1"/>
      <ellipse cx="182" cy="236" rx="30" ry="14" transform="rotate(8 182 236)" fill="url(#greenLeaf19)" stroke="#86efac" stroke-width="1"/>
      <ellipse cx="218" cy="236" rx="30" ry="14" transform="rotate(-8 218 236)" fill="url(#greenLeaf19)" stroke="#86efac" stroke-width="1"/>
      <ellipse cx="250" cy="242" rx="28" ry="13" transform="rotate(15 250 242)" fill="url(#greenLeaf19)" stroke="#86efac" stroke-width="1"/>
      
      <ellipse cx="168" cy="250" rx="26" ry="12" fill="url(#greenLeaf19)" stroke="#bbf7d0" stroke-width="0.9"/>
      <ellipse cx="200" cy="248" rx="28" ry="13" fill="url(#greenLeaf19)" stroke="#bbf7d0" stroke-width="0.9"/>
      <ellipse cx="232" cy="250" rx="26" ry="12" fill="url(#greenLeaf19)" stroke="#bbf7d0" stroke-width="0.9"/>
    </g>
  </g>

  <!-- Sub-banner 3 (Text 4) -->
  <rect x="20" y="306" width="360" height="22" rx="2" fill="#131922" stroke="#334155" stroke-width="0.8"/>
  <text x="200" y="321" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">고기 높이에 손을 넣어 따뜻한 아랫목 온도와 하얀 연기 유지</text>

  <!-- Clear Botanical Visual Indicator Strip: Oak Leaf (APPROVED) vs Pine Needles (BANNED) -->
  <g transform="translate(24, 332)">
    <!-- LEFT BOX: Broad Oak Leaf & Hardwood Charcoal [SAFE / APPROVED] -->
    <rect x="0" y="0" width="170" height="30" rx="4" fill="#0f291e" stroke="#22c55e" stroke-width="1.2"/>
    
    <!-- Bold Green Checkmark Circle -->
    <circle cx="16" cy="15" r="9" fill="#15803d" stroke="#4ade80" stroke-width="1"/>
    <path d="M 12,15 L 15,18 L 21,11" fill="none" stroke="#f0fdf4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Realistic Oak Leaf & Acorn Pictogram -->
    <g transform="translate(34, 4)">
      <!-- Scalloped Oak Leaf Profile -->
      <path d="M 10,21 C 4,18 2,13 6,11 C 3,9 4,4 8,5 C 10,1 15,1 18,4 C 22,1 26,4 25,9 C 28,12 26,17 21,19 C 18,22 13,22 10,21 Z" fill="#22c55e" stroke="#86efac" stroke-width="0.8"/>
      <!-- Small Acorn Beside Leaf -->
      <ellipse cx="29" cy="14" rx="4" ry="5" fill="#b45309" stroke="#fde68a" stroke-width="0.6"/>
      <path d="M 25,12 C 25,9 33,9 33,12 Z" fill="#78350f"/>
      <!-- Clean Smoke Waves -->
      <path d="M 40,19 Q 44,14 40,10 Q 36,6 40,2" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 47,19 Q 51,14 47,10 Q 43,6 47,2" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- RIGHT BOX: Pine Needles & Resinous Conifer [DANGER / BANNED] -->
    <rect x="182" y="0" width="170" height="30" rx="4" fill="#2c1215" stroke="#ef4444" stroke-width="1.2"/>
    
    <!-- Bold Red Crossmark Circle -->
    <circle cx="198" cy="15" r="9" fill="#991b1b" stroke="#f87171" stroke-width="1"/>
    <line x1="194" y1="11" x2="202" y2="19" stroke="#fef2f2" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="202" y1="11" x2="194" y2="19" stroke="#fef2f2" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Sharp Pine Needle Bundle & Black Soot Smoke Pictogram -->
    <g transform="translate(216, 4)">
      <!-- Sharp Spiky Pine Needles -->
      <line x1="18" y1="21" x2="6" y2="4" stroke="#84cc16" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="18" y1="21" x2="12" y2="2" stroke="#65a30d" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="18" y1="21" x2="20" y2="2" stroke="#4d7c0f" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="18" y1="21" x2="26" y2="5" stroke="#65a30d" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="18" y1="21" x2="31" y2="9" stroke="#84cc16" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="18" cy="21" r="2.5" fill="#78350f"/>
      <!-- Black Tar Soot Puffs with Warning Tone -->
      <circle cx="41" cy="14" r="5" fill="#475569" opacity="0.8"/>
      <circle cx="47" cy="8" r="6" fill="#334155" opacity="0.8"/>
    </g>
  </g>

  <!-- Footer Summary Bar (Text 5) -->
  <rect x="8" y="368" width="384" height="24" fill="#1e1b18" stroke="#f59e0b" stroke-width="1"/>
  <text x="200" y="384" fill="#fde68a" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">[3단계 핵심] 불꽃 0% 유지 및 참나무 생잎의 하얀 방부 연기 생성</text>
</svg>