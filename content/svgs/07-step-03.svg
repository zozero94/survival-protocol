<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#050505"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#262626" stroke-width="1"/>
  <rect x="24" y="24" width="352" height="352" fill="none" stroke="#171717" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 헤더 스탬프 -->
  <text x="32" y="44" fill="#737373" font-family="monospace" font-size="10" font-weight="bold">PROTOCOL // PR-07 [PINE-RESIN-OINTMENT]</text>
  <text x="368" y="44" fill="#E5E5E5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="end">STEP 03</text>

  <!-- 팔뚝 환부 단면 (Wounded Arm Section) -->
  <rect x="60" y="160" width="280" height="60" fill="#141414" stroke="#737373" stroke-width="1.5"/>

  <!-- 상처 열상 부위 (Laceration Wound) -->
  <line x1="160" y1="160" x2="240" y2="160" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="180" y1="155" x2="220" y2="165" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- 두꺼운 송진 연고 도포층 (Thick Ointment Seal, 40°C Warm) -->
  <path d="M 140 160 Q 200 140 260 160" fill="#262626" stroke="#FFFFFF" stroke-width="4"/>
  <text x="200" y="132" fill="#FFFFFF" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">WARM SALVE SEAL (40°C)</text>

  <!-- 멸균 자작나무 껍질 붕대 감기 (Birch Bark Wrap Bandage) -->
  <path d="M 120 150 L 150 230 M 160 150 L 190 230 M 210 150 L 240 230 M 250 150 L 280 230" stroke="#E5E5E5" stroke-width="3"/>
  <text x="200" y="250" fill="#E5E5E5" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">BIRCH BARK BANDAGE COMPRESSION</text>

  <!-- 100% 방수 및 혐기성 차단 배지 -->
  <rect x="50" y="80" width="300" height="35" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="1"/>
  <text x="200" y="95" fill="#FFFFFF" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">WATERPROOF + ANTIMICROBIAL BARRIER</text>
  <text x="200" y="107" fill="#A3A3A3" font-family="monospace" font-size="8" text-anchor="middle">CLEAN WITH BOILED WATER BEFORE APPLICATION</text>

  <!-- 하단 캡션 -->
  <rect x="32" y="320" width="336" height="44" fill="#0A0A0A" stroke="#262626" stroke-width="1"/>
  <text x="44" y="338" fill="#E5E5E5" font-family="monospace" font-size="11" font-weight="bold">PHASE 03: WARM APPLICATION &amp; BIRCH BARK DRESSING</text>
  <text x="44" y="353" fill="#737373" font-family="monospace" font-size="9">COOL TO BODY TEMP (~40°C); APPLY THICK LAYER AND BIND TO HALT SEPSIS</text>
</svg>
